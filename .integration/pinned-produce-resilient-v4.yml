name: Isco Video Production Resilient V4

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Optional exact Telegram-approved request id"
        required: false
        default: ""
        type: string
      request_sha256:
        description: "Optional exact Telegram request SHA-256"
        required: false
        default: ""
        type: string
      authorization_id:
        description: "Optional one-time Telegram dispatch authorization"
        required: false
        default: ""
        type: string
      engine_sha:
        description: "Optional certified Engine SHA for Telegram ingress"
        required: false
        default: ""
        type: string

concurrency:
  group: isco-video-resilient-v4
  cancel-in-progress: false

env:
  EXPECTED_ENGINE_SHA: 69b21dd1c10f196c623e5b426bccd574a80accf5
  STATIC_APPROVED_BRIEF_SHA256: bcf8d3017ee8e18ee4808614c7c07731b0452a5ba6182e1183404f663078e129

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
    steps:
      - name: Record job start time
        id: job_start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout runner
        id: checkout_runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Runner checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Validate single production ingress contract
        id: ingress_mode
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
          REQUESTED_ENGINE_SHA: ${{ inputs.engine_sha }}
        run: |
          set -euo pipefail
          present=0
          for value in "$REQUEST_ID" "$REQUEST_SHA256" "$AUTHORIZATION_ID" "$REQUESTED_ENGINE_SHA"; do
            if [ -n "$value" ]; then present=$((present + 1)); fi
          done
          if [ "$present" -eq 0 ]; then
            echo "mode=manual" >> "$GITHUB_OUTPUT"
            echo "Canonical V4 ingress: manual approved brief"
            exit 0
          fi
          if [ "$present" -ne 4 ]; then
            echo "Telegram V4 ingress is partial; all four immutable inputs are required together" >&2
            exit 1
          fi
          test "$REQUESTED_ENGINE_SHA" = "$EXPECTED_ENGINE_SHA"
          [[ "$REQUEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$AUTHORIZATION_ID" =~ ^[0-9a-f]{32}$ ]]
          echo "mode=telegram" >> "$GITHUB_OUTPUT"
          echo "Canonical V4 ingress: exact Telegram authorization"

      - name: Require protected exact-SHA production certification
        id: certification_gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/production_certification_gate.py \
            --output "$RUNNER_TEMP/production-certification-gate.json"

      - name: Checkout private engine
        id: checkout_engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 69b21dd1c10f196c623e5b426bccd574a80accf5
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine pin
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_ENGINE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: setup_python
        with:
          python-version: "3.12"

      - name: Checkout latest Telegram control state
        id: checkout_control_state
        if: steps.ingress_mode.outputs.mode == 'telegram'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: control-plane-state
          path: control-writer
          persist-credentials: true
          fetch-depth: 1

      - name: Consume Telegram authorization and materialize V4 brief
        id: telegram_ingress
        if: steps.ingress_mode.outputs.mode == 'telegram'
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
          REQUESTED_ENGINE_SHA: ${{ inputs.engine_sha }}
        run: |
          set -euo pipefail
          test -n "$STATE_ENCRYPTION_KEY"
          mkdir -p "$RUNNER_TEMP/isco-control"
          encrypted="control-writer/state/control-panel.json.enc"
          state="$RUNNER_TEMP/isco-control/control-panel.json"
          approved="$RUNNER_TEMP/isco-control/approved-request.json"
          test -f "$encrypted"
          openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 \
            -pass env:STATE_ENCRYPTION_KEY -in "$encrypted" -out "$state"
          chmod 600 "$state"
          PYTHONPATH="${GITHUB_WORKSPACE}/engine/src:${GITHUB_WORKSPACE}" python scripts/telegram_v4_ingress.py prepare \
            --state "$state" \
            --request-id "$REQUEST_ID" \
            --sha256 "$REQUEST_SHA256" \
            --authorization-id "$AUTHORIZATION_ID" \
            --engine-sha "$REQUESTED_ENGINE_SHA" \
            --expected-engine-sha "$EXPECTED_ENGINE_SHA" \
            --approved-request-output "$approved" \
            --brief-output "$GITHUB_WORKSPACE/engine/production/approved_brief.json" \
            --request-output "$RUNNER_TEMP/isco-request.json" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --github-output "$GITHUB_OUTPUT"
          release_tag="$(sed -n 's/^release_tag=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          test -n "$release_tag"
          echo "ISCO_CONTROL_REQUEST_PATH=$approved" >> "$GITHUB_ENV"
          echo "ISCO_CONTROL_REQUEST_SHA256=$REQUEST_SHA256" >> "$GITHUB_ENV"
          echo "ISCO_CONTROL_RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "ISCO_RELEASE_TAG_OVERRIDE=$release_tag" >> "$GITHUB_ENV"

          openssl enc -aes-256-cbc -salt -pbkdf2 -md sha256 \
            -pass env:STATE_ENCRYPTION_KEY -in "$state" -out "$encrypted"
          cd control-writer
          git config user.name "isco-control-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/control-panel.json.enc
          if git diff --cached --quiet; then
            echo "Telegram authorization consumption produced no durable state delta" >&2
            exit 1
          fi
          git commit -m "state: consume Telegram authorization in V4"
          git push origin HEAD:control-plane-state

      - name: Validate approved brief before secret materialization
        id: validate_brief
        env:
          ISCO_APPROVED_BRIEF_SHA256: ${{ steps.telegram_ingress.outputs.brief_sha256 || 'bcf8d3017ee8e18ee4808614c7c07731b0452a5ba6182e1183404f663078e129' }}
        run: |
          set -euo pipefail
          PYTHONPATH=engine/src python - <<'PY'
          import json, os
          from pathlib import Path
          from isco_video_agent.brief_approval_binding import verify_brief_approval
          brief_path = Path("engine/production/approved_brief.json")
          brief = json.loads(brief_path.read_text(encoding="utf-8"))
          if not isinstance(brief, dict) or brief.get("approved_by_user") is not True:
              raise SystemExit("Production brief is missing explicit user approval")
          verify_brief_approval(brief, os.environ["ISCO_APPROVED_BRIEF_SHA256"])
          topic = str(brief.get("approved_topic") or "").strip()
          fmt = str(brief.get("format") or "").strip().lower()
          if not topic or fmt not in {"film", "moment", "story"}:
              raise SystemExit("Invalid approved production brief")
          request = Path(os.environ["RUNNER_TEMP"], "isco-request.json")
          request.write_text(
              json.dumps({"topic": topic, "format": fmt}, ensure_ascii=False), encoding="utf-8"
          )
          request.chmod(0o600)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write(f"brief_sha256={os.environ['ISCO_APPROVED_BRIEF_SHA256']}\n")
          print(f"Approved production brief validated before secret materialization: format={fmt}")
          PY

      - name: Restore untrusted Piper wheel cache
        id: restore_piper_wheel
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/piper-wheel
          key: piper-wheel-v2-${{ runner.os }}-py312-b17184a664bd9431ce95c138f4bfb3025e1280cf26075a703dbfdcab989b8ee3-${{ github.run_id }}
          restore-keys: |
            piper-wheel-v2-${{ runner.os }}-py312-b17184a664bd9431ce95c138f4bfb3025e1280cf26075a703dbfdcab989b8ee3-

      - name: Restore untrusted Piper voice cache
        id: restore_piper_voice
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/piper-voices
          key: piper-voice-v2-${{ runner.os }}-${{ hashFiles('engine/security/piper_voice_hashes.json') }}-${{ github.run_id }}
          restore-keys: |
            piper-voice-v2-${{ runner.os }}-${{ hashFiles('engine/security/piper_voice_hashes.json') }}-

      - name: Install locked engine and verified local voice fallback
        id: install_engine
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y ffmpeg fonts-noto-core openssl tesseract-ocr tesseract-ocr-ara
          cd engine
          PYTHONPATH=src python ../scripts/security_v1_supply_chain_preflight.py lock --lock requirements-lock.txt
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
          python -m pip check
          echo "piper_wheel_save=false" >> "$GITHUB_OUTPUT"
          echo "piper_voice_save=false" >> "$GITHUB_OUTPUT"

          piper_wheel_dir="$RUNNER_TEMP/piper-wheel"
          mkdir -p "$piper_wheel_dir"
          if PYTHONPATH=src python ../scripts/piper_bootstrap_cache.py wheel \
            --directory "$piper_wheel_dir" \
            --sha256 b17184a664bd9431ce95c138f4bfb3025e1280cf26075a703dbfdcab989b8ee3; then
            echo "Verified Piper wheel cache hit"
          else
            echo "Piper wheel cache miss or invalid; rebuilding from authoritative artifact"
            rm -rf "$piper_wheel_dir"
            mkdir -p "$piper_wheel_dir"
            python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: \
              --dest "$piper_wheel_dir" 'piper-tts==1.4.2'
            PYTHONPATH=src python ../scripts/piper_bootstrap_cache.py wheel \
              --directory "$piper_wheel_dir" \
              --sha256 b17184a664bd9431ce95c138f4bfb3025e1280cf26075a703dbfdcab989b8ee3
            echo "piper_wheel_save=true" >> "$GITHUB_OUTPUT"
          fi
          piper_wheel="$(find "$piper_wheel_dir" -maxdepth 1 -type f -name 'piper_tts-1.4.2-*.whl' -print -quit)"
          test -n "$piper_wheel"
          python -m pip install "$piper_wheel"
          python -m pip check # post-piper-certification

          piper_voice_dir="$RUNNER_TEMP/piper-voices"
          mkdir -p "$piper_voice_dir"
          if PYTHONPATH=src python ../scripts/piper_bootstrap_cache.py voice \
            --directory "$piper_voice_dir" \
            --manifest security/piper_voice_hashes.json; then
            echo "Verified Piper voice cache hit"
          else
            echo "Piper voice cache miss or invalid; rebuilding from authoritative source"
            rm -rf "$piper_voice_dir"
            mkdir -p "$piper_voice_dir"
            for attempt in 1 2; do
              if python -m piper.download_voices --data-dir "$piper_voice_dir" ar_JO-kareem-medium; then
                break
              fi
              if [ "$attempt" -eq 2 ]; then
                echo "Piper voice download failed after bounded setup retry" >&2
                exit 1
              fi
              sleep 4
            done
            PYTHONPATH=src python ../scripts/piper_bootstrap_cache.py voice \
              --directory "$piper_voice_dir" \
              --manifest security/piper_voice_hashes.json
            echo "piper_voice_save=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save verified Piper wheel cache
        if: steps.install_engine.outputs.piper_wheel_save == 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/piper-wheel
          key: piper-wheel-v2-${{ runner.os }}-py312-b17184a664bd9431ce95c138f4bfb3025e1280cf26075a703dbfdcab989b8ee3-${{ github.run_id }}

      - name: Save verified Piper voice cache
        if: steps.install_engine.outputs.piper_voice_save == 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/piper-voices
          key: piper-voice-v2-${{ runner.os }}-${{ hashFiles('engine/security/piper_voice_hashes.json') }}-${{ github.run_id }}

      - name: Isolated dependency vulnerability audit
        working-directory: engine
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pip-audit-venv"
          "$RUNNER_TEMP/pip-audit-venv/bin/python" -m pip install --disable-pip-version-check -q pip-audit==2.10.1
          "$RUNNER_TEMP/pip-audit-venv/bin/pip-audit" --no-deps -r requirements-lock.txt

      - name: Restore encrypted cross-run memory
        id: restore_state
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/isco-state"
          mkdir -p "$state_dir"
          python scripts/persistent_memory.py restore \
            --repo . \
            --plain "$state_dir/history.json" \
            --branch agent-state \
            --legacy-state state/history.json.enc \
            --github-output "$GITHUB_OUTPUT"
          test -f "$state_dir/history.json"
          chmod 600 "$state_dir/history.json"
          echo "ISCO_HISTORY_PATH=$state_dir/history.json" >> "$GITHUB_ENV"

      - name: Require healthy restored cross-run memory
        run: test "${{ steps.restore_state.outputs.save_allowed }}" = "true"

      - name: Verify local voice fallback before cloud production
        id: voice_preflight
        env:
          PIPER_MODEL_PATH: ${{ runner.temp }}/piper-voices/ar_JO-kareem-medium.onnx
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, wave
          from pathlib import Path
          from piper import PiperVoice
          model = Path(os.environ["PIPER_MODEL_PATH"])
          voice = PiperVoice.load(str(model), config_path=str(model) + ".json")
          out = Path(os.environ["RUNNER_TEMP"]) / "piper-preflight.wav"
          with wave.open(str(out), "wb") as wav:
              voice.synthesize_wav("هذا اختبار صوت محلي.", wav)
          if out.stat().st_size < 1024:
              raise SystemExit("Piper preflight produced empty audio")
          print("Piper local voice preflight OK")
          PY

      - name: Verify production environment and release namespace
        id: environment_preflight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISCO_RELEASE_TAG_OVERRIDE: ${{ steps.telegram_ingress.outputs.release_tag }}
        run: |
          set -euo pipefail
          python scripts/environment_preflight.py

      - name: Certify Engine source immediately before provider work
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -c 'from scripts.engine_source_hermeticity import certify_engine_source_hermeticity; certify_engine_source_hermeticity("production_before_provider_work")'

      - name: Materialize approved production secrets
        id: prepare_request
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/isco-request.json"
          test -n "$GEMINI_API_KEY"
          test -n "$GROQ_API_KEY"
          test -n "$OPENROUTER_API_KEY"
          test -n "$PEXELS_API_KEY"
          test -n "$PIXABAY_API_KEY"
          umask 077
          mkdir -p "$RUNNER_TEMP/isco-secrets"
          printf '%s' "$GEMINI_API_KEY" > "$RUNNER_TEMP/isco-secrets/gemini"
          printf '%s' "$GROQ_API_KEY" > "$RUNNER_TEMP/isco-secrets/groq"
          printf '%s' "$OPENROUTER_API_KEY" > "$RUNNER_TEMP/isco-secrets/openrouter"
          printf '%s' "$PEXELS_API_KEY" > "$RUNNER_TEMP/isco-secrets/pexels"
          printf '%s' "$PIXABAY_API_KEY" > "$RUNNER_TEMP/isco-secrets/pixabay"
          printf '%s' "$YOUTUBE_API_KEY" > "$RUNNER_TEMP/isco-secrets/youtube"
          printf '%s' "$YOUTUBE_CLIENT_ID" > "$RUNNER_TEMP/isco-secrets/youtube-client-id"
          printf '%s' "$YOUTUBE_CLIENT_SECRET" > "$RUNNER_TEMP/isco-secrets/youtube-client-secret"
          printf '%s' "$YOUTUBE_REFRESH_TOKEN" > "$RUNNER_TEMP/isco-secrets/youtube-refresh-token"
          printf '%s' "$TELEGRAM_BOT_TOKEN" > "$RUNNER_TEMP/isco-secrets/telegram-bot-token"
          printf '%s' "$TELEGRAM_CHAT_ID" > "$RUNNER_TEMP/isco-secrets/telegram-chat-id"
          printf '%s' "$TELEGRAM_ALLOWED_USER_ID" > "$RUNNER_TEMP/isco-secrets/telegram-allowed-user-id"
          echo "Telegram secrets present: bot_token=$([ -n "$TELEGRAM_BOT_TOKEN" ] && echo yes || echo no) chat_id=$([ -n "$TELEGRAM_CHAT_ID" ] && echo yes || echo no) allowed_user_id=$([ -n "$TELEGRAM_ALLOWED_USER_ID" ] && echo yes || echo no)"

      - name: Verify complete provider readiness
        id: verify_providers
        env:
          GEMINI_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/gemini
          GROQ_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/groq
          OPENROUTER_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/openrouter
          PEXELS_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/pexels
          PIXABAY_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/pixabay
          GEMINI_CONTENT_MODEL: gemini-3.7-flash
          GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
        run: |
          set -euo pipefail
          python scripts/provider_preflight.py \
            --output "$RUNNER_TEMP/provider-preflight.json" \
            --content-model "$GEMINI_CONTENT_MODEL" \
            --tts-model "$GEMINI_TTS_MODEL" \
            --gemini-key-file "$GEMINI_API_KEY_FILE" \
            --groq-key-file "$GROQ_API_KEY_FILE" \
            --openrouter-key-file "$OPENROUTER_API_KEY_FILE" \
            --pexels-key-file "$PEXELS_API_KEY_FILE" \
            --pixabay-key-file "$PIXABAY_API_KEY_FILE"

      - name: Certify provider-portable planning envelope
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
          ISCO_APPROVED_BRIEF_PATH: ${{ github.workspace }}/engine/production/approved_brief.json
        run: |
          set -euo pipefail
          python scripts/planning_envelope_preflight.py \
            --output "$RUNNER_TEMP/planning-envelope-preflight.json"

      - name: Restore durable TTS section cache
        id: restore_tts_cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/isco-tts-cache
          key: tts-section-v1-${{ runner.os }}-${{ steps.validate_brief.outputs.brief_sha256 }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tts-section-v1-${{ runner.os }}-${{ steps.validate_brief.outputs.brief_sha256 }}-

      - name: Restore Pixabay 24h search cache
        id: restore_pixabay_cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/isco-pixabay-api-cache
          key: pixabay-search-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pixabay-search-v2-${{ runner.os }}-

      - name: Produce with canonical V4 runtime
        id: produce_video
        working-directory: engine
        env:
          PRODUCTION_INGRESS_MODE: ${{ steps.ingress_mode.outputs.mode }}
          CONTROL_PLANE_PRODUCTION_ENABLED: ${{ steps.ingress_mode.outputs.mode == 'telegram' && 'true' || 'false' }}
          GEMINI_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/gemini
          GROQ_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/groq
          OPENROUTER_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/openrouter
          PEXELS_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/pexels
          PIXABAY_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/pixabay
          YOUTUBE_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/youtube
          YOUTUBE_CLIENT_ID_FILE: ${{ runner.temp }}/isco-secrets/youtube-client-id
          YOUTUBE_CLIENT_SECRET_FILE: ${{ runner.temp }}/isco-secrets/youtube-client-secret
          YOUTUBE_REFRESH_TOKEN_FILE: ${{ runner.temp }}/isco-secrets/youtube-refresh-token
          ISCO_ENGINE_SHA: 69b21dd1c10f196c623e5b426bccd574a80accf5
          ISCO_APPROVED_BRIEF_PATH: ${{ github.workspace }}/engine/production/approved_brief.json
          ISCO_APPROVED_BRIEF_SHA256: ${{ steps.validate_brief.outputs.brief_sha256 }}
          ISCO_TTS_CACHE_PATH: ${{ runner.temp }}/isco-tts-cache
          ISCO_PIXABAY_CACHE_PATH: ${{ runner.temp }}/isco-pixabay-api-cache/search-cache-v2.json
          TELEGRAM_BOT_TOKEN_FILE: ${{ runner.temp }}/isco-secrets/telegram-bot-token
          TELEGRAM_CHAT_ID_FILE: ${{ runner.temp }}/isco-secrets/telegram-chat-id
          TELEGRAM_ALLOWED_USER_ID_FILE: ${{ runner.temp }}/isco-secrets/telegram-allowed-user-id
          REQUEST_FILE: ${{ runner.temp }}/isco-request.json
          PIPER_MODEL_PATH: ${{ runner.temp }}/piper-voices/ar_JO-kareem-medium.onnx
          GEMINI_CONTENT_MODEL: gemini-3.7-flash
          GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
          TRENDS_GEO: SA
          YOUTUBE_REGION: SA
          YOUTUBE_LANGUAGE: ar
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          if [ "$PRODUCTION_INGRESS_MODE" = "telegram" ]; then
            python ../scripts/run_telegram_control_production.py 2>&1 | tee "$RUNNER_TEMP/production-step.log"
          else
            python ../scripts/run_v3_voice.py 2>&1 | tee "$RUNNER_TEMP/production-step.log"
          fi

      - name: Prepare durable TTS cache for cross-run save
        id: prepare_tts_cache
        if: always() && steps.produce_video.outcome != 'skipped'
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
          ISCO_TTS_CACHE_PATH: ${{ runner.temp }}/isco-tts-cache
        run: |
          set -euo pipefail
          output="$(python scripts/tts_durable_cache.py prepare --root "$ISCO_TTS_CACHE_PATH")"
          printf '%s\n' "$output"
          allowed="$(printf '%s\n' "$output" | sed -n 's/^save_allowed=//p' | tail -n 1)"
          case "$allowed" in
            true|false) ;;
            *) echo "Invalid TTS cache persistence decision: $allowed" >&2; exit 1 ;;
          esac
          echo "save_allowed=$allowed" >> "$GITHUB_OUTPUT"

      - name: Save durable TTS section cache
        if: always() && steps.prepare_tts_cache.outputs.save_allowed == 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/isco-tts-cache
          key: tts-section-v1-${{ runner.os }}-${{ steps.validate_brief.outputs.brief_sha256 }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prepare Pixabay cache for cross-run save
        id: prepare_pixabay_cache
        if: always() && steps.produce_video.outcome != 'skipped'
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
          ISCO_PIXABAY_CACHE_PATH: ${{ runner.temp }}/isco-pixabay-api-cache/search-cache-v2.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.provider_capacity_v2 import prepare_cache_for_persistence
          path = Path(os.environ["ISCO_PIXABAY_CACHE_PATH"])
          allowed = prepare_cache_for_persistence(path)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write(f"save_allowed={'true' if allowed else 'false'}\n")
          print(f"Pixabay cache persistence sanitized: save_allowed={allowed}")
          PY

      - name: Save Pixabay 24h search cache
        if: always() && steps.prepare_pixabay_cache.outputs.save_allowed == 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/isco-pixabay-api-cache
          key: pixabay-search-v2-${{ runner.os }}-${{ github.run_id }}

      - name: Upload diagnostics on failure
        id: upload_diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: isco-resilient-v4-diagnostics-${{ github.run_number }}
          path: |
            engine/output/*/quality-final.json
            engine/output/*/quality-precheck.json
            engine/output/*/plan.json
            engine/output/*/opportunities.json
            engine/output/*/research.json
            engine/output/*/planning-telemetry.json
            engine/output/*/visual-audit.json
            engine/output/*/final-critic.json
            engine/output/*/ai-budget.json
            engine/output/*/production-manifest.json
            engine/output/*/opening-visual-audit.json
            engine/output/*/final-master-qc.json
            engine/output/*/thumbnail-plan.json
            engine/output/*/thumbnail-*.jpg
            engine/output/*/rights-manifest.json
            engine/output/*/gold-enforce-report.json
            engine/output/*/canonical-bundle-request.json
            engine/output/*/sibling-short-plan.json
            engine/output/*/sibling-short-results.json
            engine/output/*/delivery-manifest.json
            engine/output/*/capability-manifest.json
            ${{ runner.temp }}/provider-preflight.json
            ${{ runner.temp }}/preproduction-environment.json
            ${{ runner.temp }}/production-certification-gate.json
          if-no-files-found: warn
          retention-days: 7

      - name: Final review and extract result
        id: final_review
        if: success()
        working-directory: engine
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/final-review-step.log"
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          sys.path.insert(0, str(Path.cwd().parent))
          from scripts.packaging_delivery_contract import validate_packaging_delivery
          roots = sorted(Path('output').glob('*'), key=lambda p: p.stat().st_mtime, reverse=True)
          if not roots:
              raise SystemExit('No output directory')
          root = roots[0]
          final = root / 'final.mp4'
          quality = root / 'quality-final.json'
          plan = root / 'plan.json'
          telemetry = root / 'planning-telemetry.json'
          critic = root / 'final-critic.json'
          budget = root / 'ai-budget.json'
          manifest = root / 'production-manifest.json'
          delivery = root / 'delivery-manifest.json'
          opening_audit = root / 'opening-visual-audit.json'
          final_master_qc = root / 'final-master-qc.json'
          for required in (final, quality, plan, critic, budget, manifest, final_master_qc):
              if not required.exists():
                  raise SystemExit(f'Missing {required.name}')
          packaging = validate_packaging_delivery(root)
          q = json.loads(quality.read_text(encoding='utf-8'))
          qc = json.loads(final_master_qc.read_text(encoding='utf-8'))
          if not isinstance(qc, dict):
              raise SystemExit('Final Master QC evidence is not an object')
          if (
              qc.get('status') != 'pass'
              or qc.get('production_stage') != 'post_render_pre_gold_acceptance'
              or qc.get('full_decode_ok') is not True
              or qc.get('final_media_mutated') is not False
              or list(qc.get('blocking_findings') or [])
          ):
              raise SystemExit('Final Master QC evidence failed canonical final review')
          failures = []
          if q.get('duration_ok') is not True:
              failures.append('duration_ok=false')
          if q.get('audio_ok') is not True:
              failures.append('audio_ok=false')
          if int(q.get('video_streams', 0) or 0) < 1:
              failures.append('video_streams<1')
          if q.get('format') != 'moment' and int(q.get('audio_streams', 0) or 0) < 1:
              failures.append('audio_streams<1')
          if int(q.get('visual_sections_reviewed', 0) or 0) < 1:
              failures.append('visual_sections_reviewed<1')
          if failures:
              raise SystemExit('Final quality contract failed: ' + ', '.join(failures))
          size = final.stat().st_size
          if size < 1024 * 1024:
              raise SystemExit(f'final.mp4 unexpectedly small: {size} bytes')
          if q.get('format') != 'moment':
              if not delivery.is_file():
                  raise SystemExit('Missing canonical delivery-manifest.json for long-form production')
              d = json.loads(delivery.read_text(encoding='utf-8'))
              control = d.get('control_request') if isinstance(d, dict) else None
              scope = str((control or {}).get('approval_scope') or '') if isinstance(control, dict) else ''
              short_count = int(d.get('short_count', 0) or 0)
              if scope == 'long_only':
                  if d.get('delivery_kind') != 'long' or short_count != 0:
                      raise SystemExit('Approved long-only request unexpectedly contains sibling Shorts')
              else:
                  if d.get('delivery_kind') != 'long_plus_shorts':
                      raise SystemExit('Canonical long-form delivery_kind is not long_plus_shorts')
                  if short_count not in {2, 3}:
                      raise SystemExit('Canonical long-form delivery must contain 2-3 sibling Shorts')
              if len(d.get('title_thumbnail_pairs') or []) != 3:
                  raise SystemExit('Canonical long-form delivery must expose A/B/C packaging')
              if d.get('youtube_publish_mode') != 'manual_in_youtube_studio':
                  raise SystemExit('Canonical delivery attempted to change manual YouTube publication')
              if d.get('publication_performed') is not False:
                  raise SystemExit('Canonical delivery falsely claims publication')
              if d.get('partial_delivery_allowed') is not False:
                  raise SystemExit('Canonical delivery attempted to allow partial delivery')
              shorts = d.get('shorts') or []
              jobs = []
              for item in shorts:
                  if not isinstance(item, dict) or item.get('delivery_allowed') is not True:
                      raise SystemExit('Canonical delivery contains an unapproved sibling Short')
                  video_name = str(item.get('video') or '')
                  job = str(item.get('semantic_job') or '').strip().casefold()
                  if not video_name or not (root / video_name).is_file() or not job:
                      raise SystemExit('Canonical delivery sibling Short is missing video or semantic job')
                  jobs.append(job)
              if len(jobs) != len(set(jobs)):
                  raise SystemExit('Canonical delivery sibling Short semantic jobs are not distinct')
          output_root = Path('engine') / root
          final_path = Path('engine') / final
          quality_path = Path('engine') / quality
          plan_path = Path('engine') / plan
          telemetry_path = (Path('engine') / telemetry) if telemetry.exists() else None
          critic_path = Path('engine') / critic
          budget_path = Path('engine') / budget
          manifest_path = Path('engine') / manifest
          delivery_path = (Path('engine') / delivery) if delivery.exists() else None
          opening_audit_path = (Path('engine') / opening_audit) if opening_audit.exists() else None
          final_master_qc_path = Path('engine') / final_master_qc
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as fh:
              fh.write(f'output_root={output_root.as_posix()}\n')
              fh.write(f'final_path={final_path.as_posix()}\n')
              fh.write(f'quality_path={quality_path.as_posix()}\n')
              fh.write(f'plan_path={plan_path.as_posix()}\n')
              fh.write(f'telemetry_path={telemetry_path.as_posix() if telemetry_path else ""}\n')
              fh.write(f'critic_path={critic_path.as_posix()}\n')
              fh.write(f'budget_path={budget_path.as_posix()}\n')
              fh.write(f'manifest_path={manifest_path.as_posix()}\n')
              fh.write(f'delivery_path={delivery_path.as_posix() if delivery_path else ""}\n')
              fh.write(f'opening_audit_path={opening_audit_path.as_posix() if opening_audit_path else ""}\n')
              fh.write(f'final_master_qc_path={final_master_qc_path.as_posix()}\n')
          print('Final review PASS:', final)
          print('Final quality:', json.dumps(q, ensure_ascii=False, sort_keys=True))
          print('Final Master QC PASS:', json.dumps(qc, ensure_ascii=False, sort_keys=True))
          print('Final critic observe-only status:', json.loads(critic.read_text(encoding='utf-8')).get('status'))
          print('Packaging delivery validation PASS:', ', '.join(sorted(packaging)))
          if delivery.exists():
              print('Unified delivery validation PASS:', delivery)
          print('Final review output root:', output_root.as_posix())
          PY

      - name: Upload final delivery bundle
        id: upload_final
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: isco-resilient-v4-video-${{ github.run_number }}
          path: |
            ${{ steps.final_review.outputs.final_path }}
            ${{ steps.final_review.outputs.quality_path }}
            ${{ steps.final_review.outputs.plan_path }}
            ${{ steps.final_review.outputs.telemetry_path }}
            engine/output/*/visual-audit.json
            ${{ steps.final_review.outputs.critic_path }}
            ${{ steps.final_review.outputs.budget_path }}
            ${{ steps.final_review.outputs.manifest_path }}
            ${{ steps.final_review.outputs.delivery_path }}
            ${{ steps.final_review.outputs.opening_audit_path }}
            ${{ steps.final_review.outputs.final_master_qc_path }}
            ${{ steps.final_review.outputs.output_root }}/thumbnail-plan.json
            ${{ steps.final_review.outputs.output_root }}/thumbnail-*.jpg
            ${{ steps.final_review.outputs.output_root }}/rights-manifest.json
            ${{ steps.final_review.outputs.output_root }}/gold-enforce-report.json
            ${{ steps.final_review.outputs.output_root }}/capability-manifest.json
            ${{ steps.final_review.outputs.output_root }}/canonical-bundle-request.json
            ${{ steps.final_review.outputs.output_root }}/sibling-short-plan.json
            ${{ steps.final_review.outputs.output_root }}/sibling-short-results.json
            ${{ steps.final_review.outputs.output_root }}/short-*
            ${{ steps.final_review.outputs.output_root }}/visual-timeline.json
            ${{ steps.final_review.outputs.output_root }}/audio-mastering.json
            ${{ steps.final_review.outputs.output_root }}/sfx-plan.json
            ${{ steps.final_review.outputs.output_root }}/m9-transitions.json
            ${{ steps.final_review.outputs.output_root }}/m10-cards.json
            ${{ steps.final_review.outputs.output_root }}/m11-report.json
            ${{ steps.final_review.outputs.output_root }}/cta-plan.json
            ${{ steps.final_review.outputs.output_root }}/*.m8.json
          if-no-files-found: error
          retention-days: 7

      - name: Request publish approval via Telegram
        id: publish_approval
        if: success()
        working-directory: engine
        env:
          REQUIRE_PUBLISH_APPROVAL: ${{ vars.REQUIRE_PUBLISH_APPROVAL || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_OUTBOX_REF: ${{ github.ref_name }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python ../scripts/telegram_publish_gate.py

      - name: Create GitHub Release with unified delivery bundle
        id: create_release
        if: success() && steps.publish_approval.outputs.effective_decision == 'approved'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
          ISCO_RELEASE_TAG_OVERRIDE: ${{ steps.telegram_ingress.outputs.release_tag }}
          FINAL_OUTPUT_ROOT: ${{ steps.final_review.outputs.output_root }}
          FINAL_VIDEO_PATH: ${{ steps.final_review.outputs.final_path }}
          FINAL_QUALITY_PATH: ${{ steps.final_review.outputs.quality_path }}
          FINAL_PLAN_PATH: ${{ steps.final_review.outputs.plan_path }}
          FINAL_TELEMETRY_PATH: ${{ steps.final_review.outputs.telemetry_path }}
          FINAL_CRITIC_PATH: ${{ steps.final_review.outputs.critic_path }}
          FINAL_BUDGET_PATH: ${{ steps.final_review.outputs.budget_path }}
          FINAL_MANIFEST_PATH: ${{ steps.final_review.outputs.manifest_path }}
          FINAL_DELIVERY_PATH: ${{ steps.final_review.outputs.delivery_path }}
          FINAL_OPENING_AUDIT_PATH: ${{ steps.final_review.outputs.opening_audit_path }}
          FINAL_MASTER_QC_PATH: ${{ steps.final_review.outputs.final_master_qc_path }}
        run: |
          set -euo pipefail
          test -n "$FINAL_OUTPUT_ROOT"
          test -n "$FINAL_VIDEO_PATH"
          test -n "$FINAL_QUALITY_PATH"
          test -n "$FINAL_PLAN_PATH"
          test -n "$FINAL_CRITIC_PATH"
          test -n "$FINAL_BUDGET_PATH"
          test -n "$FINAL_MANIFEST_PATH"
          test -n "$FINAL_MASTER_QC_PATH"
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          sys.path.insert(0, str(Path.cwd().parent))
          from scripts.packaging_delivery_contract import validate_packaging_delivery
          root = Path(os.environ['FINAL_OUTPUT_ROOT'])
          video = Path(os.environ['FINAL_VIDEO_PATH'])
          quality = Path(os.environ['FINAL_QUALITY_PATH'])
          plan = Path(os.environ['FINAL_PLAN_PATH'])
          telemetry_value = os.environ.get('FINAL_TELEMETRY_PATH', '').strip()
          telemetry = Path(telemetry_value) if telemetry_value else None
          critic = Path(os.environ['FINAL_CRITIC_PATH'])
          budget = Path(os.environ['FINAL_BUDGET_PATH'])
          manifest = Path(os.environ['FINAL_MANIFEST_PATH'])
          delivery_value = os.environ.get('FINAL_DELIVERY_PATH', '').strip()
          delivery = Path(delivery_value) if delivery_value else None
          opening_value = os.environ.get('FINAL_OPENING_AUDIT_PATH', '').strip()
          opening = Path(opening_value) if opening_value else None
          final_master_qc = Path(os.environ['FINAL_MASTER_QC_PATH'])
          capability_manifest = root / 'capability-manifest.json'
          packaging = validate_packaging_delivery(root)
          if video != root / 'final.mp4':
              raise SystemExit(f'Release video escaped reviewed output root: {video}')
          if quality != root / 'quality-final.json':
              raise SystemExit(f'Release quality file escaped reviewed output root: {quality}')
          if plan != root / 'plan.json':
              raise SystemExit(f'Release plan escaped reviewed output root: {plan}')
          if critic != root / 'final-critic.json':
              raise SystemExit(f'Release critic escaped reviewed output root: {critic}')
          if budget != root / 'ai-budget.json':
              raise SystemExit(f'Release budget escaped reviewed output root: {budget}')
          if manifest != root / 'production-manifest.json':
              raise SystemExit(f'Release manifest escaped reviewed output root: {manifest}')
          if final_master_qc != root / 'final-master-qc.json':
              raise SystemExit(f'Release Final Master QC escaped reviewed output root: {final_master_qc}')
          if delivery is not None and delivery != root / 'delivery-manifest.json':
              raise SystemExit(f'Release delivery manifest escaped reviewed output root: {delivery}')
          if telemetry is not None and telemetry != root / 'planning-telemetry.json':
              raise SystemExit(f'Release telemetry path was exported but file is missing: {telemetry}')
          if opening is not None and opening != root / 'opening-visual-audit.json':
              raise SystemExit(f'Release opening audit path was exported but file is missing: {opening}')
          for required in (video, quality, plan, critic, budget, manifest, final_master_qc, capability_manifest):
              if not required.is_file():
                  raise SystemExit(f'Missing reviewed release asset: {required}')
          qc = json.loads(final_master_qc.read_text(encoding='utf-8'))
          if not isinstance(qc, dict):
              raise SystemExit('Release blocked: Final Master QC evidence is not an object')
          if (
              qc.get('status') != 'pass'
              or qc.get('production_stage') != 'post_render_pre_gold_acceptance'
              or qc.get('full_decode_ok') is not True
              or qc.get('final_media_mutated') is not False
              or list(qc.get('blocking_findings') or [])
          ):
              raise SystemExit('Release blocked: Final Master QC evidence is not passing')
          size = video.stat().st_size
          if size <= 1024 * 1024:
              raise SystemExit(f'Release blocked: final.mp4 is not >1MB: {size} bytes')
          q = json.loads(quality.read_text(encoding='utf-8'))
          if q.get('duration_ok') is not True:
              raise SystemExit('Release blocked: duration_ok is not true for reviewed output')
          if q.get('format') != 'moment':
              if delivery is None or not delivery.is_file():
                  raise SystemExit('Release blocked: missing reviewed long-form delivery manifest')
              d = json.loads(delivery.read_text(encoding='utf-8'))
              control = d.get('control_request') if isinstance(d, dict) else None
              scope = str((control or {}).get('approval_scope') or '') if isinstance(control, dict) else ''
              short_count = int(d.get('short_count', 0) or 0)
              if scope == 'long_only':
                  if d.get('delivery_kind') != 'long' or short_count != 0:
                      raise SystemExit('Release blocked: long-only request contains sibling Shorts')
              elif d.get('delivery_kind') != 'long_plus_shorts' or short_count not in {2, 3}:
                  raise SystemExit('Release blocked: incomplete long+Shorts bundle')
              if d.get('youtube_publish_mode') != 'manual_in_youtube_studio' or d.get('publication_performed') is not False:
                  raise SystemExit('Release blocked: YouTube publication contract changed')
          if telemetry is not None and not telemetry.is_file():
              raise SystemExit(f'Release telemetry path was exported but file is missing: {telemetry}')
          if opening is not None and not opening.is_file():
              raise SystemExit(f'Release opening audit path was exported but file is missing: {opening}')
          print(f'Release asset validation PASS: root={root} size={size} duration_ok=true')
          print('Final Master QC release validation PASS:', final_master_qc)
          print('Packaging release validation PASS:', ', '.join(sorted(packaging)))
          PY
          tag="${ISCO_RELEASE_TAG_OVERRIDE:-video-${RUN_NUMBER}}"
          if [ -n "$FINAL_DELIVERY_PATH" ]; then
            RELEASE_TAG="$tag" python - <<'PY'
          import os
          from pathlib import Path
          from scripts.unified_delivery import finalize_release_manifest
          finalize_release_manifest(
              Path(os.environ['FINAL_DELIVERY_PATH']),
              repository=os.environ['GITHUB_REPOSITORY'],
              release_tag=os.environ['RELEASE_TAG'],
          )
          PY
          fi
          release_assets=("$FINAL_VIDEO_PATH" "$FINAL_QUALITY_PATH" "$FINAL_PLAN_PATH" "$FINAL_CRITIC_PATH" "$FINAL_BUDGET_PATH" "$FINAL_MANIFEST_PATH" "$FINAL_MASTER_QC_PATH" "$FINAL_OUTPUT_ROOT/thumbnail-plan.json" "$FINAL_OUTPUT_ROOT/thumbnail-1.jpg" "$FINAL_OUTPUT_ROOT/thumbnail-2.jpg" "$FINAL_OUTPUT_ROOT/thumbnail-3.jpg" "$FINAL_OUTPUT_ROOT/rights-manifest.json" "$FINAL_OUTPUT_ROOT/gold-enforce-report.json" "$FINAL_OUTPUT_ROOT/capability-manifest.json")
          if [ -n "$FINAL_TELEMETRY_PATH" ]; then
            release_assets+=("$FINAL_TELEMETRY_PATH")
          fi
          if [ -n "$FINAL_OPENING_AUDIT_PATH" ]; then
            release_assets+=("$FINAL_OPENING_AUDIT_PATH")
          fi
          if [ -n "$FINAL_DELIVERY_PATH" ]; then
            release_assets+=("$FINAL_DELIVERY_PATH")
          fi
          for candidate in \
            "$FINAL_OUTPUT_ROOT"/canonical-bundle-request.json \
            "$FINAL_OUTPUT_ROOT"/sibling-short-plan.json \
            "$FINAL_OUTPUT_ROOT"/sibling-short-results.json \
            "$FINAL_OUTPUT_ROOT"/short-* \
            "$FINAL_OUTPUT_ROOT"/visual-timeline.json \
            "$FINAL_OUTPUT_ROOT"/audio-mastering.json \
            "$FINAL_OUTPUT_ROOT"/sfx-plan.json \
            "$FINAL_OUTPUT_ROOT"/m9-transitions.json \
            "$FINAL_OUTPUT_ROOT"/m10-cards.json \
            "$FINAL_OUTPUT_ROOT"/m11-report.json \
            "$FINAL_OUTPUT_ROOT"/cta-plan.json \
            "$FINAL_OUTPUT_ROOT"/*.m8.json
          do
            if [ -f "$candidate" ]; then release_assets+=("$candidate"); fi
          done
          release_cmd=(
            python scripts/release_transaction.py
            --repository "$GITHUB_REPOSITORY"
            --tag "$tag"
            --target-sha "$GITHUB_SHA"
            --title "Isco Video Bundle #${RUN_NUMBER}"
            --notes "Production bundle ${RUN_NUMBER}: canonical V4 reviewed delivery and evidence. YouTube publication remains manual."
            --journal "$RUNNER_TEMP/release-transaction.json"
          )
          for asset in "${release_assets[@]}"; do
            release_cmd+=(--asset "$asset")
          done
          "${release_cmd[@]}"

      - name: Upload release transaction evidence
        if: always() && steps.create_release.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: isco-release-transaction-${{ github.run_number }}
          path: ${{ runner.temp }}/release-transaction.json
          if-no-files-found: warn
          retention-days: 7

      - name: Checkout agent-state writer
        id: checkout_state_writer
        if: success() && steps.publish_approval.outputs.effective_decision == 'approved' && steps.restore_state.outputs.save_allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: state-writer
          persist-credentials: true
          fetch-depth: 1

      - name: Persist approved encrypted cross-run memory
        id: persist_state
        if: success() && steps.publish_approval.outputs.effective_decision == 'approved' && steps.restore_state.outputs.save_allowed == 'true'
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$STATE_ENCRYPTION_KEY"
          test -n "${ISCO_HISTORY_PATH:-}"
          test -f "$ISCO_HISTORY_PATH"
          encrypted="$RUNNER_TEMP/isco-state/history.json.enc"
          python scripts/persistent_memory.py encrypt \
            --plain "$ISCO_HISTORY_PATH" \
            --encrypted "$encrypted"
          python scripts/state_persistence_strict.py \
            --repo state-writer \
            --encrypted "$encrypted" \
            --branch agent-state \
            --run-number "$GITHUB_RUN_NUMBER" \
            --report "$RUNNER_TEMP/state-persistence.json"

      - name: Upload state closure diagnostics
        if: always() && steps.persist_state.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: isco-state-closure-${{ github.run_number }}
          path: ${{ runner.temp }}/state-persistence.json
          if-no-files-found: warn
          retention-days: 7

      - name: Checkout fresh Telegram state for terminal reconciliation
        id: checkout_control_closer
        if: always() && inputs.request_id != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: control-plane-state
          path: control-closer
          persist-credentials: true
          fetch-depth: 1

      - name: Reconcile Telegram dispatch against latest durable state
        id: telegram_state_close
        if: always() && inputs.request_id != '' && steps.checkout_control_closer.outcome == 'success'
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
          RELEASE_TAG: ${{ steps.telegram_ingress.outputs.release_tag }}
          CREATE_RELEASE_OUTCOME: ${{ steps.create_release.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          test -n "$STATE_ENCRYPTION_KEY"
          mkdir -p "$RUNNER_TEMP/isco-control-close"
          encrypted="control-closer/state/control-panel.json.enc"
          state="$RUNNER_TEMP/isco-control-close/control-panel.json"
          test -f "$encrypted"
          openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 \
            -pass env:STATE_ENCRYPTION_KEY -in "$encrypted" -out "$state"
          chmod 600 "$state"
          if [ "$CREATE_RELEASE_OUTCOME" = "success" ]; then
            test -n "$RELEASE_TAG"
            python scripts/telegram_v4_ingress.py complete \
              --state "$state" \
              --request-id "$REQUEST_ID" \
              --sha256 "$REQUEST_SHA256" \
              --authorization-id "$AUTHORIZATION_ID" \
              --release-tag "$RELEASE_TAG"
          else
            reason="production_failed"
            if [ "$JOB_STATUS" = "cancelled" ]; then reason="production_cancelled"; fi
            python scripts/telegram_v4_ingress.py fail \
              --state "$state" \
              --request-id "$REQUEST_ID" \
              --sha256 "$REQUEST_SHA256" \
              --authorization-id "$AUTHORIZATION_ID" \
              --reason "$reason"
          fi
          openssl enc -aes-256-cbc -salt -pbkdf2 -md sha256 \
            -pass env:STATE_ENCRYPTION_KEY -in "$state" -out "$encrypted"
          cd control-closer
          git config user.name "isco-control-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/control-panel.json.enc
          if git diff --cached --quiet; then
            echo "Telegram terminal reconciliation produced no state delta" >&2
            exit 1
          fi
          git commit -m "state: reconcile Telegram V4 terminal outcome"
          git push origin HEAD:control-plane-state

      - name: Notify Telegram
        if: always() && steps.validate_brief.outcome == 'success'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ISCO_RELEASE_TAG_OVERRIDE: ${{ steps.telegram_ingress.outputs.release_tag }}
          JOB_STATUS: ${{ job.status }}
          CHECKOUT_RUNNER_OUTCOME: ${{ steps.checkout_runner.outcome }}
          CHECKOUT_ENGINE_OUTCOME: ${{ steps.checkout_engine.outcome }}
          SETUP_PYTHON_OUTCOME: ${{ steps.setup_python.outcome }}
          INSTALL_ENGINE_OUTCOME: ${{ steps.install_engine.outcome }}
          RESTORE_STATE_OUTCOME: ${{ steps.restore_state.outcome }}
          VOICE_PREFLIGHT_OUTCOME: ${{ steps.voice_preflight.outcome }}
          ENVIRONMENT_PREFLIGHT_OUTCOME: ${{ steps.environment_preflight.outcome }}
          PREPARE_REQUEST_OUTCOME: ${{ steps.prepare_request.outcome }}
          VERIFY_PROVIDERS_OUTCOME: ${{ steps.verify_providers.outcome }}
          PRODUCE_VIDEO_OUTCOME: ${{ steps.produce_video.outcome }}
          FINAL_REVIEW_OUTCOME: ${{ steps.final_review.outcome }}
          UPLOAD_FINAL_OUTCOME: ${{ steps.upload_final.outcome }}
          PUBLISH_APPROVAL_OUTCOME: ${{ steps.publish_approval.outcome }}
          CREATE_RELEASE_OUTCOME: ${{ steps.create_release.outcome }}
          PERSIST_STATE_OUTCOME: ${{ steps.persist_state.outcome }}
          FINAL_PLAN_PATH: ${{ steps.final_review.outputs.plan_path }}
          FINAL_DELIVERY_PATH: ${{ steps.final_review.outputs.delivery_path }}
          FINAL_OUTPUT_ROOT: ${{ steps.final_review.outputs.output_root }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          python -m scripts.telegram_final_notify

      - name: Remove plaintext production secrets and state
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/isco-secrets" || true
          rm -rf "$RUNNER_TEMP/isco-state" || true
          rm -rf "$RUNNER_TEMP/isco-test-state" || true
          rm -rf "$RUNNER_TEMP/isco-control" || true
          rm -rf "$RUNNER_TEMP/isco-control-close" || true
          rm -rf "$RUNNER_TEMP/pip-audit-venv" || true
          rm -rf "$RUNNER_TEMP/piper-wheel" || true
          rm -rf "$RUNNER_TEMP/piper-voices" || true
          rm -rf "$RUNNER_TEMP/isco-tts-cache" || true
          rm -f "$RUNNER_TEMP/isco-request.json" || true
          rm -f "$RUNNER_TEMP/piper-preflight.wav" || true
