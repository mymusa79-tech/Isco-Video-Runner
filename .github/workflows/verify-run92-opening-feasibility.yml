name: Verify Run 92 Opening Feasibility

on:
  push:
    branches: ["fix/run92-opening-feasibility"]
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/__init__.py"
      - "scripts/opening_feasibility_guard.py"
      - "scripts/test_run92_opening_feasibility_guard.py"
      - ".github/workflows/verify-run92-opening-feasibility.yml"

permissions:
  contents: read

jobs:
  run92-opening-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact production Engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 5f66ab7281160e588236687e0a3c6862fa817b7a
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine pin
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "5f66ab7281160e588236687e0a3c6862fa817b7a"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install Engine candidate
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Focused Run 92 Runner regression
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: python -m unittest scripts.test_run92_opening_feasibility_guard -v

      - name: Planner quality guard compatibility regression
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: python -m unittest scripts.test_planner_quality_guard -v

      - name: Production-only binding smoke
        env:
          GITHUB_ACTIONS: "true"
          REQUEST_FILE: ${{ runner.temp }}/run92-request.json
          ISCO_ENGINE_SHA: 5f66ab7281160e588236687e0a3c6862fa817b7a
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          python - <<'PY'
          import isco_video_agent.opening_director as opening_director
          import isco_video_agent.orchestrator as orchestrator
          import scripts
          from scripts.opening_feasibility_guard import adaptive_opening_slot_specs

          assert opening_director.opening_slot_specs is adaptive_opening_slot_specs
          assert getattr(orchestrator.pexels_search_videos, "_isco_run92_stock_pool_guard", False)
          assert getattr(orchestrator.pixabay_provider.search_videos, "_isco_run92_stock_pool_guard", False)
          assert getattr(orchestrator.select_opening_sequence, "_isco_run92_adaptive_opening_guard", False)
          print("Run 92 production-only binding smoke OK")
          PY

      - name: Full Engine regression
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Full Runner regression
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q

      - name: Diff sanity
        run: git diff --check origin/main...HEAD || git diff --check
