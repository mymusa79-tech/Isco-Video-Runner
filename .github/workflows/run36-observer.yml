name: Run36 V4 Observer

on:
  workflow_run:
    workflows: ["Isco Video Production Resilient V4"]
    types: [completed]
  push:
    branches: ["main"]
    paths:
      - ".run36-observer-trigger"

permissions:
  contents: write
  actions: read

jobs:
  capture-completed:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout observer state branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ops/run36-observer-state
          persist-credentials: true
          fetch-depth: 1

      - name: Persist completed V4 run identity
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = {
              "run_id": int(os.environ["RUN_ID"]),
              "run_number": int(os.environ["RUN_NUMBER"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "conclusion": os.environ["CONCLUSION"],
              "head_sha": os.environ["HEAD_SHA"],
              "head_branch": os.environ["HEAD_BRANCH"],
              "html_url": os.environ["RUN_URL"],
              "event": os.environ["RUN_EVENT"],
          }
          Path("run36-v4-result.json").write_text(json.dumps(data, indent=2), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run36-v4-result.json
          git commit -m "ops: record completed V4 run ${RUN_NUMBER}" || true
          git push origin HEAD:ops/run36-observer-state

  query-latest:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout observer state branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ops/run36-observer-state
          persist-credentials: true
          fetch-depth: 1

      - name: Query latest V4 runs and persist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/produce-resilient-v4.yml/runs?per_page=10" \
            > /tmp/v4-runs.json
          python - <<'PY'
          import json
          from pathlib import Path
          src = json.loads(Path('/tmp/v4-runs.json').read_text(encoding='utf-8'))
          rows = []
          for run in src.get('workflow_runs', []):
              rows.append({
                  'run_id': run.get('id'),
                  'run_number': run.get('run_number'),
                  'run_attempt': run.get('run_attempt'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'event': run.get('event'),
                  'head_branch': run.get('head_branch'),
                  'head_sha': run.get('head_sha'),
                  'html_url': run.get('html_url'),
                  'created_at': run.get('created_at'),
                  'updated_at': run.get('updated_at'),
              })
          Path('run36-v4-latest.json').write_text(json.dumps(rows, indent=2), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run36-v4-latest.json
          git commit -m "ops: snapshot latest V4 runs" || true
          git push origin HEAD:ops/run36-observer-state
