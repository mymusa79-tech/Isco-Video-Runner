name: Migrate Legacy Memory and Launch Production

on:
  workflow_dispatch:
  push:
    branches:
      - ops/migrate-memory-and-launch
    paths:
      - .ops/migrate-memory-and-launch.trigger

concurrency:
  group: isco-memory-migration-launch
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  migrate-and-launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LEGACY_STATE_COMMIT: 36b0db59d8c01a625c5e4e4d929e5dc298a92746
      LEGACY_STATE_SEQUENCE: "50"
      EXPECTED_NEXT_PRODUCTION_RUN: "111"
      CANONICAL_PRODUCTION_WORKFLOW: produce-resilient-v4.yml
      ENGINE_SHA: 0370105f0b7212b02e3c53d8e64eefd83e7fd8fe
    steps:
      - name: Checkout runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Verify Production 111 has not been dispatched
        id: production_precheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${CANONICAL_PRODUCTION_WORKFLOW}/runs?per_page=1" --jq '.workflow_runs[0].run_number // 0')"
          if [ "$latest" -ne 110 ]; then
            echo "Expected canonical Production latest run_number=110, found $latest" >&2
            exit 1
          fi
          echo "Canonical Production sequence is ready for Run 111"

      - name: Checkout exact Engine security lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ env.ENGINE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine checkout
        run: test "$(git -C engine rev-parse HEAD)" = "$ENGINE_SHA"

      - name: Install locked persistent-memory crypto runtime
        run: |
          set -euo pipefail
          PYTHONPATH=engine/src python scripts/security_v1_supply_chain_preflight.py lock --lock engine/requirements-lock.txt
          python -m pip install --disable-pip-version-check \
            'cryptography==50.0.0' 'cffi==2.1.1' 'pycparser==3.0'
          python -m pip check

      - name: Resolve current agent-state head
        id: state_head
        run: |
          set -euo pipefail
          head="$(git ls-remote --exit-code --heads origin refs/heads/agent-state | awk '{print $1}')"
          test -n "$head"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "Current agent-state head: $head"

      - name: Restore and authenticate current memory
        id: restore_state
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/pre-run111-state"
          mkdir -p "$state_dir"
          GITHUB_RUN_NUMBER="$EXPECTED_NEXT_PRODUCTION_RUN" \
            python scripts/persistent_memory.py restore \
              --repo . \
              --plain "$state_dir/history.json" \
              --branch agent-state \
              --legacy-state state/history.json.enc \
              --github-output "$GITHUB_OUTPUT"
          test -f "$state_dir/history.json"
          chmod 600 "$state_dir/history.json"
          echo "MIGRATION_HISTORY_PATH=$state_dir/history.json" >> "$GITHUB_ENV"

      - name: Validate migration source contract
        id: migration_contract
        env:
          STATE_HEAD: ${{ steps.state_head.outputs.head }}
          RESTORE_SAVE_ALLOWED: ${{ steps.restore_state.outputs.save_allowed }}
          RESTORE_REASON: ${{ steps.restore_state.outputs.reason }}
          RESTORE_SEQUENCE: ${{ steps.restore_state.outputs.state_sequence }}
        run: |
          set -euo pipefail
          test "$RESTORE_SAVE_ALLOWED" = "true"
          if [ "$STATE_HEAD" = "$LEGACY_STATE_COMMIT" ]; then
            case "$RESTORE_REASON" in
              *"pinned legacy CBC state accepted for one-time authenticated migration"*) ;;
              *) echo "Legacy head did not restore through the pinned migration path" >&2; exit 1 ;;
            esac
            test -z "$RESTORE_SEQUENCE"
            echo "migration_required=true" >> "$GITHUB_OUTPUT"
          else
            test "$RESTORE_SEQUENCE" = "$LEGACY_STATE_SEQUENCE"
            case "$RESTORE_REASON" in
              *"authenticated AES-256-GCM state"*) ;;
              *) echo "Non-legacy head is not the authenticated migrated state" >&2; exit 1 ;;
            esac
            echo "migration_required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout authenticated state writer
        if: steps.migration_contract.outputs.migration_required == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: state-writer
          persist-credentials: true
          fetch-depth: 1

      - name: Rewrap exact legacy state as authenticated AES-GCM
        if: steps.migration_contract.outputs.migration_required == 'true'
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          encrypted="$RUNNER_TEMP/pre-run111-state/history.v2.json.enc"
          python scripts/persistent_memory.py encrypt \
            --plain "$MIGRATION_HISTORY_PATH" \
            --encrypted "$encrypted" \
            --run-number "$LEGACY_STATE_SEQUENCE"
          python scripts/state_persistence_strict.py \
            --repo state-writer \
            --encrypted "$encrypted" \
            --branch agent-state \
            --run-number "$LEGACY_STATE_SEQUENCE" \
            --report "$RUNNER_TEMP/pre-run111-state/persist-report.json"

      - name: Verify durable authenticated migration
        id: verify_migration
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/pre-run111-verify"
          mkdir -p "$verify_dir"
          GITHUB_RUN_NUMBER="$EXPECTED_NEXT_PRODUCTION_RUN" \
            python scripts/persistent_memory.py restore \
              --repo . \
              --plain "$verify_dir/history.json" \
              --branch agent-state \
              --legacy-state state/history.json.enc \
              --github-output "$verify_dir/outputs"
          grep -Fx 'save_allowed=true' "$verify_dir/outputs"
          grep -Fx 'state_sequence=50' "$verify_dir/outputs"
          grep -F 'authenticated AES-256-GCM state' "$verify_dir/outputs"
          new_head="$(git ls-remote --exit-code --heads origin refs/heads/agent-state | awk '{print $1}')"
          test -n "$new_head"
          if [ "$new_head" = "$LEGACY_STATE_COMMIT" ]; then
            echo "agent-state still points to the legacy CBC commit" >&2
            exit 1
          fi
          echo "Authenticated memory migration is durable at $new_head"

      - name: Recheck Production sequence before dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${CANONICAL_PRODUCTION_WORKFLOW}/runs?per_page=1" --jq '.workflow_runs[0].run_number // 0')"
          test "$latest" -eq 110

      - name: Dispatch canonical Production Run 111
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${CANONICAL_PRODUCTION_WORKFLOW}/dispatches" \
            -f ref=main
          echo "Canonical Production dispatch accepted"

      - name: Confirm Production Run 111 exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            row="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${CANONICAL_PRODUCTION_WORKFLOW}/runs?event=workflow_dispatch&per_page=5" \
              --jq '.workflow_runs[] | select(.run_number == 111) | [.id,.html_url,.status] | @tsv' | head -n1)"
            if [ -n "$row" ]; then
              printf 'Production Run 111: %s\n' "$row"
              exit 0
            fi
            sleep 2
          done
          echo "Dispatch returned success but Production Run 111 was not observable" >&2
          exit 1
