name: Run54 Opening Query Guard Test

on:
  push:
    branches: ["fix/run54-opening-query-guard"]
    paths:
      - "scripts/planner_quality_guard.py"
      - "scripts/test_planner_quality_guard.py"
      - ".github/workflows/run54-opening-query-guard-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout verified private engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 4badc9ae3215986fb2b4becdba7f147a6cf726f0
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install engine
        run: |
          set -euo pipefail
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Run targeted guard regression tests
        run: |
          set -euo pipefail
          PYTHONPATH="engine/src:." python -m unittest scripts.test_planner_quality_guard -v
