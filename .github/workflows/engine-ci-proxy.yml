# M0 diagnostic trigger pass 2
name: Engine CI Proxy

on:
  push:
    branches: ["analytics/retention-v2-m0-health"]
    paths: [".github/workflows/engine-ci-proxy.yml"]

permissions:
  contents: write
  statuses: write

jobs:
  test-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mark direct diagnostic started
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          body=json.dumps({'state':'pending','context':'analytics-m0-direct-start','description':'direct Analytics M0 started'}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",data=body,method='POST',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          urllib.request.urlopen(req,timeout=20).read()
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: df8cadcd531a9bfa28767e94fc6d61e479ad0d4a
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install minimal diagnostic runtime
        run: python -m pip install 'requests==2.32.3'

      - name: Read same known video ID from existing M0 evidence
        id: binding
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('verification/analytics-retention-m0-bound.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          binding=data.get('binding_evidence',{})
          video_id=str(binding.get('video_id','')).strip()
          if not video_id: raise SystemExit('Existing M0 evidence has no video ID')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as f:f.write(f'video_id={video_id}\n')
          print('Reusing the same known video ID from persisted M0 evidence.')
          PY

      - name: Materialize existing OAuth secrets
        env:
          CID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CSECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          RTOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CID"; test -n "$CSECRET"; test -n "$RTOKEN"
          umask 077; mkdir -p "$RUNNER_TEMP/oauth-direct"
          printf '%s' "$CID" > "$RUNNER_TEMP/oauth-direct/cid"
          printf '%s' "$CSECRET" > "$RUNNER_TEMP/oauth-direct/secret"
          printf '%s' "$RTOKEN" > "$RUNNER_TEMP/oauth-direct/refresh"

      - name: Probe base Analytics and retention directly
        id: direct
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src
          YOUTUBE_CLIENT_ID_FILE: ${{ runner.temp }}/oauth-direct/cid
          YOUTUBE_CLIENT_SECRET_FILE: ${{ runner.temp }}/oauth-direct/secret
          YOUTUBE_REFRESH_TOKEN_FILE: ${{ runner.temp }}/oauth-direct/refresh
          VID: ${{ steps.binding.outputs.video_id }}
        run: python engine/scripts/check_youtube_analytics_direct_health.py --video-id "$VID" --output "$RUNNER_TEMP/direct.json"

      - name: Add sanitized direct result to M0 evidence
        if: always()
        env:
          DIRECT_OUTCOME: ${{ steps.direct.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('verification/analytics-retention-m0-bound.json')
          data=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'schema_version':2}
          q=Path(os.environ['RUNNER_TEMP'])/'direct.json'
          try: direct=json.loads(q.read_text(encoding='utf-8'))
          except Exception: direct={'status':'missing'}
          data['schema_version']=2
          data['latest_engine_sha']='df8cadcd531a9bfa28767e94fc6d61e479ad0d4a'
          data['direct_step']=os.environ.get('DIRECT_OUTCOME') or 'not_run'
          data['direct_analytics_path']=direct
          data['targeted_tests']='pending';data['full_suite']='pending'
          data['secrets_changed']=False;data['production_video_started']=False;data['production_influence']='none'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/analytics-retention-m0-bound.json
          git commit -m "ci: record direct Analytics M0 result" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish direct API statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          try:d=json.loads((Path(os.environ['RUNNER_TEMP'])/'direct.json').read_text())
          except:d={}
          stages={'base':d.get('base_analytics',{}).get('query_status'),'retention':d.get('retention',{}).get('query_status')}
          repo=os.environ['GITHUB_REPOSITORY'];sha=os.environ['GITHUB_SHA'];tok=os.environ['GH_TOKEN']
          for n,v in stages.items():
              body=json.dumps({'state':'success' if v=='ok' else 'failure','context':f'analytics-m0-direct-{n}','description':f'{n}={v or "missing"}'}).encode()
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',data=body,method='POST',headers={'Authorization':f'Bearer {tok}','Accept':'application/vnd.github+json','Content-Type':'application/json'})
              urllib.request.urlopen(req,timeout=20).read()
          PY

      - name: Install locked Engine verification runtime
        if: always()
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Run all M0 targeted tests
        id: targeted
        if: always()
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_youtube_analytics_health.py' -v
          python -m unittest discover -s tests -p 'test_youtube_analytics_bound_health.py' -v
          python -m unittest discover -s tests -p 'test_youtube_analytics_direct_health.py' -v

      - name: Run full Engine suite
        id: full
        if: always()
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Finalize M0 test results
        if: always()
        env:
          TARGETED: ${{ steps.targeted.outcome }}
          FULL: ${{ steps.full.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('verification/analytics-retention-m0-bound.json');data=json.loads(p.read_text(encoding='utf-8'))
          data['targeted_tests']=os.environ.get('TARGETED') or 'not_run';data['full_suite']=os.environ.get('FULL') or 'not_run'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git add verification/analytics-retention-m0-bound.json
          git commit -m "ci: finalize M0 direct diagnostic tests" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
