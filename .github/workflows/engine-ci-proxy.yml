name: Engine CI Proxy

on:
  push:
    branches: ["analytics/retention-v2-m1-verification"]
    paths:
      - ".github/workflows/engine-ci-proxy.yml"

permissions:
  contents: write

jobs:
  diagnose-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 34ae246bd65c3ebf6cfec72a2968dde3cdac2f83
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install Engine
        working-directory: engine
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Materialize unchanged YouTube credentials
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          for name in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN YOUTUBE_API_KEY; do test -n "${!name}"; done
          umask 077
          mkdir -p "$RUNNER_TEMP/m1-youtube"
          printf '%s' "$YOUTUBE_CLIENT_ID" > "$RUNNER_TEMP/m1-youtube/client-id"
          printf '%s' "$YOUTUBE_CLIENT_SECRET" > "$RUNNER_TEMP/m1-youtube/client-secret"
          printf '%s' "$YOUTUBE_REFRESH_TOKEN" > "$RUNNER_TEMP/m1-youtube/refresh-token"
          printf '%s' "$YOUTUBE_API_KEY" > "$RUNNER_TEMP/m1-youtube/api-key"
      - name: Diagnose live stages safely
        working-directory: engine
        env:
          CID_FILE: ${{ runner.temp }}/m1-youtube/client-id
          CLIENT_SECRET_FILE: ${{ runner.temp }}/m1-youtube/client-secret
          REFRESH_FILE: ${{ runner.temp }}/m1-youtube/refresh-token
          API_KEY_FILE: ${{ runner.temp }}/m1-youtube/api-key
          RETENTION_ROOT: ${{ runner.temp }}/m1-retention
          REPORT_PATH: ${{ github.workspace }}/verification/retention-m1-live-diagnostic.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import requests
          from isco_video_agent.youtube_analytics import ANALYTICS_URL, TOKEN_URL, VIDEOS_URL, collect_latest_video_metrics_from_env

          def safe_error(response):
              try:
                  payload=response.json()
              except Exception:
                  return None
              err=payload.get('error') if isinstance(payload,dict) else None
              if not isinstance(err,dict): return None
              reasons=[]
              for item in err.get('errors',[]):
                  if isinstance(item,dict) and item.get('reason'): reasons.append(str(item['reason']))
              return {'code':err.get('code'),'reasons':reasons,'message':str(err.get('message',''))[:240]}

          class RecordingSession:
              def __init__(self): self.calls=[]
              def _record(self,method,url,kwargs,response):
                  params=kwargs.get('params',{}) or {}
                  kind='other'
                  if url==TOKEN_URL: kind='oauth_refresh'
                  elif url==VIDEOS_URL: kind='video_probe'
                  elif url==ANALYTICS_URL and params.get('dimensions')=='elapsedVideoTimeRatio': kind='retention'
                  elif url==ANALYTICS_URL: kind='base_analytics'
                  self.calls.append({'kind':kind,'method':method,'status':response.status_code,'error':safe_error(response)})
              def post(self,url,**kwargs):
                  r=requests.post(url,**kwargs); self._record('POST',url,kwargs,r); return r
              def get(self,url,**kwargs):
                  r=requests.get(url,**kwargs); self._record('GET',url,kwargs,r); return r

          files={
              'YOUTUBE_CLIENT_ID_FILE':Path(os.environ['CID_FILE']),
              'YOUTUBE_CLIENT_SECRET_FILE':Path(os.environ['CLIENT_SECRET_FILE']),
              'YOUTUBE_REFRESH_TOKEN_FILE':Path(os.environ['REFRESH_FILE']),
              'YOUTUBE_API_KEY_FILE':Path(os.environ['API_KEY_FILE']),
          }
          secret_values=[p.read_text(encoding='utf-8').strip() for p in files.values()]
          for name,path in files.items(): os.environ[name]=str(path)
          os.environ['ISCO_RETENTION_STORAGE_ROOT']=os.environ['RETENTION_ROOT']
          session=RecordingSession()
          result=collect_latest_video_metrics_from_env(format_hint='film',expected_video_id='e_I6g1qt4xg',session=session)
          sidecar=Path(os.environ['RETENTION_ROOT'])/'unverified'/'e_I6g1qt4xg.json'
          report={
              'engine_sha':'34ae246bd65c3ebf6cfec72a2968dde3cdac2f83',
              'observer_returned':isinstance(result,dict),
              'calls':session.calls,
              'sidecar_exists':sidecar.exists(),
          }
          if sidecar.exists():
              data=json.loads(sidecar.read_text(encoding='utf-8'))
              obs=(data.get('observations') or [{}])[-1]
              report['sidecar']={'isolation':data.get('isolation'),'points_received':obs.get('points_received'),'curve_status':obs.get('curve_status'),'metrics_returned':obs.get('metrics_returned'),'missing_metrics':obs.get('missing_metrics')}
          text=json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+'\n'
          for value in secret_values:
              if value and value in text: raise SystemExit('secret leakage in diagnostic')
          Path(os.environ['REPORT_PATH']).parent.mkdir(parents=True,exist_ok=True)
          Path(os.environ['REPORT_PATH']).write_text(text,encoding='utf-8')
          PY
      - name: Persist diagnostic evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/retention-m1-live-diagnostic.json
          git commit -m "verify: capture M1 live diagnostic"
          git push origin HEAD:analytics/retention-v2-m1-verification
