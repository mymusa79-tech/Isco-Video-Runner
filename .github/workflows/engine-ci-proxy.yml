# M0 one-time direct retention retry
name: Engine CI Proxy

on:
  push:
    branches: ["analytics/retention-v2-m0-health"]
    paths: [".github/workflows/engine-ci-proxy.yml"]

permissions:
  contents: write
  statuses: write

jobs:
  m0-direct-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark retry started
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          body=json.dumps({'state':'pending','context':'analytics-m0-retention-retry-start','description':'one-time direct retention retry started'}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",data=body,method='POST',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          urllib.request.urlopen(req,timeout=20).read()
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: df8cadcd531a9bfa28767e94fc6d61e479ad0d4a
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - run: python -m pip install 'requests==2.32.3'

      - name: Read same known video ID
        id: binding
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('verification/analytics-retention-m0-bound.json').read_text(encoding='utf-8'))
          video_id=str(data.get('binding_evidence',{}).get('video_id','')).strip()
          if not video_id: raise SystemExit('No M0 video ID')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as f:f.write(f'video_id={video_id}\n')
          PY

      - name: Materialize unchanged OAuth credentials
        env:
          CID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CSECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          RTOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CID"; test -n "$CSECRET"; test -n "$RTOKEN"
          umask 077; mkdir -p "$RUNNER_TEMP/oauth"
          printf '%s' "$CID" > "$RUNNER_TEMP/oauth/cid"
          printf '%s' "$CSECRET" > "$RUNNER_TEMP/oauth/secret"
          printf '%s' "$RTOKEN" > "$RUNNER_TEMP/oauth/refresh"

      - name: Retry direct base and retention
        id: retry
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src
          YOUTUBE_CLIENT_ID_FILE: ${{ runner.temp }}/oauth/cid
          YOUTUBE_CLIENT_SECRET_FILE: ${{ runner.temp }}/oauth/secret
          YOUTUBE_REFRESH_TOKEN_FILE: ${{ runner.temp }}/oauth/refresh
          VID: ${{ steps.binding.outputs.video_id }}
        run: python engine/scripts/check_youtube_analytics_direct_health.py --video-id "$VID" --output "$RUNNER_TEMP/retry.json"

      - name: Persist sanitized retry result
        if: always()
        env:
          RETRY_OUTCOME: ${{ steps.retry.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          p=Path('verification/analytics-retention-m0-bound.json');data=json.loads(p.read_text(encoding='utf-8'))
          try:r=json.loads((Path(os.environ['RUNNER_TEMP'])/'retry.json').read_text(encoding='utf-8'))
          except Exception:r={'status':'missing'}
          data['direct_retry_step']=os.environ.get('RETRY_OUTCOME') or 'not_run'
          data['direct_analytics_retry']=r
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          stages={'base':r.get('base_analytics',{}).get('query_status'),'retention':r.get('retention',{}).get('query_status')}
          repo=os.environ['GITHUB_REPOSITORY'];sha=os.environ['GITHUB_SHA'];tok=os.environ['GH_TOKEN']
          for n,v in stages.items():
              detail=r.get('retention',{}) if n=='retention' else r.get('base_analytics',{})
              desc=f'{n}={v or "missing"} error={detail.get("error_class") or "none"}'[:140]
              body=json.dumps({'state':'success' if v=='ok' else 'failure','context':f'analytics-m0-retry-{n}','description':desc}).encode()
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',data=body,method='POST',headers={'Authorization':f'Bearer {tok}','Accept':'application/vnd.github+json','Content-Type':'application/json'})
              urllib.request.urlopen(req,timeout=20).read()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/analytics-retention-m0-bound.json
          git commit -m "ci: record one-time direct retention retry" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
