name: Engine CI Proxy

on:
  push:
    branches: ["analytics/retention-v2-m1-verification"]
    paths:
      - ".github/workflows/engine-ci-proxy.yml"

permissions:
  contents: write
  statuses: write

concurrency:
  group: retention-m1-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Runner verifier branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Checkout exact private Engine M1 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 0a65585f987d262e2d08bbd752f9f45bf5e3a16f
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install locked Engine verification runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Run M1 targeted tests
        id: targeted
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_youtube_retention_m1*.py' -v
          python -m unittest discover -s tests -p 'test_youtube_production_observer_credentials.py' -v
          python -m unittest discover -s tests -p 'test_youtube_analytics_learning.py' -v

      - name: Publish targeted status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.targeted.outcome }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          outcome=os.environ.get('OUTCOME') or 'missing'
          body=json.dumps({'state':'success' if outcome=='success' else 'failure','context':'retention-m1-targeted-schema-final','description':outcome}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",data=body,method='POST',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          urllib.request.urlopen(req,timeout=20).read()
          PY

      - name: Run full Engine suite
        id: full
        if: always()
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -q

      - name: Publish full-suite status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.full.outcome }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          outcome=os.environ.get('OUTCOME') or 'missing'
          body=json.dumps({'state':'success' if outcome=='success' else 'failure','context':'retention-m1-full-suite-schema-final','description':outcome}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",data=body,method='POST',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          urllib.request.urlopen(req,timeout=20).read()
          PY

      - name: Materialize unchanged YouTube credentials
        id: creds
        if: always()
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          for name in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN YOUTUBE_API_KEY; do test -n "${!name}"; done
          umask 077
          mkdir -p "$RUNNER_TEMP/m1-youtube"
          printf '%s' "$YOUTUBE_CLIENT_ID" > "$RUNNER_TEMP/m1-youtube/client-id"
          printf '%s' "$YOUTUBE_CLIENT_SECRET" > "$RUNNER_TEMP/m1-youtube/client-secret"
          printf '%s' "$YOUTUBE_REFRESH_TOKEN" > "$RUNNER_TEMP/m1-youtube/refresh-token"
          printf '%s' "$YOUTUBE_API_KEY" > "$RUNNER_TEMP/m1-youtube/api-key"

      - name: Live read-only full retention fetch and persistence
        id: live
        if: always()
        working-directory: engine
        env:
          VIDEO_ID: e_I6g1qt4xg
          CID_FILE: ${{ runner.temp }}/m1-youtube/client-id
          CLIENT_SECRET_FILE: ${{ runner.temp }}/m1-youtube/client-secret
          REFRESH_FILE: ${{ runner.temp }}/m1-youtube/refresh-token
          API_KEY_FILE: ${{ runner.temp }}/m1-youtube/api-key
          RETENTION_ROOT: ${{ runner.temp }}/m1-retention
          SUMMARY_PATH: ${{ github.workspace }}/verification/retention-m1-live.json
          SIDECAR_COPY_PATH: ${{ github.workspace }}/verification/retention-m1-live-sidecar.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import requests
          from isco_video_agent.retention_storage import RETENTION_METRICS
          from isco_video_agent.youtube_analytics import ANALYTICS_URL, TOKEN_URL, VIDEOS_URL, collect_latest_video_metrics_from_env

          video_id=os.environ['VIDEO_ID'].strip()
          files={
              'client_id':Path(os.environ['CID_FILE']),
              'client_secret':Path(os.environ['CLIENT_SECRET_FILE']),
              'refresh':Path(os.environ['REFRESH_FILE']),
              'api_key':Path(os.environ['API_KEY_FILE']),
          }
          secret_values=[p.read_text(encoding='utf-8').strip() for p in files.values()]

          class RecordingSession:
              def __init__(self): self.calls=[]
              def post(self,url,**kwargs):
                  response=requests.post(url,**kwargs)
                  self.calls.append({'method':'POST','url':url,'status':response.status_code,'params':kwargs.get('params',{})})
                  return response
              def get(self,url,**kwargs):
                  response=requests.get(url,**kwargs)
                  self.calls.append({'method':'GET','url':url,'status':response.status_code,'params':kwargs.get('params',{})})
                  return response

          session=RecordingSession()
          os.environ['YOUTUBE_CLIENT_ID_FILE']=str(files['client_id'])
          os.environ['YOUTUBE_CLIENT_SECRET_FILE']=str(files['client_secret'])
          os.environ['YOUTUBE_REFRESH_TOKEN_FILE']=str(files['refresh'])
          os.environ['YOUTUBE_API_KEY_FILE']=str(files['api_key'])
          os.environ['ISCO_RETENTION_STORAGE_ROOT']=os.environ['RETENTION_ROOT']

          result=collect_latest_video_metrics_from_env(format_hint='film',expected_video_id=video_id,session=session)
          if not isinstance(result,dict): raise SystemExit('Production observer returned no result')

          sidecar=Path(os.environ['RETENTION_ROOT'])/'unverified'/f'{video_id}.json'
          if not sidecar.exists(): raise SystemExit('Expected unverified retention sidecar was not persisted')
          data=json.loads(sidecar.read_text(encoding='utf-8'))
          observations=data.get('observations',[])
          if not isinstance(observations,list) or len(observations)!=1: raise SystemExit('Expected exactly one live snapshot')
          obs=observations[0]
          rows=obs.get('raw_rows',[])
          if data.get('schema_version')!=1 or data.get('video_id')!=video_id: raise SystemExit('Sidecar identity/schema mismatch')
          if obs.get('schema_version')!=1 or obs.get('video_id')!=video_id: raise SystemExit('Observation identity/schema mismatch')
          if obs.get('binding_source') is not None: raise SystemExit('Unverified historical observation invented binding_source')
          if obs.get('curve_status')!='complete': raise SystemExit(f"Curve status was {obs.get('curve_status')}")
          if obs.get('points_received')!=100 or len(rows)!=100: raise SystemExit('Live curve did not persist exactly 100 points')
          if data.get('isolation')!='unverified': raise SystemExit('Historical live video crossed the verified provenance boundary')
          if obs.get('content_style')!='unverified' or obs.get('classification_status')!='unresolved': raise SystemExit('Historical provenance semantics changed')
          if 'production_id' in obs: raise SystemExit('Unverified live snapshot must not invent production_id')
          returned=obs.get('metrics_returned',[])
          missing=obs.get('missing_metrics',[])
          if any(name not in RETENTION_METRICS for name in returned): raise SystemExit('Unexpected retention metric name returned')
          if sorted(returned+missing)!=sorted(RETENTION_METRICS): raise SystemExit('Returned/missing metric accounting is incomplete')
          if 'audienceWatchRatio' not in returned: raise SystemExit('Legacy audienceWatchRatio was not persisted')
          ratios=[row.get('elapsedVideoTimeRatio') for row in rows]
          if ratios!=sorted(ratios): raise SystemExit('Persisted curve ratios are not sorted')

          retention_calls=[c for c in session.calls if c['url']==ANALYTICS_URL and c['params'].get('dimensions')=='elapsedVideoTimeRatio']
          if not retention_calls or retention_calls[-1]['status']!=200: raise SystemExit('Retention HTTP 200 not observed')
          allowed={TOKEN_URL,VIDEOS_URL,ANALYTICS_URL}
          if any(c['url'] not in allowed for c in session.calls): raise SystemExit('Unexpected network destination in M1 verifier')

          summary={
              'schema_version':1,
              'mode':'M1_full_retention_curve_storage',
              'engine_sha':'0a65585f987d262e2d08bbd752f9f45bf5e3a16f',
              'video_id':video_id,
              'retention_http_status':retention_calls[-1]['status'],
              'retention_request_count':len(retention_calls),
              'points_received':obs.get('points_received'),
              'curve_status':obs.get('curve_status'),
              'metrics_returned':returned,
              'missing_metrics':missing,
              'content_style':obs.get('content_style'),
              'classification_status':obs.get('classification_status'),
              'binding_source':obs.get('binding_source'),
              'ingestion_source':obs.get('ingestion_source'),
              'storage_isolation':data.get('isolation'),
              'snapshot_count':len(observations),
              'observation_schema_version':obs.get('schema_version'),
              'observation_video_id':obs.get('video_id'),
              'first_30s_present':'first_30s_retention' in (result.get('metrics') or {}),
              'sample_points':{'first':rows[0],'middle':rows[len(rows)//2],'last':rows[-1]},
              'production_run_started':False,
              'stores_raw_curve':True,
              'interpolation':False,
              'smoothing':False,
              'dip_spike_analysis':False,
              'ai_calls_added':False,
          }
          summary_text=json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)+'\n'
          sidecar_text=json.dumps(data,ensure_ascii=False,indent=2,sort_keys=True)+'\n'
          exposed=summary_text+sidecar_text
          for value in secret_values:
              if value and value in exposed: raise SystemExit('Secret leakage detected in M1 evidence')
          Path(os.environ['SUMMARY_PATH']).parent.mkdir(parents=True,exist_ok=True)
          Path(os.environ['SUMMARY_PATH']).write_text(summary_text,encoding='utf-8')
          Path(os.environ['SIDECAR_COPY_PATH']).write_text(sidecar_text,encoding='utf-8')
          print('M1 live retention storage verification PASS')
          PY

      - name: Publish live status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.live.outcome }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          outcome=os.environ.get('OUTCOME') or 'missing'
          body=json.dumps({'state':'success' if outcome=='success' else 'failure','context':'retention-m1-live-schema-final','description':outcome}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",data=body,method='POST',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          urllib.request.urlopen(req,timeout=20).read()
          PY

      - name: Persist verification evidence only
        if: steps.targeted.outcome == 'success' && steps.full.outcome == 'success' && steps.live.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/retention-m1-live.json verification/retention-m1-live-sidecar.json
          git commit -m "verify: persist final M1 observation schema evidence"
          git push origin HEAD:analytics/retention-v2-m1-verification
