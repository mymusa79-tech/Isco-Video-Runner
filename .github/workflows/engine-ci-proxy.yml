# M0 final verification only
name: Engine CI Proxy

on:
  push:
    branches: ["analytics/retention-v2-m0-health"]
    paths: [".github/workflows/engine-ci-proxy.yml"]

permissions:
  contents: write
  statuses: write

jobs:
  verify-m0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mark verification started
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          body=json.dumps({'state':'pending','context':'analytics-m0-final-verify-start','description':'final M0 code verification started'}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",data=body,method='POST',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          urllib.request.urlopen(req,timeout=20).read()
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: df8cadcd531a9bfa28767e94fc6d61e479ad0d4a
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install locked Engine verification runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Run all M0 targeted tests
        id: targeted
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_youtube_analytics_health.py' -v
          python -m unittest discover -s tests -p 'test_youtube_analytics_bound_health.py' -v
          python -m unittest discover -s tests -p 'test_youtube_analytics_direct_health.py' -v

      - name: Run full Engine suite
        id: full
        if: always()
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Persist and publish verification result
        if: always()
        env:
          TARGETED: ${{ steps.targeted.outcome }}
          FULL: ${{ steps.full.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          p=Path('verification/analytics-retention-m0-bound.json')
          data=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'schema_version':2}
          targeted=os.environ.get('TARGETED') or 'not_run';full=os.environ.get('FULL') or 'not_run'
          data['targeted_tests']=targeted;data['full_suite']=full;data['verified_engine_sha']='df8cadcd531a9bfa28767e94fc6d61e479ad0d4a'
          p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          repo=os.environ['GITHUB_REPOSITORY'];sha=os.environ['GITHUB_SHA'];tok=os.environ['GH_TOKEN']
          for context,outcome in [('analytics-m0-final-targeted',targeted),('analytics-m0-final-full-suite',full)]:
              body=json.dumps({'state':'success' if outcome=='success' else 'failure','context':context,'description':outcome[:140]}).encode()
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',data=body,method='POST',headers={'Authorization':f'Bearer {tok}','Accept':'application/vnd.github+json','Content-Type':'application/json'})
              urllib.request.urlopen(req,timeout=20).read()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/analytics-retention-m0-bound.json
          git commit -m "ci: record final M0 verification" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
