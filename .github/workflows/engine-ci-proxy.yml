name: Engine CI Proxy

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/engine-ci-proxy.yml"
      - "scripts/task_level_planner_router.py"
      - "scripts/voice_mesh.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout private engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 5969bbcf7ef9e720f85253098bf426082dcb02f8
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Run engine tests
        run: |
          set -euo pipefail
          cd engine
          python -m unittest discover -s tests -v

      - name: Verify runner dialogue routing
        run: |
          set -euo pipefail
          python -m py_compile scripts/task_level_planner_router.py scripts/voice_mesh.py
          PYTHONPATH="engine/src:scripts" python - <<'PY'
          import os
          import task_level_planner_router as router
          import voice_mesh

          assert voice_mesh.DIALOGUE_QUESTIONER_VOICE == "Kore"
          assert voice_mesh.DIALOGUE_RESPONDER_VOICE == "Gacrux"
          turns = voice_mesh._dialogue_turns("السائل: لماذا يحدث هذا؟\nالمجيب: لأننا نخلط بين الشعور والحقيقة.")
          assert turns == [("السائل", "لماذا يحدث هذا؟"), ("المجيب", "لأننا نخلط بين الشعور والحقيقة.")]
          try:
              voice_mesh._dialogue_turns("هذا مونولوج بلا أدوار")
          except RuntimeError as exc:
              assert str(exc) == "dialogue_voice_contract_invalid"
          else:
              raise AssertionError("unlabelled dialogue must fail closed")

          enriched = router._enrich_dialogue_prompt("Narrative structure: dialogue_qa\nWrite only this section, not the whole episode.")
          assert '"السائل:"' in enriched and '"المجيب:"' in enriched
          assert "routing metadata for TTS" in enriched
          print("Dialogue routing contract PASS: fixed Kore/Gacrux; labelled turns; fail-closed parser")
          PY

      - name: Verify no paid API use
        run: |
          set -euo pipefail
          test -z "${GEMINI_API_KEY:-}"
          test -z "${GROQ_API_KEY:-}"
          test -z "${OPENROUTER_API_KEY:-}"
          test -z "${PEXELS_API_KEY:-}"
          test -z "${PIXABAY_API_KEY:-}"
          echo "No provider API credentials exposed to test job"
