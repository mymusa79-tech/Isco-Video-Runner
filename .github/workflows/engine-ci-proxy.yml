name: Engine CI Proxy

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/engine-ci-proxy.yml"
      - "scripts/task_level_planner_router.py"
      - "scripts/voice_mesh.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout runner guard branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/run54-tone-directive-guard
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout private engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 4badc9ae3215986fb2b4becdba7f147a6cf726f0
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Run engine tests
        run: |
          set -euo pipefail
          cd engine
          python -m unittest discover -s tests -v

      - name: Run Run54 planner-quality regressions
        run: |
          set -euo pipefail
          PYTHONPATH="engine/src:." python -m unittest scripts.test_planner_quality_guard -v

      - name: Verify identity, visual scoring, and hook contracts
        run: |
          set -euo pipefail
          python -m py_compile scripts/task_level_planner_router.py scripts/voice_mesh.py scripts/planner_quality_guard.py
          PYTHONPATH="engine/src:scripts" python - <<'PY'
          from pathlib import Path
          import voice_mesh
          from planner_quality_guard import _neutralize_harsh_directives, _safe_opening_visual_query
          from isco_video_agent.providers.gemini import _speech_config, _voice_identity
          from isco_video_agent.orchestrator import _visual_fit_score

          assert _neutralize_harsh_directives(
              "افطم نفسك تدريجيًا عن هذا المراقبة المستمرة."
          ) == "يمكنك أن تقلل تدريجيًا من هذه المراقبة المستمرة."
          assert _neutralize_harsh_directives("جرب أن تدوّن الفكرة.") == "جرب أن تدوّن الفكرة."
          assert _safe_opening_visual_query(
              "person sitting by wooden table in sunlit room looking pensively at empty notebook"
          ) == "table room notebook"
          assert voice_mesh.DIALOGUE_QUESTIONER_VOICE == "Orus"
          assert voice_mesh.DIALOGUE_RESPONDER_VOICE == "Charon"
          assert _voice_identity("RandomVoice") == ("Charon", "Orus")
          assert _speech_config("A: لماذا؟\nB: لأن الفكرة أعمق.", "RandomVoice") == [
              {"speaker": "A", "voice": "Orus"},
              {"speaker": "B", "voice": "Charon"},
          ]
          assert _visual_fit_score({"relevance": 0.87}) == 8.7
          assert _visual_fit_score({"relevance": 2}) == 10.0
          assert _visual_fit_score({"relevance": 0}) == 1.0

          planner = Path("engine/src/isco_video_agent/planner.py").read_text(encoding="utf-8")
          assert "section s1 has a hard retention contract" in planner
          assert "a direct question" in planner
          assert "a bold but" in planner
          assert "clear tease of the concrete insight/result" in planner
          assert "No scene-setting, greeting, biography, abstract reflection, throat-clearing" in planner
          assert "s1's first spoken sentence must still be one strong direct question" in planner
          print("Run54 tone, visual guard, identity, scoring, and s1 contracts PASS")
          PY

      - name: Verify no paid API use
        run: |
          set -euo pipefail
          test -z "${GEMINI_API_KEY:-}"
          test -z "${GROQ_API_KEY:-}"
          test -z "${OPENROUTER_API_KEY:-}"
          test -z "${PEXELS_API_KEY:-}"
          test -z "${PIXABAY_API_KEY:-}"
          echo "No provider API credentials exposed to test job"
