name: Probe One Bounded Tone Repair

on:
  push:
    branches:
      - fix/one-bounded-tone-repair-run199

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run Run199 bounded tone repair regression
        run: python -m unittest scripts.test_clean_v2.OneBoundedToneRepairRun199Tests
