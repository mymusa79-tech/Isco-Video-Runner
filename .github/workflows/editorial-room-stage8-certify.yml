      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked Engine runtime and ffmpeg
        working-directory: engine
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Focused Stage 8 contracts
        working-directory: engine
        run: python -m unittest tests.test_editorial_stage8 -v

      - name: Stage 5-7 and Final Critic compatibility
        working-directory: engine
        run: >-
          python -m unittest
          tests.test_editorial_adapters tests.test_editorial_stage6 tests.test_editorial_stage7
          tests.test_human_editorial_intent tests.test_learning_and_critic tests.test_learning_metrics_source
          tests.test_final_critic_provenance_batch tests.test_final_critic_selected_visuals
          tests.test_gold_finalizer tests.test_gold_shadow_phase2a
          tests.test_packaging_identity_integrity_p1 tests.test_thumbnail_packaging_contract -q

      - name: Full Engine regression
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Stage 8 exact scope review
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- state/history.json 2>/dev/null || true
          git diff --check
          mapfile -t changed < <(git status --porcelain --untracked-files=all | sed -E 's/^.. //')
          allowed=(src/isco_video_agent/editorial_learning.py src/isco_video_agent/learning.py src/isco_video_agent/final_critic.py src/isco_video_agent/production_pipeline.py tests/test_editorial_stage8.py)
          test "${#changed[@]}" -eq 5
          for path in "${changed[@]}"; do
            ok=false
            for want in "${allowed[@]}"; do [[ "$path" == "$want" ]] && ok=true; done
            $ok || { echo "unexpected Stage 8 path: $path" >&2; exit 1; }
          done

      - name: Prepare verified Stage 8 artifact
        working-directory: engine
        run: |
          mkdir -p "$RUNNER_TEMP/stage8/src/isco_video_agent" "$RUNNER_TEMP/stage8/tests"
          cp src/isco_video_agent/editorial_learning.py src/isco_video_agent/learning.py src/isco_video_agent/final_critic.py src/isco_video_agent/production_pipeline.py "$RUNNER_TEMP/stage8/src/isco_video_agent/"
          cp tests/test_editorial_stage8.py "$RUNNER_TEMP/stage8/tests/"
          git diff > "$RUNNER_TEMP/stage8/stage8.patch"

      - name: Upload verified Stage 8 candidate
        uses: actions/upload-artifact@v4
        with:
          name: stage8-verified-candidate
          path: ${{ runner.temp }}/stage8
          retention-days: 1
