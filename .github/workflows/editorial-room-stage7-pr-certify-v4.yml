name: Editorial Room Stage 7 PR Certify V4

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  ENGINE_SHA: 2a8d246d03bb5247da23b3c7b7e97e995b4619bf

jobs:
  certify-stage7-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Runner verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout exact Engine Stage 6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ env.ENGINE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Apply exact Stage 7 V3 candidate
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path("../.github/workflows/editorial-room-stage7-closure.yml").read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("          PY\n", start)
          lines = src[start:end].splitlines()
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path("/tmp/apply_stage7.py").write_text(code, encoding="utf-8")
          PY
          python /tmp/apply_stage7.py
          rm -f tests/test_editorial_stage7.py
          python - <<'PY'
          from pathlib import Path
          p = Path("src/isco_video_agent/packaging_integrity.py")
          s = p.read_text(encoding="utf-8")
          old = "    has_semantic_anchor = max(promise_alignment, turn_alignment, payoff_alignment, thesis_alignment) > 0.0\n"
          new = "    has_semantic_anchor = max(promise_alignment, turn_alignment, payoff_alignment, thesis_alignment) >= 0.20\n"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new), encoding="utf-8")
          PY
          git diff --check

      - name: Reuse exact Stage 7 V3 contract tests
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path("../.github/workflows/editorial-room-stage7-pr-certify-v3.yml").read_text(encoding="utf-8")
          start_marker = "          cat > tests/test_editorial_stage7.py <<'PYTEST'\n"
          end_marker = "          PYTEST\n"
          start = src.index(start_marker) + len(start_marker)
          end = src.index(end_marker, start)
          lines = src[start:end].splitlines()
          text = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path("tests/test_editorial_stage7.py").write_text(text, encoding="utf-8")
          PY
          python -m py_compile tests/test_editorial_stage7.py
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked Engine runtime and ffmpeg
        working-directory: engine
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Focused Stage 7 contracts
        working-directory: engine
        run: python -m unittest tests.test_editorial_stage7 -v

      - name: Stage 5-6 HEI and packaging compatibility
        working-directory: engine
        run: >-
          python -m unittest
          tests.test_editorial_adapters
          tests.test_editorial_stage6
          tests.test_human_editorial_intent
          tests.test_packaging_benchmark_p2
          tests.test_packaging_early_brief_p2
          tests.test_packaging_experiments_p2
          tests.test_packaging_identity_integrity_p1
          tests.test_packaging_learning_p2
          tests.test_thumbnail_packaging_contract
          -q

      - name: Full Engine regression
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Final Stage 7 diff review
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git checkout -- state/history.json 2>/dev/null || true
          mapfile -t changed < <(git status --porcelain --untracked-files=all | sed -E 's/^.. //')
          allowed=(src/isco_video_agent/production_pipeline.py src/isco_video_agent/packaging_integrity.py src/isco_video_agent/thumbnail.py tests/test_editorial_stage7.py)
          for path in "${changed[@]}"; do
            ok=false
            for want in "${allowed[@]}"; do [[ "$path" == "$want" ]] && ok=true; done
            $ok || { echo "unexpected dirty path: $path" >&2; exit 1; }
          done

      - name: Prepare verified Stage 7 artifact
        working-directory: engine
        run: |
          mkdir -p "$RUNNER_TEMP/stage7/src/isco_video_agent" "$RUNNER_TEMP/stage7/tests"
          cp src/isco_video_agent/production_pipeline.py "$RUNNER_TEMP/stage7/src/isco_video_agent/"
          cp src/isco_video_agent/packaging_integrity.py "$RUNNER_TEMP/stage7/src/isco_video_agent/"
          cp src/isco_video_agent/thumbnail.py "$RUNNER_TEMP/stage7/src/isco_video_agent/"
          cp tests/test_editorial_stage7.py "$RUNNER_TEMP/stage7/tests/"
          git diff > "$RUNNER_TEMP/stage7/stage7.patch"

      - name: Upload verified Stage 7 closure
        uses: actions/upload-artifact@v4
        with:
          name: stage7-verified-closure-v4
          path: ${{ runner.temp }}/stage7
          retention-days: 1
