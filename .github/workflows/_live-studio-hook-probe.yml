name: Live Studio Hook Probe

on:
  push:
    branches:
      - feature/studio-recommendations-alignment
    paths:
      - .github/workflows/_live-studio-hook-probe.yml

permissions:
  contents: read

jobs:
  short-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TEST_RUNNER_SHA: ee5babf84d6fd123069d11948784472c45f75920
      ISCO_ENGINE_SHA: 3cbd689819e6b0e0b2ea9904d1998e24a5e2a293
      GEMINI_CONTENT_MODEL: gemini-3.7-flash
      GEMINI_TTS_MODEL: gemini-3.8-flash-tts
      GROQ_CONTENT_MODEL: openai/gpt-oss-20b
      OPENROUTER_CONTENT_MODEL: google/gemma-4-26b-a4b-it:free
      MISTRAL_CONTENT_MODEL: ministral-14b-2512
      CLOUDFLARE_VISION_FREE_ONLY: "true"
      CLOUDFLARE_VISION_MAX_CALLS_PER_WORKFLOW: "5"
      CLEAN_V2_AI_STILL_FREE_ONLY: "true"
      CLEAN_V2_MUSIC_ALLOW_DOWNLOAD: "true"
      CLEAN_V2_OUTPUT: ${{ github.workspace }}/output/live-studio-hook-probe
      PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}

    steps:
      - name: Checkout exact Runner under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TEST_RUNNER_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Runner SHA
        run: test "$(git rev-parse HEAD)" = "$TEST_RUNNER_SHA"

      - name: Checkout frozen private Engine source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ env.ISCO_ENGINE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine pin
        run: test "$(git -C engine rev-parse HEAD)" = "$ISCO_ENGINE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install production dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y ffmpeg fontconfig fonts-noto-core tesseract-ocr tesseract-ocr-ara
          bash scripts/install_cairo_bold.sh
          python -m pip install --disable-pip-version-check 'Pillow==12.3.0'
          python -m pip install --disable-pip-version-check -r engine/requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e engine

      - name: Build immutable probe brief
        run: |
          set -euo pipefail
          brief="$RUNNER_TEMP/live-studio-hook-probe-brief.json"
          cat > "$brief" <<'JSON'
          {
            "approved_by_user": true,
            "approved_topic": "كيف تنهض عندما تفقد الدافع تمامًا؟",
            "format": "short",
            "language": "ar",
            "audience": "Arabic-speaking adults",
            "editorial_intent": "نبرة هادئة وعملية وطبيعية؛ فكرة واحدة مكتملة، دون تشاؤم أو مبالغة.",
            "research_pack": [],
            "hard_constraints": [
              "No fabricated facts.",
              "One natural Arabic narrator only.",
              "No social CTA.",
              "Complete Short follows the natural mastered voice duration; no editorial duration target."
            ]
          }
          JSON
          sha="$(BRIEF="$brief" python - <<'PY'
          import json, os
          from pathlib import Path
          from clean_v2.contracts import compute_brief_sha256
          path = Path(os.environ["BRIEF"])
          brief = json.loads(path.read_text(encoding="utf-8"))
          print(compute_brief_sha256(brief))
          PY
          )"
          echo "CLEAN_V2_SHORT_BRIEF=$brief" >> "$GITHUB_ENV"
          echo "ISCO_APPROVED_BRIEF_SHA256=$sha" >> "$GITHUB_ENV"
          test "${#sha}" = 64

      - name: Run exactly one Short production attempt
        id: production
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_VISION_QUOTA_FILE: ${{ runner.temp }}/cloudflare-live-hook-probe-vision-quota-v1.json
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -uo pipefail
          rm -rf "$CLEAN_V2_OUTPUT"
          mkdir -p "$CLEAN_V2_OUTPUT"
          set +e
          probe_log="$RUNNER_TEMP/live-studio-hook-probe.log"
          python -m clean_v2 --brief "$CLEAN_V2_SHORT_BRIEF" --approved-sha "$ISCO_APPROVED_BRIEF_SHA256" --engine-sha "$ISCO_ENGINE_SHA" --runner-sha "$TEST_RUNNER_SHA" --max-visuals 5 --output "$CLEAN_V2_OUTPUT" 2>&1 | tee "$probe_log"
          cp "$probe_log" "$CLEAN_V2_OUTPUT/live-probe.log" 2>/dev/null || true
          status=${PIPESTATUS[0]}
          echo "production_status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Print hook and visual evidence
        if: always()
        run: |
          set -euo pipefail
          echo "=== files ==="
          find "$CLEAN_V2_OUTPUT" -maxdepth 2 -type f -printf '%P\n' 2>/dev/null | sort || true
          for f in plan.json script.json visual-story.json short-contract.json cta-plan.json run-manifest.json provider-telemetry.json planning-provider-telemetry.json; do
            if [ -s "$CLEAN_V2_OUTPUT/$f" ]; then
              echo "=== $f ==="
              cat "$CLEAN_V2_OUTPUT/$f"
            fi
          done
          echo "=== validator lines ==="
          if [ -s "$CLEAN_V2_OUTPUT/live-probe.log" ]; then
            grep -nEi 'hook|visual_query|immediate|tension|reject|invalid|ShortFormatError|provider|429|503|rate.?limit' "$CLEAN_V2_OUTPUT/live-probe.log" || true
          fi

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-studio-hook-probe-${{ github.run_number }}
          path: ${{ env.CLEAN_V2_OUTPUT }}
          if-no-files-found: warn
          retention-days: 7
