name: Piper Arabic Isolation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/piper-isolation.yml"

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout locked private engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 2e271271c7770289eef81c354a26681cb2ee3d23
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install exact Piper and media environment
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffprobe -version | head -n 1
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
          python -m pip install 'piper-tts==1.4.2'
          mkdir -p "$RUNNER_TEMP/piper-voices"
          python -m piper.download_voices --data-dir "$RUNNER_TEMP/piper-voices" ar_JO-kareem-medium

      - name: Baseline raw Piper sections
        env:
          PIPER_MODEL_PATH: ${{ runner.temp }}/piper-voices/ar_JO-kareem-medium.onnx
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/engine
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, tempfile, unicodedata, wave
          from pathlib import Path
          from piper import PiperVoice
          from scripts.product_proof_plan import _proof_plan, _PROOF_TOPIC

          model = Path(os.environ["PIPER_MODEL_PATH"])
          voice = PiperVoice.load(str(model), config_path=str(model) + ".json")
          plan = _proof_plan(_PROOF_TOPIC)

          def digest(text: str) -> str:
              return hashlib.sha256(text.encode("utf-8")).hexdigest()[:16]

          def synth(text: str) -> tuple[bool, str]:
              fd, name = tempfile.mkstemp(suffix=".wav")
              os.close(fd)
              try:
                  with wave.open(name, "wb") as wav:
                      voice.synthesize_wav(text, wav)
                  return True, ""
              except Exception as exc:
                  return False, f"{type(exc).__name__}: {exc}"
              finally:
                  try: os.unlink(name)
                  except FileNotFoundError: pass

          print(f"SECTIONS={len(plan.sections)}")
          for i, section in enumerate(plan.sections, 1):
              text = section.narration
              ok, err = synth(text)
              print(
                  f"RAW {i}: {'PASS' if ok else 'FAIL'} "
                  f"chars={len(text)} sha={digest(text)} "
                  f"nfc={text == unicodedata.normalize('NFC', text)}"
              )
              if not ok:
                  print(f"RAW_ERROR {i}: {err}")
                  raise SystemExit(1)
          print("RAW_RESULT: PASS_8_OF_8")
          PY

      - name: Exact Voice Mesh sequential Piper path
        env:
          PIPER_MODEL_PATH: ${{ runner.temp }}/piper-voices/ar_JO-kareem-medium.onnx
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/engine
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, tempfile, unicodedata
          from pathlib import Path

          import scripts.voice_mesh as voice_mesh
          from scripts.product_proof_plan import _proof_plan, _PROOF_TOPIC

          plan = _proof_plan(_PROOF_TOPIC)

          # Force the exact fallback branch without spending a Gemini request.
          voice_mesh._gemini_open = True
          voice_mesh._piper = None

          def digest(text: str) -> str:
              return hashlib.sha256(text.encode("utf-8")).hexdigest()[:16]

          failures = []
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              for i, section in enumerate(plan.sections, 1):
                  text = section.narration
                  output = root / f"section-{i}.wav"
                  print(
                      f"MESH_INPUT {i}: chars={len(text)} sha={digest(text)} "
                      f"nfc={text == unicodedata.normalize('NFC', text)}"
                  )
                  try:
                      voice_mesh.synthesize(
                          "unused-test-key",
                          text,
                          output,
                          model="unused",
                          voice="unused",
                          style="",
                      )
                      print(f"MESH {i}: PASS bytes={output.stat().st_size}")
                  except Exception as exc:
                      print(f"MESH {i}: FAIL {type(exc).__name__}: {exc}")
                      failures.append(i)
                      break

          if failures:
              raise SystemExit(f"VOICE_MESH_RESULT: FAIL_FIRST_SECTION={failures[0]}")
          print("VOICE_MESH_RESULT: PASS_8_OF_8")
          PY
