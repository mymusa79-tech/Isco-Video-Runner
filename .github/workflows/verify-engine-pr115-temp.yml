name: Verify Engine PR 115 Temporary

on:
  push:
    branches: ["verify/run109-pr115-engine"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENGINE_SHA: 1dfb6e7f19c5d2263ead8271db4065d943491191
      RUNNER_SHA: ca2ea5c5917d1237a9207ec6cfb0118622cb1077
    steps:
      - name: Checkout exact Runner main for compatibility tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RUNNER_SHA }}
          path: runner-clean
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Runner checkout
        working-directory: runner-clean
        run: test "$(git rev-parse HEAD)" = "$RUNNER_SHA"

      - name: Checkout exact private Engine PR 115 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ env.ENGINE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine checkout
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "$ENGINE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install locked Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Dependency audit
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install pip-audit==2.10.1
          pip-audit --no-deps -r requirements-lock.txt

      - name: Focused Run 109 structural repair regression
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest tests.test_run109_structural_local_repair -v

      - name: Focused Editorial compatibility tests
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest tests.test_human_editorial_intent -v
          python -m unittest tests.test_editorial_room_director_m7_binding_current_main -v

      - name: Full Engine regression
        working-directory: engine
        run: |
          set -o pipefail
          python -m unittest discover -s tests -q 2>&1 | tee "$RUNNER_TEMP/pr115-engine-unittest.log"

      - name: Upload Engine regression diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr115-engine-unittest
          path: ${{ runner.temp }}/pr115-engine-unittest.log
          if-no-files-found: error
          retention-days: 1

      - name: Approved-Brief CLI contract matrix
        working-directory: engine
        run: |
          set -euo pipefail
          missing="$RUNNER_TEMP/isco-no-approved-brief.json"
          rm -f "$missing"
          ISCO_APPROVED_BRIEF_PATH="$missing" isco-video produce \
            --topic "لماذا تشعر أنك متأخر عن الجميع؟" --format auto --dry-run --no-research
          ISCO_APPROVED_BRIEF_PATH="$missing" isco-video produce \
            --format auto --dry-run --no-research
          isco-video produce --format auto --dry-run --no-research
          if isco-video produce --topic "لماذا تشعر أنك متأخر عن الجميع؟" \
            --format auto --dry-run --no-research; then
            echo 'ERROR: approved-brief mismatch unexpectedly passed' >&2
            exit 1
          fi

      - name: Focused Runner binding contracts against exact Engine
        working-directory: runner-clean
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}/runner-clean
        run: |
          set -euo pipefail
          python -m unittest scripts.test_human_editorial_intent_binding -v
          python -m unittest scripts.test_m7_live_binding -v

      - name: Full Runner regression against exact Engine
        working-directory: runner-clean
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}/runner-clean
        run: |
          set -o pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q 2>&1 | tee "$RUNNER_TEMP/pr115-runner-unittest.log"

      - name: Upload Runner regression diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr115-runner-unittest
          path: ${{ runner.temp }}/pr115-runner-unittest.log
          if-no-files-found: error
          retention-days: 1
