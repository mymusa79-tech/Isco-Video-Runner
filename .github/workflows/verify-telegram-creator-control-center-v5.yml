name: Verify Telegram Creator Control Center V5

on:
  pull_request:
    paths:
      - "scripts/telegram_creator_control_center_v5.py"
      - "scripts/telegram_operator_mission_control.py"
      - "scripts/telegram_topic_research_v2.py"
      - "scripts/telegram_topic_research_v2_core.py"
      - "scripts/telegram_webhook_replay.py"
      - "scripts/telegram_webhook_replay_core.py"
      - "scripts/test_telegram_creator_control_center_v5.py"
      - "scripts/test_telegram_creator_control_center_v5_edge.py"
      - "scripts/test_telegram_operator_mission_control.py"
      - "scripts/test_telegram_observability_v1.py"
      - "cloudflare/telegram-control-worker/observability-worker.js"
      - "cloudflare/telegram-control-worker/observability-worker-v4-core.js"
      - "cloudflare/telegram-control-worker/observability-worker-v6.js"
      - ".github/workflows/verify-telegram-creator-control-center-v5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-control-center:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Compile V5 surfaces
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/telegram_creator_control_center_v5.py \
            scripts/telegram_operator_mission_control.py \
            scripts/telegram_topic_research_v2.py \
            scripts/telegram_topic_research_v2_core.py \
            scripts/telegram_webhook_replay.py \
            scripts/telegram_webhook_replay_core.py
          node --check cloudflare/telegram-control-worker/observability-worker-v6.js
          node --check cloudflare/telegram-control-worker/observability-worker.js
          node --check cloudflare/telegram-control-worker/observability-worker-v4-core.js
          node --check cloudflare/telegram-control-worker/index.js

      - name: Creator UX and integration regressions
        run: |
          set -euo pipefail
          python -m unittest -v \
            scripts.test_telegram_creator_control_center_v5 \
            scripts.test_telegram_creator_control_center_v5_edge \
            scripts.test_telegram_operator_mission_control \
            scripts.test_telegram_persistent_control_ui \
            scripts.test_telegram_topic_memory_ui \
            scripts.test_telegram_topic_research_v2 \
            scripts.test_telegram_youtube_stats \
            scripts.test_telegram_webhook_replay \
            scripts.test_telegram_observability_v1 \
            scripts.test_telegram_edge_worker_contract

      - name: Preserve production and research authority boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          production = Path('.github/workflows/produce-resilient-v4.yml').read_text(encoding='utf-8')
          telegram = Path('.github/workflows/telegram-editorial-control.yml').read_text(encoding='utf-8')
          prod_match = re.search(r'^\s*EXPECTED_ENGINE_SHA:\s*([0-9a-f]{40})\s*$', production, re.MULTILINE)
          tg_match = re.search(r'^\s*ENGINE_SHA:\s*([0-9a-f]{40})\s*$', telegram, re.MULTILINE)
          if not prod_match or not tg_match:
              raise SystemExit('Canonical Production or Telegram Engine binding is missing')
          if prod_match.group(1) != tg_match.group(1):
              raise SystemExit('Telegram production Engine does not match canonical Production V4')
          print(f'Telegram production authority matches canonical Engine: {prod_match.group(1)}')
          PY
          grep -F 'RESEARCH_ENGINE_SHA: bf85607f6e34dcedc199abad7e610b12c4685309' .github/workflows/telegram-editorial-control.yml
          grep -F '"production_dispatch_authorized": False' scripts/telegram_control_panel.py >/dev/null
          ! grep -E 'dispatchToGitHub|workflow_dispatch|telegram-production-request.yml|cmd:produce_latest|cmd:retry' \
            cloudflare/telegram-control-worker/observability-worker-v6.js \
            cloudflare/telegram-control-worker/observability-worker.js
          ! grep -E 'enqueue_request|pending_dispatch|production_queue|production_dispatch_authorized[[:space:]]*=' \
            scripts/telegram_creator_control_center_v5.py
          ! grep -F 'enqueue_request(' scripts/telegram_operator_mission_control.py
          grep -F '"copy_text": {"text": CONFIRM_TEXT}' scripts/telegram_creator_control_center_v5.py
          grep -F 'if raw == PRODUCTION_CONFIRMATION_TEXT:' scripts/telegram_persistent_control_ui.py
          grep -F 'persistent_ui._BASE_HANDLE_COMMAND = _production_handle' scripts/telegram_operator_mission_control.py

      - name: Exact delta sanity
        run: git diff --check
