name: Clean V2 Minimal E2E

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  pull_request:
    branches: ["main"]
    paths:
      - "clean_v2/**"
      - "scripts/test_clean_v2.py"
      - "scripts/test_clean_v2_channel_persona.py"
      - "scripts/test_clean_v2_human_feel.py"
      - "scripts/test_clean_v2_structural_ai_flags.py"
      - "scripts/test_clean_v2_tone_naturalness.py"
      - "scripts/test_clean_v2_opening_director.py"
      - "scripts/test_clean_v2_contextual_cta.py"
      - "scripts/test_clean_v2_identity_visual_cta.py"
      - "scripts/test_clean_v2_voice.py"
      - "scripts/test_clean_v2_short.py"
      - "scripts/test_clean_v2_final_master_qc.py"
      - "scripts/test_clean_v2_legacy_cinematic.py"
      - "scripts/test_clean_v2_visual_pacing.py"
      - "docs/clean-v2/**"
      - ".github/workflows/clean-v2-minimal-e2e.yml"

permissions:
  contents: read

concurrency:
  group: clean-v2-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.actor == github.repository_owner && github.event.comment.body == '/clean-v2-cold-e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install FFmpeg for real Final Master QC fixture
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y ffmpeg

      - name: Run Clean V2 contracts, E2E render, legacy-layer adapter, and Final Master QC
        run: |
          python -m unittest \
            scripts.test_clean_v2 \
            scripts.test_clean_v2_channel_persona \
            scripts.test_clean_v2_human_feel \
            scripts.test_clean_v2_structural_ai_flags \
            scripts.test_clean_v2_tone_naturalness \
            scripts.test_clean_v2_opening_director \
            scripts.test_clean_v2_contextual_cta \
            scripts.test_clean_v2_identity_visual_cta \
            scripts.test_clean_v2_voice \
            scripts.test_clean_v2_short \
            scripts.test_clean_v2_legacy_cinematic \
            scripts.test_clean_v2_final_master_qc \
            scripts.test_clean_v2_visual_pacing \
            -v

  produce:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.actor == github.repository_owner &&
       github.event.comment.body == '/clean-v2-cold-e2e')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ISCO_ENGINE_SHA: 3cbd689819e6b0e0b2ea9904d1998e24a5e2a293
      ISCO_APPROVED_BRIEF_SHA256: bcf8d3017ee8e18ee4808614c7c07731b0452a5ba6182e1183404f663078e129
      GEMINI_CONTENT_MODEL: gemini-3.7-flash
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
      CLEAN_V2_AZURE_TTS_F0_CONFIRMED: ${{ vars.CLEAN_V2_AZURE_TTS_F0_CONFIRMED }}
      # Set only after listening to the generated Fusha acceptance sample.
      CLEAN_V2_AZURE_TTS_VOICE_APPROVED: ${{ vars.CLEAN_V2_AZURE_TTS_VOICE_APPROVED }}
      # Default production policy is fail-closed after Charon/Azure neural exhaustion.
      # Piper remains installed as a deliberately manual emergency switch only.
      CLEAN_V2_ALLOW_PIPER_FALLBACK: "false"
      GROQ_CONTENT_MODEL: openai/gpt-oss-20b
      OPENROUTER_CONTENT_MODEL: google/gemma-4-26b-a4b-it:free
      MISTRAL_CONTENT_MODEL: ministral-14b-2512
      CLOUDFLARE_VISION_FREE_ONLY: "true"
      CLOUDFLARE_VISION_MAX_CALLS_PER_WORKFLOW: "5"
      CLEAN_V2_OUTPUT: ${{ github.workspace }}/output/clean-v2/${{ github.run_id }}-${{ github.run_attempt }}
      CLEAN_V2_RESUME: ${{ github.workspace }}/.clean-v2-resume
      # isco_video_agent (imported by scripts/final_master_qc.py for the ffmpeg probe
      # and secret_free_subprocess_env helpers) lives under engine/src per the Engine
      # repo's setuptools src-layout (pyproject.toml: packages.find where=["src"]), not
      # at the Engine checkout's root. Pointing PYTHONPATH at "engine" instead of
      # "engine/src" made every Final Master QC invocation crash with
      # ModuleNotFoundError before it could produce any verdict -- confirmed across a
      # 5-attempt cohort where all runs that reached this stage failed identically.
      PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
    steps:
      - name: Checkout exact Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Runner checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Checkout frozen private Engine source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 3cbd689819e6b0e0b2ea9904d1998e24a5e2a293
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine pin
        run: test "$(git -C engine rev-parse HEAD)" = "$ISCO_ENGINE_SHA"

      - name: Verify frozen five-run cohort topic
        run: |
          test "$(jq -r .approved_topic engine/production/approved_brief.json)" = "لماذا تفشل خطط إدارة الوقت في الحياة اليومية"

      - name: Restore Clean V2 pre-QC checkpoint
        id: clean_v2_resume
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ env.CLEAN_V2_RESUME }}
          key: clean-v2-pre-qc-${{ runner.os }}-${{ github.sha }}-${{ env.ISCO_ENGINE_SHA }}-${{ env.ISCO_APPROVED_BRIEF_SHA256 }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            clean-v2-pre-qc-${{ runner.os }}-${{ github.sha }}-${{ env.ISCO_ENGINE_SHA }}-${{ env.ISCO_APPROVED_BRIEF_SHA256 }}-

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install render, Security V1 local inspection, M10 font, and local voice dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            ffmpeg \
            fonts-noto-core \
            tesseract-ocr \
            tesseract-ocr-ara
          python -m pip install --disable-pip-version-check -r engine/requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e engine
          python -m pip install --disable-pip-version-check 'piper-tts==1.4.2'
          tesseract --list-langs | grep -Fx eng >/dev/null
          tesseract --list-langs | grep -Fx ara >/dev/null

      - name: Restore verified Piper voice cache
        id: voice_cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/piper-voices
          key: clean-v2-piper-${{ runner.os }}-${{ hashFiles('engine/security/piper_voice_hashes.json') }}
          restore-keys: |
            piper-voice-v2-${{ runner.os }}-${{ hashFiles('engine/security/piper_voice_hashes.json') }}-

      - name: Check restored Piper voice files
        id: voice_files
        run: |
          if test -s "$RUNNER_TEMP/piper-voices/ar_JO-kareem-medium.onnx" \
            && test -s "$RUNNER_TEMP/piper-voices/ar_JO-kareem-medium.onnx.json"; then
            echo "download=false" >> "$GITHUB_OUTPUT"
          else
            echo "download=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Piper voice on cache miss
        if: steps.voice_files.outputs.download == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/piper-voices"
          python -m piper.download_voices \
            --data-dir "$RUNNER_TEMP/piper-voices" \
            ar_JO-kareem-medium

      - name: Verify Piper voice identity
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from clean_v2.media import verify_voice_assets

          verify_voice_assets(
              Path(os.environ["RUNNER_TEMP"]) / "piper-voices/ar_JO-kareem-medium.onnx",
              Path("engine/security/piper_voice_hashes.json"),
          )
          print("Piper voice identity verified")
          PY

      - name: Save verified Piper voice cache candidate
        if: steps.voice_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/piper-voices
          key: clean-v2-piper-${{ runner.os }}-${{ hashFiles('engine/security/piper_voice_hashes.json') }}

      - name: Produce one Clean V2 video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_VISION_QUOTA_FILE: ${{ runner.temp }}/cloudflare-clean-v2-vision-quota-v1.json
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail
          python -m clean_v2 \
            --brief "$GITHUB_WORKSPACE/engine/production/approved_brief.json" \
            --approved-sha "$ISCO_APPROVED_BRIEF_SHA256" \
            --engine-sha "$ISCO_ENGINE_SHA" \
            --runner-sha "$GITHUB_SHA" \
            --piper-model "$RUNNER_TEMP/piper-voices/ar_JO-kareem-medium.onnx" \
            --voice-manifest "$GITHUB_WORKSPACE/engine/security/piper_voice_hashes.json" \
            --resume-from "$CLEAN_V2_RESUME" \
            --max-visuals 5 \
            --output "$CLEAN_V2_OUTPUT"

      - name: Require complete final file
        run: |
          set -euo pipefail
          test -s "$CLEAN_V2_OUTPUT/final.mp4"
          test "$(jq -r .status "$CLEAN_V2_OUTPUT/run-manifest.json")" = "pass"
          case "$(jq -r .voice_provider "$CLEAN_V2_OUTPUT/run-manifest.json")" in
            "gemini:Charon"|"azure-f0:ar-OM-AbdullahNeural") ;;
            *) echo "Unexpected Clean V2 voice provider" >&2; exit 1 ;;
          esac
          test "$(jq -r .status "$CLEAN_V2_OUTPUT/final.json")" = "pass"
          test "$(jq -r .status "$CLEAN_V2_OUTPUT/factuality-audit.json")" = "pass"
          test "$(jq -r .status "$CLEAN_V2_OUTPUT/tone-naturalness-audit.json")" = "pass"
          test -s "$CLEAN_V2_OUTPUT/cta-plan.json"
          test "$(jq -r .rules.provider_calls "$CLEAN_V2_OUTPUT/cta-plan.json")" = "0"
          test "$(jq -r .provider_calls_added "$CLEAN_V2_OUTPUT/cta-plan.json")" = "0"
          test "$(jq -r .rules.one_primary_action "$CLEAN_V2_OUTPUT/cta-plan.json")" = "true"
          case "$(jq -r .mode "$CLEAN_V2_OUTPUT/cta-plan.json")" in
            comment|subscribe|share|like) ;;
            *) echo "Unexpected Clean V2 contextual CTA mode" >&2; exit 1 ;;
          esac
          case "$(jq -r .render_status "$CLEAN_V2_OUTPUT/cta-plan.json")" in
            delegated_to_approved_visual_assets|not_scheduled) ;;
            *) echo "Unexpected Clean V2 contextual CTA render status" >&2; exit 1 ;;
          esac
          test -s "$CLEAN_V2_OUTPUT/visual-cta.json"
          test "$(jq -r .provider_calls_added "$CLEAN_V2_OUTPUT/visual-cta.json")" = "0"
          test -s "$CLEAN_V2_OUTPUT/identity-sequence.json"
          test "$(jq -r .status "$CLEAN_V2_OUTPUT/identity-sequence.json")" = "pass"
          test -s "$CLEAN_V2_OUTPUT/structural-ai-flags.json"
          test "$(jq -r .mode "$CLEAN_V2_OUTPUT/structural-ai-flags.json")" = "advisory"
          test -s "$CLEAN_V2_OUTPUT/narrative-identity.json"
          test -n "$(jq -r .opener "$CLEAN_V2_OUTPUT/narrative-identity.json")"
          test -n "$(jq -r .closer "$CLEAN_V2_OUTPUT/narrative-identity.json")"
          test "$(jq -r '.transitions | length' "$CLEAN_V2_OUTPUT/narrative-identity.json")" = "3"
          test "$(jq -r .status "$CLEAN_V2_OUTPUT/audio-mastering.json")" = "pass"
          test -s "$CLEAN_V2_OUTPUT/narration-mastered.wav"
          test "$(jq -r .status "$CLEAN_V2_OUTPUT/security-cinematic-v2.json")" = "pass"
          test "$(jq -r .status "$CLEAN_V2_OUTPUT/final-cut-visual-qa.json")" = "pass"
          test "$(jq -r .status "$CLEAN_V2_OUTPUT/opening-director.json")" = "pass"
          test "$(jq -r .audited_shot_count "$CLEAN_V2_OUTPUT/opening-director.json")" = "3"
          test "$(jq -r '.slots[0].start,.slots[0].end,.slots[1].start,.slots[1].end,.slots[2].start,.slots[2].end' "$CLEAN_V2_OUTPUT/opening-director.json" | paste -sd ",")" = "0,7,7,18,18,30"
          test -s "$CLEAN_V2_OUTPUT/opening-rights.json"
          test -s "$CLEAN_V2_OUTPUT/visual-audit.json"
          test -s "$CLEAN_V2_OUTPUT/visual-qa-budget.json"
          test "$(jq -r .status "$CLEAN_V2_OUTPUT/final-master-qc.json")" = "pass"
          test "$(jq -r '.stages | length' "$CLEAN_V2_OUTPUT/run-manifest.json")" = "15"
          test "$(jq -r '.quality_layers_executed | join(",")' "$CLEAN_V2_OUTPUT/run-manifest.json")" = "text_audit,security_v1_cinematic_v2_m7_m11,final_cut_visual_qa,opening_director,final_master_qc"
          test "$(jq -r .timeline_mode "$CLEAN_V2_OUTPUT/visual-timeline.json")" = "legacy_section_fallback"
          test -s "$CLEAN_V2_OUTPUT/m9-transitions.json"
          test -s "$CLEAN_V2_OUTPUT/m10-cards.json"
          test -s "$CLEAN_V2_OUTPUT/m11-report.json"

      - name: Prepare Clean V2 pre-QC checkpoint
        if: always()
        id: clean_v2_checkpoint
        run: |
          set -euo pipefail
          rm -rf "$CLEAN_V2_RESUME"
          if test ! -s "$CLEAN_V2_OUTPUT/resume-checkpoint.json"; then
            echo "save=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$CLEAN_V2_RESUME"
          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          source = Path(os.environ["CLEAN_V2_OUTPUT"])
          target = Path(os.environ["CLEAN_V2_RESUME"])
          checkpoint = json.loads(
              (source / "resume-checkpoint.json").read_text(encoding="utf-8")
          )
          artifacts = checkpoint.get("artifacts")
          if not isinstance(artifacts, dict) or not artifacts:
              raise SystemExit("resume checkpoint has no artifacts")
          shutil.copy2(
              source / "resume-checkpoint.json",
              target / "resume-checkpoint.json",
          )
          for raw in artifacts:
              relative = Path(str(raw))
              if relative.is_absolute() or ".." in relative.parts:
                  raise SystemExit("unsafe resume artifact path")
              src = source / relative
              dst = target / relative
              if not src.is_file():
                  raise SystemExit(f"missing resume artifact: {relative}")
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          PY
          echo "save=true" >> "$GITHUB_OUTPUT"

      - name: Save Clean V2 pre-QC checkpoint
        if: always() && steps.clean_v2_checkpoint.outputs.save == 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ env.CLEAN_V2_RESUME }}
          key: clean-v2-pre-qc-${{ runner.os }}-${{ github.sha }}-${{ env.ISCO_ENGINE_SHA }}-${{ env.ISCO_APPROVED_BRIEF_SHA256 }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Clean V2 evidence and final file
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clean-v2-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.CLEAN_V2_OUTPUT }}
          if-no-files-found: warn
          retention-days: 7
