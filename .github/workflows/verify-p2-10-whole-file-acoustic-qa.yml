name: Verify P2-10 Whole-File Acoustic QA

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  exact-combined-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f86eca1732c723d8becae24339d4f61ee105a400
          path: runner
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Runner checkout
        working-directory: runner
        run: test "$(git rev-parse HEAD)" = "f86eca1732c723d8becae24339d4f61ee105a400"

      - name: Checkout exact private Engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ae09e7f3ecfc0c49e96041f058d9e0b38924bb69
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine checkout
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "ae09e7f3ecfc0c49e96041f058d9e0b38924bb69"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install media and locked Engine runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: P2-10 focused regression
        working-directory: runner
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}/runner
        run: python -m unittest scripts.test_piper_chunking -q

      - name: Full Engine suite
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Full Runner regression suite
        working-directory: runner
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}/runner
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q

      - name: Exact P2-10 scope sanity
        working-directory: runner
        run: |
          set -euo pipefail
          git diff --check 59e0e86a2e8a81529723a2b94a5cdb6dfc2119ac..f86eca1732c723d8becae24339d4f61ee105a400
          mapfile -t changed < <(git diff --name-only 59e0e86a2e8a81529723a2b94a5cdb6dfc2119ac..f86eca1732c723d8becae24339d4f61ee105a400 | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "scripts/test_piper_chunking.py"
          test "${changed[1]}" = "scripts/voice_mesh.py"
          grep -q 'VOICE_QA_MAX_CONSECUTIVE_SILENT_WINDOWS = 5' scripts/voice_mesh.py
          grep -q 'raw = w.readframes(rate)' scripts/voice_mesh.py
          ! grep -q 'rate \* 15' scripts/voice_mesh.py
