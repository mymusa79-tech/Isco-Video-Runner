name: Clean V2 Rescue Voice Cache

# One-off, zero-provider-cost recovery: rebuild the voice-bank cache of a finished
# Telegram run from its own artifact, so "استئناف من الصوت" becomes available.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub run id whose artifact holds the paid voice
        required: true
        type: string
      request_sha256:
        description: Immutable Telegram request hash of that run
        required: true
        type: string
      format:
        description: Output format directory inside the request folder
        required: true
        default: podcast
        type: choice
        options: [podcast, film, short]

permissions:
  contents: read
  actions: read

env:
  ISCO_ENGINE_SHA: adb08665c6bdddf9ffa6ba4d503ae75254617e69
  CLEAN_V2_RESUME: ${{ github.workspace }}/.clean-v2-telegram-resume

jobs:
  rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check 'Pillow==12.3.0'
      - name: Download the run artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" \
            --jq '[.artifacts[]|select(.expired==false)]|sort_by(.created_at)|last|.id')
          test -n "$artifact_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/run.zip"
          mkdir -p "$RUNNER_TEMP/run"
          unzip -q "$RUNNER_TEMP/run.zip" -d "$RUNNER_TEMP/run"
      - name: Rebuild verified voice checkpoint
        env:
          FORMAT: ${{ inputs.format }}
        run: |
          set -euo pipefail
          source_dir=$(dirname "$(find "$RUNNER_TEMP/run" -path "*/$FORMAT/resume-checkpoint.json" | head -1)")
          test -f "$source_dir/resume-checkpoint.json"
          python scripts/rescue_voice_from_artifact.py \
            --source "$source_dir" --target "$CLEAN_V2_RESUME/$FORMAT"
      - name: Save voice bank
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ env.CLEAN_V2_RESUME }}
          key: clean-v2-voice-bank-v1-telegram-${{ runner.os }}-${{ env.ISCO_ENGINE_SHA }}-${{ inputs.request_sha256 }}-rescue-${{ github.run_id }}
