name: Install Telegram Edge State Secret

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/telegram-edge-state-secret.yml"
      - "cloudflare/telegram-control-worker/observability-worker.js"

permissions:
  contents: read

concurrency:
  group: telegram-edge-deploy
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
      WRANGLER_VERSION: "4.125.0"
    steps:
      - name: Checkout Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate secret boundary
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$STATE_ENCRYPTION_KEY"

      - name: Install encrypted control-state key
        working-directory: cloudflare/telegram-control-worker
        run: |
          set -euo pipefail
          cp wrangler.toml.example wrangler.toml
          printf '%s' "$STATE_ENCRYPTION_KEY" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put STATE_ENCRYPTION_KEY --config wrangler.toml >/dev/null
          echo "STATE_ENCRYPTION_KEY installed for read-only Telegram Edge library access"
