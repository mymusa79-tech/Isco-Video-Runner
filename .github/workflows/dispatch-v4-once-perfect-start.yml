name: Dispatch V4 Once - Perfect Start

on:
  push:
    branches:
      - ops/dispatch-v4-once-perfect-start
    paths:
      - .github/workflows/dispatch-v4-once-perfect-start.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch produce-resilient-v4 exactly once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/dispatch.json"
          import json
          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "topic": "وهم البداية المثالية",
                  "format": "film"
              }
          }, ensure_ascii=False))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/produce-resilient-v4.yml/dispatches" \
            --data-binary @"$RUNNER_TEMP/dispatch.json"
          echo "workflow_dispatch requested exactly once"
