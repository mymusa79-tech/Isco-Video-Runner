name: One-time exact Engine pin update

on:
  push:
    branches: ["fix/editorial-promise-continuity-family"]

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/editorial-promise-continuity-family
          persist-credentials: true
          fetch-depth: 1

      - name: Replace canonical production Engine pin exactly once
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/produce-resilient-v4.yml')
          old = '3d584c868b5c094d7856370f6d728aec841fef27'
          new = '69b21dd1c10f196c623e5b426bccd574a80accf5'
          text = path.read_text(encoding='utf-8')
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'Expected exactly 3 canonical Engine pins, found {count}')
          updated = text.replace(old, new)
          if updated.count(new) != 3:
              raise SystemExit('New Engine pin did not replace all three canonical locations')
          path.write_text(updated, encoding='utf-8')
          PY
          git rm .github/workflows/_pin-engine-once.yml
          git config user.name "isco-integration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/produce-resilient-v4.yml
          git diff --cached --check
          git commit -m "Pin production to Engine promise-continuity merge"
          git push origin HEAD:fix/editorial-promise-continuity-family
