name: One-time exact Engine pin blob materialization

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'fix/editorial-promise-continuity-family'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch with write token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/editorial-promise-continuity-family
          persist-credentials: true
          fetch-depth: 1

      - name: Materialize exact pinned workflow as ordinary repository blob
        run: |
          set -euo pipefail
          mkdir -p .integration
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/produce-resilient-v4.yml')
          target = Path('.integration/pinned-produce-resilient-v4.yml')
          old = '3d584c868b5c094d7856370f6d728aec841fef27'
          new = '69b21dd1c10f196c623e5b426bccd574a80accf5'
          text = source.read_text(encoding='utf-8')
          if text.count(old) != 3:
              raise SystemExit(f'Expected exactly 3 old Engine pins, found {text.count(old)}')
          updated = text.replace(old, new)
          if updated.count(new) != 3 or old in updated:
              raise SystemExit('Exact Engine pin replacement failed closed')
          target.write_text(updated, encoding='utf-8')
          PY
          git config user.name "isco-integration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .integration/pinned-produce-resilient-v4.yml
          git diff --cached --check
          git commit -m "Materialize exact production Engine pin blob"
          git push origin HEAD:fix/editorial-promise-continuity-family
