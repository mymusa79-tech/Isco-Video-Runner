name: Inspect Canonical Production Run 106

on:
  push:
    branches:
      - fix/run104-engine-candidate-certification

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Record canonical production state without dispatching
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow produce-resilient-v4.yml --branch main --limit 5 --json databaseId,displayTitle,event,status,conclusion,url,headSha,createdAt,updatedAt --jq 'sort_by(.createdAt) | reverse | .[0]')"
          printf '%s\n' "$RUN" > .one-shot-production-inspection-run106.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .one-shot-production-inspection-run106.json
          git commit -m "chore: record Run 106 production state"
          git push origin "HEAD:${GITHUB_REF_NAME}"
