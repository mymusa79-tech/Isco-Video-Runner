name: Verify Post-Planning Agent Candidate

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ENGINE_SHA: f12425a5343fee50aa0df020d74465be5e97f9a3
    steps:
      - name: Checkout Runner baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact private Engine candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ env.ENGINE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine candidate
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "$ENGINE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install locked Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Dependency audit
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install pip-audit==2.10.1
          pip-audit --no-deps -r requirements-lock.txt

      - name: Focused post-Planning closure regression
        working-directory: engine
        run: python -m unittest tests.test_post_planning_audit_closure -v

      - name: Full Engine regression
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Full Runner compatibility regression
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' | sort | sed -e 's#/#.#g' -e 's#\.py$##')
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q
