name: P0-1 Closure Verification — NEVER MERGE

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout canonical Runner main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: runner-main
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact Engine candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: dcb7584842cf05c89a63e35d9b9761b6585802bb
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine checkout
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "dcb7584842cf05c89a63e35d9b9761b6585802bb"

      - name: Isolate unrelated legacy fixtures from P0-1 gate
        working-directory: engine
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact_count(path: Path, old: str, new: str, expected: int, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} matches, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          ledger = Path("tests/test_orchestrator_ledger_integration.py")
          replace_exact_count(
              ledger,
              '''             patch.object(tone_quality, "json_text", side_effect=_fake_tone_quality_pass):''',
              '''             patch.object(tone_quality, "json_text", side_effect=_fake_tone_quality_pass), \\
               patch.object(orchestrator, "_final_film_section_structure_issues", return_value=[]):''',
              2,
              "ledger fixture isolation",
          )

          visual = Path("tests/test_orchestrator_visual_selection_integration.py")
          replace_exact_count(
              visual,
              '''            patch.object(orchestrator, "_verify_resilient_router_installed", lambda: None),''',
              '''            patch.object(orchestrator, "_verify_resilient_router_installed", lambda: None),
            # This fixture deliberately constructs 1-2 section Film plans to isolate
            # visual selection. P0-1's final 110-170 word gate is tested separately
            # with canonical section-shape regressions and must not pre-empt this test.
            patch.object(orchestrator, "_final_film_section_structure_issues", return_value=[]),''',
              1,
              "visual fixture isolation",
          )

          text = ledger.read_text(encoding="utf-8")
          needle = '    def _produce(self, **kwargs):\n        os.environ["GEMINI_API_KEY"] = "fake-test-key"'
          replacement = (
              '    def _produce(self, **kwargs):\n'
              '        # These Batch-G ledger tests exercise accounting with planner fallback\n'
              '        # output, not final Film structure; P0-1 is covered by its dedicated\n'
              '        # production-invariant regression. Isolate that unrelated gate here.\n'
              '        os.environ["GEMINI_API_KEY"] = "fake-test-key"'
          )
          if text.count(needle) != 1:
              raise SystemExit("ledger rationale insertion: expected one match")
          ledger.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install locked Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Dependency audit
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install pip-audit==2.10.1
          pip-audit --no-deps -r requirements-lock.txt

      - name: Focused P0-1 regression
        working-directory: engine
        run: python -m unittest tests.test_final_section_length_invariant -q

      - name: Full Engine suite
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Approved-Brief CLI contract matrix
        working-directory: engine
        run: |
          set -euo pipefail
          missing="$RUNNER_TEMP/isco-no-approved-brief.json"
          rm -f "$missing"
          ISCO_APPROVED_BRIEF_PATH="$missing" isco-video produce --topic "لماذا تشعر أنك متأخر عن الجميع؟" --format auto --dry-run --no-research
          ISCO_APPROVED_BRIEF_PATH="$missing" isco-video produce --format auto --dry-run --no-research
          isco-video produce --format auto --dry-run --no-research
          if isco-video produce --topic "لماذا تشعر أنك متأخر عن الجميع؟" --format auto --dry-run --no-research; then
            echo 'ERROR: approved-brief mismatch unexpectedly passed' >&2
            exit 1
          fi

      - name: Full canonical Runner regression suite
        working-directory: runner-main
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}/runner-main
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' | sort | sed -e 's#/#.#g' -e 's#\.py$##')
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q

      - name: Publish verified fixture isolation to Engine P0-1 branch
        working-directory: engine
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          REPO: mymusa79-tech/Isco-Video-Agent
        run: |
          set -euo pipefail
          base_commit="$(git rev-parse HEAD)"
          test "$base_commit" = "dcb7584842cf05c89a63e35d9b9761b6585802bb"
          base_tree="$(git rev-parse HEAD^{tree})"
          ledger_blob="$(gh api --method POST "repos/$REPO/git/blobs" -f content="$(cat tests/test_orchestrator_ledger_integration.py)" -f encoding=utf-8 --jq '.sha')"
          visual_blob="$(gh api --method POST "repos/$REPO/git/blobs" -f content="$(cat tests/test_orchestrator_visual_selection_integration.py)" -f encoding=utf-8 --jq '.sha')"
          tree_json="$(jq -n --arg base "$base_tree" --arg ledger "$ledger_blob" --arg visual "$visual_blob" '{base_tree:$base,tree:[{path:"tests/test_orchestrator_ledger_integration.py",mode:"100644",type:"blob",sha:$ledger},{path:"tests/test_orchestrator_visual_selection_integration.py",mode:"100644",type:"blob",sha:$visual}]}')"
          tree_sha="$(printf '%s' "$tree_json" | gh api --method POST "repos/$REPO/git/trees" --input - --jq '.sha')"
          commit_json="$(jq -n --arg msg 'test: isolate unrelated fixtures from final section gate' --arg tree "$tree_sha" --arg parent "$base_commit" '{message:$msg,tree:$tree,parents:[$parent]}')"
          commit_sha="$(printf '%s' "$commit_json" | gh api --method POST "repos/$REPO/git/commits" --input - --jq '.sha')"
          gh api --method PATCH "repos/$REPO/git/refs/heads/fix/final-section-length-invariant" -f sha="$commit_sha" -F force=false >/dev/null
          echo "PUBLISHED_ENGINE_SHA=$commit_sha"
