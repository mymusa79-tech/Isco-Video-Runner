name: Deploy Telegram Edge Control

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-telegram-edge.yml"
      - "cloudflare/telegram-control-worker/**"
  pull_request:
    paths:
      - ".github/workflows/deploy-telegram-edge.yml"
      - "cloudflare/telegram-control-worker/**"
      - "scripts/test_telegram_edge_activation_workflow.py"

permissions:
  contents: read

concurrency:
  group: telegram-edge-deploy
  cancel-in-progress: false

env:
  ZERO_COST_MODE: "true"
  WRANGLER_VERSION: "4.125.0"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate Worker and zero-cost activation contract
        run: |
          set -euo pipefail
          node --check cloudflare/telegram-control-worker/index.js
          python -m unittest -v scripts.test_telegram_edge_worker_contract scripts.test_telegram_edge_activation_workflow
          python - <<'PY'
          import pathlib, tomllib
          p = pathlib.Path('cloudflare/telegram-control-worker/wrangler.toml.example')
          data = tomllib.loads(p.read_text(encoding='utf-8'))
          assert data.get('workers_dev') is True
          assert data.get('limits', {}).get('cpu_ms') == 10
          assert data.get('limits', {}).get('subrequests') == 10
          assert data.get('vars', {}).get('ZERO_COST_MODE') == 'true'
          forbidden = {
              'routes', 'route', 'kv_namespaces', 'd1_databases', 'r2_buckets',
              'durable_objects', 'queues', 'workflows', 'analytics_engine_datasets',
              'vectorize', 'hyperdrive', 'mtls_certificates', 'browser', 'ai',
              'images', 'version_metadata', 'logfwdr', 'dispatch_namespaces',
          }
          found = sorted(forbidden.intersection(data))
          assert not found, f'Paid/extra Cloudflare bindings are forbidden in ZERO_COST_MODE: {found}'
          PY

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_CONTROL_TOKEN: ${{ secrets.ISCO_GITHUB_CONTROL_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - name: Checkout Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Enforce zero-cost mode
        run: |
          set -euo pipefail
          test "$ZERO_COST_MODE" = "true"
          if [ "${REPOSITORY_PRIVATE:-true}" != "false" ]; then
            echo "ZERO_COST_MODE refuses deployment when the Runner repository is private; public standard GitHub-hosted runners are required." >&2
            exit 1
          fi
          python - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path('cloudflare/telegram-control-worker/wrangler.toml.example').read_text(encoding='utf-8'))
          assert data.get('workers_dev') is True, 'workers.dev only is required in ZERO_COST_MODE'
          assert data.get('limits', {}).get('cpu_ms') == 10
          assert data.get('limits', {}).get('subrequests') == 10
          assert data.get('vars', {}).get('ZERO_COST_MODE') == 'true'
          forbidden = {
              'routes', 'route', 'kv_namespaces', 'd1_databases', 'r2_buckets',
              'durable_objects', 'queues', 'workflows', 'analytics_engine_datasets',
              'vectorize', 'hyperdrive', 'mtls_certificates', 'browser', 'ai',
              'images', 'version_metadata', 'logfwdr', 'dispatch_namespaces',
          }
          found = sorted(forbidden.intersection(data))
          assert not found, f'ZERO_COST_MODE blocks Cloudflare extras: {found}'
          PY
          echo "ZERO_COST_MODE active: Workers Free limits must fail closed at the provider; this workflow contains no billing/plan-upgrade operation."

      - name: Validate activation secrets
        run: |
          set -euo pipefail
          missing=()
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            TELEGRAM_BOT_TOKEN \
            TELEGRAM_ALLOWED_USER_ID \
            TELEGRAM_CHAT_ID \
            GITHUB_CONTROL_TOKEN \
            YOUTUBE_API_KEY
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required repository secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Ensure free workers.dev account subdomain
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/cloudflare-workers-subdomain.json"
          http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'content-type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          current="$(python - "$response_file" <<'PY'
          import json, pathlib, sys
          try:
              payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          except Exception:
              payload = {}
          result = payload.get('result') or {}
          print(str(result.get('subdomain') or '').strip())
          PY
          )"
          if [ "$http_code" = "200" ] && [ -n "$current" ]; then
            echo "workers.dev account subdomain already configured"
            exit 0
          fi
          candidate="$(python - <<'PY'
          import hashlib, os
          digest = hashlib.sha256(os.environ['CLOUDFLARE_ACCOUNT_ID'].encode('utf-8')).hexdigest()[:12]
          print(f"isco-video-{digest}")
          PY
          )"
          create_body="$(python - "$candidate" <<'PY'
          import json, sys
          print(json.dumps({'subdomain': sys.argv[1]}))
          PY
          )"
          created="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 25 \
            -X PUT "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'content-type: application/json' \
            --data "$create_body")"
          printf '%s' "$created" | python -c 'import json,sys; p=json.load(sys.stdin); assert p.get("success") is True; assert (p.get("result") or {}).get("subdomain")'
          echo "workers.dev account subdomain created in ZERO_COST_MODE"

      - name: Validate Worker syntax
        run: |
          set -euo pipefail
          node --check cloudflare/telegram-control-worker/index.js

      - name: Generate webhook secret
        run: |
          set -euo pipefail
          WEBHOOK_SECRET="$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )"
          test -n "$WEBHOOK_SECRET"
          echo "::add-mask::$WEBHOOK_SECRET"
          echo "TELEGRAM_WEBHOOK_SECRET=$WEBHOOK_SECRET" >> "$GITHUB_ENV"

      - name: Deploy Worker
        working-directory: cloudflare/telegram-control-worker
        run: |
          set -euo pipefail
          cp wrangler.toml.example wrangler.toml
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --config wrangler.toml 2>&1 | tee "$RUNNER_TEMP/wrangler-deploy.log"
          WORKER_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' "$RUNNER_TEMP/wrangler-deploy.log" | tail -1 || true)"
          if [ -z "$WORKER_URL" ]; then
            echo "Could not resolve the workers.dev deployment URL from Wrangler output" >&2
            exit 1
          fi
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"

      - name: Install Worker secrets
        working-directory: cloudflare/telegram-control-worker
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            printf '%s' "$value" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put "$name" --config wrangler.toml >/dev/null
          }
          put_secret TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
          put_secret TELEGRAM_WEBHOOK_SECRET "$TELEGRAM_WEBHOOK_SECRET"
          put_secret TELEGRAM_ALLOWED_USER_ID "$TELEGRAM_ALLOWED_USER_ID"
          put_secret TELEGRAM_CHAT_ID "$TELEGRAM_CHAT_ID"
          put_secret GITHUB_CONTROL_TOKEN "$GITHUB_CONTROL_TOKEN"
          put_secret YOUTUBE_API_KEY "$YOUTUBE_API_KEY"

      - name: Verify Worker health
        run: |
          set -euo pipefail
          body="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 20 "$WORKER_URL/health")"
          printf '%s' "$body" | python -c 'import json,sys; p=json.load(sys.stdin); assert p.get("ok") is True and p.get("mode") == "telegram-edge-control"'

      - name: Register Telegram webhook
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 25 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -H 'content-type: application/json' \
            --data "$(python - <<'PY'
          import json, os
          print(json.dumps({
              "url": os.environ["WORKER_URL"].rstrip("/") + "/telegram",
              "secret_token": os.environ["TELEGRAM_WEBHOOK_SECRET"],
              "allowed_updates": ["message", "callback_query"],
              "drop_pending_updates": False,
              "max_connections": 20,
          }))
          PY
          )")"
          printf '%s' "$response" | python -c 'import json,sys; p=json.load(sys.stdin); assert p.get("ok") is True and p.get("result") is True'

      - name: Verify Telegram webhook binding
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 25 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo")"
          printf '%s' "$response" | python -c 'import json,os,sys; p=json.load(sys.stdin); assert p.get("ok") is True; r=p.get("result") or {}; expected=os.environ["WORKER_URL"].rstrip("/")+"/telegram"; assert r.get("url")==expected, (r.get("url"), expected); assert int(r.get("pending_update_count") or 0) >= 0'

      - name: Announce live edge control
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 25 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'content-type: application/json' \
            --data "$(python - <<'PY'
          import json, os
          print(json.dumps({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": "⚡ تم تفعيل Telegram Edge Control — ZERO COST MODE.\n\nالقوائم والإحصائيات وزر التفاصيل تستجيب عبر Webhook مباشر بدل انتظار polling.\nCloudflare: Free فقط؛ عند بلوغ حد الخطة المجانية تتوقف الخدمة بدل وجود مسار ترقية في هذا النظام.\n\nاضغط «🏠 ابدأ» للتجربة.",
              "disable_web_page_preview": True,
              "reply_markup": {
                  "keyboard": [[{"text": "🏠 ابدأ"}]],
                  "resize_keyboard": True,
                  "is_persistent": True,
                  "one_time_keyboard": False,
              },
          }, ensure_ascii=False))
          PY
          )" >/dev/null

      - name: Activation summary
        run: |
          echo "Telegram Edge Control is live at $WORKER_URL/telegram"
          echo "Health: $WORKER_URL/health"
          echo "ZERO_COST_MODE=true; no paid Cloudflare binding or plan-upgrade operation is present"
          echo "Production authority remains in telegram-editorial-control.yml"
