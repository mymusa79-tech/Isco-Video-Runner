name: Preview Dimensional Arabic Text

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  render-preview:
    if: github.head_ref == 'phase-b-visual-preview-20260925'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OUT: ${{ github.workspace }}/preview-dimensional-text
      PYTHONPATH: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact preview renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install only render dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y ffmpeg fonts-noto-core

      - name: Download previously cloud-approved visual montage
        run: |
          set -euo pipefail
          mkdir -p "$OUT/input"
          gh run download 36115278613 \
            --repo "$GITHUB_REPOSITORY" \
            --name clean-v2-short-final-one-81 \
            --dir "$OUT/input"
          source="$(find "$OUT/input" -type f -name phase-b-visual-preview.mp4 | head -1)"
          test -s "$source"
          cp "$source" "$OUT/cloud-visual-source.mp4"

      - name: Render dimensional voice-following text
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from clean_v2.media import probe_duration
          from clean_v2.short_timed_text import render_progressive_text

          root = Path(os.environ["OUT"])
          source = root / "cloud-visual-source.mp4"
          total = probe_duration(source)
          third = total / 3.0
          events = [
              {
                  "start": 0.0,
                  "end": round(third, 3),
                  "text": "لا تنتظر الدافع ليبدأ كل شيء",
                  "role": "hook",
              },
              {
                  "start": round(third, 3),
                  "end": round(third * 2.0, 3),
                  "text": "خطوة صغيرة تغيّر اتجاهك",
                  "role": "beat",
              },
              {
                  "start": round(third * 2.0, 3),
                  "end": round(total, 3),
                  "text": "وهنا يبدأ التغيير الحقيقي",
                  "role": "payoff",
              },
          ]
          report = render_progressive_text(
              video=source,
              events=events,
              srt_path=root / "dimensional-preview.srt",
              output=root / "dimensional-text-preview.mp4",
          )
          payload = {**report, "events": events, "source_run": 36115278613}
          (root / "dimensional-text-preview.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Extract judgment frames
        run: |
          set -euo pipefail
          mkdir -p "$OUT/frames"
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$OUT/dimensional-text-preview.mp4")"
          for spec in "01 0.15" "02 0.50" "03 0.82"; do
            set -- $spec
            idx="$1"
            frac="$2"
            ts="$(awk -v d="$duration" -v f="$frac" 'BEGIN { printf "%.3f", d*f }')"
            ffmpeg -hide_banner -loglevel error -y -ss "$ts" \
              -i "$OUT/dimensional-text-preview.mp4" -frames:v 1 \
              "$OUT/frames/frame-$idx.jpg"
          done
          ffmpeg -hide_banner -loglevel error -y \
            -pattern_type glob -i "$OUT/frames/frame-*.jpg" \
            -filter_complex "scale=360:-1,tile=3x1" -frames:v 1 \
            "$OUT/dimensional-text-contact.jpg"

      - name: Verify renderer evidence
        run: |
          set -euo pipefail
          test -s "$OUT/dimensional-text-preview.mp4"
          test -s "$OUT/dimensional-text-contact.jpg"
          test "$(jq -r .depth_layers "$OUT/dimensional-text-preview.json")" = "3"
          test "$(jq -r .black_text_box "$OUT/dimensional-text-preview.json")" = "false"
          test "$(jq -r .accent_rgb "$OUT/dimensional-text-preview.json")" = "#D7A85B"
          test "$(jq -r .word_highlight_timing "$OUT/dimensional-text-preview.json")" = "voice_owned_phrase_weighted_approximation"

      - name: Upload dimensional text preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dimensional-arabic-text-preview
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 7
