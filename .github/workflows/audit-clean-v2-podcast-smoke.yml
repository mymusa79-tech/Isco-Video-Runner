name: Audit Clean V2 Podcast Smoke
on:
  pull_request:
    branches: ["main"]
    paths: [".github/workflows/audit-clean-v2-podcast-smoke.yml"]
permissions:
  contents: read
jobs:
  podcast-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ISCO_ENGINE_SHA: 3cbd689819e6b0e0b2ea9904d1998e24a5e2a293
      GEMINI_CONTENT_MODEL: gemini-3.7-flash
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GROQ_CONTENT_MODEL: openai/gpt-oss-20b
      OPENROUTER_CONTENT_MODEL: google/gemma-4-26b-a4b-it:free
      MISTRAL_CONTENT_MODEL: ministral-14b-2512
      CLOUDFLARE_VISION_FREE_ONLY: "true"
      CLOUDFLARE_VISION_MAX_CALLS_PER_WORKFLOW: "5"
      CLEAN_V2_AI_STILL_FREE_ONLY: "true"
      CLEAN_V2_OUTPUT: ${{ github.workspace }}/output/audit-podcast-smoke
      PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
    steps:
      - name: Checkout exact Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove product code equals reviewed main
        run: git diff --exit-code origin/main...HEAD -- . ':(exclude).github/workflows/audit-clean-v2-podcast-smoke.yml'
      - name: Checkout frozen private Engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 3cbd689819e6b0e0b2ea9904d1998e24a5e2a293
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1
      - name: Verify Engine pin
        run: test "$(git -C engine rev-parse HEAD)" = "$ISCO_ENGINE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install production dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y ffmpeg fonts-noto-core tesseract-ocr tesseract-ocr-ara espeak-ng libsndfile1
          python -m pip install --disable-pip-version-check -r engine/requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e engine
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check soundfile huggingface_hub 'misaki[en]>=0.9.4' 'phonemizer-fork>=3.3.2' camel-tools
          python -m pip install --disable-pip-version-check 'kokoro @ git+https://github.com/Oddadmix/kokoro.git@df50e07df746aec0bd7a6f237752d7109ace0b3d'
          camel_data -i disambig-mle-calima-msa-r13
          curl -fsSL 'https://gist.githubusercontent.com/Oddadmix/dc699f7942a9516ce29d4842c7aed756/raw/827b541c892a862f9ef3b44006a6e27b100d1bdd/arabic_g2p.py' -o scripts/arabic_g2p.py
          test -s scripts/arabic_g2p.py
      - name: Build Podcast brief
        run: |
          cat > "$RUNNER_TEMP/podcast.json" <<'JSON'
          {
            "approved_by_user": true,
            "approved_topic": "لماذا نعرف النصيحة الصحيحة ولا يتغير سلوكنا رغم ذلك؟",
            "format": "podcast",
            "language": "ar",
            "audience": "Arabic-speaking adults",
            "editorial_intent": "برنامج خارج النص: حديث عربي فصيح طبيعي لراوية أنثوية محايدة، بسيط في لغته وعميق في فكرته، ويظل مفهومًا صوتيًا دون الصورة.",
            "series_name": "خارج النص",
            "research_pack": [],
            "hard_constraints": ["No fabricated facts.","One neutral female Arabic narrator only.","Do not invent first-person experiences.","Audio must make complete sense with the screen closed."]
          }
          JSON
          sha="$(BRIEF="$RUNNER_TEMP/podcast.json" python -c 'import json,os; from pathlib import Path; from clean_v2.contracts import compute_brief_sha256; p=Path(os.environ["BRIEF"]); print(compute_brief_sha256(json.loads(p.read_text(encoding="utf-8"))))')"
          echo "PODCAST_BRIEF=$RUNNER_TEMP/podcast.json" >> "$GITHUB_ENV"
          echo "PODCAST_SHA=$sha" >> "$GITHUB_ENV"
      - name: Run one cold Podcast attempt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python -m clean_v2 --brief "$PODCAST_BRIEF" --approved-sha "$PODCAST_SHA" --engine-sha "$ISCO_ENGINE_SHA" --runner-sha "1d7fab2ae625ea5bdacd3959605e28a9f7b0296c" --max-visuals 5 --output "$CLEAN_V2_OUTPUT"
      - name: Verify Podcast and local derivative
        run: |
          set -euo pipefail
          test -s "$CLEAN_V2_OUTPUT/final.mp4"
          test "$(jq -r .status "$CLEAN_V2_OUTPUT/run-manifest.json")" = "pass"
          test "$(jq -r .status "$CLEAN_V2_OUTPUT/final-master-qc.json")" = "pass"
          test "$(jq -r .format "$CLEAN_V2_OUTPUT/timeline-first.json")" = "podcast"
          test "$(jq -r .voice_provider "$CLEAN_V2_OUTPUT/run-manifest.json")" = "nabra:af_msa"
          jq -e '.audio_units[] | select(.role == "promo_short")' "$CLEAN_V2_OUTPUT/timeline-first.json" >/dev/null
          test -s "$CLEAN_V2_OUTPUT/podcast-derived-short.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audit-podcast-smoke-${{ github.run_number }}
          path: ${{ env.CLEAN_V2_OUTPUT }}
          if-no-files-found: warn
          retention-days: 7
