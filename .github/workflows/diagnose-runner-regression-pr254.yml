name: TEMP Diagnose Runner Regression PR254

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  diagnose-runner-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact private Engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 64ab711bc904e9581c3cc6c8280d1321ae738eb1
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine checkout
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "64ab711bc904e9581c3cc6c8280d1321ae738eb1"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install locked Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Run exact Runner suite and preserve traceback
        id: tests
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -uo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          test "${#test_modules[@]}" -gt 0
          set +e
          python -m unittest "${test_modules[@]}" -v > "$RUNNER_TEMP/runner-unittest.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/runner-unittest.txt"
          exit "$status"

      - name: Upload exact Runner traceback
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr254-runner-unittest-${{ github.run_id }}
          path: ${{ runner.temp }}/runner-unittest.txt
          if-no-files-found: error
          retention-days: 1
