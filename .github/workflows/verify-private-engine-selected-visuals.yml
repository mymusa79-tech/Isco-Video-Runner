name: Verify Private Engine - Selected Visuals

on:
  workflow_dispatch:
  pull_request:
    branches: ["ci/selected-visuals-verifier-base"]
    paths:
      - ".github/verify-selected-visuals-trigger"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 0a362c3151ddb9739aacb9ab4388a541643b85d5
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install locked runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Six selected-visual acceptance tests
        working-directory: engine
        run: python -m unittest discover -s tests -p 'test_final_critic_selected_visuals.py' -v

      - name: Unit and media tests
        working-directory: engine
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/full-suite.log"

      - name: Upload full-suite failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: selected-visual-full-suite-log-${{ github.run_number }}
          path: ${{ runner.temp }}/full-suite.log
          if-no-files-found: error
          retention-days: 1

      - name: Dry-run orchestration with explicit topic
        working-directory: engine
        run: isco-video produce --topic "لماذا تشعر أنك متأخر عن الجميع؟" --format auto --dry-run --no-research

      - name: Dry-run autonomous topic selection
        working-directory: engine
        run: isco-video produce --format auto --dry-run --no-research

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 0a362c3151ddb9739aacb9ab4388a541643b85d5
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Audit fully pinned runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install pip-audit==2.10.1
          pip-audit --no-deps -r requirements-lock.txt
