name: Temp Dispatch Production Attempt 4

on:
  pull_request:
    branches: ["main"]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.head_ref == 'run/attempt4-production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical Production V4 on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/produce-resilient-v4.yml/runs?branch=main&event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0].id // 0')"
          echo "Previous canonical dispatch run: ${before}"
          gh workflow run produce-resilient-v4.yml --repo "${GITHUB_REPOSITORY}" --ref main
          target=""
          for _ in $(seq 1 20); do
            sleep 3
            target="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/produce-resilient-v4.yml/runs?branch=main&event=workflow_dispatch&per_page=5" --jq ".workflow_runs[] | select(.id != ${before}) | .id" | head -n 1 || true)"
            if [ -n "${target}" ]; then
              break
            fi
          done
          test -n "${target}"
          echo "ATTEMPT4_RUN_ID=${target}"
          echo "ATTEMPT4_RUN_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${target}"
