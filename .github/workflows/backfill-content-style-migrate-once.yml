name: Backfill Content Style Migration Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/backfill-content-style-migrate-once.yml

permissions:
  contents: write

concurrency:
  group: backfill-content-style-migrate-once
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_AGENT_STATE_HEAD: 28cf91a783565f040c7c9f6132bd132347b5010b
      EXPECTED_HISTORY_SHA_BEFORE: 4457f520e160242b73764bfcb2f671ef5e3b01be35a5859f6355a20ec7b4d176
      ENGINE_SHA: 2be33929854e098961bbc2d16a1311bd3afee26a
    steps:
      - name: Checkout runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout reviewed Backfill v1 draft
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ env.ENGINE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install and re-run targeted regressions
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
          python -m unittest \
            tests.test_analytics_insights \
            tests.test_analytics_insights_v2 \
            tests.test_learning_metrics_source \
            tests.test_youtube_backfill \
            tests.test_youtube_backfill_session \
            tests.test_backfill_content_style -q

      - name: Guard exact persisted baseline and restore history
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          current_head="$(git ls-remote --heads origin refs/heads/agent-state | awk '{print $1}')"
          test "$current_head" = "$EXPECTED_AGENT_STATE_HEAD"
          state_dir="$RUNNER_TEMP/isco-style-migration-state"
          meta="$RUNNER_TEMP/restore-meta.txt"
          mkdir -p "$state_dir"
          python scripts/persistent_memory.py restore \
            --repo . \
            --plain "$state_dir/history.json" \
            --branch agent-state \
            --legacy-state state/history.json.enc \
            --github-output "$meta"
          grep -qx 'save_allowed=true' "$meta"
          test -f "$state_dir/history.json"
          chmod 600 "$state_dir/history.json"
          before="$(sha256sum "$state_dir/history.json" | awk '{print $1}')"
          test "$before" = "$EXPECTED_HISTORY_SHA_BEFORE"
          echo "ISCO_HISTORY_PATH=$state_dir/history.json" >> "$GITHUB_ENV"
          echo "HISTORY_SHA_BEFORE=$before" >> "$GITHUB_ENV"
          echo "History SHA before migration: $before"

      - name: Migrate exact 128 Backfill rows and prove idempotency
        working-directory: engine
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/non-backfill-before.sha256"
          import hashlib, json, os
          from pathlib import Path
          d=json.loads(Path(os.environ['ISCO_HISTORY_PATH']).read_text(encoding='utf-8'))
          raw=d.get('learning',{}).get('metrics',[]) if isinstance(d.get('learning',{}),dict) else []
          keep=[x for x in raw if isinstance(x,dict) and not (x.get('ingestion_source')=='youtube_backfill_v1' and x.get('backfill_version')==1)]
          print(hashlib.sha256(json.dumps(keep,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest())
          PY

          python scripts/migrate_backfill_content_style.py \
            --history "$ISCO_HISTORY_PATH" --expect-target-count 128 \
            --confirm MIGRATE_BACKFILL_CONTENT_STYLE > "$RUNNER_TEMP/migrate-first.json"
          after_first="$(sha256sum "$ISCO_HISTORY_PATH" | awk '{print $1}')"
          export HISTORY_SHA_AFTER_LOCAL="$after_first"
          echo "HISTORY_SHA_AFTER_LOCAL=$after_first" >> "$GITHUB_ENV"

          python scripts/migrate_backfill_content_style.py \
            --history "$ISCO_HISTORY_PATH" --expect-target-count 128 \
            --confirm MIGRATE_BACKFILL_CONTENT_STYLE > "$RUNNER_TEMP/migrate-second.json"
          after_second="$(sha256sum "$ISCO_HISTORY_PATH" | awk '{print $1}')"
          test "$after_second" = "$after_first"

          python - <<'PY'
          import hashlib, json, os
          from collections import Counter
          from pathlib import Path
          from isco_video_agent.analytics_insights import refresh_learning_insights

          temp=Path(os.environ['RUNNER_TEMP'])
          first=json.loads((temp/'migrate-first.json').read_text())
          second=json.loads((temp/'migrate-second.json').read_text())
          assert first['target_rows']==128 and first['changed']==128 and first['conflicts']==0, first
          assert second['target_rows']==128 and second['changed']==0 and second['idempotent_noop'] is True, second
          state=Path(os.environ['ISCO_HISTORY_PATH'])
          d=json.loads(state.read_text(encoding='utf-8'))
          raw=d.get('learning',{}).get('metrics',[]) if isinstance(d.get('learning',{}),dict) else []
          backfill=[x for x in raw if isinstance(x,dict) and x.get('ingestion_source')=='youtube_backfill_v1' and x.get('backfill_version')==1]
          assert len(backfill)==128
          assert all(x.get('content_style')=='static_image' for x in backfill)
          formats=Counter(str(x.get('format','')) for x in backfill)
          assert formats==Counter({'short':109,'film':19}), formats
          non_backfill=[x for x in raw if isinstance(x,dict) and not (x.get('ingestion_source')=='youtube_backfill_v1' and x.get('backfill_version')==1)]
          after_non=hashlib.sha256(json.dumps(non_backfill,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          before_non=(temp/'non-backfill-before.sha256').read_text().strip()
          assert after_non==before_non, 'non-backfill payload changed'
          insights=refresh_learning_insights()
          assert insights['schema_version']==2
          assert insights['cohort_isolation']=='strict_by_format_and_content_style'
          film_static=insights['cohorts']['film']['static_image']['sample']['unique_videos']
          short_static=insights['cohorts']['short']['static_image']['sample']['unique_videos']
          assert film_static==19 and short_static==109, (film_static, short_static)
          assert insights['cohorts']['film']['agent_produced']['sample']['unique_videos']==0
          assert insights['cohorts']['short']['agent_produced']['sample']['unique_videos']==0
          assert insights['production_influence']=='none'
          report={
            'operation':'backfill_v1_content_style_migration',
            'engine_sha':os.environ['ENGINE_SHA'],
            'history_sha256_before':os.environ['HISTORY_SHA_BEFORE'],
            'history_sha256_after_local':os.environ['HISTORY_SHA_AFTER_LOCAL'],
            'first_migration':first,
            'second_migration_idempotency':second,
            'backfill_rows':128,
            'formats':dict(formats),
            'all_backfill_static_image':True,
            'non_backfill_payload_preserved':True,
            'non_backfill_payload_sha256':after_non,
            'insights_schema_version':2,
            'cohort_isolation':'strict_by_format_and_content_style',
            'film_static_image_unique_videos':film_static,
            'short_static_image_unique_videos':short_static,
            'film_agent_produced_unique_videos':0,
            'short_agent_produced_unique_videos':0,
            'production_influence':'none'
          }
          (temp/'migration-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Migration local verification PASS: 128 changed; second run 0; non-backfill unchanged.')
          PY

      - name: Checkout isolated agent-state writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: state-writer
          persist-credentials: true
          fetch-depth: 1

      - name: Encrypt and persist migrated history
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          encrypted="$RUNNER_TEMP/isco-style-migration-state/history.json.enc"
          python scripts/persistent_memory.py encrypt --plain "$ISCO_HISTORY_PATH" --encrypted "$encrypted"
          python scripts/persistent_memory.py persist \
            --repo state-writer --encrypted "$encrypted" \
            --branch agent-state --run-number "content-style-${GITHUB_RUN_NUMBER}"

      - name: Re-restore persisted state and verify exact migrated content
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/isco-style-migration-verify"
          mkdir -p "$verify_dir"
          python scripts/persistent_memory.py restore \
            --repo state-writer --plain "$verify_dir/history.json" \
            --branch agent-state --legacy-state state/history.json.enc
          persisted_sha="$(sha256sum "$verify_dir/history.json" | awk '{print $1}')"
          state_head="$(git -C state-writer ls-remote --heads origin refs/heads/agent-state | awk '{print $1}')"
          test -n "$state_head"
          VERIFY_HISTORY="$verify_dir/history.json" python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path(os.environ['VERIFY_HISTORY']).read_text(encoding='utf-8'))
          raw=d.get('learning',{}).get('metrics',[]) if isinstance(d.get('learning',{}),dict) else []
          b=[x for x in raw if isinstance(x,dict) and x.get('ingestion_source')=='youtube_backfill_v1' and x.get('backfill_version')==1]
          assert len(b)==128 and all(x.get('content_style')=='static_image' for x in b)
          print('Persisted migration verification PASS: 128/128 static_image.')
          PY
          export PERSISTED_HISTORY_SHA="$persisted_sha"
          export AGENT_STATE_HEAD="$state_head"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'migration-report.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          d['persisted_history_sha256']=os.environ['PERSISTED_HISTORY_SHA']
          d['agent_state_head_after']=os.environ['AGENT_STATE_HEAD']
          d['remote_persistence_verified']=True
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(d,ensure_ascii=False,indent=2))
          PY

      - name: Upload migration report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: backfill-content-style-migration-report-${{ github.run_number }}
          path: ${{ runner.temp }}/migration-report.json
          if-no-files-found: error
          retention-days: 3
