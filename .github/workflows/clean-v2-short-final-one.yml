name: Clean V2 Short Final One-Shot

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  pull_request:

permissions:
  contents: read

concurrency:
  group: clean-v2-short-final-one-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  final-one-shot:
    permissions:
      contents: write
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.actor == github.repository_owner &&
       github.event.comment.body == '/clean-v2-short-final-one')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ISCO_ENGINE_SHA: 3cbd689819e6b0e0b2ea9904d1998e24a5e2a293
      GEMINI_CONTENT_MODEL: gemini-3.7-flash
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GROQ_CONTENT_MODEL: openai/gpt-oss-20b
      OPENROUTER_CONTENT_MODEL: google/gemma-4-26b-a4b-it:free
      MISTRAL_CONTENT_MODEL: ministral-14b-2512
      CLOUDFLARE_VISION_FREE_ONLY: "true"
      CLOUDFLARE_VISION_MAX_CALLS_PER_WORKFLOW: "5"
      CLEAN_V2_OUTPUT: ${{ github.workspace }}/output/clean-v2-short-final-one
      PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}

    steps:
      - name: Checkout exact Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Runner checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Checkout frozen private Engine source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 3cbd689819e6b0e0b2ea9904d1998e24a5e2a293
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine pin
        run: test "$(git -C engine rev-parse HEAD)" = "$ISCO_ENGINE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install production dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            ffmpeg \
            fonts-noto-core \
            tesseract-ocr \
            tesseract-ocr-ara \
            espeak-ng \
            libsndfile1
          python -m pip install --disable-pip-version-check -r engine/requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e engine
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check \
            soundfile huggingface_hub 'misaki[en]>=0.9.4' \
            'phonemizer-fork>=3.3.2' camel-tools
          python -m pip install --disable-pip-version-check \
            'kokoro @ git+https://github.com/Oddadmix/kokoro.git@df50e07df746aec0bd7a6f237752d7109ace0b3d'
          camel_data -i disambig-mle-calima-msa-r13
          curl -fsSL \
            'https://gist.githubusercontent.com/Oddadmix/dc699f7942a9516ce29d4842c7aed756/raw/827b541c892a862f9ef3b44006a6e27b100d1bdd/arabic_g2p.py' \
            -o scripts/arabic_g2p.py
          test -s scripts/arabic_g2p.py

      - name: Build immutable Short final brief
        run: |
          set -euo pipefail
          brief="$RUNNER_TEMP/clean-v2-short-final-brief.json"
          cat > "$brief" <<'JSON'
          {
            "approved_by_user": true,
            "approved_topic": "كيف تنهض عندما تفقد الدافع تمامًا؟",
            "format": "short",
            "language": "ar",
            "audience": "Arabic-speaking adults",
            "editorial_intent": "نبرة هادئة وعملية وطبيعية؛ فكرة واحدة مكتملة، دون تشاؤم أو مبالغة.",
            "research_pack": [],
            "hard_constraints": [
              "No fabricated facts.",
              "One natural Arabic narrator only.",
              "No social CTA.",
              "Complete Short follows the natural mastered voice duration; no editorial duration target."
            ]
          }
          JSON
          sha="$(BRIEF="$brief" python - <<'PY'
          import json, os
          from pathlib import Path
          from clean_v2.contracts import compute_brief_sha256
          path = Path(os.environ["BRIEF"])
          brief = json.loads(path.read_text(encoding="utf-8"))
          print(compute_brief_sha256(brief))
          PY
          )"
          echo "CLEAN_V2_SHORT_BRIEF=$brief" >> "$GITHUB_ENV"
          echo "ISCO_APPROVED_BRIEF_SHA256=$sha" >> "$GITHUB_ENV"
          test "${#sha}" = 64

      - name: Run actual Phase B Planning + stock + cloud visual preview
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_VISION_QUOTA_FILE: ${{ runner.temp }}/cloudflare-clean-v2-short-preview-vision-quota-v2.json
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail
          rm -rf "$CLEAN_V2_OUTPUT"
          mkdir -p "$CLEAN_V2_OUTPUT/visuals"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from clean_v2.legacy_cinematic import (
              m8_normalize_media,
              security_media_preflight,
          )
          from clean_v2.media import StockVisualSource, _compact_stock_retrieval_query
          from clean_v2.pipeline import (
              _persist_planning_artifacts,
              _planning_prompt,
              _validate_plan_for_brief,
          )
          from clean_v2.providers import ProviderRouter
          from clean_v2.security_query_adapter import normalize_clean_v2_stock_query
          from clean_v2.visual_qa import (
              CleanV2VisualQABlock,
              CleanV2VisualQAInfrastructure,
              run_final_cut_visual_qa,
          )

          root = Path(os.environ["CLEAN_V2_OUTPUT"])
          visuals = root / "visuals"
          brief = {
              "approved_by_user": True,
              "approved_topic": "كيف تنهض عندما تفقد الدافع تمامًا؟",
              "format": "short",
              "language": "ar",
              "audience": "Arabic-speaking adults",
              "editorial_intent": (
                  "نبرة عملية ومتفائلة؛ بيئة يومية واقعية، عمق بصري، "
                  "إضاءة دافئة طبيعية، بلا وجوه واضحة."
              ),
              "research_pack": [],
              "hard_constraints": [
                  "No fabricated facts.",
                  "One natural Arabic narrator only.",
                  "No social CTA.",
              ],
          }

          router = ProviderRouter()
          planned = router.route(
              stage="planning",
              prompt=_planning_prompt(brief),
              max_tokens=3000,
              validator=lambda value: _validate_plan_for_brief(value, brief),
          )
          plan, story = _persist_planning_artifacts(root, planned)

          acquisition_plan = {**plan, "visual_story": story}
          query_evidence = []
          for section in plan["sections"]:
              primary_original = str(section.get("visual_query_en") or "")
              alternate_original = str(section.get("visual_query_alt_en") or "")
              primary_safe = normalize_clean_v2_stock_query(primary_original)
              alternate_safe = (
                  normalize_clean_v2_stock_query(alternate_original)
                  if alternate_original
                  else ""
              )
              query_evidence.append(
                  {
                      "id": section["id"],
                      "primary_original": primary_original,
                      "primary_provider_query": _compact_stock_retrieval_query(primary_safe),
                      "alternate_original": alternate_original,
                      "alternate_provider_query": (
                          _compact_stock_retrieval_query(alternate_safe)
                          if alternate_safe
                          else ""
                      ),
                  }
              )
          (root / "visual-preview-query-plan.json").write_text(
              json.dumps(
                  {"sections": query_evidence},
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          # For a visual-only diagnostic, section purpose is sufficient narration
          # context for the cloud visual judge. No voice/script generation is needed.
          script = {
              "title": plan.get("title", ""),
              "sections": [
                  {
                      "id": section["id"],
                      "narration": section["purpose"],
                  }
                  for section in plan["sections"]
              ],
          }
          (root / "script.json").write_text(
              json.dumps(script, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (root / "planning-router-events.json").write_text(
              json.dumps(router.events, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          source = StockVisualSource(
              query_normalizer=normalize_clean_v2_stock_query,
              media_preflight=security_media_preflight,
              media_transform=m8_normalize_media,
          )
          clips, rights = source.acquire(
              acquisition_plan,
              visuals,
              "short",
              5,
              section_estimated_seconds=None,
          )
          if not clips:
              raise RuntimeError("Phase B visual preview selected no stock clips")

          (root / "rights-manifest.json").write_text(
              json.dumps(
                  {"schema_version": 1, "assets": rights},
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          (root / "visual-source-events.json").write_text(
              json.dumps(source.events, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          qa_status = "not_run"
          qa_reason = None
          qa_report = {}
          try:
              qa_report = run_final_cut_visual_qa(
                  output_dir=root,
                  plan=plan,
                  script=script,
                  rights=rights,
                  fmt="short",
                  router=router,
                  visual_source=source,
              )
              qa_status = str(qa_report.get("status") or "pass")
          except (CleanV2VisualQABlock, CleanV2VisualQAInfrastructure) as exc:
              # Diagnostic preview only: preserve/show the real selected clips even
              # when production would correctly fail closed at Visual QA.
              qa_status = "blocked_by_quality_gate"
              qa_reason = str(exc)

          try:
              rights_payload = json.loads(
                  (root / "rights-manifest.json").read_text(encoding="utf-8")
              )
          except Exception:
              rights_payload = {"schema_version": 1}
          rights_payload["assets"] = rights
          (root / "rights-manifest.json").write_text(
              json.dumps(rights_payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (root / "visual-source-events.json").write_text(
              json.dumps(source.events, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          result = {
              "status": "preview_complete",
              "planning_title": plan.get("title"),
              "planned_section_count": len(plan.get("sections") or []),
              "planned_beat_count": len(story.get("beats") or []),
              "selected_clip_count": len(clips),
              "visual_qa_status": qa_status,
              "visual_qa_reason": qa_reason,
              "visual_qa_mode": qa_report.get("mode"),
              "semantic_recovery_count": qa_report.get("semantic_recovery_count"),
              "production_threshold_relaxed": False,
              "extra_preview_ai_calls": 0,
          }
          (root / "visual-preview-result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, ensure_ascii=False))
          PY

          mkdir -p "$CLEAN_V2_OUTPUT/montage-parts"
          : > "$CLEAN_V2_OUTPUT/montage-list.txt"
          n=0
          for clip in "$CLEAN_V2_OUTPUT"/visuals/visual-*.mp4; do
            n=$((n+1))
            part="$CLEAN_V2_OUTPUT/montage-parts/part-$(printf '%02d' "$n").mp4"
            ffmpeg -hide_banner -loglevel error -y \
              -i "$clip" -t 2.5 \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30" \
              -an -c:v libx264 -preset veryfast -crf 21 -pix_fmt yuv420p "$part"
            printf "file '%s'\n" "$part" >> "$CLEAN_V2_OUTPUT/montage-list.txt"
          done
          ffmpeg -hide_banner -loglevel error -y \
            -f concat -safe 0 -i "$CLEAN_V2_OUTPUT/montage-list.txt" \
            -c copy -movflags +faststart "$CLEAN_V2_OUTPUT/phase-b-visual-preview.mp4"

      - name: Verify actual visual preview evidence
        run: |
          set -euo pipefail
          test -s "$CLEAN_V2_OUTPUT/phase-b-visual-preview.mp4"
          test "$(jq -r .status "$CLEAN_V2_OUTPUT/visual-preview-result.json")" = "preview_complete"
          test "$(jq -r .planned_section_count "$CLEAN_V2_OUTPUT/visual-preview-result.json")" = "3"
          test "$(jq -r .selected_clip_count "$CLEAN_V2_OUTPUT/visual-preview-result.json")" -ge 3
          test -s "$CLEAN_V2_OUTPUT/visual-story.json"
          test -s "$CLEAN_V2_OUTPUT/visual-preview-query-plan.json"
          test -s "$CLEAN_V2_OUTPUT/rights-manifest.json"
          test -s "$CLEAN_V2_OUTPUT/visual-source-events.json"

      - name: Write preview summary
        if: success()
        run: |
          jq -n \
            --arg runner_sha "$GITHUB_SHA" \
            --argjson result "$(cat "$CLEAN_V2_OUTPUT/visual-preview-result.json")" \
            --argjson assets "$(jq '.assets' "$CLEAN_V2_OUTPUT/rights-manifest.json")" \
            '{status:"preview_complete", runner_sha:$runner_sha, result:$result, assets:$assets}' \
            > "$CLEAN_V2_OUTPUT/preview-summary.json"

      - name: Upload final Short evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clean-v2-short-final-one-${{ github.run_number }}
          path: ${{ env.CLEAN_V2_OUTPUT }}
          if-no-files-found: warn
          retention-days: 7
      - name: Deliver final video through unified GitHub Release
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/clean_v2_release_delivery.py deliver \
            --output-root "$CLEAN_V2_OUTPUT" \
            --scope short \
            --delivery-key "short-final-one"

      - name: Notify Telegram terminal result
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLEAN_V2_JOB_STATUS: ${{ job.status }}
        run: |
          python scripts/telegram_clean_v2_notify.py terminal \
            --output "$CLEAN_V2_OUTPUT" \
            --kind short \
            --job-status "$CLEAN_V2_JOB_STATUS" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
