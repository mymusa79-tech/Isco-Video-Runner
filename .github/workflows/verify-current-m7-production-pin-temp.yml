name: TEMP Verify Current M7 Production Pin

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENGINE_SHA: 64ab711bc904e9581c3cc6c8280d1321ae738eb1
      OLD_ENGINE_SHA: 089a97adde5d2e64b35262f944865241384f1429
    steps:
      - name: Checkout Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify canonical production pin surfaces
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from pathlib import Path
          new = os.environ['ENGINE_SHA']
          old = os.environ['OLD_ENGINE_SHA']
          v4 = Path('.github/workflows/produce-resilient-v4.yml').read_text(encoding='utf-8')
          tg = Path('.github/workflows/telegram-editorial-control.yml').read_text(encoding='utf-8')
          hei = Path('.github/workflows/verify-human-editorial-intent-m7.yml').read_text(encoding='utf-8')
          runner = Path('scripts/run_v3_voice.py').read_text(encoding='utf-8')
          if v4.count(new) != 3 or old in v4:
              raise SystemExit('Production V4 exact Engine pin contract failed')
          checkout = re.findall(r'^\s+ref:\s+([0-9a-f]{40})\s*$', v4, flags=re.MULTILINE)
          env_pin = re.findall(r'^\s+ISCO_ENGINE_SHA:\s+([0-9a-f]{40})\s*$', v4, flags=re.MULTILINE)
          if checkout != [new] or env_pin != [new]:
              raise SystemExit(f'Production V4 checkout/env mismatch: checkout={checkout} env={env_pin}')
          if f'test "$(git rev-parse HEAD)" = "{new}"' not in v4:
              raise SystemExit('Production V4 exact checkout verification missing')
          if tg.count(new) != 1 or old in tg:
              raise SystemExit('Telegram research Engine pin mismatch')
          if 'CONTROL_PLANE_PRODUCTION_ENABLED: "false"' not in tg:
              raise SystemExit('Telegram automatic production lock changed')
          if hei.count(new) != 1 or old in hei:
              raise SystemExit('HEI/M7 verifier Engine pin mismatch')
          required_runner = (
              'from scripts.m7_live_binding import install_m7_live_binding',
              'install_m7_live_binding()',
              'out = orchestrator.produce(',
          )
          missing = [x for x in required_runner if x not in runner]
          if missing:
              raise SystemExit('Runner M7 production binding missing: ' + ', '.join(missing))
          if runner.index('install_m7_live_binding()') > runner.index('out = orchestrator.produce('):
              raise SystemExit('M7 binding installs after production call')
          print('Canonical Production V4 + Runner M7 binding PASS')
          PY

      - name: Checkout exact current Engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ env.ENGINE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine and required modules
        working-directory: engine
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ENGINE_SHA"
          test -f src/isco_video_agent/cinematic_m7_runtime.py
          test -f src/isco_video_agent/cinematic_m7_visual_timeline.py
          test -f src/isco_video_agent/cinematic_m7_live_binding.py
          test -f src/isco_video_agent/cinematic_m11_runtime.py
          grep -F 'sections' src/isco_video_agent/cinematic_m7_live_binding.py >/dev/null

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install locked Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Focused M7 current-main tests
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest tests.test_editorial_room_director_m7_binding_current_main -v
          python -m unittest tests.test_cinematic_m7_runtime -v
          python -m unittest tests.test_cinematic_m7_visual_timeline -v

      - name: Focused Runner live binding tests
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m unittest scripts.test_m7_live_binding -v
          python -m unittest scripts.test_m11_live_binding -v

      - name: Full Engine regression
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Full Runner regression
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' | sort | sed -e 's#/#.#g' -e 's#\.py$##')
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q

      - name: Final diff sanity
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          ! grep -R -F "$OLD_ENGINE_SHA" .github/workflows/produce-resilient-v4.yml .github/workflows/telegram-editorial-control.yml .github/workflows/verify-human-editorial-intent-m7.yml
