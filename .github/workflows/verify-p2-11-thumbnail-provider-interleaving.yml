name: Verify P2-11 Thumbnail Provider Interleaving

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  exact-combined-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact Runner main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4dffd788882abc5b1083b2b8e4ab7f9e14873022
          path: runner
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Runner checkout
        working-directory: runner
        run: test "$(git rev-parse HEAD)" = "4dffd788882abc5b1083b2b8e4ab7f9e14873022"

      - name: Checkout exact private Engine candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 38565e7fe4d0e9b3f16a9078e431f64e26015583
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact Engine checkout
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "38565e7fe4d0e9b3f16a9078e431f64e26015583"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install media and locked Engine runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: P2-11 focused regression
        working-directory: engine
        run: python -m unittest discover -s tests -p 'test_thumbnail_pixabay_fallback.py' -q

      - name: Full Engine suite
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Full Runner regression suite
        working-directory: runner
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}/runner
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q

      - name: Exact P2-11 scope sanity
        working-directory: engine
        run: |
          set -euo pipefail
          git diff --check ae09e7f3ecfc0c49e96041f058d9e0b38924bb69..38565e7fe4d0e9b3f16a9078e431f64e26015583
          mapfile -t changed < <(git diff --name-only ae09e7f3ecfc0c49e96041f058d9e0b38924bb69..38565e7fe4d0e9b3f16a9078e431f64e26015583 | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "src/isco_video_agent/thumbnail.py"
          test "${changed[1]}" = "tests/test_thumbnail_pixabay_fallback.py"
          grep -q 'up_to_4_pexels_plus_pixabay_fill_interleaved_pexels_first' src/isco_video_agent/thumbnail.py
          grep -q '\["pexels", "pixabay", "pexels", "pixabay", "pexels", "pexels"\]' tests/test_thumbnail_pixabay_fallback.py
