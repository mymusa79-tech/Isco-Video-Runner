name: Synchronize Live Engine Pins

on:
  push:
    branches:
      - fix/editorial-promise-continuity-family

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/editorial-promise-continuity-family
          persist-credentials: true
          fetch-depth: 0

      - name: Synchronize every live production Engine pin
        env:
          OLD_ENGINE_SHA: 3d584c868b5c094d7856370f6d728aec841fef27
          NEW_ENGINE_SHA: 69b21dd1c10f196c623e5b426bccd574a80accf5
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          old = os.environ['OLD_ENGINE_SHA']
          new = os.environ['NEW_ENGINE_SHA']
          paths = [
              Path('.github/workflows/telegram-editorial-control.yml'),
              Path('.github/workflows/telegram-production-request.yml'),
              Path('.github/workflows/verify-human-editorial-intent-m7.yml'),
              Path('.github/workflows/verify-m11-live-integration.yml'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'{path}: expected old Engine SHA at least once, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{path}: replaced {count} live pin(s)')
          PY

      - name: Remove synchronization workflow and commit exact pin family
        run: |
          set -euo pipefail
          rm .github/workflows/sync-live-engine-pins.yml
          git config user.name "isco-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/telegram-editorial-control.yml \
                  .github/workflows/telegram-production-request.yml \
                  .github/workflows/verify-human-editorial-intent-m7.yml \
                  .github/workflows/verify-m11-live-integration.yml \
                  .github/workflows/sync-live-engine-pins.yml
          test -n "$(git status --porcelain)"
          git commit -m "Pin every live workflow to editorial continuity Engine"
          git push origin HEAD:fix/editorial-promise-continuity-family
