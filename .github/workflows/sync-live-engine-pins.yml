name: Synchronize Live Engine Pins

on:
  push:
    branches:
      - fix/editorial-promise-continuity-family

permissions:
  contents: read

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/editorial-promise-continuity-family
          persist-credentials: false
          fetch-depth: 1

      - name: Synchronize every live production Engine pin in workspace
        env:
          OLD_ENGINE_SHA: 3d584c868b5c094d7856370f6d728aec841fef27
          NEW_ENGINE_SHA: 69b21dd1c10f196c623e5b426bccd574a80accf5
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          old = os.environ['OLD_ENGINE_SHA']
          new = os.environ['NEW_ENGINE_SHA']
          paths = [
              Path('.github/workflows/telegram-editorial-control.yml'),
              Path('.github/workflows/telegram-production-request.yml'),
              Path('.github/workflows/verify-human-editorial-intent-m7.yml'),
              Path('.github/workflows/verify-m11-live-integration.yml'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'{path}: expected old Engine SHA at least once, found {count}')
              updated = text.replace(old, new)
              if old in updated or new not in updated:
                  raise SystemExit(f'{path}: pin synchronization verification failed')
              path.write_text(updated, encoding='utf-8')
              print(f'{path}: replaced {count} live pin(s)')
          PY

      - name: Stage exact synchronized workflow files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/live-engine-pins/.github/workflows"
          cp .github/workflows/telegram-editorial-control.yml "$RUNNER_TEMP/live-engine-pins/.github/workflows/"
          cp .github/workflows/telegram-production-request.yml "$RUNNER_TEMP/live-engine-pins/.github/workflows/"
          cp .github/workflows/verify-human-editorial-intent-m7.yml "$RUNNER_TEMP/live-engine-pins/.github/workflows/"
          cp .github/workflows/verify-m11-live-integration.yml "$RUNNER_TEMP/live-engine-pins/.github/workflows/"

      - name: Upload synchronized workflow files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synchronized-live-engine-pins
          path: ${{ runner.temp }}/live-engine-pins
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
