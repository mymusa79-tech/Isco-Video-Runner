name: Editorial Room Stage 7 PR Certify V4

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  ENGINE_SHA: 2a8d246d03bb5247da23b3c7b7e97e995b4619bf

jobs:
  certify-stage7-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Runner verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact Engine Stage 6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ env.ENGINE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1
      - name: Apply Stage 7 candidate and tighten semantic anchor
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path("../.github/workflows/editorial-room-stage7-closure.yml").read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("          PY\n", start)
          lines = src[start:end].splitlines()
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path("/tmp/apply_stage7.py").write_text(code, encoding="utf-8")
          PY
          python /tmp/apply_stage7.py
          rm -f tests/test_editorial_stage7.py
          python - <<'PY'
          from pathlib import Path
          p = Path("src/isco_video_agent/packaging_integrity.py")
          s = p.read_text(encoding="utf-8")
          old = "    has_semantic_anchor = max(promise_alignment, turn_alignment, payoff_alignment, thesis_alignment) > 0.0\n"
          new = "    has_semantic_anchor = max(promise_alignment, turn_alignment, payoff_alignment, thesis_alignment) >= 0.20\n"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new), encoding="utf-8")
          PY
          git diff --check
      - name: Write Stage 7 contract tests
        working-directory: engine
        shell: bash
        run: |
          cat > tests/test_editorial_stage7.py <<'PYTEST'
          from __future__ import annotations
          import json, tempfile, unittest
          from pathlib import Path
          from unittest.mock import patch
          from isco_video_agent import thumbnail
          from isco_video_agent.editorial_room import make_editorial_intent
          from isco_video_agent.models import ProductionPlan, ScriptSection
          from isco_video_agent.packaging_integrity import audit_editorial_packaging_binding
          from isco_video_agent.production_pipeline import _plan_from_json

          class EditorialStage7Tests(unittest.TestCase):
              def _intent(self):
                  return make_editorial_intent(
                      editorial_thesis="الشعور بالتأخر يتضخم حين تستخدم مقياسًا لا يناسب حياتك.",
                      viewer_starting_belief="المشاهد يظن أن سرعة الآخرين دليل على أنه متأخر فعلًا.",
                      hidden_assumption="الافتراض الخفي هو أن كل الناس يجب أن يتقدموا بالإيقاع نفسه.",
                      editorial_turn="بدل سؤال كم تأخرت، افحص المقياس الذي تستخدمه للحكم على تقدمك.",
                      stakes="المقياس الخاطئ يحول التقدم الحقيقي إلى شعور دائم بالفشل.",
                      viewer_promise="ستتعلم كيف تميز بين التأخر الحقيقي ومقارنة نفسك بمقياس لا يناسب حياتك.",
                      evidence_boundaries=("لا نقدم تشخيصًا طبيًا.", "لا نعمم مسارًا واحدًا على الجميع."),
                      earned_payoff="اختر مقياس تقدم مرتبطًا بظروفك وقارن نفسك بخطوتك السابقة.",
                  )
              def _plan(self):
                  i=self._intent()
                  return ProductionPlan(topic="لماذا تشعر أنك متأخر عن الجميع؟", pillar="understand", format="film",
                      hook="قد لا تكون متأخرًا؛ ربما تستخدم مقياسًا لا يخص حياتك.", title_options=["هل أنت متأخر فعلًا؟"],
                      thumbnail_concepts=["ساعة ومسار مختلف"], sections=[ScriptSection(id="s1", narration="نقارن سرعتنا بالآخرين ثم ننسى اختلاف نقطة البداية والظروف.", visual_query="person walking different path", key_point="افحص مقياس المقارنة")],
                      cta="جرّب مقياسًا واحدًا هذا الأسبوع.", closing_payoff=i.earned_payoff, editorial_intent=i.to_dict())
              def _candidate(self):
                  i=self._intent()
                  return {"candidate_id":"packaging-a","title_ar":"هل مقياسك يجعلك متأخرًا؟","text_mode":"short_text","text_ar":"المقياس الخطأ",
                      "packaging_hypothesis":"إعادة تعريف التأخر عبر كشف مقياس المقارنة الخاطئ.","viewer_promise":i.viewer_promise,
                      "viewer_promise_expression":"ستعرف هل أنت متأخر فعلًا أم تحاكم حياتك بمقياس لا يناسبك.","locked_viewer_promise":i.viewer_promise,
                      "editorial_fingerprint":i.editorial_fingerprint,"persona_version":i.persona_version}
              def test_valid_candidate_bound_to_same_intent(self):
                  p=self._plan(); r=audit_editorial_packaging_binding(p,self._candidate())
                  self.assertIn(r["status"],{"pass","review"}); self.assertTrue(r["release_authority"])
              def test_missing_intent_fails_closed(self):
                  p=self._plan(); p.editorial_intent={}; self.assertEqual(audit_editorial_packaging_binding(p,self._candidate())["status"],"block")
              def test_fingerprint_mismatch_blocks(self):
                  p=self._plan(); c=self._candidate(); c["editorial_fingerprint"]="wrong"; r=audit_editorial_packaging_binding(p,c)
                  self.assertEqual(r["status"],"block"); self.assertIn("editorial_fingerprint_mismatch",r["issues"])
              def test_unrelated_expression_blocks(self):
                  p=self._plan(); c=self._candidate(); c.update(title_ar="وصفة فطائر منزلية",text_ar="مطبخ سريع",packaging_hypothesis="مكونات وطهي وجبة لذيذة.",viewer_promise_expression="ستتعلم وصفة فطائر ومقاديرها ووقت خبزها.")
                  r=audit_editorial_packaging_binding(p,c); self.assertEqual(r["status"],"block"); self.assertIn("editorial_packaging_has_no_intent_anchor",r["issues"])
              def test_plan_json_reload_preserves_serialized_editorial_intent(self):
                  p=self._plan(); expected=json.loads(json.dumps(p.editorial_intent,ensure_ascii=False))
                  with tempfile.TemporaryDirectory() as tmp:
                      path=Path(tmp)/"plan.json"; path.write_text(json.dumps(p.to_dict(),ensure_ascii=False),encoding="utf-8"); loaded=_plan_from_json(path)
                  self.assertEqual(loaded.editorial_intent,expected)
              def test_abc_share_locked_promise_with_one_model_call(self):
                  p=self._plan(); raw={"concepts":[
                    {"title_ar":"هل أنت متأخر فعلًا؟","text_mode":"short_text","text_ar":"مقياس خاطئ","visual_query_en":"person comparing clocks","alternate_visual_query_en":"different life paths","text_position":"left","packaging_hypothesis":"وضوح المقياس الخاطئ.","viewer_promise":"ستفهم لماذا يبدو تقدم الآخرين أسرع حين تستخدم مقياسًا لا يناسبك.","title_role":"يسأل عن التأخر.","thumbnail_role":"يكشف المقياس.","angle":"clarity","why_it_can_work":"واضح"},
                    {"title_ar":"المقارنة التي تسرق تقدمك","text_mode":"short_text","text_ar":"سباق غيرك","visual_query_en":"runner on separate lanes","alternate_visual_query_en":"people walking separate roads","text_position":"right","packaging_hypothesis":"توتر المقارنة بسباق الآخرين.","viewer_promise":"ستعيد تقييم إحساسك بالتأخر عندما ترى أن مسارك لا يقاس بسرعة غيرك.","title_role":"يصنع التوتر.","thumbnail_role":"يجسد السباق.","angle":"tension","why_it_can_work":"متوتر"},
                    {"title_ar":"غيّر المقياس أولًا","text_mode":"none","text_ar":"","visual_query_en":"single ruler beside winding road","alternate_visual_query_en":"measuring tape different paths","text_position":"center","packaging_hypothesis":"اختزال الفكرة في تغيير المقياس.","viewer_promise":"ستخرج بمقياس تقدم يناسب ظروفك بدل مقارنة خطوتك بإيقاع الآخرين.","title_role":"يقدم التحول.","thumbnail_role":"يجسد المقياس بصريًا.","angle":"minimalist","why_it_can_work":"بسيط"}]}
                  with patch.object(thumbnail,"json_text",return_value=raw) as call: concepts=thumbnail._concepts("fake",p,"fake-model")
                  call.assert_called_once(); self.assertEqual(len(concepts),3)
                  self.assertEqual({x["viewer_promise"] for x in concepts},{p.editorial_intent["viewer_promise"]})
                  self.assertEqual({x["editorial_fingerprint"] for x in concepts},{p.editorial_intent["editorial_fingerprint"]})
                  self.assertEqual(len({x["packaging_hypothesis"] for x in concepts}),3)
          if __name__ == "__main__": unittest.main()
          PYTEST
          python -m py_compile tests/test_editorial_stage7.py
          git diff --check
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked Engine runtime and ffmpeg
        working-directory: engine
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Focused Stage 7 contracts
        working-directory: engine
        run: python -m unittest tests.test_editorial_stage7 -v
      - name: Stage 5-6 HEI M7 and full packaging compatibility
        working-directory: engine
        run: >-
          python -m unittest
          tests.test_editorial_adapters
          tests.test_editorial_stage6
          tests.test_human_editorial_intent
          tests.test_editorial_room_director_m7_binding_current_main
          tests.test_packaging_benchmark_p2
          tests.test_packaging_early_brief_p2
          tests.test_packaging_experiments_p2
          tests.test_packaging_identity_integrity_p1
          tests.test_packaging_learning_p2
          tests.test_thumbnail_packaging_contract
          -q
      - name: Full Engine regression
        working-directory: engine
        run: python -m unittest discover -s tests -q
      - name: Final Stage 7 diff review
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git checkout -- state/history.json 2>/dev/null || true
          mapfile -t changed < <(git status --porcelain --untracked-files=all | sed -E 's/^.. //')
          allowed=(src/isco_video_agent/production_pipeline.py src/isco_video_agent/packaging_integrity.py src/isco_video_agent/thumbnail.py tests/test_editorial_stage7.py)
          for path in "${changed[@]}"; do
            ok=false; for want in "${allowed[@]}"; do [[ "$path" == "$want" ]] && ok=true; done
            $ok || { echo "unexpected dirty path: $path" >&2; exit 1; }
          done
      - name: Prepare verified Stage 7 artifact
        working-directory: engine
        run: |
          mkdir -p "$RUNNER_TEMP/stage7/src/isco_video_agent" "$RUNNER_TEMP/stage7/tests"
          cp src/isco_video_agent/production_pipeline.py "$RUNNER_TEMP/stage7/src/isco_video_agent/"
          cp src/isco_video_agent/packaging_integrity.py "$RUNNER_TEMP/stage7/src/isco_video_agent/"
          cp src/isco_video_agent/thumbnail.py "$RUNNER_TEMP/stage7/src/isco_video_agent/"
          cp tests/test_editorial_stage7.py "$RUNNER_TEMP/stage7/tests/"
          git diff > "$RUNNER_TEMP/stage7/stage7.patch"
      - name: Upload verified Stage 7 closure
        uses: actions/upload-artifact@v4
        with:
          name: stage7-verified-closure-v4
          path: ${{ runner.temp }}/stage7
          retention-days: 1
