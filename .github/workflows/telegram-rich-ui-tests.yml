name: Telegram Rich UI Tests

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/telegram-control-worker/index.js"
      - "scripts/telegram_bot_api_10_3_ui.py"
      - "scripts/telegram_production_rich_ui.py"
      - "scripts/telegram_rich_integration.py"
      - "scripts/telegram_topic_memory_ui.py"
      - "scripts/test_telegram_edge_worker_contract.py"
      - "scripts/test_telegram_bot_api_10_3_ui.py"
      - "scripts/test_telegram_production_rich_ui.py"
      - "scripts/test_telegram_rich_integration.py"
      - ".github/workflows/telegram-rich-ui-tests.yml"
  pull_request:
    paths:
      - "cloudflare/telegram-control-worker/index.js"
      - "scripts/telegram_bot_api_10_3_ui.py"
      - "scripts/telegram_production_rich_ui.py"
      - "scripts/telegram_rich_integration.py"
      - "scripts/telegram_topic_memory_ui.py"
      - "scripts/test_telegram_edge_worker_contract.py"
      - "scripts/test_telegram_bot_api_10_3_ui.py"
      - "scripts/test_telegram_production_rich_ui.py"
      - "scripts/test_telegram_rich_integration.py"
      - ".github/workflows/telegram-rich-ui-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Compile Telegram rich UI modules
        run: |
          python -m py_compile \
            scripts/telegram_bot_api_10_3_ui.py \
            scripts/telegram_production_rich_ui.py \
            scripts/telegram_rich_integration.py \
            scripts/telegram_topic_memory_ui.py
          node --check cloudflare/telegram-control-worker/index.js

      - name: Run Telegram rich UI tests
        run: |
          python -m unittest -v \
            scripts.test_telegram_edge_worker_contract \
            scripts.test_telegram_bot_api_10_3_ui \
            scripts.test_telegram_production_rich_ui \
            scripts.test_telegram_rich_integration
