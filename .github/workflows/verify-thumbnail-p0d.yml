name: Verify Thumbnail Pixabay Fallback P0-D

on:
  push:
    branches: ["ci/verify-thumbnail-p0d"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Runner P0-D stack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact Engine P0-D candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 5f6eaa933cd8ad0a62dc23f06b731fb88e9a4241
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked Engine runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Focused thumbnail P0 A-B-C-D tests
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_thumbnail_cultural_safety \
            tests.test_thumbnail_packaging_contract \
            tests.test_thumbnail_batch_review \
            tests.test_thumbnail_candidate_board \
            tests.test_thumbnail_pixabay_fallback \
            -v

      - name: Verify Gold Phase 2B and Phase 4 regressions
        env:
          PYTHONPATH: engine/src:.
        run: |
          set -euo pipefail
          python -m unittest \
            scripts.test_gold_shadow_phase2b \
            scripts.test_gold_single_evaluator_phase3 \
            scripts.test_gold_enforce_phase4 \
            scripts.test_thumbnail_pixabay_bridge_p0d \
            -v

      - name: Prove mixed-provider P0-D board stays at four provider attempts
        env:
          PYTHONPATH: engine/src:.
        run: |
          set -euo pipefail
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from types import SimpleNamespace
          from unittest.mock import Mock, patch

          import isco_video_agent.thumbnail as thumbnail
          from isco_video_agent.ai_budget import BudgetLedger
          import scripts.gold_thumbnail_budget as gold_budget

          plan = SimpleNamespace(
              format="film",
              topic="كيف تنهض بعد السقوط؟",
              hook="hook",
              title_options=["title"],
              thumbnail_concepts=["concept"],
              closing_payoff="payoff",
          )
          concepts = []
          for index in range(1, 4):
              concepts.append({
                  "title_ar": f"عنوان مختلف {index}",
                  "text_ar": f"ابدأ الآن {index}",
                  "visual_query_en": f"sunrise path {index}",
                  "text_position": ("left", "right", "center")[index - 1],
                  "packaging_hypothesis": f"فرضية مختلفة {index}",
                  "viewer_promise": f"وعد مختلف {index}",
                  "title_role": f"دور العنوان {index}",
                  "thumbnail_role": f"دور الصورة {index}",
                  "angle": f"زاوية {index}",
                  "why_it_can_work": f"سبب {index}",
              })
          pexels_photos = [
              {
                  "id": index,
                  "url": f"https://www.pexels.com/photo/{index}/",
                  "photographer": f"p{index}",
                  "photographer_url": f"https://www.pexels.com/@p{index}/",
              }
              for index in range(1, 7)
          ]
          pixabay_photos = [
              {
                  "id": 100 + index,
                  "url": f"https://pixabay.com/photos/{100 + index}/",
                  "photographer": f"x{index}",
                  "photographer_url": f"https://pixabay.com/users/x-{index}/",
              }
              for index in range(1, 4)
          ]
          original_json = Mock(return_value={"concepts": concepts})
          original_audit = Mock(return_value={
              "status": "pass",
              "selected_candidate_index": 6,
              "candidate_count": 6,
          })

          def fake_download(_url, path):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(b"raw")
              return path

          def fake_preview(_raw, path):
              path.write_bytes(b"preview")
              return path

          ledger = BudgetLedger("film", enforce=True)
          with tempfile.TemporaryDirectory() as tmp, \
               patch.object(thumbnail, "json_text", original_json), \
               patch.object(thumbnail, "audit_image_preview", original_audit), \
               patch.object(thumbnail, "search_photos", return_value=pexels_photos), \
               patch.object(thumbnail, "photo_file", side_effect=lambda photo: f"https://images.pexels.com/{photo['id']}.jpg"), \
               patch.object(thumbnail, "download", side_effect=fake_download), \
               patch.object(thumbnail.pixabay_provider, "search_photos", return_value=pixabay_photos), \
               patch.object(thumbnail.pixabay_provider, "photo_file", side_effect=lambda photo: f"https://cdn.pixabay.com/{photo['id']}.jpg"), \
               patch.object(thumbnail.pixabay_provider, "download", side_effect=fake_download), \
               patch.object(thumbnail, "make_image_review_preview", side_effect=fake_preview), \
               patch.object(thumbnail, "write_srt", side_effect=lambda _segments, path: path), \
               patch.object(thumbnail, "render_thumbnail", side_effect=lambda _raw, _srt, output, **_kwargs: output):
              package = gold_budget.build_budgeted_thumbnail_package(
                  gemini_key="g",
                  pexels_key="p",
                  pixabay_key="x",
                  plan=plan,
                  output_dir=Path(tmp),
                  model="model",
                  ledger=ledger,
              )

          summary = ledger.to_summary()
          assert original_json.call_count == 1, original_json.call_count
          assert original_audit.call_count == 3, original_audit.call_count
          assert summary["provider_attempts"]["total"] == 4, summary
          assert summary["logical_tasks"]["by_priority"]["P2"] == 4, summary
          assert package["visual_review"]["max_ai_calls_per_package"] == 4, package
          assert all(c["photo_provider"] == "pixabay" for c in package["candidates"]), package
          assert all(c["reviewed_providers"] == ["pexels", "pixabay"] for c in package["candidates"]), package
          print("P0-D Gold budget integration PASS: mixed Pexels/Pixabay board remains 1 Text + 3 Vision = 4 provider attempts")
          PY

      - name: Full Engine regression suite
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -q

      - name: Static compatibility and rights invariants
        env:
          PYTHONPATH: engine/src:.
        run: |
          set -euo pipefail
          python - <<'PY'
          import inspect
          import isco_video_agent.production_pipeline as pipeline
          import isco_video_agent.thumbnail as thumbnail
          from isco_video_agent.gold_finalizer import finalize_gold_output
          import scripts.gold_enforce_phase4 as phase4
          import scripts.gold_thumbnail_budget as gold_budget

          signature = inspect.signature(thumbnail.build_thumbnail_package)
          assert list(signature.parameters) == ["gemini_key", "pexels_key", "plan", "output_dir", "model", "pixabay_key"]
          assert signature.parameters["pixabay_key"].default is None
          assert list(inspect.signature(pipeline._augment_rights).parameters) == ["output_dir", "thumbnail_package"]
          assert "pixabay" in pipeline._THUMBNAIL_RIGHTS
          assert "pexels" in pipeline._THUMBNAIL_RIGHTS
          finalizer_params = list(inspect.signature(finalize_gold_output).parameters)
          assert finalizer_params == [
              "output_dir", "output_key", "gemini", "pexels", "plan_from_json",
              "build_thumbnail_package", "augment_rights", "run_final_critic",
              "remove_production_record", "mark_production_accepted", "sync_state_snapshot",
          ]
          gold_source = inspect.getsource(gold_budget)
          assert "thumbnail.build_thumbnail_package" in gold_source
          assert "thumbnail.audit_image_preview = budgeted_audit_image_preview" in gold_source
          assert inspect.signature(phase4.run_gold_enforce_phase4).parameters["pixabay"].default is None
          assert thumbnail.MAX_VISUAL_CANDIDATES_PER_HYPOTHESIS == 6
          assert thumbnail.PEXELS_PRIMARY_BOARD_SLOTS == 4
          print("P0-D compatibility, rights, and Gold seams PASS")
          PY
