name: V24 Editorial Shot Guidance
on:
  push:
    branches: [agent/v24-editorial-shot-guidance-20261018]
  pull_request:
    branches: [main]
    paths: [clean_v2/short_format.py, clean_v2/visual_story.py, scripts/test_v24_editorial_guidance.py, .github/workflows/v24-editorial-shot-guidance.yml]
permissions:
  contents: read
jobs:
  guidance-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile and test V24 prompt contract
        run: |
          python -m py_compile clean_v2/short_format.py clean_v2/visual_story.py scripts/test_v24_editorial_guidance.py
          python -m unittest scripts.test_v24_editorial_guidance -v
