name: PR564 Retry Owner Fix Once

on:
  push:
    branches:
      - fix/planning-envelope-retry-parity-20260906
    paths:
      - .github/workflows/pr564-retry-owner-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/planning-envelope-retry-parity-20260906
          fetch-depth: 0

      - name: Remove duplicate deferred-retry cooldown ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/planning_stage_contract.py")
          text = path.read_text(encoding="utf-8")
          old = '''                    if (
                        contract.provider_policy.second_pass_after_full_exhaustion
                        and round_index == 1
                        and deferred_retry_providers
                        and total_attempts < contract.provider_policy.max_total_attempts
                    ):
                        time.sleep(router.TRANSIENT_PROVIDER_COOLDOWN_SECONDS)
                        continue
          '''
          new = '''                    if (
                        contract.provider_policy.second_pass_after_full_exhaustion
                        and round_index == 1
                        and deferred_retry_providers
                        and total_attempts < contract.provider_policy.max_total_attempts
                    ):
                        # The deferred round owns this bounded cooldown. Clear only the
                        # provider-local timestamps for providers explicitly authorized
                        # for round two so the same cooldown is not enforced twice.
                        time.sleep(router.TRANSIENT_PROVIDER_COOLDOWN_SECONDS)
                        for provider in deferred_retry_providers:
                            transient_cooldown_until.pop(provider, None)
                        continue
          '''
          if old not in text:
              if "The deferred round owns this bounded cooldown" in text:
                  print("PR564 retry cooldown owner fix already applied")
                  raise SystemExit(0)
              raise SystemExit("expected PR564 retry block not found")
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one PR564 retry block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          if git diff --quiet -- scripts/planning_stage_contract.py; then
            echo "No patch needed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/planning_stage_contract.py
          git commit -m "Fix deferred retry cooldown ownership"
          git push origin HEAD:fix/planning-envelope-retry-parity-20260906
