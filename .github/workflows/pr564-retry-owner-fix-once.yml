name: PR564 Retry Owner Fix Once

on:
  push:
    branches:
      - fix/planning-envelope-retry-parity-20260906
    paths:
      - .github/workflows/pr564-retry-owner-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/planning-envelope-retry-parity-20260906
          fetch-depth: 0

      - name: Remove duplicate deferred-retry cooldown ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/planning_stage_contract.py")
          text = path.read_text(encoding="utf-8")
          marker = "The deferred round owns this bounded cooldown"
          if marker in text:
              print("PR564 retry cooldown owner fix already applied")
              raise SystemExit(0)

          lines = text.splitlines(keepends=True)
          matches = []
          for i, line in enumerate(lines):
              if line.strip() != "time.sleep(router.TRANSIENT_PROVIDER_COOLDOWN_SECONDS)":
                  continue
              context = "".join(lines[max(0, i - 8):i])
              if "second_pass_after_full_exhaustion" in context and "deferred_retry_providers" in context:
                  matches.append(i)

          if len(matches) != 1:
              raise SystemExit(f"expected one deferred-round cooldown line, found {len(matches)}")

          i = matches[0]
          indent = lines[i][: len(lines[i]) - len(lines[i].lstrip())]
          insertion = [
              indent + "# The deferred round owns this bounded cooldown. Clear only the\n",
              indent + "# provider-local timestamps for providers explicitly authorized\n",
              indent + "# for round two so the same cooldown is not enforced twice.\n",
              lines[i],
              indent + "for provider in deferred_retry_providers:\n",
              indent + "    transient_cooldown_until.pop(provider, None)\n",
          ]
          lines[i:i + 1] = insertion
          path.write_text("".join(lines), encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/planning_stage_contract.py
          git commit -m "Fix deferred retry cooldown ownership"
          git push origin HEAD:fix/planning-envelope-retry-parity-20260906
