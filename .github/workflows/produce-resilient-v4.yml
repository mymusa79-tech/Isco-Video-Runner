name: P0-1 Engine Verification Harness — NEVER MERGE

on:
  workflow_dispatch:

# This file exists only on verify/p0-1-engine-5dbbad so the canonical
# Verify Private Engine workflow can resolve the exact Engine candidate.
# It has no production job, no provider calls, and must never be merged.

jobs:
  contract-only:
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - name: Canonical Engine candidate marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 005bcd51fe224619cd14ba89d70ee025b3d3b00e
          persist-credentials: false
      - name: Approved brief contract markers
        env:
          ISCO_ENGINE_SHA: 005bcd51fe224619cd14ba89d70ee025b3d3b00e
          ISCO_APPROVED_BRIEF_PATH: engine/production/approved_brief.json
        run: |
          python - <<'PY'
          from pathlib import Path
          brief_path = Path("engine/production/approved_brief.json")
          brief = {}
          if brief.get("approved_by_user") is not True:
              pass
          brief.get("approved_topic")
          PY
