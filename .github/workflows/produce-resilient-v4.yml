name: Isco Video Production Resilient V4

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Arabic topic or working title"
        required: true
        default: "كيف تنهض بعد أن سقطت كثيرًا؟"
        type: string
      format:
        description: "film or story"
        required: true
        default: film
        type: choice
        options: [film, story]
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/produce-resilient-v4.yml"
      - "scripts/run_v3_voice.py"
      - "scripts/voice_mesh.py"
      - "scripts/task_level_planner_router.py"

concurrency:
  group: isco-video-resilient-v4
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout private engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 626db410cc539be6486d43045b5d4ee9053a01d7
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install locked engine and local voice fallback
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core openssl
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
          python -m pip check
          python -m unittest discover -s tests -q
          python -m pip install 'piper-tts==1.4.2'
          mkdir -p "$RUNNER_TEMP/piper-voices"
          python -m piper.download_voices --data-dir "$RUNNER_TEMP/piper-voices" ar_JO-kareem-medium
          test -f "$RUNNER_TEMP/piper-voices/ar_JO-kareem-medium.onnx"
          test -f "$RUNNER_TEMP/piper-voices/ar_JO-kareem-medium.onnx.json"

      - name: Verify local voice fallback before cloud production
        env:
          PIPER_MODEL_PATH: ${{ runner.temp }}/piper-voices/ar_JO-kareem-medium.onnx
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, wave
          from pathlib import Path
          from piper import PiperVoice
          model = Path(os.environ["PIPER_MODEL_PATH"])
          voice = PiperVoice.load(str(model), config_path=str(model) + ".json")
          out = Path(os.environ["RUNNER_TEMP"]) / "piper-preflight.wav"
          with wave.open(str(out), "wb") as wav:
              voice.synthesize_wav("هذا اختبار صوت محلي.", wav)
          if out.stat().st_size < 1024:
              raise SystemExit("Piper preflight produced empty audio")
          print("Piper local voice preflight OK")
          PY

      - name: Prepare secure request and secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          TOPIC_INPUT: ${{ inputs.topic }}
          FORMAT_INPUT: ${{ inputs.format }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          test -n "$GROQ_API_KEY"
          test -n "$OPENROUTER_API_KEY"
          test -n "$PEXELS_API_KEY"
          test -n "$PIXABAY_API_KEY"
          umask 077
          mkdir -p "$RUNNER_TEMP/isco-secrets"
          printf '%s' "$GEMINI_API_KEY" > "$RUNNER_TEMP/isco-secrets/gemini"
          printf '%s' "$GROQ_API_KEY" > "$RUNNER_TEMP/isco-secrets/groq"
          printf '%s' "$OPENROUTER_API_KEY" > "$RUNNER_TEMP/isco-secrets/openrouter"
          printf '%s' "$PEXELS_API_KEY" > "$RUNNER_TEMP/isco-secrets/pexels"
          printf '%s' "$PIXABAY_API_KEY" > "$RUNNER_TEMP/isco-secrets/pixabay"
          printf '%s' "$YOUTUBE_API_KEY" > "$RUNNER_TEMP/isco-secrets/youtube"
          python - <<'PY'
          import json, os
          from pathlib import Path
          if os.environ.get("EVENT_NAME") == "workflow_dispatch":
              topic = (os.environ.get("TOPIC_INPUT") or "").strip()
              fmt = (os.environ.get("FORMAT_INPUT") or "film").strip().lower()
          else:
              topic = "كيف تنهض بعد أن سقطت كثيرًا؟"
              fmt = "film"
          if not topic or fmt not in {"film", "story"}:
              raise SystemExit("Invalid production request")
          Path(os.environ["RUNNER_TEMP"], "isco-request.json").write_text(
              json.dumps({"topic": topic, "format": fmt}, ensure_ascii=False), encoding="utf-8"
          )
          PY

      - name: Verify free provider authentication
        env:
          GROQ_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/groq
          PIXABAY_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/pixabay
        run: |
          python - <<'PY'
          import os, requests
          from pathlib import Path
          groq = Path(os.environ["GROQ_API_KEY_FILE"]).read_text().strip()
          pixabay = Path(os.environ["PIXABAY_API_KEY_FILE"]).read_text().strip()
          a = requests.get("https://api.groq.com/openai/v1/models", headers={"Authorization": "Bearer " + groq}, timeout=30)
          if not a.ok: raise SystemExit(f"Groq auth failed: HTTP {a.status_code}")
          b = requests.get("https://pixabay.com/api/videos/", params={"key": pixabay, "q": "nature", "per_page": 3, "safesearch": "true"}, timeout=30)
          if not b.ok: raise SystemExit(f"Pixabay auth failed: HTTP {b.status_code}")
          print("Groq auth OK; Pixabay auth OK")
          PY

      - name: Produce with task-level brain and voice meshes
        working-directory: engine
        env:
          GEMINI_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/gemini
          GROQ_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/groq
          OPENROUTER_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/openrouter
          PEXELS_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/pexels
          PIXABAY_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/pixabay
          YOUTUBE_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/youtube
          REQUEST_FILE: ${{ runner.temp }}/isco-request.json
          PIPER_MODEL_PATH: ${{ runner.temp }}/piper-voices/ar_JO-kareem-medium.onnx
          GEMINI_CONTENT_MODEL: gemini-2.5-flash
          GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
          TRENDS_GEO: SA
          YOUTUBE_REGION: SA
          YOUTUBE_LANGUAGE: ar
          PYTHONPATH: ${{ github.workspace }}
        run: python ../scripts/run_v3_voice.py

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: isco-resilient-v4-diagnostics-${{ github.run_number }}
          path: |
            engine/output/*/quality-final.json
            engine/output/*/quality-precheck.json
            engine/output/*/plan.json
            engine/output/*/opportunities.json
            engine/output/*/research.json
          if-no-files-found: warn
          retention-days: 7

      - name: Final review and extract result
        if: success()
        working-directory: engine
        env:
          GEMINI_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/gemini
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('src').resolve()))
          from isco_video_agent.providers.gemini import json_text
          roots = sorted(Path('output').glob('*'), key=lambda p: p.stat().st_mtime, reverse=True)
          if not roots: raise SystemExit('No output directory')
          root = roots[0]
          final = root/'final.mp4'
          quality = root/'quality-final.json'
          if not final.exists() or not quality.exists(): raise SystemExit('Missing final deliverables')
          q = json.loads(quality.read_text(encoding='utf-8'))
          if q.get('status') != 'pass': raise SystemExit('Final quality report is not pass')
          key = Path(os.environ['GEMINI_API_KEY_FILE']).read_text().strip()
          plan = json.loads((root/'plan.json').read_text(encoding='utf-8'))
          verdict = json_text(key, 'Final editorial sanity check for Arabic YouTube video metadata. Return JSON with approved boolean and reason. Topic: '+str(plan.get('topic'))+' Titles: '+json.dumps(plan.get('title_options',[]), ensure_ascii=False), model='gemini-2.5-flash')
          if not verdict.get('approved'): raise SystemExit('Final editorial review blocked output')
          print('Final review PASS:', final)
          PY

      - name: Upload final video
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: isco-resilient-v4-video-${{ github.run_number }}
          path: |
            engine/output/*/final.mp4
            engine/output/*/quality-final.json
            engine/output/*/plan.json
          if-no-files-found: error
          retention-days: 7
