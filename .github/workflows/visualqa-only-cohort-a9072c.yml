name: Clean V2 Visual-QA-Only Cohort a9072c

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/visualqa-only-cohort-a9072c.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: visualqa-only-cohort-a9072c
  cancel-in-progress: false

jobs:
  visualqa:
    name: visualqa-${{ matrix.attempt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        attempt: [1, 2, 3, 4, 5]
    env:
      ISCO_RUNNER_SHA: a9072c99113caf0f4152bdbc4454e1a9f074d160
      ISCO_ENGINE_SHA: 3cbd689819e6b0e0b2ea9904d1998e24a5e2a293
      SOURCE_RUNNER_SHA: 4d6f1b6b4cca26988ddbba58c4882f3f4f85bf13
      SOURCE_ARTIFACT_ID: "10570908873"
      ISCO_APPROVED_BRIEF_SHA256: bcf8d3017ee8e18ee4808614c7c07731b0452a5ba6182e1183404f663078e129
      GEMINI_CONTENT_MODEL: gemini-3.7-flash
      PREQC_ROOT: ${{ github.workspace }}/.visualqa-preqc
      PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}

    steps:
      - name: Checkout exact Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a9072c99113caf0f4152bdbc4454e1a9f074d160
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Runner pin
        run: test "$(git rev-parse HEAD)" = "$ISCO_RUNNER_SHA"

      - name: Checkout frozen private Engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 3cbd689819e6b0e0b2ea9904d1998e24a5e2a293
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine pin
        run: test "$(git -C engine rev-parse HEAD)" = "$ISCO_ENGINE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install Visual QA runtime only
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y ffmpeg unzip
          python -m pip install --disable-pip-version-check -r engine/requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e engine

      - name: Restore frozen pre-QC artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$PREQC_ROOT"
          mkdir -p "$PREQC_ROOT"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" -o "$RUNNER_TEMP/preqc.zip"
          unzip -q "$RUNNER_TEMP/preqc.zip" -d "$PREQC_ROOT"

      - name: Verify frozen pre-QC identity
        run: |
          set -euo pipefail
          cd "$PREQC_ROOT"
          test "$(jq -r .approved_topic brief.json)" = "لماذا تفشل خطط إدارة الوقت في الحياة اليومية"
          test "$(jq -r .format brief.json)" = "film"
          test "$(jq -r .runner_sha run-manifest.json)" = "$SOURCE_RUNNER_SHA"
          test "$(jq -r .engine_sha run-manifest.json)" = "$ISCO_ENGINE_SHA"
          test "$(jq -r .approved_brief_sha256 run-manifest.json)" = "$ISCO_APPROVED_BRIEF_SHA256"
          test "$(jq -r '.sections | length' plan.json)" = "5"
          test "$(jq -r '.sections | length' script.json)" = "5"
          test "$(jq -r '.assets | length' rights-manifest.json)" = "5"
          test "$(jq -r '.stages[0:5] | map(.status) | unique | join(",")' run-manifest.json)" = "pass"
          {
            echo "994e03809132afdc76f41cfec5611093cd7561ce89ff518eebc41ba6bf5f895b  brief.json"
            echo "0b1611890b7dae692beb13de9ca542f0a41b949e55cfab19cf35f8ae50a6f7f4  plan.json"
            echo "a40d6135853b85e267a25bbf9867760412a8b01843462b60ebfeb1ec81efc805  script.json"
            echo "2d2d0fd3e2026f257d23d75dbda0fd1ad954914a3b600ed2813398bf22712e92  rights-manifest.json"
            echo "813d14b31491f8f7cef64d89d718d8453aa9ecc5f2d720a3a035b54cc0a27cc7  narration.wav"
            echo "3b83e21be7c26c471bfd854248367f24afd09965316d62a3f61d7004d2db25cc  visuals/visual-01.mp4"
            echo "ff0a1e3166913bc18f60e42b73d01999ed910604f386069a099ca9108ddf1657  visuals/visual-02.mp4"
            echo "7fdf813fa3debdc57d09a8214535d1da94dac410e0946627543626eb1388fe29  visuals/visual-03.mp4"
            echo "4c58bdaea388a5836f65333fcf100e4868b4e3d3f729527fc6b9699cd496d312  visuals/visual-04.mp4"
            echo "bf8aa370af8d004084c0c1146275ca8a778d88abacd6cdde0b1682af243da4c2  visuals/visual-05.mp4"
          } > "$RUNNER_TEMP/preqc.sha256"
          sha256sum -c "$RUNNER_TEMP/preqc.sha256"
          rm -rf visual-qa
          rm -f visual-audit.json visual-qa-budget.json final-cut-visual-qa.json visualqa-only-verdict.json visualqa-only-traceback.txt

      - name: Run Visual QA only
        env:
          ATTEMPT: ${{ matrix.attempt }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import traceback
          from pathlib import Path
          from clean_v2.visual_qa import CleanV2VisualQABlock, CleanV2VisualQAInfrastructure, run_final_cut_visual_qa

          root = Path(os.environ["PREQC_ROOT"])
          verdict_path = root / "visualqa-only-verdict.json"
          traceback_path = root / "visualqa-only-traceback.txt"
          plan = json.loads((root / "plan.json").read_text(encoding="utf-8"))
          script = json.loads((root / "script.json").read_text(encoding="utf-8"))
          rights = json.loads((root / "rights-manifest.json").read_text(encoding="utf-8"))["assets"]
          verdict = {
              "schema_version": 1,
              "attempt": int(os.environ["ATTEMPT"]),
              "runner_sha": os.environ["ISCO_RUNNER_SHA"],
              "engine_sha": os.environ["ISCO_ENGINE_SHA"],
              "source_runner_sha": os.environ["SOURCE_RUNNER_SHA"],
              "source_artifact_id": int(os.environ["SOURCE_ARTIFACT_ID"]),
              "topic": "لماذا تفشل خطط إدارة الوقت في الحياة اليومية",
              "stage": "final_cut_visual_qa",
          }
          try:
              report = run_final_cut_visual_qa(output_dir=root, plan=plan, script=script, rights=rights, fmt="film")
          except CleanV2VisualQAInfrastructure as exc:
              verdict.update(status="failure", classification="infrastructure", error_type=type(exc).__name__, error=str(exc))
              traceback_path.write_text(traceback.format_exc(), encoding="utf-8")
          except CleanV2VisualQABlock as exc:
              detail = str(exc)
              classification = "QC-block" if "selected_visual_not_final_cut_ready" in detail else "pre-QC"
              verdict.update(status="failure", classification=classification, error_type=type(exc).__name__, error=detail)
              traceback_path.write_text(traceback.format_exc(), encoding="utf-8")
          except Exception as exc:
              verdict.update(status="failure", classification="pre-QC", error_type=type(exc).__name__, error=str(exc))
              traceback_path.write_text(traceback.format_exc(), encoding="utf-8")
          else:
              verdict.update(
                  status="success",
                  classification="pass",
                  report_status=report.get("status"),
                  audited_selected_clip_count=report.get("audited_selected_clip_count"),
                  final_cut_readiness_target=report.get("final_cut_readiness_target"),
                  provider_attempts=report.get("provider_attempts"),
              )
          verdict_path.write_text(json.dumps(verdict, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(verdict, ensure_ascii=False, sort_keys=True))
          PY

      - name: Verify verdict contract
        run: |
          set -euo pipefail
          test -s "$PREQC_ROOT/visualqa-only-verdict.json"
          classification="$(jq -r .classification "$PREQC_ROOT/visualqa-only-verdict.json")"
          case "$classification" in
            pass|pre-QC|QC-block|infrastructure) ;;
            *) echo "invalid classification: $classification" >&2; exit 1 ;;
          esac
          if test "$(jq -r .status "$PREQC_ROOT/visualqa-only-verdict.json")" = "success"; then
            test "$(jq -r .status "$PREQC_ROOT/final-cut-visual-qa.json")" = "pass"
            test "$(jq -r 'length' "$PREQC_ROOT/visual-audit.json")" = "5"
            test "$(jq -r '[.[] | select(.is_selected == true and .status == "pass" and .final_cut_readiness == "ready")] | length' "$PREQC_ROOT/visual-audit.json")" = "5"
          fi

      - name: Upload Visual QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: visualqa-only-a9072c-${{ matrix.attempt }}
          path: |
            ${{ env.PREQC_ROOT }}/visualqa-only-verdict.json
            ${{ env.PREQC_ROOT }}/visualqa-only-traceback.txt
            ${{ env.PREQC_ROOT }}/visual-audit.json
            ${{ env.PREQC_ROOT }}/visual-qa-budget.json
            ${{ env.PREQC_ROOT }}/final-cut-visual-qa.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce cohort attempt result
        run: |
          set -euo pipefail
          test "$(jq -r .status "$PREQC_ROOT/visualqa-only-verdict.json")" = "success"
