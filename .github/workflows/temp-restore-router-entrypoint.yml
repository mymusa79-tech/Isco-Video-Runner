name: Temp Restore Router Entrypoint

on:
  pull_request:
    branches: ["main"]
    types: [synchronize]

permissions:
  contents: write

jobs:
  restore:
    if: github.head_ref == 'fix/planning-subtask-budget-scope'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/planning-subtask-budget-scope
          fetch-depth: 0
      - name: Restore preserved CLI entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/task_level_planner_router.py')
          text = path.read_text(encoding='utf-8')
          marker = '\n\ndef run() -> None:\n'
          if marker not in text:
              text = text.rstrip() + '''\n\n\ndef run() -> None:\n    install_router()\n    request = json.loads(Path(os.environ["REQUEST_FILE"]).read_text(encoding="utf-8"))\n    out = orchestrator.produce(\n        topic=request["topic"],\n        requested_format=request["format"],\n        dry_run=False,\n        do_research=True,\n    )\n    print(f"Production completed: {out.name}")\n\n\nif __name__ == "__main__":\n    run()\n'''
              path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/task_level_planner_router.py
      - name: Commit only preserved entrypoint and remove temp workflow
        run: |
          set -euo pipefail
          rm .github/workflows/temp-restore-router-entrypoint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/task_level_planner_router.py .github/workflows/temp-restore-router-entrypoint.yml
          git commit -m "fix: preserve planner router entrypoint"
          git push origin HEAD:fix/planning-subtask-budget-scope
