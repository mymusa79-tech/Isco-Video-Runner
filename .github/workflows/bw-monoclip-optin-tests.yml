name: BW Monoclip Opt-In - Offline Safety Tests

on:
  push:
    branches: [feature/bw-monoclip-optin-v1]
    paths:
      - clean_v2/production_package.py
      - clean_v2/owner_art.py
      - clean_v2/media.py
      - clean_v2/short_timed_text.py
      - scripts/test_bw_monoclip_optin.py
      - .github/workflows/bw-monoclip-optin-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bw-monoclip-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install local test dependencies only
        run: python -m pip install 'Pillow==12.3.0'
      - name: Compile all changed modules and tests
        run: python -m py_compile clean_v2/production_package.py clean_v2/owner_art.py clean_v2/media.py clean_v2/short_timed_text.py scripts/test_bw_monoclip_optin.py
      - name: Run BW contract and existing package regression tests (no network)
        run: python -m unittest scripts.test_bw_monoclip_optin scripts.test_production_package -v
