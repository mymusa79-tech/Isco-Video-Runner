name: TEMP Diagnose PR258 Telegram Memory

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run focused Telegram memory tests verbosely
        run: |
          set -euo pipefail
          python -m unittest scripts.test_telegram_control_active_ui scripts.test_telegram_production_workflow -v
