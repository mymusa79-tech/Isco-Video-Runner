name: Dispatch Production Once

on:
  push:
    branches:
      - ops/dispatch-perfect-start-once
    paths:
      - .github/workflows/dispatch-production-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production workflow once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body='{"ref":"main","inputs":{"topic":"وهم البداية المثالية","format":"film"}}'
          code=$(curl -sS -o "$RUNNER_TEMP/dispatch-response.txt" -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/produce-resilient-v4.yml/dispatches" \
            -d "$body")
          test "$code" = "204"
          echo "Production workflow_dispatch accepted (HTTP $code)."
