name: Inspect Canonical Production Dispatch

on:
  push:
    branches:
      - fix/run104-engine-candidate-certification

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Record latest canonical production dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow produce-resilient-v4.yml --event workflow_dispatch --branch main --limit 10 --json databaseId,status,conclusion,url,headSha,createdAt,event > .one-shot-production-dispatch-result.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .one-shot-production-dispatch-result.json
          git commit -m "chore: record production dispatch status"
          git push origin "HEAD:${GITHUB_REF_NAME}"
