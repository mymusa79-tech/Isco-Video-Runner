name: Verify Editorial Final Integration

on:
  push:
    branches: ["verify/editorial-room-stage5-9-final-current-main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  EDITORIAL_ENGINE_SHA: 10858bccc1d3a2c29a66f9c89029d6c6ae254b93

jobs:
  combined-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact Runner verifier candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate exact Engine SHA
        run: |
          set -euo pipefail
          [[ "$EDITORIAL_ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "runner=$GITHUB_SHA engine=$EDITORIAL_ENGINE_SHA"

      - name: Checkout exact private Engine candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ env.EDITORIAL_ENGINE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine checkout
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "$EDITORIAL_ENGINE_SHA"

      - name: Apply indentation-safe Stage 8 candidate
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply-editorial-stage8.py engine
          python -m py_compile \
            engine/src/isco_video_agent/editorial_learning.py \
            engine/src/isco_video_agent/learning.py \
            engine/src/isco_video_agent/final_critic.py \
            engine/src/isco_video_agent/production_pipeline.py \
            engine/tests/test_editorial_stage8.py
          cd engine
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install media and locked Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Dependency audit
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install pip-audit==2.10.1
          pip-audit --no-deps -r requirements-lock.txt
          python -m pip check

      - name: Focused Editorial Stage 5-8 contracts
        working-directory: engine
        env:
          ISCO_DEFER_YOUTUBE_ANALYTICS: "1"
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_editorial_room \
            tests.test_resilient_planner_persona_binding \
            tests.test_editorial_adapters \
            tests.test_editorial_stage6 \
            tests.test_editorial_stage7 \
            tests.test_editorial_stage8 \
            tests.test_repair_dossier \
            tests.test_short_quality_gate \
            tests.test_orchestrator_visual_selection_integration \
            tests.test_packaging_identity_integrity_p1 \
            tests.test_thumbnail_packaging_contract \
            tests.test_thumbnail_alternate_query_recovery \
            tests.test_thumbnail_candidate_board \
            tests.test_thumbnail_pixabay_fallback \
            tests.test_learning_and_critic \
            tests.test_learning_metrics_source \
            tests.test_final_critic_provenance_batch \
            tests.test_final_critic_selected_visuals \
            tests.test_gold_finalizer \
            tests.test_gold_shadow_phase2a -v

      - name: Human Editorial Intent and M7 compatibility
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest tests.test_human_editorial_intent -v

      - name: Full Engine regression
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Approved-Brief CLI contract matrix
        working-directory: engine
        run: |
          set -euo pipefail
          missing="$RUNNER_TEMP/isco-no-approved-brief.json"
          rm -f "$missing"
          ISCO_APPROVED_BRIEF_PATH="$missing" isco-video produce \
            --topic "لماذا تشعر أنك متأخر عن الجميع؟" --format auto --dry-run --no-research
          ISCO_APPROVED_BRIEF_PATH="$missing" isco-video produce \
            --format auto --dry-run --no-research
          isco-video produce --format auto --dry-run --no-research
          if isco-video produce --topic "لماذا تشعر أنك متأخر عن الجميع؟" \
            --format auto --dry-run --no-research; then
            echo 'ERROR: approved-brief mismatch unexpectedly passed' >&2
            exit 1
          fi

      - name: Stage 8 candidate scope and worktree sanity
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- state/history.json 2>/dev/null || true
          git diff --check
          mapfile -t changed < <(git status --porcelain --untracked-files=all | sed -E 's/^.. //')
          allowed=(src/isco_video_agent/editorial_learning.py src/isco_video_agent/learning.py src/isco_video_agent/final_critic.py src/isco_video_agent/production_pipeline.py tests/test_editorial_stage8.py)
          test "${#changed[@]}" -eq 5
          for path in "${changed[@]}"; do
            ok=false
            for want in "${allowed[@]}"; do [[ "$path" == "$want" ]] && ok=true; done
            $ok || { echo "ERROR: unexpected Stage 8 path: $path" >&2; exit 1; }
          done

      - name: Prepare verified Stage 8 artifact
        working-directory: engine
        run: |
          mkdir -p "$RUNNER_TEMP/stage8/src/isco_video_agent" "$RUNNER_TEMP/stage8/tests"
          cp src/isco_video_agent/editorial_learning.py src/isco_video_agent/learning.py src/isco_video_agent/final_critic.py src/isco_video_agent/production_pipeline.py "$RUNNER_TEMP/stage8/src/isco_video_agent/"
          cp tests/test_editorial_stage8.py "$RUNNER_TEMP/stage8/tests/"
          git diff > "$RUNNER_TEMP/stage8/stage8.patch"

      - name: Upload verified Stage 8 artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage8-verified-candidate-combined
          path: ${{ runner.temp }}/stage8
          retention-days: 1

      - name: Full Runner regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q

      - name: Runner diff and production isolation sanity
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD || git diff --check
          test -f .github/workflows/produce-resilient-v4.yml
          test -f .github/workflows/verify-editorial-final-integration.yml
          grep -q '860b61b0f99b285cc2917cba079e29bfa9e2c119' .github/workflows/produce-resilient-v4.yml
          test "$EDITORIAL_ENGINE_SHA" != '860b61b0f99b285cc2917cba079e29bfa9e2c119'
