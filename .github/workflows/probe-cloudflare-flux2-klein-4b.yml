name: Probe Cloudflare FLUX.2 Klein 4B

on:
  push:
    branches:
      - probe/flux2-klein-4b-isolated-20260924
    paths:
      - experiments/cloudflare_flux2_klein_probe.py
      - .github/workflows/probe-cloudflare-flux2-klein-4b.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate isolated probe secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "CLOUDFLARE_API_TOKEN missing" >&2; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "CLOUDFLARE_ACCOUNT_ID missing" >&2; exit 2; }

      - name: Run isolated FLUX.2 Klein 4B probe
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/cloudflare_flux2_klein_probe.py

      - name: Print manifest without image payloads
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/cloudflare-flux2-klein-4b/manifest.json ]; then
            cat artifacts/cloudflare-flux2-klein-4b/manifest.json
          fi

      - name: Upload five images and telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-flux2-klein-4b-probe
          path: artifacts/cloudflare-flux2-klein-4b/
          if-no-files-found: error
          retention-days: 7
