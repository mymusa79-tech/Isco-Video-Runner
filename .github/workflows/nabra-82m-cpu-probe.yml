name: Nabra 82M CPU Probe

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/probe_nabra_82m_cpu.py"
      - ".github/workflows/nabra-82m-cpu-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install system audio dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y espeak-ng ffmpeg libsndfile1

      - name: Install pinned Nabra runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            torch
          python -m pip install --disable-pip-version-check \
            soundfile huggingface_hub 'misaki[en]>=0.9.4' \
            'phonemizer-fork>=3.3.2' camel-tools
          python -m pip install --disable-pip-version-check \
            'kokoro @ git+https://github.com/Oddadmix/kokoro.git@df50e07df746aec0bd7a6f237752d7109ace0b3d'

      - name: Install official MSA diacritizer data and pinned Arabic G2P
        run: |
          set -euo pipefail
          camel_data -i disambig-mle-calima-msa-r13
          curl -fsSL \
            'https://gist.githubusercontent.com/Oddadmix/dc699f7942a9516ce29d4842c7aed756/raw/827b541c892a862f9ef3b44006a6e27b100d1bdd/arabic_g2p.py' \
            -o scripts/arabic_g2p.py
          test -s scripts/arabic_g2p.py

      - name: Run one bounded CPU synthesis
        run: |
          set -euo pipefail
          /usr/bin/time -v python scripts/probe_nabra_82m_cpu.py \
            --output probe_artifacts/nabra-82m-cpu

      - name: Show report
        if: always()
        run: |
          cat probe_artifacts/nabra-82m-cpu/report.json || true

      - name: Upload listening samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nabra-82m-cpu-probe
          path: probe_artifacts/nabra-82m-cpu/
          if-no-files-found: warn
          retention-days: 7
