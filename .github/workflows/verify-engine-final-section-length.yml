name: Verify Engine Final Section Length

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/verify-engine-final-section-length.yml"

permissions:
  contents: read

jobs:
  combined-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact private Engine candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 005bcd51fe224619cd14ba89d70ee025b3d3b00e
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact Engine checkout
        working-directory: engine
        env:
          ENGINE_SHA: 005bcd51fe224619cd14ba89d70ee025b3d3b00e
        run: test "$(git rev-parse HEAD)" = "$ENGINE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install locked Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Focused final section-length regressions
        working-directory: engine
        run: python -m unittest tests.test_repair_dossier tests.test_final_section_length_invariant -v

      - name: Dependency audit
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install pip-audit==2.10.1
          pip-audit --no-deps -r requirements-lock.txt

      - name: Full Engine suite
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Approved-Brief CLI contract matrix
        working-directory: engine
        run: |
          set -euo pipefail
          missing="$RUNNER_TEMP/isco-no-approved-brief.json"
          rm -f "$missing"
          ISCO_APPROVED_BRIEF_PATH="$missing" isco-video produce \
            --topic "لماذا تشعر أنك متأخر عن الجميع؟" --format auto --dry-run --no-research
          ISCO_APPROVED_BRIEF_PATH="$missing" isco-video produce \
            --format auto --dry-run --no-research
          isco-video produce --format auto --dry-run --no-research
          if isco-video produce --topic "لماذا تشعر أنك متأخر عن الجميع؟" \
            --format auto --dry-run --no-research; then
            echo 'ERROR: approved-brief mismatch unexpectedly passed' >&2
            exit 1
          fi

      - name: Full Runner regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q

      - name: Scope and syntax sanity
        working-directory: engine
        run: |
          set -euo pipefail
          python -m py_compile src/isco_video_agent/orchestrator.py src/isco_video_agent/repair_dossier.py tests/test_final_section_length_invariant.py tests/test_orchestrator_ledger_integration.py tests/test_orchestrator_visual_selection_integration.py
          git diff --check 549d1dc32cd57c4cccfefecf7f04e35b6f3e1b39...HEAD
          actual="$(git diff --name-only 549d1dc32cd57c4cccfefecf7f04e35b6f3e1b39...HEAD | sort)"
          expected="$(printf '%s\n' 'src/isco_video_agent/orchestrator.py' 'src/isco_video_agent/repair_dossier.py' 'tests/test_final_section_length_invariant.py' 'tests/test_orchestrator_ledger_integration.py' 'tests/test_orchestrator_visual_selection_integration.py' | sort)"
          test "$actual" = "$expected"
