name: Export P0-1 Fixture Isolation

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  export-fixtures:
    if: ${{ github.head_ref == 'verify/p0-1-engine-5dbbad' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact private Engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: dcb7584842cf05c89a63e35d9b9761b6585802bb
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine checkout
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "dcb7584842cf05c89a63e35d9b9761b6585802bb"

      - name: Apply exact verified fixture isolation
        working-directory: engine
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_existing(path: Path, old: str, new: str, label: str) -> int:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f"{label}: expected at least one match, found 0")
              path.write_text(text.replace(old, new), encoding="utf-8")
              print(f"{label}: isolated {count} fixture path(s)")
              return count

          ledger = Path("tests/test_orchestrator_ledger_integration.py")
          ledger_count = replace_existing(
              ledger,
              '''             patch.object(tone_quality, "json_text", side_effect=_fake_tone_quality_pass):''',
              '''             patch.object(tone_quality, "json_text", side_effect=_fake_tone_quality_pass), \\
             patch.object(orchestrator, "_final_film_section_structure_issues", return_value=[]):''',
              "ledger fixture isolation",
          )
          if ledger_count != 2:
              raise SystemExit(f"ledger fixture isolation: expected exactly 2 known paths, found {ledger_count}")

          visual = Path("tests/test_orchestrator_visual_selection_integration.py")
          visual_count = replace_existing(
              visual,
              '''            patch.object(orchestrator, "_verify_resilient_router_installed", lambda: None),''',
              '''            patch.object(orchestrator, "_verify_resilient_router_installed", lambda: None),
            # This fixture deliberately constructs 1-2 section Film plans to isolate
            # visual selection. P0-1's final 110-170 word gate is tested separately
            # with canonical section-shape regressions and must not pre-empt this test.
            patch.object(orchestrator, "_final_film_section_structure_issues", return_value=[]),''',
              "visual fixture isolation",
          )
          if visual_count != 1:
              raise SystemExit(f"visual fixture isolation: expected exactly 1 known path, found {visual_count}")

          text = ledger.read_text(encoding="utf-8")
          needle = '    def _produce(self, **kwargs):\n        os.environ["GEMINI_API_KEY"] = "fake-test-key"'
          replacement = (
              '    def _produce(self, **kwargs):\n'
              '        # These Batch-G ledger tests exercise accounting with planner fallback\n'
              '        # output, not final Film structure; P0-1 is covered by its dedicated\n'
              '        # production-invariant regression. Isolate that unrelated gate here.\n'
              '        os.environ["GEMINI_API_KEY"] = "fake-test-key"'
          )
          if text.count(needle) != 1:
              raise SystemExit("ledger rationale insertion: expected one match")
          ledger.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Upload exact modified fixture files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p0-1-verified-fixtures-${{ github.run_id }}
          path: |
            engine/tests/test_orchestrator_ledger_integration.py
            engine/tests/test_orchestrator_visual_selection_integration.py
          if-no-files-found: error
          retention-days: 1
