name: Pin V4 Agent PR19 once

# Armed after merge so the workflow already exists on default branch before its trigger push.
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pin-v4-agent-pr19-once.yml"

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Pin V4 and trigger exactly one production push
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          OLD_SHA: 5e9974a05aad5f9e4762a3d86f58fe1b29f02310
          NEW_SHA: afa2f08416ac2c0f85edb1b73f1ed17518990a93
        run: |
          set -euo pipefail
          test -n "$PRIVATE_SOURCE_TOKEN"
          python - <<'PY'
          import os
          from pathlib import Path

          old = os.environ["OLD_SHA"]
          new = os.environ["NEW_SHA"]
          workflow = Path(".github/workflows/produce-resilient-v4.yml")
          text = workflow.read_text(encoding="utf-8")
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"Expected exactly 2 old V4 pin occurrences, found {count}")
          text = text.replace(old, new)
          if text.count(new) != 2:
              raise SystemExit("New V4 pin was not written exactly twice")
          workflow.write_text(text, encoding="utf-8")

          trigger = Path("scripts/run_v3_voice.py")
          marker = f"# Production trigger only: Agent pin {new}"
          source = trigger.read_text(encoding="utf-8")
          if marker not in source:
              trigger.write_text(source.rstrip() + "\n\n" + marker + "\n", encoding="utf-8")
          PY
          git rm .github/workflows/pin-v4-agent-pr19-once.yml
          git diff --check
          git add .github/workflows/produce-resilient-v4.yml scripts/run_v3_voice.py
          git config user.name "isco-v4-pin-bot"
          git config user.email "isco-v4-pin-bot@users.noreply.github.com"
          git commit -m "ci: pin V4 to Agent PR #19 merge"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PRIVATE_SOURCE_TOKEN" | base64 -w0)" push https://github.com/${GITHUB_REPOSITORY}.git HEAD:main
