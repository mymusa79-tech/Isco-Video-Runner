name: Verify M11 Live Integration

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  combined-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENGINE_SHA: 64ab711bc904e9581c3cc6c8280d1321ae738eb1
    steps:
      - name: Checkout Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout exact private Engine M11 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ env.ENGINE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact Engine checkout
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "$ENGINE_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Install locked Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Dependency audit
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install pip-audit==2.10.1
          pip-audit --no-deps -r requirements-lock.txt
      - name: Focused M11 Engine tests
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest tests.test_cinematic_v2_m11_cc0 -v
          python -m unittest tests.test_cinematic_m11_runtime -v
          python -m unittest tests.test_cinematic_m11_visual_review -v
          python -m unittest tests.test_m11_rights_integration -v
          python -m unittest tests.test_m11_archive_policy_contract -v
          python -m unittest tests.test_human_editorial_intent -v
          python -m unittest tests.test_editorial_room_director_m7_binding_current_main -v
      - name: Real M11 FFmpeg renderer smoke
        working-directory: engine
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m11-smoke"
          ffmpeg -y -f lavfi -i color=size=1200x800:duration=1 -frames:v 1 "$RUNNER_TEMP/m11-smoke/input.png" >/dev/null 2>&1
          M11_SMOKE="$RUNNER_TEMP/m11-smoke" python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from isco_video_agent.cinematic_m11_runtime import _render_archive_clip
          root = Path(os.environ["M11_SMOKE"])
          dest = _render_archive_clip(root / "input.png", root / "archive.mp4", 4.2, fps=30)
          data = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_streams", "-show_format", "-of", "json", str(dest)
          ], text=True))
          video = [x for x in data["streams"] if x.get("codec_type") == "video"]
          audio = [x for x in data["streams"] if x.get("codec_type") == "audio"]
          duration = float(data["format"]["duration"])
          assert len(video) == 1 and not audio
          assert video[0]["width"] == 1920 and video[0]["height"] == 1080
          assert 4.0 <= duration <= 4.4, duration
          PY
      - name: Full Engine suite
        working-directory: engine
        run: |
          set -o pipefail
          python -m unittest discover -s tests -q 2>&1 | tee "$RUNNER_TEMP/m11-engine-unittest.log"
      - name: Focused Runner M11 HEI M7 Security tests
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m unittest scripts.test_m11_live_binding -v
          python -m unittest scripts.test_human_editorial_intent_binding -v
          python -m unittest scripts.test_m7_live_binding -v
      - name: Full Runner regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' | sort | sed -e 's#/#.#g' -e 's#\.py$##')
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q
      - name: M11 contract sanity
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          grep -F 'with _m11_archive_scope(' scripts/m7_live_binding.py >/dev/null
          grep -F 'runtime.apply_m11_overrides(' scripts/m7_live_binding.py >/dev/null
          grep -F 'kind="M11_ARCHIVE_REVIEW"' scripts/m7_live_binding.py >/dev/null
          grep -F 'priority=Priority.P2' scripts/m7_live_binding.py >/dev/null
          grep -F 'AttemptOutcome.CONTENT_BLOCKED' scripts/m7_live_binding.py >/dev/null
          grep -F '_M11_REVIEW_MODULE' scripts/m7_live_binding.py >/dev/null
          grep -F 'install_security_v1_live_binding()' scripts/m7_live_binding.py >/dev/null
          test -f engine/src/isco_video_agent/cinematic_m11_runtime.py
          test -f engine/src/isco_video_agent/cinematic_m11_visual_review.py
          test -f engine/config/m11_archive_policy.yaml
          grep -F 'visual_review_required' engine/src/isco_video_agent/cinematic_m11_runtime.py >/dev/null
          grep -F 'CC0-1.0-EXPLICIT' engine/src/isco_video_agent/rights.py >/dev/null
          grep -F 'archive_and_public_domain_art:' engine/config/visual_bible.yaml >/dev/null
      - name: Upload Engine unittest diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m11-live-engine-unittest
          path: ${{ runner.temp }}/m11-engine-unittest.log
          if-no-files-found: warn
          retention-days: 1
