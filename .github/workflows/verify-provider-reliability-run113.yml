name: Verify Provider Reliability Run 113

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  candidate-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 1

      - name: Checkout exact merged Agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 9cab677a74f80489ff36665f98fc343a3b61eee2
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact merged Agent
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "9cab677a74f80489ff36665f98fc343a3b61eee2"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install locked Agent runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Focused OpenRouter provider contract
        working-directory: engine
        run: python -m unittest tests.test_openrouter_provider -v

      - name: Full Agent regression
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Focused Run 113 Router regression
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: python -m unittest scripts.test_provider_failure scripts.test_provider_reliability_run113 -v

      - name: Full Runner regression
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q

      - name: Diff sanity
        run: git diff --check origin/main...HEAD || git diff --check

      - name: Finalize canonical production pin and remove temporary verifier
        if: github.event_name == 'pull_request' && github.head_ref == 'provider-reliability-run113'
        env:
          OLD_ENGINE_SHA: d5f2bec5a129ed0e1d922fab802314e1861b9b98
          NEW_ENGINE_SHA: 9cab677a74f80489ff36665f98fc343a3b61eee2
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path('.github/workflows/produce-resilient-v4.yml')
          text = path.read_text(encoding='utf-8')
          old = os.environ['OLD_ENGINE_SHA']
          new = os.environ['NEW_ENGINE_SHA']
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'Expected exactly 3 canonical Engine pin occurrences, found {count}')
          text = text.replace(old, new)
          if old in text or text.count(new) != 3:
              raise SystemExit('Canonical Engine pin replacement failed closed')
          path.write_text(text, encoding='utf-8')

          verifier = Path('.github/workflows/verify-provider-reliability-run113.yml')
          if not verifier.is_file():
              raise SystemExit('Temporary verifier missing before cleanup')
          verifier.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/produce-resilient-v4.yml .github/workflows/verify-provider-reliability-run113.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "No finalization delta" >&2; exit 1; }
          git commit -m "fix: pin production to certified provider reliability Agent"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
