name: Verify Provider Reliability Run 113

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  candidate-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact Agent candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: c7c77ebc991047e225933bf1753613f9ccb6bf98
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Agent candidate
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "c7c77ebc991047e225933bf1753613f9ccb6bf98"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install locked Agent runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Focused OpenRouter provider contract
        working-directory: engine
        run: python -m unittest tests.test_openrouter_provider -v

      - name: Full Agent regression
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Focused Run 113 Router regression
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: python -m unittest scripts.test_provider_failure scripts.test_provider_reliability_run113 -v

      - name: Full Runner regression
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q

      - name: Diff sanity
        run: git diff --check origin/main...HEAD || git diff --check
