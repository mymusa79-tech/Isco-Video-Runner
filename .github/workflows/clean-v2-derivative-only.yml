name: Clean V2 Derivative Only

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing successful Long or Podcast release with frozen derivative source
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: clean-v2-derivative-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install local media tools only
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y ffmpeg fontconfig
          bash scripts/install_cairo_bold.sh
          python -m pip install --disable-pip-version-check 'Pillow==12.3.0'
      - name: Restore accepted original and retry only the derivative
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^clean-v2-final-(long|podcast)-[A-Za-z0-9_-]+$ ]]
          out="$RUNNER_TEMP/derivative-only"
          mkdir -p "$out"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern final.mp4 --pattern derivative-source.zip --dir "$out"
          python -m scripts.retry_clean_v2_derivative --output "$out" --release-tag "$RELEASE_TAG"
      - name: Save extraction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: derivative-only-${{ github.run_id }}
          path: ${{ runner.temp }}/derivative-only/*short*.json
          if-no-files-found: ignore
          retention-days: 7
