name: Voice Flash-Lite A/B Sample (one-off)

on:
  workflow_dispatch:
  push:
    branches: ["claude/voice-flash-lite-ab-sample-20260928"]

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate alternate-voice samples on gemini-3.8-flash-lite-tts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          import wave

          API_KEY = os.environ["GEMINI_API_KEY"]
          MODEL = "gemini-3.8-flash-lite-tts"
          # Candidate replacements for the primary/Charon role on the lite
          # model only - Orus stays fixed as the questioner for a like-for-like
          # comparison. Characteristics per Google's own voice list:
          #   Umbriel: easy-going and calm
          #   Iapetus: clear and articulate
          #   Schedar: even and balanced
          #   Algenib: gravelly texture
          CANDIDATE_VOICES = ["Umbriel", "Iapetus", "Schedar", "Algenib"]

          QUESTIONER_STYLE = (
              "Natural Modern Standard Arabic listener voice. Brief, curious and personally invested, as if voicing "
              "the listener's own question or objection; warm and spontaneous, never interviewer-like, theatrical or performative."
          )
          ANSWER_STYLE = (
              "Same established channel voice. Calm, close and thoughtful, answering one listener directly; "
              "simple-deep conversational delivery, unhurried but not sleepy, never announcer or lecture tone."
          )
          QUESTION = "ليش أرجع لنفس النقطة كل مرة رغم إني أعرف الحل؟"
          ANSWER = (
              "لأن المشكلة مو في معرفتك، المشكلة إن أول خطوة تبدو أكبر من قدرتك اللحظية عليها. "
              "قسّمها لخطوة أصغر من اللي تتخيلها، وابدأ فيها الآن قبل ما يهدأ الحماس."
          )

          content = [
              {
                  "type": "text",
                  "text": QUESTION,
                  "annotations": [
                      {"type": "speech_metadata", "speaker": "A", "style": QUESTIONER_STYLE}
                  ],
              },
              {
                  "type": "text",
                  "text": ANSWER,
                  "annotations": [
                      {"type": "speech_metadata", "speaker": "B", "style": ANSWER_STYLE}
                  ],
              },
          ]

          for voice in CANDIDATE_VOICES:
              speech_config = {
                  "mode": "conversational",
                  "speakers": [
                      {"speaker": "A", "voice": "Orus"},
                      {"speaker": "B", "voice": voice},
                  ],
              }
              payload = {
                  "model": MODEL,
                  "input": [{"type": "user_input", "content": content}],
                  "response_format": {"type": "audio"},
                  "generation_config": {"speech_config": speech_config},
              }
              request = urllib.request.Request(
                  "https://generativelanguage.googleapis.com/v1beta/interactions",
                  data=json.dumps(payload, ensure_ascii=False, separators=(",", ":")).encode("utf-8"),
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": API_KEY,
                      "User-Agent": "Isco-Clean-V2-AB-Sample/1",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      body = response.read(64 * 1024 * 1024)
              except urllib.error.HTTPError as exc:
                  print(f"{voice}: HTTP {exc.code} - {exc.read().decode('utf-8', 'replace')}")
                  continue

              decoded = json.loads(body.decode("utf-8"))
              encoded = ""
              for step in reversed(decoded.get("steps") or []):
                  for block in reversed(step.get("content") or []):
                      if block.get("type") == "audio" and isinstance(block.get("data"), str):
                          encoded = block["data"]
                          break
                  if encoded:
                      break
              if not encoded:
                  print(f"{voice}: no audio payload returned")
                  continue

              audio = base64.b64decode(encoded, validate=True)
              out_name = f"sample-lite-{voice}.wav"
              with open(out_name, "wb") as fh:
                  fh.write(audio)
              with wave.open(out_name, "rb") as wav:
                  duration = wav.getnframes() / float(wav.getframerate())
              print(f"{voice}: wrote {out_name} ({len(audio)} bytes, {duration:.1f}s)")
          PY

      - name: Upload samples
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: voice-flash-lite-ab-sample
          path: sample-*.wav
          if-no-files-found: warn
          retention-days: 3

      - name: Commit samples to this branch
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(sample-*.wav)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no samples produced, nothing to commit"
            exit 0
          fi
          mkdir -p voice-ab-sample
          mv sample-*.wav voice-ab-sample/
          git config user.name "voice-ab-sample-bot"
          git config user.email "actions@users.noreply.github.com"
          git add voice-ab-sample/
          git commit -m "test: add flash vs flash-lite TTS A/B samples [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
