name: Verify Final Production Closure PR

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact Runner PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify canonical V4 and resolve Engine SHA
        id: contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path('.github/workflows/produce-resilient-v4.yml').read_text(encoding='utf-8')
          checkout = re.findall(r'^\s+ref:\s+([0-9a-f]{40})\s*$', text, flags=re.MULTILINE)
          env_pin = re.findall(r'^\s+ISCO_ENGINE_SHA:\s+([0-9a-f]{40})\s*$', text, flags=re.MULTILINE)
          if checkout != ['245ef9a52fcf2500b058d08b2c9d48d92e746951']:
              raise SystemExit(f'Unexpected Engine checkout pin: {checkout}')
          if env_pin != checkout:
              raise SystemExit(f'ISCO_ENGINE_SHA mismatch: {env_pin} != {checkout}')
          required = [
              'workflow_dispatch:',
              'engine/production/approved_brief.json',
              'approved_by_user',
              'approved_topic',
              'ISCO_APPROVED_BRIEF_PATH:',
          ]
          forbidden = ['inputs.topic', 'inputs.format', 'TOPIC_INPUT', 'FORMAT_INPUT', 'EVENT_NAME', 'push:']
          missing = [x for x in required if x not in text]
          present = [x for x in forbidden if x in text]
          if missing or present:
              raise SystemExit(f'Canonical V4 contract failed: missing={missing} forbidden_present={present}')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as fh:
              fh.write(f'engine_sha={checkout[0]}\n')
          print('Canonical V4 contract PASS')
          PY

      - name: Verify historical production entry points are retired
        run: |
          set -euo pipefail
          for path in \
            .github/workflows/engine-ci-proxy-latest-query.yml \
            .github/workflows/engine-ci-proxy.yml \
            .github/workflows/final-v4-pin-and-run.yml \
            .github/workflows/integration-latest-v4-query.yml \
            .github/workflows/produce-resilient-v2.yml \
            .github/workflows/produce-resilient-v3.yml \
            .github/workflows/produce-resilient.yml \
            .github/workflows/produce.yml \
            .github/workflows/run36-oneoff-dispatch.yml \
            .github/workflows/run54-pin-updater.yml \
            .github/workflows/run54-production-validation.yml
          do
            test ! -e "$path" || { echo "Retired workflow still present: $path" >&2; exit 1; }
          done
          test -f .github/workflows/produce-resilient-v4.yml
          test -f .github/workflows/verify-private-engine.yml

      - name: Checkout exact final Engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ steps.contract.outputs.engine_sha }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine checkout
        working-directory: engine
        env:
          ENGINE_SHA: ${{ steps.contract.outputs.engine_sha }}
        run: test "$(git rev-parse HEAD)" = "$ENGINE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked Engine runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Dependency audit
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install pip-audit==2.10.1
          pip-audit --no-deps -r requirements-lock.txt

      - name: Full Engine suite
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Approved-Brief regressions and CLI matrix
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_security \
            tests.test_workflows \
            tests.test_approved_brief_orchestration_contract \
            -q
          missing="$RUNNER_TEMP/isco-no-approved-brief.json"
          rm -f "$missing"
          ISCO_APPROVED_BRIEF_PATH="$missing" isco-video produce \
            --topic "لماذا تشعر أنك متأخر عن الجميع؟" --format auto --dry-run --no-research
          ISCO_APPROVED_BRIEF_PATH="$missing" isco-video produce \
            --format auto --dry-run --no-research
          isco-video produce --format auto --dry-run --no-research
          if isco-video produce --topic "لماذا تشعر أنك متأخر عن الجميع؟" --format auto --dry-run --no-research; then
            echo 'ERROR: approved-brief mismatch unexpectedly passed' >&2
            exit 1
          fi

      - name: Full Runner regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q

      - name: Diff sanity
        run: git diff --check HEAD^
