name: TEMP Verify Contextual CTA Live

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENGINE_SHA: 64ab711bc904e9581c3cc6c8280d1321ae738eb1
    steps:
      - name: Checkout Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Checkout exact Engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ env.ENGINE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact Engine
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "$ENGINE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.12"}
      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Install locked Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Focused CTA and cinematic chain tests
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          (cd engine && python -m unittest tests.test_cinematic_cta -v)
          python -m unittest scripts.test_cta_live_binding -v
          python -m unittest scripts.test_runtime_closure -v
          python -m unittest scripts.test_m10_live_binding -v
          python -m unittest scripts.test_m9_live_binding -v
          python -m unittest scripts.test_m8_live_binding -v
      - name: Real Arabic CTA overlay smoke with audio preservation
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf /tmp/cta-smoke && mkdir -p /tmp/cta-smoke
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i color=c=0x202020:s=1920x1080:r=30:d=4 \
            -f lavfi -i sine=frequency=440:sample_rate=48000:duration=4 \
            -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/cta-smoke/src.mp4
          python - <<'PY'
          from pathlib import Path
          from types import SimpleNamespace
          from isco_video_agent.cinematic_cta import bind_contextual_cta, schedule_cta, render_cta_overlay
          root=Path('/tmp/cta-smoke')
          plan=SimpleNamespace(format='film', cta='اشترك لتكمل الرحلة معنا', sections=[SimpleNamespace(id=f's{i}', narration=f'نص {i}') for i in range(1,7)])
          bound=bind_contextual_cta(plan)
          schedule=schedule_cta(bound,[f's{i}' for i in range(1,7)],[40.0]*6)
          assert schedule is not None and schedule.start_seconds >= 30.5
          out=render_cta_overlay(root/'src.mp4',bound,schedule,root/'dest.mp4')
          assert out.is_file() and out.stat().st_size > 1000
          PY
          test "$(ffprobe -v error -select_streams v -show_entries stream=codec_type -of csv=p=0 /tmp/cta-smoke/dest.mp4 | wc -l)" -ge 1
          test "$(ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 /tmp/cta-smoke/dest.mp4 | wc -l)" -ge 1
      - name: Wiring and policy sanity
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          grep -F 'install_cta_live_binding()' scripts/runtime_closure.py >/dev/null
          grep -F 'bind_contextual_cta(plan)' scripts/cta_live_binding.py >/dev/null
          grep -F 'production_blocking=False' scripts/cta_live_binding.py >/dev/null
          grep -F 'moment_no_cta' engine/src/isco_video_agent/cinematic_cta.py >/dev/null
