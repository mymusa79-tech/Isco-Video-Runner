name: Retention M5 Verification

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify-m5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 1a55f6dbb6978d745aecd510c9bb8df625a9afe7
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install locked Engine runtime
        run: |
          set -euo pipefail
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: M5 through M1 targeted tests
        run: |
          set -euo pipefail
          cd engine
          python -m unittest discover -s tests -p 'test_youtube_retention_m5_*.py' -v
          python -m unittest discover -s tests -p 'test_youtube_retention_m4_*.py' -v
          python -m unittest discover -s tests -p 'test_youtube_retention_m3_*.py' -v
          python -m unittest discover -s tests -p 'test_youtube_retention_m2_*.py' -v
          python -m unittest discover -s tests -p 'test_youtube_retention_m1_*.py' -v

      - name: Full Engine Python suite
        run: |
          set -euo pipefail
          cd engine
          python -m unittest discover -s tests -q

      - name: Materialize YouTube Analytics OAuth only
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_CLIENT_ID"
          test -n "$YOUTUBE_CLIENT_SECRET"
          test -n "$YOUTUBE_REFRESH_TOKEN"
          umask 077
          mkdir -p "$RUNNER_TEMP/m5-youtube"
          printf '%s' "$YOUTUBE_CLIENT_ID" > "$RUNNER_TEMP/m5-youtube/client-id"
          printf '%s' "$YOUTUBE_CLIENT_SECRET" > "$RUNNER_TEMP/m5-youtube/client-secret"
          printf '%s' "$YOUTUBE_REFRESH_TOKEN" > "$RUNNER_TEMP/m5-youtube/refresh-token"

      - name: Live read-only YouTube Reporting discovery
        env:
          YOUTUBE_CLIENT_ID_FILE: ${{ runner.temp }}/m5-youtube/client-id
          YOUTUBE_CLIENT_SECRET_FILE: ${{ runner.temp }}/m5-youtube/client-secret
          YOUTUBE_REFRESH_TOKEN_FILE: ${{ runner.temp }}/m5-youtube/refresh-token
        run: |
          set -euo pipefail
          mkdir -p verification-m5
          PYTHONPATH="engine/src" python engine/scripts/probe_reach_reporting.py > verification-m5/discovery.json
          echo "Sanitized Reporting discovery result:"
          cat verification-m5/discovery.json
          ENGINE_SHA="$(git -C engine rev-parse HEAD)" python - <<'PY'
          import json, os
          from pathlib import Path
          discovery = json.loads(Path('verification-m5/discovery.json').read_text())
          assert os.environ['ENGINE_SHA'] == '1a55f6dbb6978d745aecd510c9bb8df625a9afe7'
          assert discovery['mutation_performed'] is False
          assert discovery['production_influence'] == 'none'
          assert discovery['report_type'] == 'channel_reach_basic_a1'
          assert discovery['status'] in {
              'job_missing','job_waiting_for_report','report_ready',
              'reporting_api_unavailable','report_type_unavailable','jobs_unavailable',
          }
          evidence = {
              'schema_version': 1,
              'mode': 'M5_reach_ctr_context_diagnostic',
              'engine_sha': os.environ['ENGINE_SHA'],
              'report_type': discovery['report_type'],
              'report_type_available': discovery['report_type_available'],
              'discovery_status': discovery['status'],
              'existing_job': discovery['existing_job'],
              'latest_report_available': discovery['latest_report_available'],
              'requires_job_creation': discovery['requires_job_creation'],
              'mutation_performed': discovery['mutation_performed'],
              'metric_names': ['video_thumbnail_impressions','video_thumbnail_impressions_ctr'],
              'ad_impressions_substitution': False,
              'context_only': True,
              'cross_metric_causal_inference': 'not_permitted',
              'production_influence': 'none',
              'ai_calls': 0,
              'production_run_started': False,
          }
          Path('verification-m5/retention-m5-live.json').write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n')
          print(json.dumps(evidence, sort_keys=True))
          PY
          test ! -e "$RUNNER_TEMP/m5-youtube/client-id"
          test ! -e "$RUNNER_TEMP/m5-youtube/client-secret"
          test ! -e "$RUNNER_TEMP/m5-youtube/refresh-token"

      - name: Verify unrelated provider credentials absent
        run: |
          set -euo pipefail
          test -z "${GEMINI_API_KEY:-}"
          test -z "${GROQ_API_KEY:-}"
          test -z "${OPENROUTER_API_KEY:-}"
          test -z "${PEXELS_API_KEY:-}"
          test -z "${PIXABAY_API_KEY:-}"

      - name: Upload sanitized M5 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: retention-m5-verification
          path: verification-m5/
          if-no-files-found: error
          retention-days: 1
