name: Verify Mistral Clean V2 Fallbacks Live Integration

on:
  push:
    branches:
      - feat/mistral-visual-qa-fallback
    paths:
      - .github/workflows/probe-mistral.yml
      - clean_v2/visual_qa.py
      - clean_v2/mistral_executor.py
      - clean_v2/providers.py
      - clean_v2/pipeline.py
      - clean_v2/text_audit.py
      - scripts/canonical_visual_evidence_v1.py
      - scripts/mistral_visual_qa_fallback.py
      - scripts/run181_vision_mesh_closure.py
      - scripts/test_canonical_visual_evidence_v1.py
      - scripts/test_mistral_visual_qa_fallback.py
      - scripts/test_mistral_clean_v2_executor.py

permissions:
  actions: read
  contents: read

jobs:
  live-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ENGINE_SHA: 3cbd689819e6b0e0b2ea9904d1998e24a5e2a293
      SOURCE_RUN_ID: "35461535282"
      SOURCE_ARTIFACT_ID: "10590525061"
      PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}

    steps:
      - name: Checkout exact feature candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Runner checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Checkout frozen private Engine source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ env.ENGINE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install frozen Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Run focused Mistral unit and routing tests
        run: |
          set -euo pipefail
          python -m unittest \
            scripts.test_mistral_visual_qa_fallback \
            scripts.test_mistral_clean_v2_executor \
            scripts.test_canonical_visual_evidence_v1 \
            scripts.test_run181_vision_provider_health_mesh \
            -v

      - name: Download exact Run 114 canonical evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/clean-v2-114-1.zip"
          evidence="$RUNNER_TEMP/clean-v2-114-1"
          mkdir -p "$evidence"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            > "$archive"
          unzip -q "$archive" -d "$evidence"
          test -s "$evidence/visuals/visual-01.mp4"
          test -s "$evidence/visual-evidence/01-s1/frame-01.jpg"
          test -s "$evidence/visual-evidence/01-s1/frame-02.jpg"
          test -s "$evidence/visual-evidence/01-s1/frame-03.jpg"
          test -s "$evidence/brief.json"
          test -s "$evidence/plan.json"
          test -s "$evidence/script.json"
          test -s "$evidence/narrative-identity.json"
          printf '%s  %s\n' \
            'c92269f4de1f5ea9b83169f7fc050d0849e6b8eaa367f835c72782c9964c8026' "$evidence/visual-evidence/01-s1/frame-01.jpg" \
            '439e005974a0a3557946e88222c9067c48f76f51218e068b223fe49b79dfce37' "$evidence/visual-evidence/01-s1/frame-02.jpg" \
            'b2c4e49afd434bc8b3b21e5baaaf8ba9895e33fe02e7b9c6fc4aaefdca31b824' "$evidence/visual-evidence/01-s1/frame-03.jpg" \
            | sha256sum -c -
          echo "MISTRAL_INTEGRATION_SOURCE=$evidence" >> "$GITHUB_ENV"

      - name: Send real canonical Visual QA request to Mistral
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          RESULT_PATH: ${{ runner.temp }}/mistral-visual-qa-live-result.json
        run: |
          set -euo pipefail
          test -n "${MISTRAL_API_KEY:-}"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from scripts import canonical_visual_evidence_v1 as canonical
          from scripts import mistral_visual_qa_fallback as mistral
          from scripts import vision_stage_contract_v2 as contract


          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()


          root = Path(os.environ["MISTRAL_INTEGRATION_SOURCE"])
          plan = json.loads((root / "plan.json").read_text(encoding="utf-8"))
          script = json.loads((root / "script.json").read_text(encoding="utf-8"))
          manifest = json.loads(
              (root / "visual-evidence/01-s1/evidence.json").read_text(encoding="utf-8")
          )
          section = next(item for item in plan["sections"] if item["id"] == "s1")
          narration = next(item for item in script["sections"] if item["id"] == "s1")[
              "narration"
          ]
          prompt = canonical.canonical_visual_prompt(
              narration_context=narration,
              intended_visual=section["visual_query_en"],
          )
          prompt_hash = hashlib.sha256(prompt.encode("utf-8")).hexdigest()
          if prompt_hash != manifest["prompt_hash"]:
              raise SystemExit("canonical prompt hash drift")

          source = root / "visuals/visual-01.mp4"
          frames = tuple(
              root / f"visual-evidence/01-s1/frame-{index:02d}.jpg"
              for index in range(1, 4)
          )
          frame_hashes = tuple(sha256(path) for path in frames)
          if list(frame_hashes) != manifest["frame_sha256"]:
              raise SystemExit("canonical frame hash drift")
          if sha256(source) != manifest["source_sha256"]:
              raise SystemExit("canonical source hash drift")

          evidence = canonical.CanonicalVisualEvidence(
              source_path=source,
              source_sha256=manifest["source_sha256"],
              frame_paths=frames,
              frame_sha256=frame_hashes,
              prompt=prompt,
              prompt_hash=prompt_hash,
          )
          mistral.reset_mistral_visual_qa_telemetry()
          audit = mistral._mistral_visual_call(
              source,
              narration_context=narration,
              intended_visual=section["visual_query_en"],
              canonical_visual_evidence=evidence,
          )
          error = contract._schema_error(
              audit,
              resolved_model=mistral.MISTRAL_VISION_MODEL,
          )
          if error is not None:
              raise error
          telemetry = mistral.get_mistral_visual_qa_telemetry()
          if len(telemetry) != 1:
              raise SystemExit(f"expected one Mistral telemetry entry, got {len(telemetry)}")

          result = {
              "schema_version": 1,
              "status": "pass",
              "runner_sha": os.environ["GITHUB_SHA"],
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_artifact_id": int(os.environ["SOURCE_ARTIFACT_ID"]),
              "source_section": "s1",
              "model": mistral.MISTRAL_VISION_MODEL,
              "canonical_prompt_hash": prompt_hash,
              "canonical_frame_sha256": list(frame_hashes),
              "canonical_frame_count": len(frames),
              "schema_exact": set(audit) == set(contract.VISUAL_AUDIT_SCHEMA["properties"]),
              "normalizer_status": audit["status"],
              "audit": audit,
              "telemetry": telemetry[0],
          }
          if not result["schema_exact"]:
              raise SystemExit("normalized Mistral result is not the exact Visual Audit schema")
          Path(os.environ["RESULT_PATH"]).write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(
              json.dumps(
                  {
                      "integration": "SUCCESS",
                      "model": result["model"],
                      "canonical_frame_count": result["canonical_frame_count"],
                      "schema_exact": result["schema_exact"],
                      "normalizer_status": result["normalizer_status"],
                      "rate_limit_headers": result["telemetry"]["rate_limit_headers"],
                      "usage": result["telemetry"]["usage"],
                  },
                  ensure_ascii=False,
                  sort_keys=True,
              )
          )
          PY

      - name: Send real Planning and full Script requests to Mistral
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          RESULT_PATH: ${{ runner.temp }}/mistral-planning-script-live-result.json
        run: |
          set -euo pipefail
          test -n "${MISTRAL_API_KEY:-}"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from clean_v2 import mistral_executor
          from clean_v2 import providers
          from clean_v2.contracts import validate_plan, validate_script
          from clean_v2.pipeline import _planning_prompt, _script_prompt


          root = Path(os.environ["MISTRAL_INTEGRATION_SOURCE"])
          brief = json.loads((root / "brief.json").read_text(encoding="utf-8"))
          locked_plan = json.loads((root / "plan.json").read_text(encoding="utf-8"))
          identity = json.loads(
              (root / "narrative-identity.json").read_text(encoding="utf-8")
          )

          route_order = []

          def technical_failure(name):
              def fail(_prompt, _max_tokens):
                  route_order.append(name)
                  raise providers.ProviderWireFailure(name + "_injected_technical_failure")
              return fail

          def live_mistral(prompt, max_tokens, stage):
              route_order.append("mistral")
              return providers._mistral_call(prompt, max_tokens, stage)

          router = providers.ProviderRouter(
              (
                  providers.ProviderAdapter("gemini", technical_failure("gemini")),
                  providers.ProviderAdapter("groq", technical_failure("groq")),
                  providers.ProviderAdapter(
                      "openrouter", technical_failure("openrouter")
                  ),
                  providers.ProviderAdapter(
                      "mistral",
                      live_mistral,
                      stages=frozenset({"planning", "script"}),
                      accepts_stage=True,
                  ),
              )
          )
          mistral_executor.reset_mistral_executor_telemetry()

          planning_prompt = _planning_prompt(brief)
          generated_plan = router.route(
              stage="planning",
              prompt=planning_prompt,
              max_tokens=3000,
              validator=lambda value: validate_plan(value, brief),
          )

          script_prompt = _script_prompt(
              brief,
              locked_plan,
              transitions=identity.get("transitions"),
          )
          generated_script = router.route(
              stage="script",
              prompt=script_prompt,
              max_tokens=7500,
              validator=lambda value: validate_script(value, locked_plan),
          )
          expected_order = [
              "gemini", "groq", "openrouter", "mistral",
              "gemini", "groq", "openrouter", "mistral",
          ]
          if route_order != expected_order:
              raise SystemExit(f"unexpected Planning/Script route: {route_order}")

          telemetry = mistral_executor.get_mistral_executor_telemetry()
          if [item["task_kind"] for item in telemetry] != ["planning", "script"]:
              raise SystemExit("missing exact Planning/Script Mistral telemetry")
          narration = "\n\n".join(
              item["narration"] for item in generated_script["sections"]
          )
          script_words = len(narration.split())
          script_utf8_bytes = len(narration.encode("utf-8"))
          if script_utf8_bytes < 2000:
              raise SystemExit(
                  "live Script response was not a full long-form payload "
                  f"(utf8_bytes={script_utf8_bytes})"
              )

          result = {
              "schema_version": 1,
              "status": "pass",
              "runner_sha": os.environ["GITHUB_SHA"],
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_artifact_id": int(os.environ["SOURCE_ARTIFACT_ID"]),
              "model": mistral_executor.MISTRAL_EXECUTOR_MODEL,
              "role": "executor",
              "route_order": route_order,
              "upstream_failures": "injected technical failures; Mistral wire is live",
              "planning": {
                  "prompt_sha256": hashlib.sha256(
                      planning_prompt.encode("utf-8")
                  ).hexdigest(),
                  "prompt_utf8_bytes": len(planning_prompt.encode("utf-8")),
                  "section_count": len(generated_plan["sections"]),
                  "telemetry": telemetry[0],
              },
              "script": {
                  "prompt_sha256": hashlib.sha256(
                      script_prompt.encode("utf-8")
                  ).hexdigest(),
                  "prompt_utf8_bytes": len(script_prompt.encode("utf-8")),
                  "section_count": len(generated_script["sections"]),
                  "narration_words": script_words,
                  "narration_utf8_bytes": script_utf8_bytes,
                  "telemetry": telemetry[1],
              },
          }
          Path(os.environ["RESULT_PATH"]).write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(
              json.dumps(
                  {
                      "integration": "SUCCESS",
                      "model": result["model"],
                      "route_order": route_order,
                      "planning_usage": telemetry[0]["usage"],
                      "script_usage": telemetry[1]["usage"],
                      "script_words": script_words,
                      "script_utf8_bytes": script_utf8_bytes,
                      "rate_limit_headers": telemetry[1]["rate_limit_headers"],
                  },
                  ensure_ascii=False,
                  sort_keys=True,
              )
          )
          PY

      - name: Send real full Text Audit request to Mistral
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          RESULT_PATH: ${{ runner.temp }}/mistral-text-audit-live-result.json
        run: |
          set -euo pipefail
          test -n "${MISTRAL_API_KEY:-}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from unittest import mock

          from clean_v2 import mistral_executor
          from clean_v2 import text_audit
          from clean_v2.pipeline import _build_production_plan_for_audit
          from isco_video_agent import factuality


          root = Path(os.environ["MISTRAL_INTEGRATION_SOURCE"])
          brief = json.loads((root / "brief.json").read_text(encoding="utf-8"))
          plan = json.loads((root / "plan.json").read_text(encoding="utf-8"))
          script = json.loads((root / "script.json").read_text(encoding="utf-8"))
          production_plan = _build_production_plan_for_audit(
              brief=brief,
              plan=plan,
              script=script,
          )
          calls = []

          def technical_failure(name):
              def fail(*_args, **_kwargs):
                  calls.append(name)
                  raise RuntimeError(name + " injected technical capacity failure")
              return fail

          real_mistral = text_audit._mistral_factuality_call

          def observed_mistral(prompt):
              calls.append("mistral")
              return real_mistral(prompt)

          diagnostics = {}
          mistral_executor.reset_mistral_executor_telemetry()
          with mock.patch.object(
              factuality, "json_text", side_effect=technical_failure("gemini")
          ), mock.patch.object(
              factuality.groq,
              "json_text",
              side_effect=technical_failure("groq"),
          ), mock.patch.object(
              factuality.openrouter,
              "json_text",
              side_effect=technical_failure("openrouter"),
          ), mock.patch.object(
              text_audit,
              "_mistral_factuality_call",
              side_effect=observed_mistral,
          ):
              audit = text_audit.audit_plan_with_mistral(
                  "injected-unused-gemini-key",
                  production_plan,
                  brief.get("research_pack") or [],
                  "gemini-3.7-flash",
                  diagnostics=diagnostics,
              )

          expected_order = ["gemini", "groq", "openrouter", "mistral"]
          if calls != expected_order:
              raise SystemExit(f"unexpected Text Audit route: {calls}")
          if diagnostics.get("provider") != "mistral":
              raise SystemExit("Mistral was not the Text Audit winner")
          if diagnostics.get("validation") != "valid":
              raise SystemExit(
                  f"Mistral Text Audit failed Engine validation: {diagnostics}"
              )
          if audit.get("status") not in {"pass", "block"}:
              raise SystemExit("Mistral Text Audit has invalid semantic status")
          telemetry = mistral_executor.get_mistral_executor_telemetry()
          if len(telemetry) != 1 or telemetry[0].get("task_kind") != "text_audit":
              raise SystemExit("missing exact Text Audit Mistral telemetry")

          narration = "\n\n".join(item["narration"] for item in script["sections"])
          result = {
              "schema_version": 1,
              "status": "pass",
              "semantic_verdict": audit["status"],
              "runner_sha": os.environ["GITHUB_SHA"],
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_artifact_id": int(os.environ["SOURCE_ARTIFACT_ID"]),
              "model": mistral_executor.MISTRAL_EXECUTOR_MODEL,
              "role": "executor",
              "route_order": calls,
              "upstream_failures": "injected technical failures; Mistral wire is live",
              "audited_section_count": len(script["sections"]),
              "audited_narration_words": len(narration.split()),
              "audited_narration_utf8_bytes": len(narration.encode("utf-8")),
              "schema_exact": set(diagnostics["raw_result"])
              == set(text_audit.TEXT_AUDIT_SCHEMA["properties"]),
              "normalized_audit": audit,
              "attempts": diagnostics["attempts"],
              "telemetry": telemetry[0],
          }
          if not result["schema_exact"]:
              raise SystemExit("Mistral Text Audit did not match the full contract")
          Path(os.environ["RESULT_PATH"]).write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(
              json.dumps(
                  {
                      "integration": "SUCCESS",
                      "model": result["model"],
                      "semantic_verdict": result["semantic_verdict"],
                      "route_order": calls,
                      "schema_exact": result["schema_exact"],
                      "audited_narration_words": result[
                          "audited_narration_words"
                      ],
                      "rate_limit_headers": telemetry[0]["rate_limit_headers"],
                      "usage": telemetry[0]["usage"],
                  },
                  ensure_ascii=False,
                  sort_keys=True,
              )
          )
          PY

      - name: Calculate actual combined TPM and RPM headroom
        env:
          VISUAL_RESULT: ${{ runner.temp }}/mistral-visual-qa-live-result.json
          CONTENT_RESULT: ${{ runner.temp }}/mistral-planning-script-live-result.json
          AUDIT_RESULT: ${{ runner.temp }}/mistral-text-audit-live-result.json
          CAPACITY_RESULT: ${{ runner.temp }}/mistral-capacity-analysis.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path


          visual = json.loads(Path(os.environ["VISUAL_RESULT"]).read_text(encoding="utf-8"))
          content = json.loads(Path(os.environ["CONTENT_RESULT"]).read_text(encoding="utf-8"))
          audit = json.loads(Path(os.environ["AUDIT_RESULT"]).read_text(encoding="utf-8"))

          telemetry = {
              "visual_qa": visual["telemetry"],
              "planning": content["planning"]["telemetry"],
              "script": content["script"]["telemetry"],
              "text_audit": audit["telemetry"],
          }

          def total_tokens(entry):
              usage = entry.get("usage")
              if not isinstance(usage, dict):
                  return None
              value = usage.get("total_tokens")
              try:
                  return int(value)
              except (TypeError, ValueError):
                  return None

          actual_tokens = {
              name: total_tokens(entry) for name, entry in telemetry.items()
          }
          limit_values = []
          for entry in telemetry.values():
              raw = (entry.get("rate_limit_headers") or {}).get(
                  "x-ratelimit-limit-tokens-minute"
              )
              try:
                  limit_values.append(int(raw))
              except (TypeError, ValueError):
                  pass
          tpm_limit = min(limit_values) if limit_values else None
          rpm_values = []
          for entry in telemetry.values():
              raw = (entry.get("rate_limit_headers") or {}).get(
                  "x-ratelimit-limit-req-minute"
              )
              try:
                  rpm_values.append(int(raw))
              except (TypeError, ValueError):
                  pass
          rpm_limit = min(rpm_values) if rpm_values else None
          visual_tokens = actual_tokens["visual_qa"]
          script_tokens = actual_tokens["script"]
          dual_tokens = (
              visual_tokens + script_tokens
              if visual_tokens is not None and script_tokens is not None
              else None
          )
          five_visuals_plus_script = (
              5 * visual_tokens + script_tokens
              if visual_tokens is not None and script_tokens is not None
              else None
          )
          all_values = list(actual_tokens.values())
          full_fallback_attempt = (
              actual_tokens["planning"]
              + actual_tokens["script"]
              + actual_tokens["text_audit"]
              + 5 * actual_tokens["visual_qa"]
              if all(value is not None for value in all_values)
              else None
          )

          def headroom(tokens):
              if tokens is None or tpm_limit is None:
                  return None
              return {
                  "tokens": tokens,
                  "remaining_tokens": tpm_limit - tokens,
                  "percent_of_tpm": round(100.0 * tokens / tpm_limit, 4),
                  "headroom_multiple": round(tpm_limit / tokens, 2) if tokens else None,
              }

          analysis = {
              "schema_version": 1,
              "status": "measured" if all_values and all(
                  value is not None for value in all_values
              ) else "usage_incomplete",
              "runner_sha": os.environ["GITHUB_SHA"],
              "model": "ministral-14b-2512",
              "actual_usage_total_tokens": actual_tokens,
              "actual_rate_limit_headers": {
                  name: entry.get("rate_limit_headers") or {}
                  for name, entry in telemetry.items()
              },
              "tpm_limit_from_response_headers": tpm_limit,
              "dual_visual_qa_plus_script": headroom(dual_tokens),
              "five_sections_visual_qa_plus_script_same_minute": headroom(
                  five_visuals_plus_script
              ),
              "full_fallback_attempt_planning_script_text_audit_five_visuals": headroom(
                  full_fallback_attempt
              ),
              "request_rate_scenarios": {
                  "dual_visual_qa_plus_script_requests": 2,
                  "full_fallback_attempt_requests": 8,
                  "rpm_limit_from_response_headers": rpm_limit,
              },
              "inference_policy": (
                  "Use response usage first; null means Mistral did not expose enough "
                  "data and no token estimate was substituted."
              ),
          }
          Path(os.environ["CAPACITY_RESULT"]).write_text(
              json.dumps(analysis, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(analysis, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload live integration evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mistral-clean-v2-live-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/mistral-visual-qa-live-result.json
            ${{ runner.temp }}/mistral-planning-script-live-result.json
            ${{ runner.temp }}/mistral-text-audit-live-result.json
            ${{ runner.temp }}/mistral-capacity-analysis.json
          if-no-files-found: error
          retention-days: 30
