name: Verify P1-8 Exact Combined Regression

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-combined-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 25c5871369a1621c62805f05295c67f567e704b5
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Runner checkout
        run: test "$(git rev-parse HEAD)" = "25c5871369a1621c62805f05295c67f567e704b5"

      - name: Checkout exact private Engine candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 3b47adad72350284a74788eee3333b19a5b1f3ee
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine checkout
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "3b47adad72350284a74788eee3333b19a5b1f3ee"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install locked Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: P1-8 focused Engine regression
        working-directory: engine
        run: python -m unittest tests.test_text_audit_run_scoped_circuit -q

      - name: Full Engine suite
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: P1-8 Runner scope contract
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("scripts/run_v3_voice.py")
          tree = ast.parse(path.read_text(encoding="utf-8"))

          scope_nodes = []
          gold_calls = []
          for node in ast.walk(tree):
              if isinstance(node, ast.With):
                  for item in node.items:
                      call = item.context_expr
                      if isinstance(call, ast.Call) and isinstance(call.func, ast.Name) and call.func.id == "text_audit_circuit_scope":
                          scope_nodes.append(node)
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id == "run_gold_enforce_phase4":
                  gold_calls.append(node)

          if len(scope_nodes) != 1:
              raise SystemExit(f"expected exactly one text_audit_circuit_scope, found {len(scope_nodes)}")
          if len(gold_calls) != 1:
              raise SystemExit(f"expected exactly one run_gold_enforce_phase4 call, found {len(gold_calls)}")

          scope = scope_nodes[0]
          nested_calls = []
          for node in ast.walk(scope):
              if isinstance(node, ast.Call):
                  if isinstance(node.func, ast.Attribute):
                      nested_calls.append(f"{getattr(node.func.value, 'id', '?')}.{node.func.attr}")
                  elif isinstance(node.func, ast.Name):
                      nested_calls.append(node.func.id)

          if "orchestrator.produce" not in nested_calls:
              raise SystemExit("orchestrator.produce is not inside text_audit_circuit_scope")
          if "run_gold_enforce_phase4" in nested_calls:
              raise SystemExit("Gold Phase 4 must remain outside text_audit_circuit_scope")
          if gold_calls[0].lineno <= getattr(scope, "end_lineno", scope.lineno):
              raise SystemExit("Gold Phase 4 must execute after text_audit_circuit_scope exits")

          print("P1-8 scope contract PASS: core audits scoped; Gold Phase 4 remains independent")
          PY

      - name: Full Runner regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q

      - name: Exact candidate sanity
        run: |
          set -euo pipefail
          test -f scripts/run_v3_voice.py
          git diff --check 9018f665a6551e4742c1b416366a43eb34f1602b..25c5871369a1621c62805f05295c67f567e704b5 || git show --check --oneline --no-patch 25c5871369a1621c62805f05295c67f567e704b5
