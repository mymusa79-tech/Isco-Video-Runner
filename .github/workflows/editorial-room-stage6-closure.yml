name: Editorial Room Stage 6 Closure

on:
  push:
    branches: ["verify/editorial-room-stage5-9-current-main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  close-stage6:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Runner verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Engine editorial branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: feature/editorial-room-stage5-9-current-main
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: true
          fetch-depth: 0

      - name: Apply Stage 6 enforcement and fixture-isolation patch
        working-directory: engine
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          orchestrator = Path("src/isco_video_agent/orchestrator.py")
          text = orchestrator.read_text(encoding="utf-8")

          write_anchor = '    _write_json(out / "repair-dossier.json", {\n'
          if text.count(write_anchor) != 1:
              raise SystemExit(f"repair-dossier write anchor count={text.count(write_anchor)}")
          final_editorial = (
              '    final_editorial = (\n'
              '        repair_outcome.dossier_after.editorial\n'
              '        if repair_outcome is not None and repair_outcome.dossier_after is not None\n'
              '        else dossier.editorial\n'
              '    )\n'
          )
          text = text.replace(write_anchor, final_editorial + write_anchor, 1)

          status_anchor = '        "repair_status": repair_outcome.status if repair_outcome is not None else "not_attempted_no_gemini_key",\n'
          if text.count(status_anchor) != 1:
              raise SystemExit(f"repair status anchor count={text.count(status_anchor)}")
          status_fields = (
              status_anchor
              + '        "editorial_status_initial": dossier.editorial.status,\n'
              + '        "editorial_status_final": final_editorial.status,\n'
              + '        "editorial_issues_final": list(final_editorial.issues),\n'
          )
          text = text.replace(status_anchor, status_fields, 1)

          novelty_anchor = '    if novelty and not dry_run:\n'
          if text.count(novelty_anchor) != 1:
              raise SystemExit(f"novelty gate anchor count={text.count(novelty_anchor)}")
          editorial_gate = (
              '    if final_editorial.status == "block" and not dry_run:\n'
              '        details = "; ".join(final_editorial.issues)\n'
              '        raise RuntimeError(\n'
              '            "Editorial Room gate blocked real production after the single RepairDossier repair: " + details\n'
              '        )\n'
          )
          text = text.replace(novelty_anchor, editorial_gate + novelty_anchor, 1)
          orchestrator.write_text(text, encoding="utf-8")

          ledger_test = Path("tests/test_orchestrator_ledger_integration.py")
          text = ledger_test.read_text(encoding="utf-8")
          outputs_anchor = '        self._outputs: list = []\n'
          if text.count(outputs_anchor) != 1:
              raise SystemExit(f"ledger outputs anchor count={text.count(outputs_anchor)}")
          isolation = (
              '        # Ledger tests intentionally exercise legacy offline planner fallback,\n'
              '        # not Editorial Room. Isolate Stage 6 so accounting assertions do not\n'
              '        # manufacture an unrelated editorial repair.\n'
              '        self._editorial_patch = patch.object(\n'
              '            tone_quality,\n'
              '            "_long_editorial_review",\n'
              '            return_value={"passed": True, "reasons": [], "structural_flags": []},\n'
              '        )\n'
              '        self._editorial_patch.start()\n'
          )
          text = text.replace(outputs_anchor, isolation + outputs_anchor, 1)

          env_stop_anchor = '        self._env_patch.stop()\n'
          if text.count(env_stop_anchor) != 1:
              raise SystemExit(f"ledger teardown anchor count={text.count(env_stop_anchor)}")
          text = text.replace(env_stop_anchor, '        self._editorial_patch.stop()\n' + env_stop_anchor, 1)
          ledger_test.write_text(text, encoding="utf-8")
          PY
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/isco_video_agent/orchestrator.py tests/test_orchestrator_ledger_integration.py | sort)"
          test "$changed" = "$expected" || { echo "Unexpected patch scope:"; printf '%s\n' "$changed"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Focused Stage 6 regression
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_editorial_stage6 \
            tests.test_editorial_room \
            tests.test_repair_dossier \
            tests.test_short_quality_gate \
            tests.test_tone_quality \
            tests.test_p0c_migration_contracts \
            tests.test_orchestrator_ledger_integration -v

      - name: Full Engine regression
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Final diff review
        working-directory: engine
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/isco_video_agent/orchestrator.py tests/test_orchestrator_ledger_integration.py | sort)"
          test "$changed" = "$expected"

      - name: Commit and push Stage 6 closure
        working-directory: engine
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/isco_video_agent/orchestrator.py tests/test_orchestrator_ledger_integration.py
          git commit -m "feat(editorial): enforce Stage 6 final review gate"
          git push origin HEAD:feature/editorial-room-stage5-9-current-main
