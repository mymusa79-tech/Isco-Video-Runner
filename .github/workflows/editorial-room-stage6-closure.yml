name: Editorial Room Stage 6 Closure

on:
  push:
    branches: ["verify/editorial-room-stage5-9-current-main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  close-stage6:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Runner verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout Engine editorial branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: feature/editorial-room-stage5-9-current-main
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 0

      - name: Normalize temporary Engine CI scaffolding
        working-directory: engine
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f .github/workflows/editorial-room-stage6-engine-closure.yml

      - name: Apply exact Stage 6 closure patch
        working-directory: engine
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path("src/isco_video_agent/orchestrator.py")
          s = p.read_text(encoding="utf-8")
          a = '    _write_json(out / "repair-dossier.json", {\n'
          if s.count(a) != 1:
              raise SystemExit(f"repair-dossier anchor count={s.count(a)}")
          s = s.replace(a, (
              '    final_editorial = (\n'
              '        repair_outcome.dossier_after.editorial\n'
              '        if repair_outcome is not None and repair_outcome.dossier_after is not None\n'
              '        else dossier.editorial\n'
              '    )\n' + a
          ), 1)
          a = '        "repair_status": repair_outcome.status if repair_outcome is not None else "not_attempted_no_gemini_key",\n'
          if s.count(a) != 1:
              raise SystemExit(f"repair-status anchor count={s.count(a)}")
          s = s.replace(a, a
              + '        "editorial_status_initial": dossier.editorial.status,\n'
              + '        "editorial_status_final": final_editorial.status,\n'
              + '        "editorial_issues_final": list(final_editorial.issues),\n', 1)
          a = '    if novelty and not dry_run:\n'
          if s.count(a) != 1:
              raise SystemExit(f"novelty anchor count={s.count(a)}")
          s = s.replace(a, (
              '    if final_editorial.status == "block" and not dry_run:\n'
              '        details = "; ".join(final_editorial.issues)\n'
              '        raise RuntimeError(\n'
              '            "Editorial Room gate blocked real production after the single RepairDossier repair: " + details\n'
              '        )\n' + a
          ), 1)
          p.write_text(s, encoding="utf-8")

          p = Path("tests/test_orchestrator_ledger_integration.py")
          s = p.read_text(encoding="utf-8")
          a = '        self._outputs: list = []\n'
          if s.count(a) != 1:
              raise SystemExit(f"ledger setUp anchor count={s.count(a)}")
          s = s.replace(a, (
              '        # Ledger tests exercise legacy offline planner fallback, not Editorial Room.\n'
              '        self._editorial_patch = patch.object(\n'
              '            tone_quality, "_long_editorial_review",\n'
              '            return_value={"passed": True, "reasons": [], "structural_flags": []},\n'
              '        )\n'
              '        self._editorial_patch.start()\n' + a
          ), 1)
          a = '        self._env_patch.stop()\n'
          if s.count(a) != 1:
              raise SystemExit(f"ledger tearDown anchor count={s.count(a)}")
          s = s.replace(a, '        self._editorial_patch.stop()\n' + a, 1)
          p.write_text(s, encoding="utf-8")
          PY
          git diff --check

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Focused Stage 6 regression
        working-directory: engine
        run: |
          python -m unittest tests.test_editorial_stage6 tests.test_editorial_room tests.test_repair_dossier tests.test_short_quality_gate tests.test_tone_quality tests.test_p0c_migration_contracts tests.test_orchestrator_ledger_integration -v

      - name: Full Engine regression
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Final Stage 6 diff review
        working-directory: engine
        run: |
          set -euo pipefail
          git diff --check
          if git status --porcelain --untracked-files=no | grep -q 'state/history.json'; then
            git checkout -- state/history.json
          fi
          changed="$(git diff --name-only -- src/isco_video_agent/orchestrator.py tests/test_orchestrator_ledger_integration.py | sort)"
          expected="$(printf '%s\n' src/isco_video_agent/orchestrator.py tests/test_orchestrator_ledger_integration.py | sort)"
          test "$changed" = "$expected" || { printf 'Unexpected Stage 6 code diff:\n%s\n' "$changed"; exit 1; }

      - name: Prepare verified closure artifact
        working-directory: engine
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/stage6-verified"
          mkdir -p "$root/src/isco_video_agent" "$root/tests"
          cp src/isco_video_agent/orchestrator.py "$root/src/isco_video_agent/orchestrator.py"
          cp tests/test_orchestrator_ledger_integration.py "$root/tests/test_orchestrator_ledger_integration.py"
          git diff -- src/isco_video_agent/orchestrator.py tests/test_orchestrator_ledger_integration.py > "$root/stage6.patch"
          test -s "$root/stage6.patch"

      - name: Upload verified Stage 6 closure artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage6-verified-closure
          path: ${{ runner.temp }}/stage6-verified
          if-no-files-found: error
          retention-days: 1
