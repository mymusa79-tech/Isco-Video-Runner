name: Patch visual failure memory transport

on:
  push:
    branches:
      - fix/visual-family-closure-run228
    paths:
      - .github/workflows/_patch-visual-failure-memory-transport.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/visual-family-closure-run228
          persist-credentials: true
          fetch-depth: 1

      - name: Patch canonical V4 workflow exactly once
        run: |
          set -euo pipefail
          python scripts/_patch_visual_failure_transport.py
          git config user.name "isco-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/produce-resilient-v4.yml .github/workflows/_patch-visual-failure-memory-transport.yml scripts/_patch_visual_failure_transport.py
          git diff --cached --check
          git diff --cached --quiet && { echo "No patch delta" >&2; exit 1; }
          git commit -m "Wire failed-run visual learning state transport"
          git push origin HEAD:fix/visual-family-closure-run228
