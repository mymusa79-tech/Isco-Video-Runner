name: Retention M6 Verification

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify-m6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 9f46fb54fe459772dc28d029abd8c2cfcfa9a799
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install locked Engine runtime
        run: |
          set -euo pipefail
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: M6 through M1 targeted tests
        run: |
          set -euo pipefail
          cd engine
          python -m unittest discover -s tests -p 'test_youtube_retention_m6_*.py' -v
          python -m unittest discover -s tests -p 'test_youtube_retention_m5_*.py' -v
          python -m unittest discover -s tests -p 'test_youtube_retention_m4_*.py' -v
          python -m unittest discover -s tests -p 'test_youtube_retention_m3_*.py' -v
          python -m unittest discover -s tests -p 'test_youtube_retention_m2_*.py' -v
          python -m unittest discover -s tests -p 'test_youtube_retention_m1_*.py' -v

      - name: Full Engine Python suite
        run: |
          set -euo pipefail
          cd engine
          python -m unittest discover -s tests -q

      - name: Operational M6 registry verification
        run: |
          set -euo pipefail
          rm -rf verification-m6
          mkdir -p verification-m6
          cat > verification-m6/spec.json <<'JSON'
          {
            "name": "m6-verification-opening-length",
            "hypothesis": "A shorter opening may retain more viewers through 30 seconds.",
            "format": "film",
            "content_style": "agent_produced",
            "variable": "opening_length",
            "primary_metric": "first_30_seconds_retention_percent",
            "variants": [
              {"id": "control", "label": "Current opening", "value": "18s", "is_control": true},
              {"id": "treatment", "label": "Short opening", "value": "12s", "is_control": false}
            ],
            "minimum_samples_per_variant": 4
          }
          JSON
          PYTHONPATH="engine/src" python engine/scripts/register_retention_experiment.py \
            --spec verification-m6/spec.json \
            --output verification-m6/experiment.json \
            > verification-m6/register-first.json
          EXP_BEFORE="$(sha256sum verification-m6/experiment.json | awk '{print $1}')"
          PYTHONPATH="engine/src" python engine/scripts/register_retention_experiment.py \
            --spec verification-m6/spec.json \
            --output verification-m6/experiment.json \
            > verification-m6/register-second.json
          EXP_AFTER="$(sha256sum verification-m6/experiment.json | awk '{print $1}')"
          test "$EXP_BEFORE" = "$EXP_AFTER"
          ENGINE_SHA="$(git -C engine rev-parse HEAD)" EXP_SHA="$EXP_BEFORE" PYTHONPATH="engine/src" python - <<'PY'
          import json, os
          from pathlib import Path
          from isco_video_agent.retention_experiments import append_verified_outcome, analyze_experiment

          assert os.environ['ENGINE_SHA'] == '9f46fb54fe459772dc28d029abd8c2cfcfa9a799'
          path = Path('verification-m6/experiment.json')
          first = json.loads(Path('verification-m6/register-first.json').read_text())
          second = json.loads(Path('verification-m6/register-second.json').read_text())
          assert first['created'] is True
          assert second['created'] is False
          assert first['experiment_id'] == second['experiment_id']
          doc = json.loads(path.read_text())
          assert doc['definition_locked'] is True
          assert doc['spec']['assignment_mode'] == 'external_or_manual_only'
          assert doc['spec']['causal_claims'] == 'not_permitted'
          assert doc['production_influence'] == 'none'
          assert doc['outcomes'] == []
          underpowered = analyze_experiment(doc)
          assert underpowered['status'] == 'insufficient_sample'
          assert underpowered['treatment_minus_control'] is None
          for i, value in enumerate((40.0, 42.0, 38.0, 40.0)):
              append_verified_outcome(
                  path,
                  video_id=f'synthetic-control-{i}',
                  variant_id='control',
                  metric_value=value,
                  production_id=f'synthetic-prod-c-{i}',
                  binding_source='m6_synthetic_verification_only',
                  evidence_grade='strong_observational',
              )
          for i, value in enumerate((45.0, 47.0, 43.0, 45.0)):
              append_verified_outcome(
                  path,
                  video_id=f'synthetic-treatment-{i}',
                  variant_id='treatment',
                  metric_value=value,
                  production_id=f'synthetic-prod-t-{i}',
                  binding_source='m6_synthetic_verification_only',
                  evidence_grade='strong_observational',
              )
          final_doc = json.loads(path.read_text())
          analysis = final_doc['analysis']
          assert analysis['status'] == 'descriptive_ready'
          assert analysis['counts'] == {'control': 4, 'treatment': 4}
          assert analysis['treatment_minus_control'] == 5.0
          assert analysis['causal_claims'] == 'not_permitted'
          assert analysis['statistical_significance_claim'] == 'not_permitted'
          assert analysis['production_action'] == 'none'
          evidence = {
              'schema_version': 1,
              'mode': 'M6_experiment_registry_final',
              'engine_sha': os.environ['ENGINE_SHA'],
              'experiment_id': final_doc['experiment_id'],
              'definition_locked': final_doc['definition_locked'],
              'assignment_mode': final_doc['spec']['assignment_mode'],
              'minimum_samples_per_variant': final_doc['spec']['minimum_samples_per_variant'],
              'synthetic_outcomes_only': True,
              'real_production_outcomes_used': False,
              'descriptive_gate_status': analysis['status'],
              'descriptive_counts': analysis['counts'],
              'descriptive_delta_test_value': analysis['treatment_minus_control'],
              'causal_claims': analysis['causal_claims'],
              'statistical_significance_claim': analysis['statistical_significance_claim'],
              'production_action': analysis['production_action'],
              'production_influence': 'none',
              'ai_calls': 0,
              'production_run_started': False
          }
          Path('verification-m6/retention-m6-live.json').write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n')
          print(json.dumps(evidence, sort_keys=True))
          PY

      - name: Verify no provider credentials exposed
        run: |
          set -euo pipefail
          test -z "${GEMINI_API_KEY:-}"
          test -z "${GROQ_API_KEY:-}"
          test -z "${OPENROUTER_API_KEY:-}"
          test -z "${PEXELS_API_KEY:-}"
          test -z "${PIXABAY_API_KEY:-}"
          test -z "${YOUTUBE_REFRESH_TOKEN:-}"

      - name: Upload sanitized M6 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: retention-m6-verification
          path: verification-m6/
          if-no-files-found: error
          retention-days: 1
