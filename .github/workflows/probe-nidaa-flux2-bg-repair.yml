name: Probe Nidaa FLUX.2 Background Repair

on:
  push:
    branches:
      - probe/nidaa-flux2-bg-repair-20260924
    paths:
      - experiments/nidaa_flux2_bg_repair_probe.py
      - .github/workflows/probe-nidaa-flux2-bg-repair.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Cloudflare secrets
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
      - name: Run isolated repair probe
        run: python3 experiments/nidaa_flux2_bg_repair_probe.py
      - name: Print manifest
        if: always()
        run: |
          if [ -f artifacts/nidaa-flux2-bg-repair/manifest.json ]; then
            cat artifacts/nidaa-flux2-bg-repair/manifest.json
          fi
      - name: Upload repair images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nidaa-flux2-bg-repair-probe
          path: artifacts/nidaa-flux2-bg-repair/
          if-no-files-found: error
          retention-days: 7
