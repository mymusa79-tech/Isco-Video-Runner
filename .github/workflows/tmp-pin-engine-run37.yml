name: Temporary pin engine for Run 37

on:
  push:
    branches: ["chore/pin-engine-525f3e7-run37"]
    paths:
      - ".tmp/pin-engine-run37.trigger"

permissions:
  contents: write

jobs:
  pin-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/pin-engine-525f3e7-run37
          persist-credentials: true
          fetch-depth: 0

      - name: Pin reviewed engine SHA and commit only final workflow change
        run: |
          set -euo pipefail
          file=.github/workflows/produce-resilient-v4.yml
          old=064acab57a0d9e155d5938145072dc548657061f
          new=525f3e7900068e48e29e2d04391f0489f93869c6
          count="$(grep -c "ref: $old" "$file")"
          test "$count" -eq 1
          sed -i "s/ref: $old/ref: $new/" "$file"
          grep -q "ref: $new" "$file"
          rm -f .tmp/pin-engine-run37.trigger .github/workflows/tmp-pin-engine-run37.yml
          rmdir .tmp 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code -- . ':!.github/workflows/produce-resilient-v4.yml' || {
            echo "Unexpected staged paths" >&2
            git diff --cached --name-status >&2
            exit 1
          }
          git commit -m "chore: pin resilient v4 to engine 525f3e7"
          git push origin HEAD:chore/pin-engine-525f3e7-run37
