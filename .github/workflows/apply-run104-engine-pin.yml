name: Apply Run104 Engine Pin

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/run104-engine-candidate-certification'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/run104-engine-candidate-certification
          fetch-depth: 1
          persist-credentials: true
      - name: Replace only the certified Engine pin
        env:
          OLD_SHA: a1eea541c8ec36b0c701093793c730ffcc53b03b
          NEW_SHA: c8929fd057ff5bffa5dc3f4c556bb6753aca6f9c
        run: |
          set -euo pipefail
          file=.github/workflows/produce-resilient-v4.yml
          before="$(grep -o "$OLD_SHA" "$file" | wc -l)"
          test "$before" -eq 3
          sed -i "s/$OLD_SHA/$NEW_SHA/g" "$file"
          test "$(grep -o "$OLD_SHA" "$file" | wc -l)" -eq 0
          test "$(grep -o "$NEW_SHA" "$file" | wc -l)" -eq 3
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$file"
          git commit -m "fix: pin final certified Run104 Engine candidate"
          git push origin HEAD:fix/run104-engine-candidate-certification
