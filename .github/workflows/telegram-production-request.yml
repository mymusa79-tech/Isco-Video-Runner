name: Telegram Explicit Production Request

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Exact approved Telegram request id"
        required: true
        type: string
      request_sha256:
        description: "Exact immutable approved Telegram request hash"
        required: true
        type: string
      authorization_id:
        description: "Exact durable authorization created by the second Telegram action"
        required: true
        type: string
      engine_sha:
        description: "Exact certified Engine SHA"
        required: true
        type: string

permissions:
  actions: write
  contents: write

env:
  EXPECTED_ENGINE_SHA: fe576d91f604412a010fa6cd61ff66f839e67550

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Runner main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Verify exact Runner and certified Engine input
        env:
          REQUESTED_ENGINE_SHA: ${{ inputs.engine_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${GITHUB_REF_NAME}" = "main"
          test "$REQUESTED_ENGINE_SHA" = "$EXPECTED_ENGINE_SHA"

      - name: Restore exact durable Telegram reservation
        id: admission
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
        run: |
          set -euo pipefail
          test -n "$STATE_ENCRYPTION_KEY"
          test -n "$REQUEST_ID"
          test -n "$REQUEST_SHA256"
          test -n "$AUTHORIZATION_ID"
          mkdir -p "$RUNNER_TEMP/isco-control"
          encrypted="$RUNNER_TEMP/isco-control/control-panel.json.enc"
          state="$RUNNER_TEMP/isco-control/control-panel.json"
          request="$RUNNER_TEMP/isco-control/approved-request.json"
          git fetch --no-tags origin control-plane-state:refs/remotes/origin/control-plane-state
          git show origin/control-plane-state:state/control-panel.json.enc > "$encrypted"
          openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 \
            -pass env:STATE_ENCRYPTION_KEY -in "$encrypted" -out "$state"
          chmod 600 "$state"
          CONTROL_STATE_PATH="$state" CONTROL_REQUEST_PATH="$request" python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.telegram_production_queue import release_tag_for, validate_dispatch_authorization, validate_ready_request

          state = json.loads(Path(os.environ["CONTROL_STATE_PATH"]).read_text(encoding="utf-8"))
          request_id = os.environ["REQUEST_ID"]
          expected = os.environ["REQUEST_SHA256"]
          authorization_id = os.environ["AUTHORIZATION_ID"]
          request = (state.get("requests") or {}).get(request_id)
          if not isinstance(request, dict):
              raise SystemExit("Approved Telegram request id is absent from encrypted state")
          validate_ready_request(request)
          if request.get("request_sha256") != expected:
              raise SystemExit("Approved Telegram request hash does not match workflow dispatch")
          validate_dispatch_authorization(state, request_id, expected, authorization_id)
          output = Path(os.environ["CONTROL_REQUEST_PATH"])
          output.write_text(json.dumps(request, ensure_ascii=False, indent=2), encoding="utf-8")
          output.chmod(0o600)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write(f"release_tag={release_tag_for(request)}\n")
          PY
          echo "CONTROL_STATE_PATH=$state" >> "$GITHUB_ENV"
          echo "CONTROL_REQUEST_PATH=$request" >> "$GITHUB_ENV"

      - name: Reject duplicate completed release without starting Production
        id: duplicate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.admission.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            python scripts/telegram_release_identity.py \
              --repository "$GITHUB_REPOSITORY" \
              --tag "$RELEASE_TAG" \
              --target-sha "$GITHUB_SHA" \
              --request "$CONTROL_REQUEST_PATH"
            echo "already_released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Admission gate — never queue behind an active V4 run
        id: capacity
        if: steps.duplicate.outputs.already_released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/produce-resilient-v4.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
          if [ "$active" -gt 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "V4 is active; Telegram request will not be queued behind it"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch exact reservation to the single V4 owner
        id: dispatch
        if: steps.duplicate.outputs.already_released != 'true' && steps.capacity.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
          ENGINE_SHA: ${{ inputs.engine_sha }}
        run: |
          set -euo pipefail
          gh workflow run produce-resilient-v4.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f request_id="$REQUEST_ID" \
            -f request_sha256="$REQUEST_SHA256" \
            -f authorization_id="$AUTHORIZATION_ID" \
            -f engine_sha="$ENGINE_SHA"

      - name: Release reservation when admission or dispatch fails
        if: >-
          always() &&
          steps.duplicate.outputs.already_released != 'true' &&
          (
            steps.capacity.outputs.available == 'false' ||
            steps.dispatch.outcome == 'failure'
          )
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
        run: |
          set -euo pipefail
          reason="workflow_dispatch_failed"
          python scripts/telegram_v4_ingress.py fail \
            --state "$CONTROL_STATE_PATH" \
            --request-id "$REQUEST_ID" \
            --sha256 "$REQUEST_SHA256" \
            --authorization-id "$AUTHORIZATION_ID" \
            --reason "$reason"
          encrypted="$RUNNER_TEMP/isco-control/control-panel.failed.json.enc"
          openssl enc -aes-256-cbc -salt -pbkdf2 -md sha256 \
            -pass env:STATE_ENCRYPTION_KEY -in "$CONTROL_STATE_PATH" -out "$encrypted"
          git fetch --no-tags origin control-plane-state:refs/remotes/origin/control-plane-state
          worktree="$RUNNER_TEMP/isco-control-failed-worktree"
          git worktree add --detach "$worktree" origin/control-plane-state
          mkdir -p "$worktree/state"
          cp "$encrypted" "$worktree/state/control-panel.json.enc"
          cd "$worktree"
          git config user.name "isco-control-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/control-panel.json.enc
          if ! git diff --cached --quiet; then
            git commit -m "state: release failed Telegram V4 admission"
            git push origin HEAD:control-plane-state
          fi

      - name: Notify only when the request could not start
        if: >-
          always() &&
          steps.duplicate.outputs.already_released != 'true' &&
          (
            steps.capacity.outputs.available == 'false' ||
            steps.dispatch.outcome == 'failure'
          )
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REQUEST_ID: ${{ inputs.request_id }}
          V4_AVAILABLE: ${{ steps.capacity.outputs.available }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          if os.environ.get("V4_AVAILABLE") == "false":
              text = "⏸️ يوجد إنتاج يعمل الآن، لذلك لم أضع اختيارك في طابور انتظار. أبقيت الموضوع معتمدًا؛ أرسل «تأكيد الإنتاج» عندما يصبح الخط فارغًا."
          else:
              text = f"⚠️ لم يبدأ Production للطلب {os.environ['REQUEST_ID']} بسبب فشل تسليم التفويض إلى V4. لم يتم وضعه في طابور، ويمكن إعادة التأكيد."
          payload = urllib.parse.urlencode({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": text}).encode()
          url = "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage"
          with urllib.request.urlopen(urllib.request.Request(url, data=payload), timeout=25) as response:
              body = json.loads(response.read().decode("utf-8"))
          if not body.get("ok"):
              raise SystemExit("Telegram admission notification failed")
          PY

      - name: Remove plaintext admission state
        if: always()
        run: rm -rf "$RUNNER_TEMP/isco-control" || true
