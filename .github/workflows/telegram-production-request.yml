name: Telegram Explicit Production Request

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Exact approved Telegram request id"
        required: true
        type: string
      request_sha256:
        description: "Exact immutable approved Telegram request hash"
        required: true
        type: string
      authorization_id:
        description: "Exact durable authorization created by the second Telegram action"
        required: true
        type: string
      engine_sha:
        description: "Exact certified Engine SHA"
        required: true
        type: string

permissions:
  actions: write
  contents: write

env:
  EXPECTED_ENGINE_SHA: c9d7f5a5d63629e11eaaabaee8d2ca01dd184dc8

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Runner main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Verify exact Runner and certified Engine input
        env:
          REQUESTED_ENGINE_SHA: ${{ inputs.engine_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${GITHUB_REF_NAME}" = "main"
          test "$REQUESTED_ENGINE_SHA" = "$EXPECTED_ENGINE_SHA"

      - name: Restore exact durable Telegram reservation
        id: admission
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
        run: |
          set -euo pipefail
          test -n "$STATE_ENCRYPTION_KEY"
          test -n "$REQUEST_ID"
          test -n "$REQUEST_SHA256"
          test -n "$AUTHORIZATION_ID"
          mkdir -p "$RUNNER_TEMP/isco-control"
          encrypted="$RUNNER_TEMP/isco-control/control-panel.json.enc"
          state="$RUNNER_TEMP/isco-control/control-panel.json"
          request="$RUNNER_TEMP/isco-control/approved-request.json"
          echo "CONTROL_STATE_PATH=$state" >> "$GITHUB_ENV"
          echo "CONTROL_REQUEST_PATH=$request" >> "$GITHUB_ENV"
          git fetch --no-tags origin control-plane-state:refs/remotes/origin/control-plane-state
          git show origin/control-plane-state:state/control-panel.json.enc > "$encrypted"
          openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 \
            -pass env:STATE_ENCRYPTION_KEY -in "$encrypted" -out "$state"
          chmod 600 "$state"
          CONTROL_STATE_PATH="$state" CONTROL_REQUEST_PATH="$request" python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.telegram_production_queue import release_tag_for, validate_dispatch_authorization, validate_ready_request

          state = json.loads(Path(os.environ["CONTROL_STATE_PATH"]).read_text(encoding="utf-8"))
          request_id = os.environ["REQUEST_ID"]
          expected = os.environ["REQUEST_SHA256"]
          authorization_id = os.environ["AUTHORIZATION_ID"]
          request = (state.get("requests") or {}).get(request_id)
          if not isinstance(request, dict):
              raise SystemExit("Approved Telegram request id is absent from encrypted state")
          validate_ready_request(request)
          if request.get("request_sha256") != expected:
              raise SystemExit("Approved Telegram request hash does not match workflow dispatch")
          validate_dispatch_authorization(
              state,
              request_id,
              expected,
              authorization_id,
              runner_sha=os.environ["GITHUB_SHA"],
          )
          output = Path(os.environ["CONTROL_REQUEST_PATH"])
          output.write_text(json.dumps(request, ensure_ascii=False, indent=2), encoding="utf-8")
          output.chmod(0o600)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write(f"release_tag={release_tag_for(request)}\n")
          PY

      - name: Reject duplicate completed release without starting Production
        id: duplicate
        if: steps.admission.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.admission.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            python scripts/telegram_release_identity.py \
              --repository "$GITHUB_REPOSITORY" \
              --tag "$RELEASE_TAG" \
              --target-sha "$GITHUB_SHA" \
              --request "$CONTROL_REQUEST_PATH"
            echo "already_released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconcile an already completed release into the latest durable state
        id: duplicate_reconcile
        if: steps.duplicate.outputs.already_released == 'true'
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
          RELEASE_TAG: ${{ steps.admission.outputs.release_tag }}
        run: |
          set -euo pipefail
          worktree="$RUNNER_TEMP/isco-control-completed-worktree"
          fresh_enc="$RUNNER_TEMP/isco-control/completed-latest.json.enc"
          fresh_state="$RUNNER_TEMP/isco-control/completed-latest.json"
          git fetch --no-tags origin control-plane-state:refs/remotes/origin/control-plane-state
          git show origin/control-plane-state:state/control-panel.json.enc > "$fresh_enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 \
            -pass env:STATE_ENCRYPTION_KEY -in "$fresh_enc" -out "$fresh_state"
          python scripts/telegram_production_queue.py consume \
            --state "$fresh_state" \
            --request-id "$REQUEST_ID" \
            --sha256 "$REQUEST_SHA256" \
            --authorization-id "$AUTHORIZATION_ID" \
            --runner-sha "$GITHUB_SHA" \
            --workflow-run-id "release-reconcile-${GITHUB_RUN_ID}"
          python scripts/telegram_v4_ingress.py complete \
            --state "$fresh_state" \
            --request-id "$REQUEST_ID" \
            --sha256 "$REQUEST_SHA256" \
            --authorization-id "$AUTHORIZATION_ID" \
            --release-tag "$RELEASE_TAG"
          openssl enc -aes-256-cbc -salt -pbkdf2 -md sha256 \
            -pass env:STATE_ENCRYPTION_KEY -in "$fresh_state" -out "$fresh_enc"
          git worktree add --detach "$worktree" origin/control-plane-state
          mkdir -p "$worktree/state"
          cp "$fresh_enc" "$worktree/state/control-panel.json.enc"
          cd "$worktree"
          git config user.name "isco-control-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/control-panel.json.enc
          if git diff --cached --quiet; then
            echo "Duplicate release reconciliation produced no state delta" >&2
            exit 1
          fi
          git commit -m "state: reconcile completed Telegram release"
          git push origin HEAD:control-plane-state

      - name: Admission gate — never queue behind an active V4 run
        id: capacity
        if: steps.duplicate.outputs.already_released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/produce-resilient-v4.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
          if [ "$active" -gt 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "V4 is active; Telegram request will not be queued behind it"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch exact reservation to the single V4 owner
        id: dispatch
        if: steps.duplicate.outputs.already_released == 'false' && steps.capacity.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
          ENGINE_SHA: ${{ inputs.engine_sha }}
        run: |
          set -euo pipefail
          payload="$(jq -cn \
            --arg request_id "$REQUEST_ID" \
            --arg request_sha256 "$REQUEST_SHA256" \
            --arg authorization_id "$AUTHORIZATION_ID" \
            --arg engine_sha "$ENGINE_SHA" \
            '{ref:"main",return_run_details:true,inputs:{request_id:$request_id,request_sha256:$request_sha256,authorization_id:$authorization_id,engine_sha:$engine_sha}}')"
          response="$(gh api --method POST \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/produce-resilient-v4.yml/dispatches" \
            --input - <<<"$payload")"
          child_run_id="$(jq -r '.workflow_run_id // empty' <<<"$response")"
          child_run_url="$(jq -r '.html_url // empty' <<<"$response")"
          [[ "$child_run_id" =~ ^[0-9]+$ ]]
          test -n "$child_run_url"
          echo "workflow_run_id=$child_run_id" >> "$GITHUB_OUTPUT"
          echo "workflow_run_url=$child_run_url" >> "$GITHUB_OUTPUT"

      - name: Reject post-dispatch concurrency race instead of waiting
        id: race_guard
        if: steps.dispatch.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CHILD_RUN_ID: ${{ steps.dispatch.outputs.workflow_run_id }}
        run: |
          set -euo pipefail
          [[ "$CHILD_RUN_ID" =~ ^[0-9]+$ ]]
          for attempt in 1 2 3; do
            child_status="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${CHILD_RUN_ID}" --jq '.status')"
            if [ "$child_status" = "in_progress" ] || [ "$child_status" = "completed" ]; then
              echo "accepted=true" >> "$GITHUB_OUTPUT"
              echo "Dispatched V4 owns execution; it is not waiting behind another production"
              exit 0
            fi

            active_payload="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/produce-resilient-v4.yml/runs?per_page=20")"
            rivals="$(jq --argjson child "$CHILD_RUN_ID" \
              '[.workflow_runs[] | select(.id != $child and .status != "completed")] | length' \
              <<<"$active_payload")"
            if [ "$rivals" -gt 0 ]; then
              if gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${CHILD_RUN_ID}/cancel" >/dev/null 2>&1; then
                echo "accepted=false" >> "$GITHUB_OUTPUT"
                echo "reason=concurrency_race" >> "$GITHUB_OUTPUT"
                echo "Canceled Telegram V4 child instead of leaving it pending behind another production"
                exit 0
              fi
              child_status="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${CHILD_RUN_ID}" --jq '.status')"
              if [ "$child_status" = "in_progress" ] || [ "$child_status" = "completed" ]; then
                echo "accepted=true" >> "$GITHUB_OUTPUT"
                echo "Concurrency changed before cancellation; child already owns execution"
                exit 0
              fi
              echo "Unable to cancel a non-running Telegram V4 child safely" >&2
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then sleep 2; fi
          done
          echo "accepted=true" >> "$GITHUB_OUTPUT"
          echo "No competing V4 run appeared during bounded post-dispatch admission verification"

      - name: Release reservation when admission or dispatch cannot start V4
        id: release_failed_admission
        if: >-
          always() &&
          steps.duplicate_reconcile.outcome != 'success' &&
          (
            steps.admission.outcome == 'failure' ||
            steps.duplicate.outcome == 'failure' ||
            steps.duplicate_reconcile.outcome == 'failure' ||
            steps.capacity.outputs.available == 'false' ||
            steps.dispatch.outcome == 'failure' ||
            steps.race_guard.outcome == 'failure' ||
            steps.race_guard.outputs.accepted == 'false'
          )
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
        run: |
          set -euo pipefail
          fresh_enc="$RUNNER_TEMP/isco-control/failed-latest.json.enc"
          fresh_state="$RUNNER_TEMP/isco-control/failed-latest.json"
          git fetch --no-tags origin control-plane-state:refs/remotes/origin/control-plane-state
          git show origin/control-plane-state:state/control-panel.json.enc > "$fresh_enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 \
            -pass env:STATE_ENCRYPTION_KEY -in "$fresh_enc" -out "$fresh_state"
          python scripts/telegram_v4_ingress.py fail \
            --state "$fresh_state" \
            --request-id "$REQUEST_ID" \
            --sha256 "$REQUEST_SHA256" \
            --authorization-id "$AUTHORIZATION_ID" \
            --reason workflow_dispatch_failed
          openssl enc -aes-256-cbc -salt -pbkdf2 -md sha256 \
            -pass env:STATE_ENCRYPTION_KEY -in "$fresh_state" -out "$fresh_enc"
          worktree="$RUNNER_TEMP/isco-control-failed-worktree"
          git worktree add --detach "$worktree" origin/control-plane-state
          mkdir -p "$worktree/state"
          cp "$fresh_enc" "$worktree/state/control-panel.json.enc"
          cd "$worktree"
          git config user.name "isco-control-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/control-panel.json.enc
          if git diff --cached --quiet; then
            echo "Failed admission reconciliation produced no state delta" >&2
            exit 1
          fi
          git commit -m "state: release failed Telegram V4 admission"
          git push origin HEAD:control-plane-state

      - name: Notify only when the request could not start
        if: always() && steps.release_failed_admission.outcome == 'success'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REQUEST_ID: ${{ inputs.request_id }}
          V4_AVAILABLE: ${{ steps.capacity.outputs.available }}
          RACE_ACCEPTED: ${{ steps.race_guard.outputs.accepted }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          if os.environ.get("V4_AVAILABLE") == "false" or os.environ.get("RACE_ACCEPTED") == "false":
              text = "⏸️ يوجد إنتاج يعمل الآن، لذلك لم أضع اختيارك في طابور انتظار. أبقيت الموضوع معتمدًا؛ أرسل «تأكيد الإنتاج» عندما يصبح الخط فارغًا."
          else:
              text = f"⚠️ لم يبدأ Production للطلب {os.environ['REQUEST_ID']}. لم يُترك في انتظار أو حجز صامت، ويمكن إعادة التأكيد بعد مراجعة الحالة."
          payload = urllib.parse.urlencode({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": text}).encode()
          url = "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage"
          with urllib.request.urlopen(urllib.request.Request(url, data=payload), timeout=25) as response:
              body = json.loads(response.read().decode("utf-8"))
          if not body.get("ok"):
              raise SystemExit("Telegram admission notification failed")
          PY

      - name: Remove plaintext admission state
        if: always()
        run: rm -rf "$RUNNER_TEMP/isco-control" || true
