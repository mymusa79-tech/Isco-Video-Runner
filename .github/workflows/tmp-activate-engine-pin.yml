name: Temporary stage Engine pin blob

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/tmp-activate-engine-pin.yml'
      - '.github/workflows/produce-resilient-v4.yml'

permissions:
  contents: write

jobs:
  stage-pin-blob:
    if: github.head_ref == 'chore/activate-adaptive-engine-928ee95'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 1
      - name: Generate exact activated Production V4 file
        shell: bash
        run: |
          set -euo pipefail
          source_file=.github/workflows/produce-resilient-v4.yml
          staged_file=activation_staging/produce-resilient-v4.yml
          old=928ee95a1d5209a52ee7b50c2d0b65079771cfcd
          new=ece86a6aefe87901c8771a7cb2cec1a08523e704
          before="$(awk -v s="$old" 'BEGIN{n=0} {while(index($0,s)){n++; $0=substr($0,index($0,s)+length(s))}} END{print n}' "$source_file")"
          test "$before" = "3"
          mkdir -p activation_staging
          cp "$source_file" "$staged_file"
          sed -i "s/$old/$new/g" "$staged_file"
          after_new="$(awk -v s="$new" 'BEGIN{n=0} {while(index($0,s)){n++; $0=substr($0,index($0,s)+length(s))}} END{print n}' "$staged_file")"
          after_old="$(awk -v s="$old" 'BEGIN{n=0} {while(index($0,s)){n++; $0=substr($0,index($0,s)+length(s))}} END{print n}' "$staged_file")"
          test "$after_new" = "3"
          test "$after_old" = "0"
          diff -u "$source_file" "$staged_file" | grep -E '^[+-].*(EXPECTED_ENGINE_SHA|ref:|ISCO_ENGINE_SHA)' || true
      - name: Push only non-workflow staging blob
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'isco-activation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add activation_staging/produce-resilient-v4.yml
          git diff --cached --check
          git commit -m 'chore: stage activated Production V4 workflow blob'
          git push origin HEAD:${{ github.head_ref }}
