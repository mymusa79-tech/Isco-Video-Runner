name: Temporary finalize Engine pin

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/tmp-activate-engine-pin.yml'
      - '.github/workflows/produce-resilient-v4.yml'

permissions:
  contents: write

jobs:
  finalize-pin:
    if: github.head_ref == 'chore/activate-adaptive-engine-928ee95'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 1
      - name: Replace the three canonical production Engine pins
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/produce-resilient-v4.yml
          old=928ee95a1d5209a52ee7b50c2d0b65079771cfcd
          new=ece86a6aefe87901c8771a7cb2cec1a08523e704
          before="$(awk -v s="$old" 'BEGIN{n=0} {while(index($0,s)){n++; $0=substr($0,index($0,s)+length(s))}} END{print n}' "$file")"
          test "$before" = "3"
          sed -i "s/$old/$new/g" "$file"
          after_new="$(awk -v s="$new" 'BEGIN{n=0} {while(index($0,s)){n++; $0=substr($0,index($0,s)+length(s))}} END{print n}' "$file")"
          after_old="$(awk -v s="$old" 'BEGIN{n=0} {while(index($0,s)){n++; $0=substr($0,index($0,s)+length(s))}} END{print n}' "$file")"
          test "$after_new" = "3"
          test "$after_old" = "0"
          grep -F "EXPECTED_ENGINE_SHA: $new" "$file"
          grep -F "ref: $new" "$file"
          grep -F "ISCO_ENGINE_SHA: $new" "$file"
      - name: Commit pin update and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-activate-engine-pin.yml
          git config user.name 'isco-activation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/produce-resilient-v4.yml .github/workflows/tmp-activate-engine-pin.yml
          git diff --cached --check
          git commit -m 'chore: activate Engine ece86a6 on Production V4'
          git push origin HEAD:${{ github.head_ref }}
