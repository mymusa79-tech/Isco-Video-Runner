name: Deploy Clean V2 Telegram Lite

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/telegram-clean-v2-lite/**"
      - ".github/workflows/deploy-telegram-clean-v2-lite.yml"
      - ".github/workflows/telegram-clean-v2-control.yml"
      - ".github/workflows/clean-v2-telegram-production.yml"
      - ".github/workflows/clean-v2-youtube-snapshot.yml"
      - "scripts/telegram_clean_v2_control.py"
  pull_request:
    paths:
      - "cloudflare/telegram-clean-v2-lite/**"
      - ".github/workflows/deploy-telegram-clean-v2-lite.yml"
      - ".github/workflows/telegram-clean-v2-control.yml"
      - ".github/workflows/clean-v2-telegram-production.yml"
      - ".github/workflows/clean-v2-youtube-snapshot.yml"
      - "scripts/telegram_clean_v2_control.py"
      - "scripts/test_telegram_clean_v2_control.py"

permissions:
  contents: read

concurrency:
  group: deploy-clean-v2-telegram-lite
  cancel-in-progress: false

env:
  WRANGLER_VERSION: "4.125.0"
  ZERO_COST_MODE: "true"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate Lite worker and control contracts
        run: |
          set -euo pipefail
          node --check cloudflare/telegram-clean-v2-lite/index.js
          node --test cloudflare/telegram-clean-v2-lite/index.test.mjs
          python -m py_compile scripts/telegram_clean_v2_control.py
          python -m unittest -v scripts.test_telegram_clean_v2_control scripts.test_telegram_clean_v2_notify
          python -c 'import pathlib,tomllib; d=tomllib.loads(pathlib.Path("cloudflare/telegram-clean-v2-lite/wrangler.toml.example").read_text(encoding="utf-8")); assert d.get("workers_dev") is True; assert d.get("main") == "index.js"; assert d.get("vars",{}).get("ZERO_COST_MODE") == "true"; assert not set(("kv_namespaces","d1_databases","r2_buckets","durable_objects","queues")).intersection(d)'
          git diff --check origin/main...HEAD

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_CONTROL_TOKEN: ${{ secrets.ISCO_GITHUB_CONTROL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate required activation secrets
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID GITHUB_CONTROL_TOKEN; do
            test -n "${!name:-}" || { echo "::error::$name is missing"; exit 2; }
          done

      - name: Validate before deploy
        run: |
          set -euo pipefail
          node --check cloudflare/telegram-clean-v2-lite/index.js
          node --test cloudflare/telegram-clean-v2-lite/index.test.mjs
          python -m unittest -v scripts.test_telegram_clean_v2_control scripts.test_telegram_clean_v2_notify

      - name: Derive stable Telegram webhook secret
        run: |
          set -euo pipefail
          secret="$(python -c 'import hashlib,os; token=os.environ["TELEGRAM_BOT_TOKEN"]; print(hashlib.sha256(("clean-v2-webhook-v1:"+token).encode()).hexdigest())')"
          test -n "$secret"
          echo "::add-mask::$secret"
          echo "TELEGRAM_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Deploy zero-cost workers.dev endpoint
        working-directory: cloudflare/telegram-clean-v2-lite
        run: |
          set -euo pipefail
          cp wrangler.toml.example wrangler.toml
          npx --yes "wrangler@$WRANGLER_VERSION" deploy --config wrangler.toml 2>&1 | tee "$RUNNER_TEMP/wrangler.log"
          worker_url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' "$RUNNER_TEMP/wrangler.log" | tail -1 || true)"
          test -n "$worker_url"
          echo "WORKER_URL=$worker_url" >> "$GITHUB_ENV"

      - name: Install Worker secrets
        working-directory: cloudflare/telegram-clean-v2-lite
        run: |
          set -euo pipefail
          put_secret() {
            printf '%s' "$2" | npx --yes "wrangler@$WRANGLER_VERSION" secret put "$1" --config wrangler.toml >/dev/null
          }
          put_secret TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
          put_secret TELEGRAM_CHAT_ID "$TELEGRAM_CHAT_ID"
          put_secret GITHUB_CONTROL_TOKEN "$GITHUB_CONTROL_TOKEN"

      - name: Verify worker health and bind Telegram webhook
        run: |
          set -euo pipefail
          health="$(curl --fail-with-body --silent --show-error "$WORKER_URL/health")"
          printf '%s' "$health" | python -c 'import json,sys; p=json.load(sys.stdin); assert p.get("ok") is True and p.get("phase") == "C"'

          webhook_ok=0
          last_description="Telegram setWebhook did not return JSON"
          for attempt in 1 2 3 4 5; do
            response="$(curl --silent --show-error \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
              --data-urlencode "url=${WORKER_URL%/}/telegram" \
              --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}" \
              --data-urlencode 'allowed_updates=["message","callback_query"]' \
              --data-urlencode 'drop_pending_updates=false' || true)"

            if printf '%s' "$response" | jq -e '.ok == true and .result == true' >/dev/null 2>&1; then
              webhook_ok=1
              break
            fi
            last_description="$(printf '%s' "$response" | jq -r '.description // "Telegram setWebhook returned an invalid response"' 2>/dev/null || true)"
            test -n "$last_description" || last_description="Telegram setWebhook returned an empty response"
            echo "::warning::setWebhook attempt ${attempt}/5 failed: $last_description"
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
          done

          if [ "$webhook_ok" -ne 1 ]; then
            echo "::error::Telegram webhook activation failed after 5 attempts: $last_description"
            exit 22
          fi
          echo "Clean V2 Telegram webhook accepted at $WORKER_URL/telegram"

      - name: Install stable webhook secret after Telegram accepts it
        working-directory: cloudflare/telegram-clean-v2-lite
        run: |
          set -euo pipefail
          printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | npx --yes "wrangler@$WRANGLER_VERSION" secret put TELEGRAM_WEBHOOK_SECRET --config wrangler.toml >/dev/null

      - name: Activate visible Telegram bot interface
        run: |
          set -euo pipefail

          api() {
            local method="$1"
            local body="$2"
            curl --fail-with-body --silent --show-error \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/$method" \
              -H 'content-type: application/json' \
              --data "$body"
          }

          commands='[
            {"command":"start","description":"فتح الرئيسية"}
          ]'

          response="$(api setMyCommands "$(jq -nc --argjson commands "$commands" '{commands:$commands}')")"
          printf '%s' "$response" | python -c 'import json,sys; p=json.load(sys.stdin); assert p.get("ok") is True and p.get("result") is True'

          response="$(api setChatMenuButton "$(jq -nc --argjson chat_id "$TELEGRAM_CHAT_ID" '{chat_id:$chat_id,menu_button:{type:"commands"}}')")"
          printf '%s' "$response" | python -c 'import json,sys; p=json.load(sys.stdin); assert p.get("ok") is True and p.get("result") is True'

          response="$(api setMyDescription "$(jq -nc --arg d "مساعد نداء اليقظة: كل الأدوات داخل قائمة الرئيسية؛ البحث والمحفوظات والمستعملة والمتابعة في مكان واحد." '{description:$d}')")"
          printf '%s' "$response" | python -c 'import json,sys; p=json.load(sys.stdin); assert p.get("ok") is True and p.get("result") is True'

          response="$(api setMyShortDescription "$(jq -nc --arg d "كل أدوات القناة داخل الرئيسية." '{short_description:$d}')")"
          printf '%s' "$response" | python -c 'import json,sys; p=json.load(sys.stdin); assert p.get("ok") is True and p.get("result") is True'

      - name: Verify visible Telegram interface
        run: |
          set -euo pipefail
          commands="$(curl --fail-with-body --silent --show-error "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMyCommands")"
          printf '%s' "$commands" | python -c 'import json,sys; p=json.load(sys.stdin); got=[x.get("command") for x in p.get("result",[])]; assert p.get("ok") is True; assert got == ["start"], got'

          menu="$(curl --fail-with-body --silent --show-error "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getChatMenuButton?chat_id=${TELEGRAM_CHAT_ID}")"
          printf '%s' "$menu" | python -c 'import json,sys; p=json.load(sys.stdin); assert p.get("ok") is True; assert p.get("result",{}).get("type") == "commands", p'

      - name: Notify owner that visible interface is active
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg chat_id "$TELEGRAM_CHAT_ID" '{chat_id:$chat_id,text:"✅ تم تبسيط واجهة البوت.\n\nخارج القوائم بقي زر واحد فقط: 🏠 الرئيسية. افتحه لتجد البحث والمحفوظات والمستعملة والإحصائيات والمتابعة.",disable_web_page_preview:true,reply_markup:{keyboard:[[{text:"🏠 الرئيسية"}]],resize_keyboard:true,is_persistent:true,input_field_placeholder:"افتح الرئيسية"}}')"
          response="$(curl --fail-with-body --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'content-type: application/json' \
            --data "$payload")"
          printf '%s' "$response" | python -c 'import json,sys; p=json.load(sys.stdin); assert p.get("ok") is True'
