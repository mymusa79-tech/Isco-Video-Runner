name: Editorial Room Stage 7 PR Certify V5

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  ENGINE_SHA: 2a8d246d03bb5247da23b3c7b7e97e995b4619bf

jobs:
  certify-stage7-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Runner verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact Engine Stage 6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ env.ENGINE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1
      - name: Apply exact Stage 7 V3 production candidate
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('../.github/workflows/editorial-room-stage7-closure.yml').read_text(encoding='utf-8')
          m="          python - <<'PY'\n"; start=src.index(m)+len(m); end=src.index('          PY\n',start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end].splitlines())+'\n'
          Path('/tmp/apply_stage7.py').write_text(code,encoding='utf-8')
          PY
          python /tmp/apply_stage7.py
          rm -f tests/test_editorial_stage7.py
          python - <<'PY'
          from pathlib import Path
          p=Path('src/isco_video_agent/packaging_integrity.py'); s=p.read_text(encoding='utf-8')
          old='    has_semantic_anchor = max(promise_alignment, turn_alignment, payoff_alignment, thesis_alignment) > 0.0\n'
          new='    has_semantic_anchor = max(promise_alignment, turn_alignment, payoff_alignment, thesis_alignment) >= 0.20\n'
          assert s.count(old)==1; p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Reuse exact Stage 7 V3 contracts
        working-directory: engine
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('../.github/workflows/editorial-room-stage7-pr-certify-v3.yml').read_text(encoding='utf-8')
          a="          cat > tests/test_editorial_stage7.py <<'PYTEST'\n"; b='          PYTEST\n'
          start=src.index(a)+len(a); end=src.index(b,start)
          text='\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end].splitlines())+'\n'
          Path('tests/test_editorial_stage7.py').write_text(text,encoding='utf-8')
          PY
          python -m py_compile tests/test_editorial_stage7.py
      - name: Migrate legacy packaging fixtures to locked EditorialIntent
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('tests/test_packaging_identity_integrity_p1.py'); s=p.read_text(encoding='utf-8')
          old='from isco_video_agent import thumbnail\nfrom isco_video_agent.models import ProductionPlan, ScriptSection\n'
          new='from isco_video_agent import thumbnail\nfrom isco_video_agent.editorial_room import make_editorial_intent\nfrom isco_video_agent.models import ProductionPlan, ScriptSection\n'
          assert s.count(old)==1; s=s.replace(old,new)
          old='def _plan() -> ProductionPlan:\n    return ProductionPlan(\n'
          new='''def _plan() -> ProductionPlan:\n    intent = make_editorial_intent(\n        editorial_thesis="العودة بعد السقوط تُبنى من خطوة صغيرة قابلة للتكرار.",\n        viewer_starting_belief="المشاهد يظن أن السقوط يعني أن عليه إعادة بناء حياته كاملة دفعة واحدة.",\n        hidden_assumption="الافتراض الخفي أن العودة لا تُحسب إلا إذا كانت كبيرة وسريعة.",\n        editorial_turn="بدل انتظار عودة كاملة، ابدأ بخطوة صغيرة وكررها حتى تستعيد الثقة.",\n        stakes="انتظار القفزة الكبيرة قد يطيل التوقف ويزيد الإحساس بالعجز.",\n        viewer_promise="ستتعلم كيف تبدأ العودة بعد السقوط بخطوة صغيرة قابلة للتنفيذ والتكرار.",\n        evidence_boundaries=("لا نقدم علاجًا طبيًا.", "لا نزعم أن مسارًا واحدًا يناسب الجميع."),\n        earned_payoff="اختر خطوة صغيرة قابلة للتنفيذ اليوم وكررها لتبني عودتك تدريجيًا.",\n    )\n    return ProductionPlan(\n'''
          assert s.count(old)==1; s=s.replace(old,new)
          old='        closing_payoff="العودة الحقيقية تبدأ بخطوة صغيرة تتكرر اليوم وغدًا.",\n    )\n'
          new='        closing_payoff="العودة الحقيقية تبدأ بخطوة صغيرة تتكرر اليوم وغدًا.",\n        editorial_intent=intent.to_dict(),\n    )\n'
          assert s.count(old)==1; p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('tests/test_thumbnail_packaging_contract.py'); s=p.read_text(encoding='utf-8')
          old='from isco_video_agent import thumbnail\n\n\ndef _plan(*, fmt: str = "film"):\n'
          new='''from isco_video_agent import thumbnail\nfrom isco_video_agent.editorial_room import make_editorial_intent\n\n\ndef _intent():\n    return make_editorial_intent(\n        editorial_thesis="العودة بعد السقوط تُبنى من خطوة صغيرة قابلة للتكرار.",\n        viewer_starting_belief="المشاهد يظن أن السقوط يعني النهاية أو يتطلب عودة ضخمة فورًا.",\n        hidden_assumption="الافتراض الخفي أن الخطوات الصغيرة لا تُحسب كعودة حقيقية.",\n        editorial_turn="بدل انتظار قفزة كبيرة، ابدأ بخطوة صغيرة قابلة للتنفيذ اليوم.",\n        stakes="انتظار التغيير الكامل قد يطيل التوقف ويضعف الثقة.",\n        viewer_promise="ستتعلم كيف تبدأ العودة بعد السقوط بخطوة صغيرة قابلة للتنفيذ اليوم.",\n        evidence_boundaries=("لا نقدم علاجًا طبيًا.", "لا نعمم مسارًا واحدًا على الجميع."),\n        earned_payoff="اختر خطوة صغيرة قابلة للتنفيذ اليوم وابدأ منها عودتك.",\n    )\n\n\ndef _plan(*, fmt: str = "film"):\n'''
          assert s.count(old)==1; s=s.replace(old,new)
          old='        closing_payoff="العودة تبدأ بخطوة قابلة للتنفيذ اليوم.",\n    )\n'
          new='        closing_payoff="العودة تبدأ بخطوة قابلة للتنفيذ اليوم.",\n        editorial_intent=_intent().to_dict(),\n    )\n'
          assert s.count(old)==1; s=s.replace(old,new)
          start=s.index('    def test_duplicate_viewer_promise_is_rejected_as_non_distinct(self) -> None:\n')
          end=s.index('    def test_build_package_keeps_gold_adapter_candidate_contract_and_adds_pair_metadata',start)
          replacement='''    def test_shared_locked_viewer_promise_is_allowed_when_hypotheses_are_distinct(self) -> None:\n        duplicate = "ستخرج بخطوة عملية واحدة واضحة"\n        response = {\n            "concepts": [\n                _concept(1, promise=duplicate),\n                _concept(2, promise=duplicate),\n                _concept(3),\n            ]\n        }\n        with patch.object(thumbnail, "json_text", return_value=response):\n            concepts = thumbnail._concepts("key", _plan(), "model")\n        self.assertEqual({c["viewer_promise"] for c in concepts}, {_intent().viewer_promise})\n        self.assertEqual(len({c["packaging_hypothesis"] for c in concepts}), 3)\n\n'''
          s=s[:start]+replacement+s[end:]
          old='''            raw.update({"candidate_id": f"packaging-{chr(96 + index)}", "experiment_slot": chr(64 + index)})\n            concepts.append(raw)\n'''
          new='''            intent = _intent()\n            raw.update({\n                "candidate_id": f"packaging-{chr(96 + index)}",\n                "experiment_slot": chr(64 + index),\n                "title_ar": f"العودة تبدأ بخطوة صغيرة {index}",\n                "text_ar": f"خطوة صغيرة {index}",\n                "packaging_hypothesis": f"زاوية عملية للعودة بعد السقوط بخطوة صغيرة {index}",\n                "viewer_promise_expression": f"ستتعلم كيف تبدأ العودة بعد السقوط بخطوة صغيرة قابلة للتنفيذ اليوم {index}",\n                "viewer_promise": intent.viewer_promise,\n                "locked_viewer_promise": intent.viewer_promise,\n                "editorial_fingerprint": intent.editorial_fingerprint,\n                "persona_version": intent.persona_version,\n            })\n            concepts.append(raw)\n'''
          assert s.count(old)==1; p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          python -m py_compile tests/test_packaging_identity_integrity_p1.py tests/test_thumbnail_packaging_contract.py
          git diff --check
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked Engine runtime and ffmpeg
        working-directory: engine
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Focused Stage 7 contracts
        working-directory: engine
        run: python -m unittest tests.test_editorial_stage7 -v
      - name: Stage 5-6 HEI and packaging compatibility
        working-directory: engine
        run: >-
          python -m unittest
          tests.test_editorial_adapters tests.test_editorial_stage6 tests.test_human_editorial_intent
          tests.test_packaging_benchmark_p2 tests.test_packaging_early_brief_p2 tests.test_packaging_experiments_p2
          tests.test_packaging_identity_integrity_p1 tests.test_packaging_learning_p2 tests.test_thumbnail_packaging_contract -q
      - name: Full Engine regression
        working-directory: engine
        run: python -m unittest discover -s tests -q
      - name: Final Stage 7 diff review
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git checkout -- state/history.json 2>/dev/null || true
          mapfile -t changed < <(git status --porcelain --untracked-files=all | sed -E 's/^.. //')
          allowed=(src/isco_video_agent/production_pipeline.py src/isco_video_agent/packaging_integrity.py src/isco_video_agent/thumbnail.py tests/test_editorial_stage7.py tests/test_packaging_identity_integrity_p1.py tests/test_thumbnail_packaging_contract.py)
          for path in "${changed[@]}"; do ok=false; for want in "${allowed[@]}"; do [[ "$path" == "$want" ]] && ok=true; done; $ok || { echo "unexpected dirty path: $path" >&2; exit 1; }; done
      - name: Prepare verified Stage 7 artifact
        working-directory: engine
        run: |
          mkdir -p "$RUNNER_TEMP/stage7/src/isco_video_agent" "$RUNNER_TEMP/stage7/tests"
          cp src/isco_video_agent/production_pipeline.py src/isco_video_agent/packaging_integrity.py src/isco_video_agent/thumbnail.py "$RUNNER_TEMP/stage7/src/isco_video_agent/"
          cp tests/test_editorial_stage7.py tests/test_packaging_identity_integrity_p1.py tests/test_thumbnail_packaging_contract.py "$RUNNER_TEMP/stage7/tests/"
          git diff > "$RUNNER_TEMP/stage7/stage7.patch"
      - name: Upload verified Stage 7 closure
        uses: actions/upload-artifact@v4
        with:
          name: stage7-verified-closure-v5
          path: ${{ runner.temp }}/stage7
          retention-days: 1
