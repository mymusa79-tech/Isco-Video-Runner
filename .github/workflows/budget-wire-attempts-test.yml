name: Budget Wire Attempts Test

on:
  push:
    branches:
      - fix/budget-ledger-wire-attempts

permissions:
  contents: read

jobs:
  wire-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Runner branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout Engine fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: fix/budget-ledger-wire-attempts
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install Engine
        run: |
          set -euo pipefail
          python -m pip install -r engine/requirements-lock.txt
          python -m pip install --no-deps -e engine
          python -m pip check

      - name: Prove provider credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          for name in GEMINI_API_KEY GROQ_API_KEY OPENROUTER_API_KEY PEXELS_API_KEY PIXABAY_API_KEY YOUTUBE_API_KEY; do
            if [ -n "${!name:-}" ]; then
              echo "Unexpected provider credential exposed: $name" >&2
              exit 1
            fi
          done
          echo "No provider credentials exposed to test job"

      - name: Run new acceptance matrix
        run: |
          set -euo pipefail
          python engine/tests/test_budget_wire_attempts.py -v
          python scripts/test_budget_wire_attempts.py -v

      - name: Run affected Engine regressions
        run: |
          set -euo pipefail
          python engine/tests/test_ai_budget.py -v
          python engine/tests/test_text_audit_router.py -v
          python engine/tests/test_batch_g_text_audit_integration.py -v
          python engine/tests/test_orchestrator_ledger_integration.py -v
          python engine/tests/test_orchestrator_tts_budget_integration.py -v

      - name: Run affected Runner regressions
        run: |
          set -euo pipefail
          python scripts/test_task_level_planner_router.py -v
          if [ -f scripts/test_voice_mesh.py ]; then python scripts/test_voice_mesh.py -v; fi
