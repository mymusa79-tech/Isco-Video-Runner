name: Verify Human Editorial Intent M7

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  combined-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ENGINE_SHA: 568da9edfb68ebf9ea6e7d6aed0b6a9ee9a1180a
    steps:
      - name: Checkout Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout exact private Engine candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ env.ENGINE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine checkout
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "$ENGINE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install locked Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Dependency audit
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install pip-audit==2.10.1
          pip-audit --no-deps -r requirements-lock.txt

      - name: Focused Human Editorial Intent and current-main compatibility tests
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest tests.test_human_editorial_intent -v
          python -m unittest tests.test_editorial_room_director_m7_binding_current_main -v

      - name: Full Engine suite
        working-directory: engine
        run: |
          set -o pipefail
          python -m unittest discover -s tests -q 2>&1 | tee "$RUNNER_TEMP/engine-unittest.log"

      - name: Upload Engine unittest diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: human-editorial-intent-engine-unittest
          path: ${{ runner.temp }}/engine-unittest.log
          if-no-files-found: error
          retention-days: 1

      - name: Approved-Brief CLI contract matrix
        working-directory: engine
        run: |
          set -euo pipefail
          missing="$RUNNER_TEMP/isco-no-approved-brief.json"
          rm -f "$missing"
          ISCO_APPROVED_BRIEF_PATH="$missing" isco-video produce \
            --topic "لماذا تشعر أنك متأخر عن الجميع؟" --format auto --dry-run --no-research
          ISCO_APPROVED_BRIEF_PATH="$missing" isco-video produce \
            --format auto --dry-run --no-research
          isco-video produce --format auto --dry-run --no-research
          if isco-video produce --topic "لماذا تشعر أنك متأخر عن الجميع؟" \
            --format auto --dry-run --no-research; then
            echo 'ERROR: approved-brief mismatch unexpectedly passed' >&2
            exit 1
          fi

      - name: Focused Runner HEI plus existing M7 and Security contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m unittest scripts.test_human_editorial_intent_binding -v
          python -m unittest scripts.test_m7_live_binding -v

      - name: Full Runner regression suite including Gold Packaging Cinematic Security
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q

      - name: Diff and verifier sanity
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          test -f .github/workflows/verify-human-editorial-intent-m7.yml
          test -f scripts/m7_live_binding.py
          test -f scripts/test_human_editorial_intent_binding.py
          grep -F 'install_security_v1_live_binding()' scripts/m7_live_binding.py >/dev/null
          grep -F 'with live_m7_binding_scope(' scripts/m7_live_binding.py >/dev/null
          grep -F 'with _human_editorial_intent_scope():' scripts/m7_live_binding.py >/dev/null
