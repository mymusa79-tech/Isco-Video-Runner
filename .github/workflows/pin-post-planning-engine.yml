name: Pin Post-Planning Merged Engine

on:
  push:
    branches: ["fix/post-planning-audit-closure"]
    paths:
      - ".github/workflows/pin-post-planning-engine.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Replace remaining exact Engine pins in workspace only
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/post-planning-audit-closure"
          python - <<'PY'
          from pathlib import Path

          OLD = "6a0d91cc80511a174a47b95c6c203f8d93ba86ca"
          NEW = "f3c9357098947882882ca3010b46a565c2d90460"
          expected = {
              ".github/workflows/produce-resilient-v4.yml": 3,
              ".github/workflows/telegram-production-request.yml": 1,
          }
          total = 0
          for name, wanted in expected.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              found = text.count(OLD)
              if found != wanted:
                  raise SystemExit(f"{name}: expected {wanted} old Engine pins, found {found}")
              total += found
              path.write_text(text.replace(OLD, NEW), encoding="utf-8")
          if total != 4:
              raise SystemExit(f"expected exactly 4 remaining Engine pin replacements, observed {total}")
          for name, wanted in expected.items():
              text = Path(name).read_text(encoding="utf-8")
              if OLD in text or text.count(NEW) < wanted:
                  raise SystemExit(f"{name}: post-replacement pin verification failed")
          print(f"Patched workflow export PASS: {total} exact references -> {NEW}")
          PY
          git diff --check -- \
            .github/workflows/produce-resilient-v4.yml \
            .github/workflows/telegram-production-request.yml

      - name: Stage visible exact patched workflows for export
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/post-planning-pin-export"
          mkdir -p "$export_dir"
          cp .github/workflows/produce-resilient-v4.yml "$export_dir/produce-resilient-v4.yml"
          cp .github/workflows/telegram-production-request.yml "$export_dir/telegram-production-request.yml"
          sha256sum \
            "$export_dir/produce-resilient-v4.yml" \
            "$export_dir/telegram-production-request.yml" \
            > "$export_dir/SHA256SUMS"

      - name: Upload exact patched workflow export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: post-planning-engine-pin-export-visible
          path: ${{ runner.temp }}/post-planning-pin-export
          if-no-files-found: error
          retention-days: 1
