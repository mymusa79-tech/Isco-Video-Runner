name: Pin Post-Planning Merged Engine

on:
  push:
    branches: ["fix/post-planning-audit-closure"]
    paths:
      - ".github/workflows/pin-post-planning-engine.yml"

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch with workflow-authorized token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Replace remaining exact Engine pins
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/post-planning-audit-closure"
          python - <<'PY'
          from pathlib import Path

          OLD = "6a0d91cc80511a174a47b95c6c203f8d93ba86ca"
          NEW = "f3c9357098947882882ca3010b46a565c2d90460"
          expected = {
              ".github/workflows/produce-resilient-v4.yml": 3,
              ".github/workflows/telegram-production-request.yml": 1,
          }
          total = 0
          for name, wanted in expected.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              found = text.count(OLD)
              if found != wanted:
                  raise SystemExit(f"{name}: expected {wanted} old Engine pins, found {found}")
              total += found
              path.write_text(text.replace(OLD, NEW), encoding="utf-8")
          if total != 4:
              raise SystemExit(f"expected exactly 4 remaining Engine pin replacements, observed {total}")
          for name, wanted in expected.items():
              text = Path(name).read_text(encoding="utf-8")
              if OLD in text or text.count(NEW) < wanted:
                  raise SystemExit(f"{name}: post-replacement pin verification failed")
          print(f"Remaining Engine pin replacement PASS: {total} exact references -> {NEW}")
          PY

      - name: Commit exact workflow pin closure
        run: |
          set -euo pipefail
          git config user.name "isco-pin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/produce-resilient-v4.yml \
            .github/workflows/telegram-production-request.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "No workflow pin delta" >&2; exit 1; }
          git commit -m "chore: finish post-Planning Engine workflow pins"
          git push origin "HEAD:${GITHUB_REF_NAME}"
