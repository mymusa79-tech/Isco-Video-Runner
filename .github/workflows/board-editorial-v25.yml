name: Board V25 Editorial and Compare Regression

on:
  pull_request:
    branches: [main]
    paths:
      - clean_v2/board_scene.py
      - clean_v2/production_package.py
      - scripts/test_board_scene.py
      - scripts/render_board_v25_previews.py
      - docs/production-zip.md
      - .github/workflows/board-editorial-v25.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  board-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BOARD_ALLOW_FALLBACK_FONT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install FFmpeg for actual Board video tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install local rendering dependencies (no external provider)
        run: python -m pip install 'Pillow==12.3.0' numpy
      - name: Compile board and importer
        run: python -m py_compile clean_v2/board_scene.py clean_v2/production_package.py scripts/test_board_scene.py scripts/render_board_v25_previews.py
      - name: Render and validate legacy and V25 board contracts
        run: python -m unittest scripts.test_board_scene -v
      - name: Guard existing approved ZIP contract
        run: python -m unittest scripts.test_production_package -v
      - name: Produce representative editorial image frames for human review
        run: python -m scripts.render_board_v25_previews --output board-v25-samples
      - name: Upload phone-size and full-width evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: board-v25-visual-review
          path: board-v25-samples/*.png
          if-no-files-found: error
          retention-days: 7
