name: Verify Final Pre-Production Closure

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  final-preproduction-closure:
    if: github.head_ref == 'verify/final-preproduction-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENGINE_CANDIDATE_SHA: 09239088c92c0e411a488f9636092fca8b54c229
      RUNNER_CANDIDATE_SHA: 8a744052817a04455a3975f3e3e888317df54da1
    steps:
      - name: Checkout verifier carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact Engine candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ env.ENGINE_CANDIDATE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RUNNER_CANDIDATE_SHA }}
          path: runner
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact candidate SHAs and carrier isolation
        run: |
          set -euo pipefail
          test "$(git -C engine rev-parse HEAD)" = "$ENGINE_CANDIDATE_SHA"
          test "$(git -C runner rev-parse HEAD)" = "$RUNNER_CANDIDATE_SHA"
          cmp runner/.github/workflows/produce-resilient-v4.yml .github/workflows/produce-resilient-v4.yml
          test -f runner/scripts/m7_live_binding.py
          test -f runner/scripts/runtime_closure.py
          grep -F 'install_m7_live_binding()' runner/scripts/run_v3_voice.py
          grep -F 'install_runtime_closure()' runner/scripts/run_v3_voice.py
          grep -F 'run_post_gold_observers(out)' runner/scripts/run_v3_voice.py
          git -C engine diff --check
          git -C runner diff --check

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install locked Engine and dependency audit
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
          python -m pip install pip-audit==2.10.1
          pip-audit --no-deps -r requirements-lock.txt

      - name: Focused Security V1 contracts
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_multimodal_firewall \
            tests.test_research_quarantine \
            tests.test_model_output_schemas \
            tests.test_brief_approval_binding \
            tests.test_supply_chain_integrity \
            -v

      - name: Focused Cinematic M7 contracts
        working-directory: engine
        run: |
          set -euo pipefail
          mapfile -t modules < <(
            find tests -maxdepth 1 -type f -name 'test_cinematic_m7*.py' -printf '%p\n' \
              | sort | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          test "${#modules[@]}" -gt 0
          python -m unittest "${modules[@]}" -v

      - name: Focused Runner Runtime closure contracts
        working-directory: runner
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}/runner
        run: |
          set -euo pipefail
          python -m unittest \
            scripts.test_attempt10_append_bound_recovery \
            scripts.test_runtime_closure \
            scripts.test_groq_audio_audit \
            -v

      - name: Full Engine regression
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Approved-Brief CLI contract matrix
        working-directory: engine
        run: |
          set -euo pipefail
          missing="$RUNNER_TEMP/isco-no-approved-brief.json"
          rm -f "$missing"
          ISCO_APPROVED_BRIEF_PATH="$missing" isco-video produce \
            --topic "لماذا تشعر أنك متأخر عن الجميع؟" --format auto --dry-run --no-research
          ISCO_APPROVED_BRIEF_PATH="$missing" isco-video produce \
            --format auto --dry-run --no-research
          isco-video produce --format auto --dry-run --no-research
          if isco-video produce --topic "لماذا تشعر أنك متأخر عن الجميع؟" \
            --format auto --dry-run --no-research; then
            echo 'ERROR: approved-brief mismatch unexpectedly passed' >&2
            exit 1
          fi

      - name: Full Runner regression
        working-directory: runner
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}/runner
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q

      - name: Final non-production invariants
        run: |
          set -euo pipefail
          test -f engine/src/isco_video_agent/multimodal_firewall.py
          test -f engine/src/isco_video_agent/research_quarantine.py
          test -f engine/src/isco_video_agent/model_output_schemas.py
          test -f engine/src/isco_video_agent/brief_approval_binding.py
          test -f engine/src/isco_video_agent/supply_chain_integrity.py
          test -f engine/security/piper_voice_hashes.json
          grep -F 'isco-security-artifact:' engine/requirements-lock.txt
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path('runner/scripts/run_v3_voice.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          main = next(x for x in tree.body if isinstance(x, ast.FunctionDef) and x.name == 'main')
          names=[]
          for node in ast.walk(main):
              if not isinstance(node, ast.Call):
                  continue
              f=node.func
              if isinstance(f, ast.Name): names.append(f.id)
              elif isinstance(f, ast.Attribute): names.append(f.attr)
          assert names.count('produce') == 1, names.count('produce')
          assert names.count('install_m7_live_binding') == 1
          assert names.count('install_runtime_closure') == 1
          assert names.count('run_gold_enforce_phase4') == 1
          assert names.count('run_post_gold_observers') == 1
          print('Final pre-production invariants PASS')
          PY
