name: Verify Private Engine

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  combined-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact Runner verifier candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify Production V4 remains pinned and unchanged
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          canonical = "17102aa8f66e1aefadc94547a9b079aa074bb28f"
          path = Path(".github/workflows/produce-resilient-v4.yml")
          text = path.read_text(encoding="utf-8")
          checkout = re.findall(r"^\s+ref:\s+([0-9a-f]{40})\s*$", text, flags=re.MULTILINE)
          env_pin = re.findall(r"^\s+ISCO_ENGINE_SHA:\s+([0-9a-f]{40})\s*$", text, flags=re.MULTILINE)
          if checkout != [canonical] or env_pin != [canonical]:
              raise SystemExit(f"Production V4 pin changed: checkout={checkout} env={env_pin}")
          if f'test "$(git rev-parse HEAD)" = "{canonical}"' not in text:
              raise SystemExit("Production V4 exact Engine verification changed")
          required = (
              "workflow_dispatch:",
              'brief_path = Path("engine/production/approved_brief.json")',
              'brief.get("approved_by_user") is not True',
              'brief.get("approved_topic")',
              "ISCO_APPROVED_BRIEF_PATH:",
          )
          missing = [needle for needle in required if needle not in text]
          if missing:
              raise SystemExit("Production V4 contract missing: " + ", ".join(missing))
          forbidden = ("inputs.topic", "inputs.format", "TOPIC_INPUT", "FORMAT_INPUT", "push:")
          present = [needle for needle in forbidden if needle in text]
          if present:
              raise SystemExit("Production V4 exposes forbidden request paths: " + ", ".join(present))
          print("Production V4 unchanged at canonical M7 Engine pin")
          PY

      - name: Checkout exact Editorial Room Engine candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: fc1c6fee9a42ab05b2b0f4744e3235df34447ecf
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine candidate
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "fc1c6fee9a42ab05b2b0f4744e3235df34447ecf"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install locked Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Dependency audit
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install pip-audit==2.10.1
          pip-audit --no-deps -r requirements-lock.txt

      - name: Focused Editorial Room and Planner contracts
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest -q \
            tests.test_editorial_room \
            tests.test_editorial_room_director_m7_binding_current_main \
            tests.test_resilient_planner \
            tests.test_resilient_planner_persona_binding \
            tests.test_resilient_planner_underlength_retry \
            tests.test_sensitive_visual_planning_prompt

      - name: Focused Director and M7 compatibility
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest -q \
            tests.test_director_brain_deterministic_contract_current_main \
            tests.test_director_eyes_phase_b \
            tests.test_cinematic_m7_live_binding \
            tests.test_cinematic_m7_visual_timeline

      - name: Full Engine suite
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Approved-Brief CLI contract matrix
        working-directory: engine
        run: |
          set -euo pipefail
          missing="$RUNNER_TEMP/isco-no-approved-brief.json"
          rm -f "$missing"
          ISCO_APPROVED_BRIEF_PATH="$missing" isco-video produce \
            --topic "لماذا تشعر أنك متأخر عن الجميع؟" --format auto --dry-run --no-research
          ISCO_APPROVED_BRIEF_PATH="$missing" isco-video produce \
            --format auto --dry-run --no-research
          isco-video produce --format auto --dry-run --no-research
          if isco-video produce --topic "لماذا تشعر أنك متأخر عن الجميع؟" \
            --format auto --dry-run --no-research; then
            echo 'ERROR: approved-brief mismatch unexpectedly passed' >&2
            exit 1
          fi

      - name: Full Runner regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}:${{ github.workspace }}/scripts
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q

      - name: Verifier isolation and no-production invariants
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/verify-private-engine.yml"
          test -f .github/workflows/produce-resilient-v4.yml
          ! git diff --name-only origin/main...HEAD | grep -q 'produce-resilient-v4.yml'
          ! git diff --name-only origin/main...HEAD | grep -q 'scripts/run_v3_voice.py'
          echo "Verifier isolation PASS; no Production code/pin changes"
