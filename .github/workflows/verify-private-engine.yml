name: Verify Private Engine

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  combined-regression:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'verify/director-brain-robustness-current-main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ENGINE_CANDIDATE_SHA: 607b17b3f408be7f177e0debbcee50b012b89cd3
      CANONICAL_ENGINE_SHA: 79e9993cc0d9459adc2585b9b46c6526f8c1cb6b
    steps:
      - name: Checkout exact Runner verifier candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify production V4 remains canonical and unchanged
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('.github/workflows/produce-resilient-v4.yml')
          text = path.read_text(encoding='utf-8')
          checkout = re.findall(r'^\s+ref:\s+([0-9a-f]{40})\s*$', text, flags=re.MULTILINE)
          explicit_verify = re.findall(r'git rev-parse HEAD\)" = "([0-9a-f]{40})"', text)
          expected = os.environ['CANONICAL_ENGINE_SHA']
          if checkout != [expected] or explicit_verify != [expected]:
              raise SystemExit(
                  f'Canonical V4 Engine pin changed unexpectedly: checkout={checkout} verify={explicit_verify}'
              )
          required = (
              'workflow_dispatch:',
              'brief_path = Path("engine/production/approved_brief.json")',
              'brief.get("approved_by_user") is not True',
              'brief.get("approved_topic")',
              'ISCO_APPROVED_BRIEF_PATH:',
          )
          missing = [needle for needle in required if needle not in text]
          if missing:
              raise SystemExit('Canonical V4 contract missing: ' + ', '.join(missing))
          forbidden = ('inputs.topic', 'inputs.format', 'TOPIC_INPUT', 'FORMAT_INPUT', 'EVENT_NAME', 'push:')
          present = [needle for needle in forbidden if needle in text]
          if present:
              raise SystemExit('Canonical V4 exposes legacy request paths: ' + ', '.join(present))
          print(f'Canonical production V4 unchanged at Engine {expected}; testing unmerged candidate separately')
          PY

      - name: Checkout exact private Engine candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ env.ENGINE_CANDIDATE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine candidate checkout
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "$ENGINE_CANDIDATE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install locked Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Dependency audit
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install pip-audit==2.10.1
          pip-audit --no-deps -r requirements-lock.txt

      - name: Focused Director Phase A robustness regression
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest tests/test_director_brain_deterministic_contract_current_main.py -v
          python -m unittest tests/test_director_brain_phase_a.py -v
          python -m unittest tests/test_director_eyes_phase_b.py -v

      - name: Full Engine suite
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Approved-Brief CLI contract matrix
        working-directory: engine
        run: |
          set -euo pipefail
          missing="$RUNNER_TEMP/isco-no-approved-brief.json"
          rm -f "$missing"
          ISCO_APPROVED_BRIEF_PATH="$missing" isco-video produce \
            --topic "لماذا تشعر أنك متأخر عن الجميع؟" --format auto --dry-run --no-research
          ISCO_APPROVED_BRIEF_PATH="$missing" isco-video produce \
            --format auto --dry-run --no-research
          isco-video produce --format auto --dry-run --no-research
          if isco-video produce --topic "لماذا تشعر أنك متأخر عن الجميع؟" \
            --format auto --dry-run --no-research; then
            echo 'ERROR: approved-brief mismatch unexpectedly passed' >&2
            exit 1
          fi

      - name: Full Runner regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q

      - name: Verifier isolation sanity
        run: |
          set -euo pipefail
          git diff --check
          test -f .github/workflows/produce-resilient-v4.yml
          test -f .github/workflows/verify-private-engine.yml
          test "$ENGINE_CANDIDATE_SHA" != "$CANONICAL_ENGINE_SHA"
          git diff --name-only origin/main...HEAD | grep -Fx '.github/workflows/verify-private-engine.yml'
          test "$(git diff --name-only origin/main...HEAD | wc -l)" -eq 1
          echo 'Verifier-only candidate test PASS; production V4 pin was not modified.'
