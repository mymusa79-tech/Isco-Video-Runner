name: Validate Engine Opening Recovery Patch

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate-opening-recovery:
    if: github.head_ref == 'ops/final-canonical-v4-once'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Engine fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: fix/opening-director-bounded-recovery
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Apply minimal orchestrator wiring in workspace only
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('engine/src/isco_video_agent/orchestrator.py')
          text = path.read_text(encoding='utf-8')
          old = '''                audit_fn=_visual_audit_fn,
                cache=visual_cache,
                exclude_ids={"pexels": excluded_pexels},
            )
            reviews = opening_sequence.reviewed
'''
          new = '''                audit_fn=_visual_audit_fn,
                cache=visual_cache,
                exclude_ids={"pexels": excluded_pexels},
                alternate_query_fn=_alternate_query_fn if gemini else None,
                alternate_search_fn=_search_provider if gemini else None,
            )
            reviews = opening_sequence.reviewed
'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one opening wiring target; found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git -C engine diff --check
          git -C engine diff -- src/isco_video_agent/orchestrator.py

      - name: Run focused opening recovery regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src
        run: |
          set -euo pipefail
          python -m unittest engine/tests/test_cinematic_m6_opening_selection.py -v
          python -m py_compile engine/src/isco_video_agent/opening_director.py engine/src/isco_video_agent/orchestrator.py

      - name: Upload patched orchestrator for connector commit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opening-recovery-orchestrator
          path: engine/src/isco_video_agent/orchestrator.py
          if-no-files-found: error
          retention-days: 1
