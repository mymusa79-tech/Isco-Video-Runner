name: Verify Private Engine

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  combined-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact private Engine M7 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 72844260a086c91fd36fc584598baba6bae15bc9
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact candidate SHAs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C engine rev-parse HEAD)" = "72844260a086c91fd36fc584598baba6bae15bc9"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install locked Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: M7 focused Engine contracts
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_cinematic_m7_visual_timeline \
            tests.test_cinematic_m7_live_binding -q

      - name: Full Engine suite
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Approved-Brief CLI contract matrix
        working-directory: engine
        run: |
          set -euo pipefail
          missing="$RUNNER_TEMP/isco-no-approved-brief.json"
          rm -f "$missing"
          ISCO_APPROVED_BRIEF_PATH="$missing" isco-video produce \
            --topic "لماذا تشعر أنك متأخر عن الجميع؟" --format auto --dry-run --no-research
          ISCO_APPROVED_BRIEF_PATH="$missing" isco-video produce \
            --format auto --dry-run --no-research
          isco-video produce --format auto --dry-run --no-research
          if isco-video produce --topic "لماذا تشعر أنك متأخر عن الجميع؟" \
            --format auto --dry-run --no-research; then
            echo 'ERROR: approved-brief mismatch unexpectedly passed' >&2
            exit 1
          fi

      - name: M7 focused Runner contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m unittest scripts.test_m7_live_binding scripts.test_run_v3_voice -q

      - name: Full Runner regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q

      - name: M7 single-render production wiring invariants
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          run_path = Path('scripts/run_v3_voice.py')
          tree = ast.parse(run_path.read_text(encoding='utf-8'))
          produce_calls = 0
          install_calls = 0
          for node in ast.walk(tree):
              if not isinstance(node, ast.Call):
                  continue
              func = node.func
              if isinstance(func, ast.Attribute) and isinstance(func.value, ast.Name):
                  if func.value.id == 'orchestrator' and func.attr == 'produce':
                      produce_calls += 1
              if isinstance(func, ast.Name) and func.id == 'install_m7_live_binding':
                  install_calls += 1
          if produce_calls != 1:
              raise SystemExit(f'Expected exactly one orchestrator.produce call, got {produce_calls}')
          if install_calls != 1:
              raise SystemExit(f'Expected exactly one install_m7_live_binding call, got {install_calls}')

          required = [
              Path('engine/src/isco_video_agent/cinematic_m7_visual_timeline.py'),
              Path('engine/src/isco_video_agent/cinematic_m7_runtime.py'),
              Path('engine/src/isco_video_agent/cinematic_m7_live_binding.py'),
              Path('scripts/m7_live_binding.py'),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit('Missing M7 runtime files: ' + ', '.join(missing))
          print('M7 single-render wiring PASS')
          PY

      - name: Dependency audit
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install pip-audit==2.10.1
          pip-audit --no-deps -r requirements-lock.txt

      - name: Diff sanity
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD || git diff --check
