name: Verify Private Engine

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/verify-private-engine.yml
      - scripts/voice_mesh.py
      - scripts/test_voice_mesh.py

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout runner verification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: runner
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout private engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 78a08d385c3b70f055c7f47790fa7951a97d66a6
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install locked runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Runner voice-mesh regression tests
        working-directory: runner
        run: python -m unittest scripts.test_voice_mesh -v

      - name: Unit and media tests
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Dry-run orchestration with explicit topic
        working-directory: engine
        run: isco-video produce --topic "لماذا تشعر أنك متأخر عن الجميع؟" --format auto --dry-run --no-research

      - name: Dry-run autonomous topic selection
        working-directory: engine
        run: isco-video produce --format auto --dry-run --no-research

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 78a08d385c3b70f055c7f47790fa7951a97d66a6
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Audit fully pinned runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install pip-audit==2.10.1
          pip-audit --no-deps -r requirements-lock.txt
