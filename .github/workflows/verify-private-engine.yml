name: Verify Private Engine

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  combined-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact Runner verifier candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Verify binding candidate and untouched Production V4 pin
        id: contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import os
          import re
          from pathlib import Path

          production = Path('.github/workflows/produce-resilient-v4.yml').read_text(encoding='utf-8')
          canonical_old = '79e9993cc0d9459adc2585b9b46c6526f8c1cb6b'
          engine_candidate = '17102aa8f66e1aefadc94547a9b079aa074bb28f'
          checkout = re.findall(r'^\s+ref:\s+([0-9a-f]{40})\s*$', production, flags=re.MULTILINE)
          env_pin = re.findall(r'^\s+ISCO_ENGINE_SHA:\s+([0-9a-f]{40})\s*$', production, flags=re.MULTILINE)
          if checkout != [canonical_old] or env_pin != [canonical_old]:
              raise SystemExit(f'Production V4 pin changed unexpectedly: checkout={checkout} env={env_pin}')

          runner = Path('scripts/run_v3_voice.py').read_text(encoding='utf-8')
          if runner.count('from scripts.m7_live_binding import install_m7_live_binding') != 1:
              raise SystemExit('M7 binding import must exist exactly once')
          if runner.count('install_m7_live_binding()') != 1:
              raise SystemExit('M7 binding installer must execute exactly once')
          if 'groq_audio_audit' in runner or 'run_groq_audio_audit' in runner:
              raise SystemExit('G1/G2 audio audit must remain unwired from Production')

          tree = ast.parse(runner)
          core_calls = 0
          for node in ast.walk(tree):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                  if isinstance(node.func.value, ast.Name) and node.func.value.id == 'orchestrator' and node.func.attr == 'produce':
                      core_calls += 1
          if core_calls != 1:
              raise SystemExit(f'Expected exactly one orchestrator.produce call, got {core_calls}')

          required = (
              'workflow_dispatch:',
              'brief_path = Path("engine/production/approved_brief.json")',
              'brief.get("approved_by_user") is not True',
              'brief.get("approved_topic")',
              'ISCO_APPROVED_BRIEF_PATH:',
          )
          missing = [needle for needle in required if needle not in production]
          if missing:
              raise SystemExit('Canonical V4 contract missing: ' + ', '.join(missing))
          forbidden = ('inputs.topic', 'inputs.format', 'TOPIC_INPUT', 'FORMAT_INPUT', 'EVENT_NAME', 'push:')
          present = [needle for needle in forbidden if needle in production]
          if present:
              raise SystemExit('Canonical V4 exposes legacy request paths: ' + ', '.join(present))

          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as fh:
              fh.write(f'engine_sha={engine_candidate}\n')
          print(f'M7 binding certification contract PASS: engine_candidate={engine_candidate}; production_pin={canonical_old}')
          PY

      - name: Checkout exact private Engine candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ steps.contract.outputs.engine_sha }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine candidate checkout
        working-directory: engine
        env:
          ENGINE_SHA: ${{ steps.contract.outputs.engine_sha }}
        run: test "$(git rev-parse HEAD)" = "$ENGINE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install locked Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Dependency audit
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install pip-audit==2.10.1
          pip-audit --no-deps -r requirements-lock.txt

      - name: Focused M7 Engine contracts
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_cinematic_m7_live_binding \
            tests.test_cinematic_m7_visual_timeline \
            tests.test_director_brain_deterministic_contract_current_main \
            tests.test_director_brain_phase_a -q

      - name: Focused M7 Runner binding contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}:${{ github.workspace }}/scripts
        run: python -m unittest scripts.test_m7_live_binding scripts.test_run_v3_voice -q

      - name: Full Engine suite
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Approved-Brief CLI contract matrix
        working-directory: engine
        run: |
          set -euo pipefail
          missing="$RUNNER_TEMP/isco-no-approved-brief.json"
          rm -f "$missing"
          ISCO_APPROVED_BRIEF_PATH="$missing" isco-video produce \
            --topic "لماذا تشعر أنك متأخر عن الجميع؟" --format auto --dry-run --no-research
          ISCO_APPROVED_BRIEF_PATH="$missing" isco-video produce \
            --format auto --dry-run --no-research
          isco-video produce --format auto --dry-run --no-research
          if isco-video produce --topic "لماذا تشعر أنك متأخر عن الجميع؟" \
            --format auto --dry-run --no-research; then
            echo 'ERROR: approved-brief mismatch unexpectedly passed' >&2
            exit 1
          fi

      - name: Full Runner regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}:${{ github.workspace }}/scripts
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q

      - name: Verifier isolation sanity
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD || git diff --check
          test -f scripts/m7_live_binding.py
          test -f .github/workflows/produce-resilient-v4.yml
          test -f .github/workflows/verify-private-engine.yml
