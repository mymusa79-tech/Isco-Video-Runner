name: Observe Final Canonical V4 via Existing PR Workflow

on:
  pull_request:
    branches: ["main"]

permissions:
  actions: read
  contents: read

jobs:
  observe-final-v4:
    if: github.head_ref == 'ops/final-canonical-v4-once'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect recent canonical V4 runs read-only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          url = f'https://api.github.com/repos/{repo}/actions/workflows/produce-resilient-v4.yml/runs?event=workflow_dispatch&branch=main&per_page=20'
          req = urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'isco-final-v4-observer',
          })
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)
          slim = [{k: x.get(k) for k in ('id','run_number','status','conclusion','created_at','updated_at','head_sha','event','html_url')} for x in data.get('workflow_runs', [])[:12]]
          print('RECENT_V4_RUNS=' + json.dumps(slim, sort_keys=True))
          active = [x for x in slim if x['status'] not in ('completed',)]
          print('ACTIVE_V4_RUNS=' + json.dumps(active, sort_keys=True))
          PY
