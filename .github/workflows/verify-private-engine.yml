name: Verify P0-1 Final Section Length

on:
  pull_request:
    branches: ["main"]
    types: [synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  p0-1-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact private Engine P0-1 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 103d5c4ce522f70848f45bfba7a3b7dfcd6a1f7f
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Apply guarded orchestrator wiring in working tree
        working-directory: engine
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/isco_video_agent/orchestrator.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "from .repair_dossier import apply_single_repair, build_dossier",
              "from .repair_dossier import (\n"
              "    FILM_SECTION_MAX_WORDS,\n"
              "    FILM_SECTION_MIN_WORDS,\n"
              "    apply_single_repair,\n"
              "    build_dossier,\n"
              "    check_section_word_bands,\n"
              ")",
              "repair_dossier import",
          )

          marker = "\ndef _visual_fit_score(audit: dict) -> float:\n"
          helper = '''

def _final_film_section_structure_issues(plan) -> list:
    """Hard final Film section band on the exact narration that can reach TTS."""
    if getattr(plan, "format", None) != "film":
        return []
    sections = [
        {"id": sec.id, "narration": sec.narration, "target_words": 120}
        for sec in plan.sections
    ]
    return check_section_word_bands(
        sections,
        minimum_words=FILM_SECTION_MIN_WORDS,
        maximum_words=FILM_SECTION_MAX_WORDS,
    )
'''
          replace_once(marker, helper + marker, "final Film helper insertion")

          replace_once(
              '''    dossier = build_dossier(
        structure_issues=[], novelty_flags=novelty,
        factuality_audit=fact_audit, semantic_repetition_audit=content_audit, tone_audit=tone_audit,
    )''',
              '''    dossier = build_dossier(
        structure_issues=_final_film_section_structure_issues(plan), novelty_flags=novelty,
        factuality_audit=fact_audit, semantic_repetition_audit=content_audit, tone_audit=tone_audit,
    )''',
              "initial dossier structure wiring",
          )

          replace_once(
              '''        return build_dossier(
            structure_issues=[], novelty_flags=r_novelty,
            factuality_audit=r_fact, semantic_repetition_audit=r_content, tone_audit=r_tone,
        )''',
              '''        return build_dossier(
            structure_issues=_final_film_section_structure_issues(repaired_plan), novelty_flags=r_novelty,
            factuality_audit=r_fact, semantic_repetition_audit=r_content, tone_audit=r_tone,
        )''',
              "re-audit dossier structure wiring",
          )

          replace_once(
              '''    _write_json(out / "repair-dossier.json", {
        "needed_repair_initially": dossier.needs_repair,''',
              '''    final_structure_issues = (
        repair_outcome.dossier_after.structure_issues
        if repair_outcome is not None and repair_outcome.dossier_after is not None
        else dossier.structure_issues
    )
    _write_json(out / "repair-dossier.json", {
        "needed_repair_initially": dossier.needs_repair,''',
              "final structure state",
          )

          replace_once(
              '''    if novelty and not dry_run:
        raise RuntimeError("Anti-repetition quality gate failed on final script: " + "; ".join(novelty))''',
              '''    if final_structure_issues and not dry_run:
        details = "; ".join(f"{issue.section_id} {issue.detail}" for issue in final_structure_issues)
        raise RuntimeError(
            "Final Film section-length invariant failed before TTS after the single RepairDossier repair: " + details
        )
    if novelty and not dry_run:
        raise RuntimeError("Anti-repetition quality gate failed on final script: " + "; ".join(novelty))''',
              "pre-TTS structure fail-closed gate",
          )

          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile src/isco_video_agent/orchestrator.py
          git diff --check
          git diff -- src/isco_video_agent/orchestrator.py

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install locked Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Focused P0-1 regression
        working-directory: engine
        run: python -m unittest tests.test_final_section_length_invariant -v

      - name: Full Engine suite
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Dependency audit
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install pip-audit==2.10.1
          pip-audit --no-deps -r requirements-lock.txt

      - name: Full Runner regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q

      - name: Publish verified Engine P0-1 commit
        working-directory: engine
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          REPO: mymusa79-tech/Isco-Video-Agent
        run: |
          set -euo pipefail
          base_commit="$(git rev-parse HEAD)"
          test "$base_commit" = "103d5c4ce522f70848f45bfba7a3b7dfcd6a1f7f"
          base_tree="$(git rev-parse HEAD^{tree})"
          blob_sha="$(gh api --method POST "repos/$REPO/git/blobs" -f content="$(cat src/isco_video_agent/orchestrator.py)" -f encoding=utf-8 --jq '.sha')"
          tree_json="$(jq -n --arg base "$base_tree" --arg blob "$blob_sha" '{base_tree:$base,tree:[{path:"src/isco_video_agent/orchestrator.py",mode:"100644",type:"blob",sha:$blob},{path:".github/workflows/patch-final-section-length-orchestrator.yml",mode:"100644",type:"blob",sha:null}]}')"
          tree_sha="$(printf '%s' "$tree_json" | gh api --method POST "repos/$REPO/git/trees" --input - --jq '.sha')"
          commit_json="$(jq -n --arg msg 'fix: wire final film section bands into orchestrator' --arg tree "$tree_sha" --arg parent "$base_commit" '{message:$msg,tree:$tree,parents:[$parent]}')"
          commit_sha="$(printf '%s' "$commit_json" | gh api --method POST "repos/$REPO/git/commits" --input - --jq '.sha')"
          gh api --method PATCH "repos/$REPO/git/refs/heads/fix/final-section-length-invariant" -f sha="$commit_sha" -F force=false >/dev/null
          echo "VERIFIED_ENGINE_SHA=$commit_sha"
