name: Inspect Run 55 Production Failure

on:
  pull_request:
    branches: ["main"]

permissions:
  actions: read
  contents: read

jobs:
  inspect-run55:
    if: github.head_ref == 'ops/final-canonical-v4-once'
    runs-on: ubuntu-latest
    steps:
      - name: Extract targeted failure evidence read-only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, os, re, urllib.error, urllib.request, zipfile

          repo = os.environ['GITHUB_REPOSITORY']
          job_id = 96375672648

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          api_url = f'https://api.github.com/repos/{repo}/actions/jobs/{job_id}/logs'
          req = urllib.request.Request(
              api_url,
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'isco-run55-log-inspector',
              },
          )
          opener = urllib.request.build_opener(NoRedirect())
          try:
              opener.open(req, timeout=30)
              raise SystemExit('Expected GitHub Actions logs endpoint to redirect')
          except urllib.error.HTTPError as exc:
              if exc.code not in (302, 303, 307):
                  raise
              location = exc.headers.get('Location')
              if not location:
                  raise SystemExit('Actions logs redirect had no Location header')

          # The signed blob URL must be fetched WITHOUT the GitHub Authorization header.
          blob_req = urllib.request.Request(location, headers={'User-Agent': 'isco-run55-log-inspector'})
          with urllib.request.urlopen(blob_req, timeout=60) as r:
              raw = r.read()

          if raw[:2] == b'PK':
              with zipfile.ZipFile(io.BytesIO(raw)) as zf:
                  chunks = []
                  for name in zf.namelist():
                      if not name.endswith('/'):
                          chunks.append(zf.read(name).decode('utf-8', 'replace'))
                  text = '\n'.join(chunks)
          else:
              text = raw.decode('utf-8', 'replace')

          lines = text.splitlines()
          patterns = re.compile(r'Traceback|RuntimeError|ValueError|Exception|Error|FAILED|failed|BLOCK|blocked|visual|Pexels|Pixabay|media|ffmpeg|No (?:video|visual)|candidate|Final Critic', re.I)
          hits = [i for i, line in enumerate(lines) if patterns.search(line)]
          ranges = []
          for i in hits:
              lo, hi = max(0, i-18), min(len(lines), i+25)
              if ranges and lo <= ranges[-1][1] + 4:
                  ranges[-1] = (ranges[-1][0], max(ranges[-1][1], hi))
              else:
                  ranges.append((lo, hi))
          ranges = ranges[-6:]
          print('=== TARGETED_ERROR_WINDOWS ===')
          for lo, hi in ranges:
              print(f'--- lines {lo+1}-{hi} ---')
              for line in lines[lo:hi]:
                  print(line)
          print('=== FINAL_180_LOG_LINES ===')
          for line in lines[-180:]:
              print(line)
          PY
