name: Voice Sample Test (Gacrux vs Charon vs Orus vs Sadaltager vs Schedar)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  synthesize_samples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout private engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 8e898e65af7148f088ad357c438e7e1d2dd95c63
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install locked engine
        run: |
          set -euo pipefail
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .

      - name: Prepare secure secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          umask 077
          mkdir -p "$RUNNER_TEMP/isco-secrets"
          printf '%s' "$GEMINI_API_KEY" > "$RUNNER_TEMP/isco-secrets/gemini"

      - name: Synthesize voice samples
        env:
          GEMINI_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/gemini
        run: |
          set -euo pipefail
          mkdir -p voice-samples
          python - <<'PY'
          import os
          from pathlib import Path
          from unittest.mock import patch

          import isco_video_agent.providers.gemini as gem

          api_key = Path(os.environ["GEMINI_API_KEY_FILE"]).read_text().strip()
          text_sample = (
              "هل أنت متأخر فعلًا، أم أنك تستخدم مقياسًا لم يُصنع لحياتك أصلًا؟ "
              "خلال دقائق سنفكك هذا المقياس ونرى ما الذي يستحق أن تقيسه بدلًا منه."
          )
          voices = ["Gacrux", "Charon", "Orus", "Sadaltager", "Schedar"]
          out_dir = Path("voice-samples")

          for voice in voices:
              out = out_dir / f"voice_test_{voice.lower()}.wav"
              with patch.object(gem, "_voice_identity", return_value=(voice, "Iapetus")):
                  gem.synthesize_wav(
                      api_key,
                      text_sample,
                      out,
                      model="gemini-3.1-flash-tts-preview",
                      voice=voice,
                      style="",
                  )
              size = out.stat().st_size
              print(f"OK {voice}: {out} ({size} bytes)")
              if size < 1024:
                  raise SystemExit(f"{voice} produced suspiciously small audio")
          PY

      - name: Upload voice samples
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: voice-samples
          path: voice-samples/*.wav
          if-no-files-found: error
          retention-days: 3
