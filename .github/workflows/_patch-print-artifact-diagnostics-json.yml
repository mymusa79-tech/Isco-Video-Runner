name: Patch print artifact diagnostics JSON

# One-time-use diagnostic tool, matching the _patch-*.yml convention in this repo.
#
# Investigating req-c39f532991c1's third production failure ("Independent
# factuality/AI-expert gate blocked real production") needs the actual
# factuality-audit.json content from that failed run's uploaded diagnostics
# artifact, but this session's sandbox cannot reach GitHub's artifact blob
# storage directly (its network egress policy blocks *.blob.core.windows.net).
# This workflow downloads the artifact from *inside* Actions instead (which has
# no such restriction), reusing the exact `gh api .../artifacts/{id}/zip` + unzip
# pattern resume-gold-qc-pending.yml's "Download exact QC_PENDING recovery
# artifact" step already uses, then prints the requested file's content straight
# to the job log -- which is readable from outside via the Actions API.
#
# Read-only: downloads and prints one existing artifact's content. Touches no
# quality gate, security gate, or Gold acceptance/release-authority logic, and
# writes nothing back to any state.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run id whose diagnostics artifact to inspect"
        required: true
        type: string
      file_glob:
        description: "Glob (relative to the unzipped artifact root) of the file to print"
        required: true
        type: string
        default: "*/factuality-audit.json"

permissions:
  contents: read
  actions: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download artifact and print requested diagnostics file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          FILE_GLOB: ${{ inputs.file_glob }}
        run: |
          set -euo pipefail
          test -n "$RUN_ID"
          test -n "$FILE_GLOB"
          json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")"
          count="$(printf '%s' "$json" | jq '[.artifacts[] | select(.expired == false)] | length')"
          test "$count" -ge 1
          artifact_id="$(printf '%s' "$json" | jq -r '[.artifacts[] | select(.expired == false)][0].id')"
          test -n "$artifact_id"
          archive="$RUNNER_TEMP/diagnostics.zip"
          extracted="$RUNNER_TEMP/diagnostics"
          mkdir -p "$extracted"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$archive"
          unzip -q "$archive" -d "$extracted"
          matches="$(find "$extracted" -path "$extracted/$FILE_GLOB" -type f || true)"
          if [ -z "$matches" ]; then
            echo "No file matched glob: $FILE_GLOB"
            echo "--- Full extracted file listing ---"
            find "$extracted" -type f
            exit 1
          fi
          while IFS= read -r file; do
            echo "=== $file ==="
            cat "$file"
            echo
          done <<< "$matches"
