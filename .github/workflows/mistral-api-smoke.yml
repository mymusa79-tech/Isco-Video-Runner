name: Mistral API Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - test/mistral-api-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - name: Verify secret is present
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MISTRAL_API_KEY:-}" ]; then
            echo "MISTRAL_API_KEY is not available to this workflow" >&2
            exit 1
          fi
          echo "MISTRAL_API_KEY is present"

      - name: Verify Mistral authentication and Ministral 8B visibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          api_key = os.environ["MISTRAL_API_KEY"]
          request = urllib.request.Request(
              "https://api.mistral.ai/v1/models",
              headers={"Authorization": f"Bearer {api_key}", "Accept": "application/json"},
              method="GET",
          )
          with urllib.request.urlopen(request, timeout=45) as response:
              status = response.status
              data = json.loads(response.read().decode("utf-8"))

          models = data.get("data") if isinstance(data, dict) else None
          if status != 200 or not isinstance(models, list):
              raise SystemExit("Mistral models check failed")
          ids = {str(item.get("id")) for item in models if isinstance(item, dict) and item.get("id")}
          if "ministral-8b-latest" not in ids:
              raise SystemExit("ministral-8b-latest is not visible")
          print("Mistral authentication test: PASS")
          print("ministral-8b-latest visible: True")
          PY

      - name: Verify Arabic JSON mode on Ministral 8B
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          api_key = os.environ["MISTRAL_API_KEY"]
          model = "ministral-8b-latest"
          prompt = (
              "أعد JSON فقط. حلّل الجملة العربية التالية لمهمة مونتاج فيديو قصيرة: "
              "'حين ينطفئ الدافع، لا تنتظر الشعور المناسب؛ ابدأ بخطوة صغيرة.' "
              "استخدم هذه المفاتيح فقط: intent, tone, visual_query, decision. "
              "اجعل كل قيمة نصية قصيرة جدًا، وdecision إما PASS أو BLOCK فقط."
          )
          payload = json.dumps({
              "model": model,
              "messages": [{"role": "user", "content": prompt}],
              "temperature": 0,
              "max_tokens": 320,
              "response_format": {"type": "json_object"},
          }, ensure_ascii=False).encode("utf-8")

          request = urllib.request.Request(
              "https://api.mistral.ai/v1/chat/completions",
              data=payload,
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Accept": "application/json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  status = response.status
                  data = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              raw = exc.read().decode("utf-8", errors="replace")
              print(f"JSON-mode HTTP error: {exc.code} {exc.reason}", file=sys.stderr)
              try:
                  error = json.loads(raw)
              except Exception:
                  error = {}
              if isinstance(error, dict):
                  safe = {k: error[k] for k in ("message", "detail", "type", "code", "object") if k in error and isinstance(error[k], (str, int, float, bool))}
                  if safe:
                      print("Mistral error details: " + json.dumps(safe, ensure_ascii=False), file=sys.stderr)
              raise SystemExit(1)

          if status != 200:
              raise SystemExit(f"Unexpected HTTP status: {status}")
          choices = data.get("choices") if isinstance(data, dict) else None
          if not isinstance(choices, list) or not choices:
              raise SystemExit("No choices returned")
          choice = choices[0]
          message = choice.get("message") if isinstance(choice, dict) else None
          content = message.get("content") if isinstance(message, dict) else None
          finish_reason = choice.get("finish_reason") if isinstance(choice, dict) else None
          if not isinstance(content, str) or not content.strip():
              raise SystemExit("Empty content")

          try:
              obj = json.loads(content)
          except Exception as exc:
              raise SystemExit(f"JSON mode returned invalid JSON: {exc}; finish_reason={finish_reason}")

          expected = {"intent", "tone", "visual_query", "decision"}
          if set(obj) != expected:
              raise SystemExit(f"Unexpected keys: {sorted(obj)}")
          if obj.get("decision") not in {"PASS", "BLOCK"}:
              raise SystemExit("Invalid decision value")
          for key in ("intent", "tone", "visual_query"):
              if not isinstance(obj.get(key), str) or not obj[key].strip():
                  raise SystemExit(f"Missing non-empty string: {key}")

          print("Arabic JSON-mode probe: PASS")
          print(f"HTTP status: {status}")
          print(f"Model requested: {model}")
          print(f"Finish reason: {finish_reason}")
          print("Valid JSON: True")
          print("Exact keys: True")
          print("Decision enum valid: True")
          PY
