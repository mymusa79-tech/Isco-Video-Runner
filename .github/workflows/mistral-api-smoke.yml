name: Mistral API Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - test/mistral-api-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - name: Verify secret is present
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MISTRAL_API_KEY:-}" ]; then
            echo "MISTRAL_API_KEY is not available to this workflow" >&2
            exit 1
          fi
          echo "MISTRAL_API_KEY is present"

      - name: Verify Mistral authentication and target models
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          api_key = os.environ["MISTRAL_API_KEY"]
          request = urllib.request.Request(
              "https://api.mistral.ai/v1/models",
              headers={"Authorization": f"Bearer {api_key}", "Accept": "application/json"},
              method="GET",
          )
          with urllib.request.urlopen(request, timeout=45) as response:
              status = response.status
              data = json.loads(response.read().decode("utf-8"))

          models = data.get("data") if isinstance(data, dict) else None
          if status != 200 or not isinstance(models, list):
              raise SystemExit("Mistral models check failed")

          ids = {str(item.get("id")) for item in models if isinstance(item, dict) and item.get("id")}
          for required in ("mistral-small-latest", "ministral-3b-latest"):
              if required not in ids:
                  raise SystemExit(f"Required diagnostic model is not visible: {required}")

          print("Mistral authentication test: PASS")
          print(f"HTTP status: {status}")
          print(f"Visible models: {len(ids)}")
          print("mistral-small-latest visible: True")
          print("ministral-3b-latest visible: True")
          PY

      - name: Probe lowest-cost text generation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          api_key = os.environ["MISTRAL_API_KEY"]
          model = "ministral-3b-latest"
          payload = json.dumps({
              "model": model,
              "messages": [{"role": "user", "content": "Reply: OK"}],
              "temperature": 0,
              "max_tokens": 4,
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.mistral.ai/v1/chat/completions",
              data=payload,
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Accept": "application/json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  status = response.status
                  body = response.read().decode("utf-8")
          except urllib.error.HTTPError as exc:
              raw = exc.read().decode("utf-8", errors="replace")
              print(f"Diagnostic generation HTTP error: {exc.code} {exc.reason}", file=sys.stderr)
              try:
                  data = json.loads(raw)
              except Exception:
                  data = {}
              if isinstance(data, dict):
                  safe = {k: data[k] for k in ("message", "detail", "type", "code", "object") if k in data and isinstance(data[k], (str, int, float, bool))}
                  if safe:
                      print("Mistral error details: " + json.dumps(safe, ensure_ascii=False), file=sys.stderr)
              raise SystemExit(1)

          if status != 200:
              raise SystemExit(f"Unexpected generation HTTP status: {status}")

          data = json.loads(body)
          choices = data.get("choices") if isinstance(data, dict) else None
          if not isinstance(choices, list) or not choices:
              raise SystemExit("Generation response contains no choices")

          message = choices[0].get("message") if isinstance(choices[0], dict) else None
          content = message.get("content") if isinstance(message, dict) else None
          if not isinstance(content, str) or not content.strip():
              raise SystemExit("Generation returned empty content")

          print("Lowest-cost generation probe: PASS")
          print(f"HTTP status: {status}")
          print(f"Model requested: {model}")
          print("Non-empty response: True")
          PY
