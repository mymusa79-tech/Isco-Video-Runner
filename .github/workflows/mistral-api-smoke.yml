name: Mistral API Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - test/mistral-api-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - name: Verify secret is present
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MISTRAL_API_KEY:-}" ]; then
            echo "MISTRAL_API_KEY is not available to this workflow" >&2
            exit 1
          fi
          echo "MISTRAL_API_KEY is present"

      - name: Verify Mistral authentication without generation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          api_key = os.environ.get("MISTRAL_API_KEY", "")
          if not api_key:
              raise SystemExit("MISTRAL_API_KEY missing")

          request = urllib.request.Request(
              "https://api.mistral.ai/v1/models",
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Accept": "application/json",
              },
              method="GET",
          )

          try:
              with urllib.request.urlopen(request, timeout=45) as response:
                  status = response.status
                  body = response.read().decode("utf-8")
          except urllib.error.HTTPError as exc:
              raw = exc.read().decode("utf-8", errors="replace")
              print(f"Mistral models endpoint HTTP error: {exc.code} {exc.reason}", file=sys.stderr)
              try:
                  data = json.loads(raw)
              except Exception:
                  data = {}
              if isinstance(data, dict):
                  safe = {k: data[k] for k in ("message", "detail", "type", "code", "object") if k in data and isinstance(data[k], (str, int, float, bool))}
                  if safe:
                      print("Mistral error details: " + json.dumps(safe, ensure_ascii=False), file=sys.stderr)
              raise SystemExit(1)

          if status != 200:
              raise SystemExit(f"Unexpected HTTP status: {status}")

          data = json.loads(body)
          models = data.get("data") if isinstance(data, dict) else None
          if not isinstance(models, list):
              raise SystemExit("Mistral models response has unexpected shape")

          ids = {str(item.get("id")) for item in models if isinstance(item, dict) and item.get("id")}
          print("Mistral authentication test: PASS")
          print(f"HTTP status: {status}")
          print(f"Visible models: {len(ids)}")
          print(f"mistral-small-latest visible: {'mistral-small-latest' in ids}")
          print(f"mistral-medium-latest visible: {'mistral-medium-latest' in ids}")
          PY
