name: One-Off Run 98 Podcast Dispatch

on:
  push:
    branches:
      - fix/run97-podcast-question-retry
    paths:
      - .github/workflows/one-off-run98-podcast.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ensure no production is active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/clean-v2-telegram-production.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
          test "$active" = "0"

      - name: Dispatch Run 97 podcast request on current main
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: req-e5c7f47856a0
          REQUEST_SHA256: ad1718d06b0fa3180ded2f822c962b1ea93c4eed58f20d182a4083fabcfdfc87
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg ref "main" \
            --arg request_id "$REQUEST_ID" \
            --arg request_sha256 "$REQUEST_SHA256" \
            '{ref:$ref,inputs:{request_id:$request_id,request_sha256:$request_sha256}}')"
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/dispatch-response.txt" --write-out '%{http_code}' \
            -X POST "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/clean-v2-telegram-production.yml/dispatches" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "$payload")"
          if [ "$code" != "204" ]; then
            cat "$RUNNER_TEMP/dispatch-response.txt"
          fi
          test "$code" = "204"
