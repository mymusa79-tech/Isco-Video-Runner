name: One-time State Recovery Smoke

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/state-recovery-smoke.yml"

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout public runner repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Recover encrypted state from verified production artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9160230703/zip" > "$RUNNER_TEMP/artifact.zip"
          mkdir -p "$RUNNER_TEMP/artifact"
          unzip -q "$RUNNER_TEMP/artifact.zip" history.json.enc -d "$RUNNER_TEMP/artifact"
          test -s "$RUNNER_TEMP/artifact/history.json.enc"
          mkdir -p state
          cp "$RUNNER_TEMP/artifact/history.json.enc" state/history.json.enc
          git add state/history.json.enc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Recover encrypted production state from run 3"
          git push origin HEAD:main
