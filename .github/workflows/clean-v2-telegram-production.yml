name: Clean V2 Telegram Production

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Immutable Telegram request id
        required: true
        type: string
      request_sha256:
        description: Immutable Telegram request hash
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: clean-v2-telegram-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ISCO_ENGINE_SHA: 595f69a28ff6ddc5532291c9f113f334562292f9
      GEMINI_CONTENT_MODEL: gemini-3.7-flash
      GEMINI_TTS_MODEL: gemini-3.8-flash-tts
      GROQ_CONTENT_MODEL: openai/gpt-oss-20b
      OPENROUTER_CONTENT_MODEL: google/gemma-4-26b-a4b-it:free
      MISTRAL_CONTENT_MODEL: ministral-14b-2512
      CLOUDFLARE_VISION_FREE_ONLY: "true"
      CLOUDFLARE_VISION_MAX_CALLS_PER_WORKFLOW: "5"
      CLEAN_V2_VISUAL_SKIP_GEMINI: "true"
      CLEAN_V2_AI_STILL_FREE_ONLY: "true"
      CLEAN_V2_MUSIC_ALLOW_DOWNLOAD: "true"
      STATE_BRANCH: clean-v2-telegram-state
      STATE_FILE: state/telegram-clean-v2.json
      CLEAN_V2_RESUME: ${{ github.workspace }}/.clean-v2-telegram-resume
      CLEAN_V2_RESUME_ACROSS_RUNNER: "1"
      CLEAN_V2_TTS_CACHE_PATH: ${{ github.workspace }}/.clean-v2-tts-cache
      PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout exact Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 1

      - name: Verify exact Runner checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Check queued Runner freshness
        id: runner_freshness
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          echo "current_main_sha=$current_main" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_SHA" = "$current_main" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Stale queued production::queued_sha=$GITHUB_SHA current_main=$current_main"
          fi

      - name: Notify Telegram that stale queued production was rejected
        if: steps.runner_freshness.outputs.stale == 'true'
        env:
          CURRENT_MAIN_SHA: ${{ steps.runner_freshness.outputs.current_main_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          text = (
              "⚠️ أوقفت محاولة إنتاج قديمة قبل أن تستهلك وقتًا أو حصة مزودات. "
              "كانت مرتبطة بنسخة أقدم من النظام، بينما main تم تحديثه. "
              "أعد تأكيد الإنتاج لتبدأ المحاولة على النسخة الحالية."
          )
          payload = urllib.parse.urlencode(
              {"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": text}
          ).encode()
          url = "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage"
          with urllib.request.urlopen(
              urllib.request.Request(url, data=payload),
              timeout=20,
          ) as response:
              body = json.loads(response.read().decode("utf-8"))
          if not body.get("ok"):
              raise SystemExit("Telegram stale-run notification failed")
          PY

      - name: Reject stale queued Runner before production
        if: steps.runner_freshness.outputs.stale == 'true'
        run: |
          echo "Refusing stale queued production: queued=$GITHUB_SHA current=${{ steps.runner_freshness.outputs.current_main_sha }}" >&2
          exit 75

      - name: Restore verified CC0 music cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: clean_v2/assets/music/cache
          key: clean-v2-cc0-music-v1-${{ hashFiles('clean_v2/assets/music/library.json') }}

      - name: Checkout frozen private Engine source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 595f69a28ff6ddc5532291c9f113f334562292f9
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine pin
        run: test "$(git -C engine rev-parse HEAD)" = "$ISCO_ENGINE_SHA"

      - name: Read dispatched request from simple state
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
        run: |
          set -euo pipefail
          state_root="$RUNNER_TEMP/clean-v2-telegram-production-state"
          git fetch --no-tags origin "$STATE_BRANCH:refs/remotes/origin/$STATE_BRANCH"
          git worktree add --detach "$state_root" "origin/$STATE_BRANCH"
          state="$state_root/$STATE_FILE"
          test -s "$state"

          # The controller persists confirmed_pending_dispatch, asks GitHub to
          # create this run, then commits status=dispatched. A newly-created
          # production run can start a few seconds before that final state push.
          # Wait only for that durable state transition; never proceed on the
          # earlier confirmed state.
          status=""
          stored_sha=""
          for attempt in $(seq 1 12); do
            git -C "$state_root" fetch --quiet origin "$STATE_BRANCH"
            git -C "$state_root" reset --quiet --hard "origin/$STATE_BRANCH"
            status="$(jq -r --arg id "$REQUEST_ID" '.requests[$id].status // empty' "$state")"
            stored_sha="$(jq -r --arg id "$REQUEST_ID" '.requests[$id].request_sha256 // empty' "$state")"
            if [ "$status" = "dispatched" ] && [ "$stored_sha" = "$REQUEST_SHA256" ]; then
              break
            fi
            sleep 2
          done
          test "$status" = "dispatched"
          test "$stored_sha" = "$REQUEST_SHA256"
          scope="$(jq -r --arg id "$REQUEST_ID" '.requests[$id].scope // empty' "$state")"
          topic="$(jq -r --arg id "$REQUEST_ID" '.requests[$id].approved_topic // empty' "$state")"
          case "$scope" in
            long|bundle|short|podcast) ;;
            *) echo "Unsupported Telegram request scope" >&2; exit 2 ;;
          esac
          echo "TELEGRAM_REQUEST_STATE_ROOT=$state_root" >> "$GITHUB_ENV"
          echo "TELEGRAM_REQUEST_STATE=$state" >> "$GITHUB_ENV"
          echo "TELEGRAM_REQUEST_SCOPE=$scope" >> "$GITHUB_ENV"
          echo "TELEGRAM_REQUEST_TOPIC=$topic" >> "$GITHUB_ENV"
          echo "CLEAN_V2_TELEGRAM_OUTPUT=$GITHUB_WORKSPACE/output/clean-v2-telegram/$REQUEST_ID" >> "$GITHUB_ENV"

      - name: Record original Telegram production run identity
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
        run: |
          set -euo pipefail
          resume_cache_key="clean-v2-resume-v6-$RUNNER_OS-$GITHUB_SHA-$ISCO_ENGINE_SHA-$REQUEST_SHA256-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "CLEAN_V2_RESUME_CACHE_KEY=$resume_cache_key" >> "$GITHUB_ENV"
          git -C "$TELEGRAM_REQUEST_STATE_ROOT" config user.name "isco-clean-v2-telegram"
          git -C "$TELEGRAM_REQUEST_STATE_ROOT" config user.email "actions@users.noreply.github.com"
          recorded=false
          for attempt in 1 2 3; do
            git -C "$TELEGRAM_REQUEST_STATE_ROOT" fetch --quiet origin "$STATE_BRANCH"
            git -C "$TELEGRAM_REQUEST_STATE_ROOT" reset --quiet --hard "origin/$STATE_BRANCH"
            python scripts/telegram_clean_v2_control.py record-production-start \
              --state "$TELEGRAM_REQUEST_STATE" \
              --request-id "$REQUEST_ID" \
              --request-sha256 "$REQUEST_SHA256" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --runner-sha "$GITHUB_SHA" \
              --engine-sha "$ISCO_ENGINE_SHA" \
              --resume-cache-key "$resume_cache_key"
            git -C "$TELEGRAM_REQUEST_STATE_ROOT" add "$STATE_FILE"
            if git -C "$TELEGRAM_REQUEST_STATE_ROOT" diff --cached --quiet; then
              recorded=true
              break
            fi
            git -C "$TELEGRAM_REQUEST_STATE_ROOT" commit -m "state: record Telegram production run identity"
            if git -C "$TELEGRAM_REQUEST_STATE_ROOT" push origin "HEAD:$STATE_BRANCH"; then
              recorded=true
              break
            fi
          done
          test "$recorded" = "true"

      - name: Restore recent film and Short narrative history
        run: |
          set -euo pipefail
          history_root="$RUNNER_TEMP/clean-v2-narrative-history-state"
          history_file="$history_root/state/clean-v2-narrative-history.json"
          if git fetch --no-tags origin "$STATE_BRANCH:refs/remotes/origin/$STATE_BRANCH" 2>/dev/null; then
            git worktree add -B "$STATE_BRANCH" "$history_root" "origin/$STATE_BRANCH"
          else
            git worktree add -b "$STATE_BRANCH" "$history_root" origin/main
          fi
          mkdir -p "$(dirname "$history_file")"
          if [ ! -s "$history_file" ]; then
            printf '%s\n' '{"schema_version":1}' > "$history_file"
          fi
          echo "CLEAN_V2_NARRATIVE_HISTORY=$history_file" >> "$GITHUB_ENV"
          echo "CLEAN_V2_NARRATIVE_HISTORY_ROOT=$history_root" >> "$GITHUB_ENV"

      - name: Restore exact Telegram request checkpoint
        id: exact_checkpoint
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ env.CLEAN_V2_RESUME }}
          key: clean-v2-resume-v6-${{ runner.os }}-${{ github.sha }}-${{ env.ISCO_ENGINE_SHA }}-${{ inputs.request_sha256 }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            clean-v2-resume-v6-${{ runner.os }}-${{ github.sha }}-${{ env.ISCO_ENGINE_SHA }}-${{ inputs.request_sha256 }}-

      - name: Restore voice-bank checkpoint across Runner updates
        if: steps.exact_checkpoint.outputs.cache-matched-key == ''
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ env.CLEAN_V2_RESUME }}
          key: clean-v2-voice-bank-v1-telegram-${{ runner.os }}-${{ env.ISCO_ENGINE_SHA }}-${{ inputs.request_sha256 }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            clean-v2-voice-bank-v1-telegram-${{ runner.os }}-${{ env.ISCO_ENGINE_SHA }}-${{ inputs.request_sha256 }}-

      - name: Restore verified Gemini TTS chunks
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ env.CLEAN_V2_TTS_CACHE_PATH }}
          key: clean-v2-gemini38-chunk-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            clean-v2-gemini38-chunk-v1-${{ runner.os }}-

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Notify Telegram that production actually started
        run: |
          GITHUB_RUNTIME_TOKEN="${{ github.token }}" \
          python scripts/telegram_clean_v2_notify.py started \
            --scope "$TELEGRAM_REQUEST_SCOPE" \
            --topic "$TELEGRAM_REQUEST_TOPIC" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true

      - name: Install production dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            ffmpeg \
            fontconfig \
            fonts-noto-core \
            tesseract-ocr \
            tesseract-ocr-ara
          bash scripts/install_cairo_bold.sh
          python -m pip install --disable-pip-version-check 'Pillow==12.3.0'
          python -m pip install --disable-pip-version-check -r engine/requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e engine

      - name: Produce exact approved Telegram scope
        env:
          PYTHONUNBUFFERED: "1"
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$CLEAN_V2_TELEGRAM_OUTPUT"

          run_one() {
            local fmt="$1"
            local kind="$2"
            local out="$CLEAN_V2_TELEGRAM_OUTPUT/$fmt"
            local brief="$RUNNER_TEMP/telegram-$fmt-brief.json"

            python scripts/telegram_clean_v2_control.py materialize-brief \
              --state "$TELEGRAM_REQUEST_STATE" \
              --request-id "$REQUEST_ID" \
              --request-sha256 "$REQUEST_SHA256" \
              --format "$fmt" \
              --output "$brief"

            local brief_sha
            brief_sha="$(BRIEF="$brief" python -c 'import json,os; from pathlib import Path; from clean_v2.contracts import compute_brief_sha256; p=Path(os.environ["BRIEF"]); print(compute_brief_sha256(json.loads(p.read_text(encoding="utf-8"))))')"
            rm -rf "$out"
            GITHUB_RUNTIME_TOKEN="${{ github.token }}" \
            python scripts/telegram_clean_v2_notify.py watch \
              --output "$out" \
              --kind "$kind" \
              --scope "$TELEGRAM_REQUEST_SCOPE" \
              --topic "$TELEGRAM_REQUEST_TOPIC" \
              --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --poll-seconds 4 &
            local notify_pid=$!
            cleanup_notify() {
              kill "$notify_pid" 2>/dev/null || true
              wait "$notify_pid" 2>/dev/null || true
            }
            trap cleanup_notify RETURN

            set +e
            python -m clean_v2 \
              --brief "$brief" \
              --approved-sha "$brief_sha" \
              --engine-sha "$ISCO_ENGINE_SHA" \
              --runner-sha "$GITHUB_SHA" \
              --resume-from "$CLEAN_V2_RESUME/$fmt" \
              --narrative-history "$CLEAN_V2_NARRATIVE_HISTORY" \
              --max-visuals 5 \
              --output "$out"
            local status=$?
            set -e
            cleanup_notify
            trap - RETURN

            local job_status="success"
            if [ "$status" -ne 0 ]; then job_status="failure"; fi
            if python scripts/telegram_clean_v2_notify.py terminal \
              --output "$out" \
              --kind "$kind" \
              --job-status "$job_status" \
              --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; then
              touch "$out/.telegram-terminal-sent"
            fi

            if [ "$status" -ne 0 ]; then return "$status"; fi
            test -s "$out/final.mp4"
            test "$(jq -r .status "$out/run-manifest.json")" = "pass"
            test "$(jq -r .status "$out/final-master-qc.json")" = "pass"
          }

          case "$TELEGRAM_REQUEST_SCOPE" in
            long)
              run_one film long
              ;;
            short)
              run_one short short
              ;;
            podcast)
              run_one podcast podcast
              ;;
            bundle)
              # Bundle is intentionally one Long production. Its optional derived
              # Short is cut locally from the certified Long final and is fail-soft.
              run_one film long
              ;;
          esac

      - name: Prepare exact Telegram request checkpoint
        if: always() && steps.runner_freshness.outputs.stale != 'true'
        id: clean_v2_checkpoint
        run: |
          set -euo pipefail
          case "${TELEGRAM_REQUEST_SCOPE:-}" in
            short) fmt=short ;;
            podcast) fmt=podcast ;;
            long|bundle) fmt=film ;;
            *) echo "save=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          save_allowed=false
          if python scripts/clean_v2_resume_cache.py prepare \
            --output "$CLEAN_V2_TELEGRAM_OUTPUT/$fmt" \
            --target "$CLEAN_V2_RESUME/$fmt" | grep -qx 'save_allowed=true'; then
            save_allowed=true
            echo "save=true" >> "$GITHUB_OUTPUT"
          else
            echo "save=false" >> "$GITHUB_OUTPUT"
          fi
          python scripts/telegram_resume_history.py annotate-manifest \
            --manifest "$CLEAN_V2_TELEGRAM_OUTPUT/$fmt/run-manifest.json" \
            --checkpoint "$CLEAN_V2_RESUME/$fmt/resume-checkpoint.json" \
            --cache-key "$CLEAN_V2_RESUME_CACHE_KEY" \
            --save-allowed "$save_allowed" \
            --job-status '${{ job.status }}'

      - name: Save exact Telegram request checkpoint
        if: always() && steps.runner_freshness.outputs.stale != 'true' && steps.clean_v2_checkpoint.outputs.save == 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ env.CLEAN_V2_RESUME }}
          key: clean-v2-resume-v6-${{ runner.os }}-${{ github.sha }}-${{ env.ISCO_ENGINE_SHA }}-${{ inputs.request_sha256 }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save voice-bank checkpoint across Runner updates
        if: always() && steps.runner_freshness.outputs.stale != 'true' && steps.clean_v2_checkpoint.outputs.save == 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ env.CLEAN_V2_RESUME }}
          key: clean-v2-voice-bank-v1-telegram-${{ runner.os }}-${{ env.ISCO_ENGINE_SHA }}-${{ inputs.request_sha256 }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prepare verified Gemini TTS chunks
        if: always() && steps.runner_freshness.outputs.stale != 'true'
        id: clean_v2_tts_cache
        run: |
          set -euo pipefail
          if python -m clean_v2.tts_cache prepare \
            --root "$CLEAN_V2_TTS_CACHE_PATH" | grep -qx 'save_allowed=true'; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          else
            echo "save=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save verified Gemini TTS chunks
        if: always() && steps.runner_freshness.outputs.stale != 'true' && steps.clean_v2_tts_cache.outputs.save == 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ env.CLEAN_V2_TTS_CACHE_PATH }}
          key: clean-v2-gemini38-chunk-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Persist recent narrative and Podcast promo history
        if: always() && steps.runner_freshness.outputs.stale != 'true'
        run: |
          set -euo pipefail
          test -n "${CLEAN_V2_NARRATIVE_HISTORY_ROOT:-}"
          git -C "$CLEAN_V2_NARRATIVE_HISTORY_ROOT" config user.name "isco-clean-v2-telegram"
          git -C "$CLEAN_V2_NARRATIVE_HISTORY_ROOT" config user.email "actions@users.noreply.github.com"
          git -C "$CLEAN_V2_NARRATIVE_HISTORY_ROOT" add state/clean-v2-narrative-history.json
          if ! git -C "$CLEAN_V2_NARRATIVE_HISTORY_ROOT" diff --cached --quiet; then
            git -C "$CLEAN_V2_NARRATIVE_HISTORY_ROOT" pull --ff-only origin "$STATE_BRANCH"
            git -C "$CLEAN_V2_NARRATIVE_HISTORY_ROOT" commit -m "state: record narrative selection"
            git -C "$CLEAN_V2_NARRATIVE_HISTORY_ROOT" push origin "HEAD:$STATE_BRANCH"
          fi

      - name: Upload Telegram Clean V2 production evidence
        id: upload
        if: always() && steps.runner_freshness.outputs.stale != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clean-v2-telegram-${{ github.run_number }}
          path: ${{ github.workspace }}/output/clean-v2-telegram
          if-no-files-found: warn
          retention-days: 7

      - name: Deliver final video through unified GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/clean_v2_release_delivery.py deliver \
            --output-root "$CLEAN_V2_TELEGRAM_OUTPUT" \
            --scope "$TELEGRAM_REQUEST_SCOPE" \
            --topic "$TELEGRAM_REQUEST_TOPIC" \
            --delivery-key "telegram"

      - name: Telegram terminal watchdog
        if: always() && steps.runner_freshness.outputs.stale != 'true'
        env:
          TELEGRAM_JOB_STATUS: ${{ job.status }}
        run: |
          GITHUB_RUNTIME_TOKEN="${{ github.token }}" \
          python scripts/telegram_clean_v2_notify.py watchdog \
            --output-root "${CLEAN_V2_TELEGRAM_OUTPUT:-$GITHUB_WORKSPACE/output/clean-v2-telegram}" \
            --scope "${TELEGRAM_REQUEST_SCOPE:-long}" \
            --job-status "$TELEGRAM_JOB_STATUS" \
            --topic "${TELEGRAM_REQUEST_TOPIC:-}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true

      - name: Record Telegram production terminal history
        if: always() && steps.runner_freshness.outputs.stale != 'true'
        continue-on-error: true
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          TELEGRAM_JOB_STATUS: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_REQUEST_STATE_ROOT:-}" || exit 0
          case "${TELEGRAM_REQUEST_SCOPE:-}" in
            short) fmt=short ;;
            podcast) fmt=podcast ;;
            long|bundle) fmt=film ;;
            *) exit 0 ;;
          esac
          final_published=false
          if [ "$TELEGRAM_JOB_STATUS" = "success" ]; then
            final_published=true
          fi
          git -C "$TELEGRAM_REQUEST_STATE_ROOT" config user.name "isco-clean-v2-telegram"
          git -C "$TELEGRAM_REQUEST_STATE_ROOT" config user.email "actions@users.noreply.github.com"
          recorded=false
          for attempt in 1 2 3; do
            git -C "$TELEGRAM_REQUEST_STATE_ROOT" fetch --quiet origin "$STATE_BRANCH"
            git -C "$TELEGRAM_REQUEST_STATE_ROOT" reset --quiet --hard "origin/$STATE_BRANCH"
            python scripts/telegram_clean_v2_control.py record-production-terminal \
              --state "$TELEGRAM_REQUEST_STATE" \
              --request-id "$REQUEST_ID" \
              --request-sha256 "$REQUEST_SHA256" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --job-status "$TELEGRAM_JOB_STATUS" \
              --manifest "$CLEAN_V2_TELEGRAM_OUTPUT/$fmt/run-manifest.json" \
              --artifact-id "${ARTIFACT_ID:-}" \
              --artifact-name "clean-v2-telegram-$GITHUB_RUN_NUMBER" \
              --artifact-url "${ARTIFACT_URL:-}" \
              --final-published "$final_published"
            git -C "$TELEGRAM_REQUEST_STATE_ROOT" add "$STATE_FILE"
            if git -C "$TELEGRAM_REQUEST_STATE_ROOT" diff --cached --quiet; then
              recorded=true
              break
            fi
            git -C "$TELEGRAM_REQUEST_STATE_ROOT" commit -m "state: record Telegram production terminal history"
            if git -C "$TELEGRAM_REQUEST_STATE_ROOT" push origin "HEAD:$STATE_BRANCH"; then
              recorded=true
              break
            fi
          done
          test "$recorded" = "true"
