name: Verify Engine PR128 Candidate

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify-engine-pr128:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ENGINE_SHA: b0c37df4657a2170cb33845ed2a0722ad17ddb73
    steps:
      - name: Checkout exact Runner verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact Engine PR128 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ env.ENGINE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine checkout
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "$ENGINE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install locked Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Dependency audit
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install pip-audit==2.10.1
          pip-audit --no-deps -r requirements-lock.txt

      - name: Verify V4-only production authority contract
        working-directory: engine
        run: |
          set -euo pipefail
          python scripts/verify_production_authority_boundary.py --runner-root ..
          python -m unittest tests.test_v4_production_authority_contract -v

      - name: Full Engine suite
        working-directory: engine
        env:
          ISCO_HISTORY_PATH: ${{ runner.temp }}/verify-pr128-engine-history.json
        run: python -m unittest discover -s tests -q

      - name: Full Runner regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
          ISCO_HISTORY_PATH: ${{ runner.temp }}/verify-pr128-runner-history.json
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q

      - name: Verifier diff sanity
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD || git diff --check
          test -f .github/workflows/verify-engine-pr128-candidate.yml
          echo "Engine PR128 candidate verification PASS; production_dispatch_performed=false"
