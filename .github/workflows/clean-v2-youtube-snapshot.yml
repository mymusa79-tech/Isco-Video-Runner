name: Clean V2 YouTube Snapshot

on:
  workflow_dispatch:
  schedule:
    # 00:05 Asia/Muscat. Snapshot near local midnight gives an honest
    # baseline for /stats "today" without YouTube Analytics OAuth.
    - cron: "5 20 * * *"

permissions:
  contents: write

concurrency:
  group: clean-v2-telegram-state
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STATE_BRANCH: clean-v2-telegram-state
      STATE_FILE: state/telegram-clean-v2.json
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

    steps:
      - name: Checkout exact main controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Restore simple Telegram JSON state
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_API_KEY"
          state_root="$RUNNER_TEMP/clean-v2-telegram-state"
          if git fetch --no-tags origin "$STATE_BRANCH:refs/remotes/origin/$STATE_BRANCH" 2>/dev/null; then
            git worktree add -B "$STATE_BRANCH" "$state_root" "origin/$STATE_BRANCH"
          else
            git worktree add -b "$STATE_BRANCH" "$state_root" origin/main
          fi
          mkdir -p "$state_root/state"
          if [ ! -s "$state_root/$STATE_FILE" ]; then
            printf '%s\n' '{"schema_version":1,"ideas":[],"sessions":{},"requests":{},"current_request_id":null,"youtube_snapshots":[],"updated_at":null}' > "$state_root/$STATE_FILE"
          fi
          echo "TELEGRAM_STATE_ROOT=$state_root" >> "$GITHUB_ENV"
          echo "TELEGRAM_STATE_PATH=$state_root/$STATE_FILE" >> "$GITHUB_ENV"

      - name: Capture public YouTube Data API snapshot
        run: |
          set -euo pipefail
          python scripts/telegram_clean_v2_control.py snapshot             --state "$TELEGRAM_STATE_PATH"

      - name: Persist bounded snapshot history
        run: |
          set -euo pipefail
          git -C "$TELEGRAM_STATE_ROOT" config user.name "isco-clean-v2-youtube-stats"
          git -C "$TELEGRAM_STATE_ROOT" config user.email "actions@users.noreply.github.com"
          git -C "$TELEGRAM_STATE_ROOT" add "$STATE_FILE"
          if ! git -C "$TELEGRAM_STATE_ROOT" diff --cached --quiet; then
            git -C "$TELEGRAM_STATE_ROOT" commit -m "state: YouTube channel snapshot"
            git -C "$TELEGRAM_STATE_ROOT" push origin "HEAD:$STATE_BRANCH"
          fi
