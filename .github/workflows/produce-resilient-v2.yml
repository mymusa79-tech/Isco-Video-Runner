name: Isco Video Production Resilient V2

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Arabic topic or working title"
        required: true
        default: "كيف تنهض بعد أن سقطت كثيرًا؟"
        type: string
      format:
        description: "film or story"
        required: true
        default: film
        type: choice
        options: [film, story]
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/produce-resilient-v2.yml"

concurrency:
  group: isco-video-resilient-v2
  cancel-in-progress: false

jobs:
  produce:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout public runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare request
        env:
          EVENT_NAME: ${{ github.event_name }}
          TOPIC_INPUT: ${{ inputs.topic }}
          FORMAT_INPUT: ${{ inputs.format }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          if os.environ.get("EVENT_NAME") == "workflow_dispatch":
              data = {"topic": os.environ.get("TOPIC_INPUT", ""), "format": os.environ.get("FORMAT_INPUT", "film")}
          else:
              data = {"topic": "كيف تنهض بعد أن سقطت كثيرًا؟", "format": "film"}
          topic = str(data.get("topic", "") or "").strip()
          fmt = str(data.get("format", "film") or "film").strip().lower()
          if not topic:
              raise SystemExit("Topic required")
          if fmt not in {"film", "story"}:
              raise SystemExit("Invalid format")
          path = Path(os.environ["RUNNER_TEMP"]) / "isco-request.json"
          path.write_text(json.dumps({"topic": topic, "format": fmt}, ensure_ascii=False), encoding="utf-8")
          print("Request prepared")
          PY

      - name: Checkout private engine read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 2e271271c7770289eef81c354a26681cb2ee3d23
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core openssl

      - name: Restore encrypted state
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$STATE_ENCRYPTION_KEY"
          if [ -f state/history.json.enc ]; then
            mkdir -p engine/state
            openssl enc -d -aes-256-cbc -pbkdf2 -in state/history.json.enc -out engine/state/history.json -pass env:STATE_ENCRYPTION_KEY
          fi

      - name: Install and validate engine
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
          python -m pip check
          python -m unittest discover -s tests -q

      - name: Materialize provider secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          test -n "$GROQ_API_KEY"
          test -n "$OPENROUTER_API_KEY"
          test -n "$PEXELS_API_KEY"
          test -n "$PIXABAY_API_KEY"
          umask 077
          mkdir -p "$RUNNER_TEMP/isco-secrets"
          printf '%s' "$GEMINI_API_KEY" > "$RUNNER_TEMP/isco-secrets/gemini"
          printf '%s' "$GROQ_API_KEY" > "$RUNNER_TEMP/isco-secrets/groq"
          printf '%s' "$OPENROUTER_API_KEY" > "$RUNNER_TEMP/isco-secrets/openrouter"
          printf '%s' "$PEXELS_API_KEY" > "$RUNNER_TEMP/isco-secrets/pexels"
          printf '%s' "$PIXABAY_API_KEY" > "$RUNNER_TEMP/isco-secrets/pixabay"
          printf '%s' "$YOUTUBE_API_KEY" > "$RUNNER_TEMP/isco-secrets/youtube"

      - name: Verify free provider keys
        env:
          GROQ_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/groq
          PIXABAY_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/pixabay
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import requests

          groq = Path(os.environ["GROQ_API_KEY_FILE"]).read_text(encoding="utf-8").strip()
          pixabay = Path(os.environ["PIXABAY_API_KEY_FILE"]).read_text(encoding="utf-8").strip()
          if not groq or not pixabay:
              raise SystemExit("Provider preflight: required key missing")

          r = requests.post(
              "https://api.groq.com/openai/v1/chat/completions",
              headers={"Authorization": "Bearer " + groq, "Content-Type": "application/json"},
              json={
                  "model": "openai/gpt-oss-20b",
                  "messages": [{"role": "user", "content": "Return only this JSON object: {\"ok\":true}"}],
                  "response_format": {"type": "json_object"},
                  "temperature": 0,
                  "max_completion_tokens": 64,
              },
              timeout=45,
          )
          if not r.ok:
              raise SystemExit(f"Groq preflight failed safely: HTTP {r.status_code}")
          try:
              body = r.json()
              content = (body.get("choices") or [])[0]["message"]["content"]
              parsed = json.loads(content)
          except Exception:
              raise SystemExit("Groq preflight failed safely: invalid response") from None
          if parsed.get("ok") is not True:
              raise SystemExit("Groq preflight failed safely: unexpected response")
          print("Groq preflight OK")

          r = requests.get(
              "https://pixabay.com/api/videos/",
              params={"key": pixabay, "q": "nature", "per_page": 3, "safesearch": "true"},
              timeout=45,
          )
          if not r.ok:
              raise SystemExit(f"Pixabay preflight failed safely: HTTP {r.status_code}")
          try:
              data = r.json()
          except Exception:
              raise SystemExit("Pixabay preflight failed safely: invalid response") from None
          hits = data.get("hits")
          if not isinstance(hits, list):
              raise SystemExit("Pixabay preflight failed safely: missing video results")
          print(f"Pixabay preflight OK: {len(hits)} sample results")
          PY

      - name: Produce with staged free planning fallback
        working-directory: engine
        env:
          GEMINI_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/gemini
          GROQ_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/groq
          OPENROUTER_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/openrouter
          PEXELS_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/pexels
          YOUTUBE_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/youtube
          GEMINI_CONTENT_MODEL: gemini-2.5-flash
          GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
          REQUEST_FILE: ${{ runner.temp }}/isco-request.json
          TRENDS_GEO: SA
          YOUTUBE_REGION: SA
          YOUTUBE_LANGUAGE: ar
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import requests
          import isco_video_agent.resilient_planner as staged
          import isco_video_agent.orchestrator as orchestrator
          from isco_video_agent.providers.gemini import json_text as gemini_json_text
          from isco_video_agent.providers.openrouter import json_text as openrouter_json_text

          def parse_json(raw):
              text = str(raw or "").strip()
              try:
                  value = json.loads(text)
              except json.JSONDecodeError:
                  decoder = json.JSONDecoder()
                  value = None
                  for i, ch in enumerate(text):
                      if ch != "{":
                          continue
                      try:
                          candidate, _ = decoder.raw_decode(text[i:])
                      except json.JSONDecodeError:
                          continue
                      if isinstance(candidate, dict):
                          value = candidate
                          break
                  if value is None:
                      raise RuntimeError("Provider returned invalid JSON")
              if not isinstance(value, dict):
                  raise RuntimeError("Provider JSON must be an object")
              return value

          def groq_json_text(prompt):
              key_path = Path(os.environ["GROQ_API_KEY_FILE"])
              token = key_path.read_text(encoding="utf-8").strip()
              if not token:
                  raise RuntimeError("Groq key unavailable")
              response = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
                  json={
                      "model": "openai/gpt-oss-20b",
                      "messages": [{"role": "user", "content": prompt + "\nReturn ONLY one complete valid JSON object. No markdown."}],
                      "response_format": {"type": "json_object"},
                      "temperature": 0.2,
                      "max_completion_tokens": 4000,
                  },
                  timeout=120,
              )
              if not response.ok:
                  raise RuntimeError(f"Groq HTTP {response.status_code}")
              body = response.json()
              choices = body.get("choices") or []
              if not choices:
                  raise RuntimeError("Groq returned no choices")
              return parse_json(choices[0]["message"]["content"])

          original_json_text = staged.json_text
          providers = [
              ("gemini", lambda key, prompt, model: gemini_json_text(key, prompt, model=model)),
              ("groq-gpt-oss-20b-free", lambda key, prompt, model: groq_json_text(prompt)),
              ("openrouter-free-router", lambda key, prompt, model: openrouter_json_text(prompt, model="openrouter/free")),
              ("openrouter-gpt-oss-20b-free", lambda key, prompt, model: openrouter_json_text(prompt, model="openai/gpt-oss-20b:free")),
          ]

          def resilient_build_plan(api_key, topic, requested_format, content_model, **kwargs):
              failures = []
              for name, provider in providers:
                  def fixed_json(key, prompt, model=content_model, _provider=provider):
                      return _provider(key, prompt, model)
                  staged.json_text = fixed_json
                  try:
                      plan = staged.build_plan(
                          api_key, topic, requested_format, content_model,
                          research_context=kwargs.get("research_context"),
                          avoid_context=kwargs.get("avoid_context"),
                          revision_note=kwargs.get("revision_note", ""),
                          allow_fallback=False,
                      )
                      print(f"Staged planning provider selected: {name}")
                      return plan
                  except Exception as exc:
                      detail = str(exc).replace("\n", " ")[:300]
                      failures.append(f"{name}:{type(exc).__name__}:{detail}")
                      print(f"Staged planning provider failed safely: {name}:{type(exc).__name__}:{detail}")
                  finally:
                      staged.json_text = original_json_text
              raise RuntimeError("All free staged planning providers failed: " + " | ".join(failures))

          orchestrator.build_plan = resilient_build_plan
          req = json.loads(Path(os.environ["REQUEST_FILE"]).read_text(encoding="utf-8"))
          out = orchestrator.produce(topic=req["topic"], requested_format=req["format"], dry_run=False, do_research=True)
          print(f"Production completed: {out.name}")
          PY

      - name: Stage review output
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          OUT_DIR="$(find engine/output -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$OUT_DIR"
          test -f "$OUT_DIR/final.mp4"
          test -f "$OUT_DIR/state-snapshot.json"
          mkdir -p safe-output
          cp "$OUT_DIR/final.mp4" safe-output/final.mp4
          if [ -f "$OUT_DIR/quality-final.json" ]; then cp "$OUT_DIR/quality-final.json" safe-output/quality-final.json; fi
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$OUT_DIR/state-snapshot.json" -out safe-output/history.json.enc -pass env:STATE_ENCRYPTION_KEY

      - name: Enforce free artifact guard
        run: |
          set -euo pipefail
          BYTES="$(du -sb safe-output | cut -f1)"
          test "$BYTES" -le $((350 * 1024 * 1024))

      - name: Upload review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: isco-resilient-v2-${{ github.run_number }}
          path: safe-output/
          if-no-files-found: error
          retention-days: 1
