name: One-shot V4 Attempt 4 Observe

on:
  pull_request:
    branches: ["main"]
    types: [synchronize]
    paths:
      - ".github/workflows/one-shot-v4-attempt4-dispatch.yml"

permissions:
  actions: read
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Capture newly dispatched Production V4
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_MAIN_SHA: 2c7ed80f34e2b9396d1fe795529da5daa7a7a761
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/$REPO/actions/workflows/produce-resilient-v4.yml/runs?event=workflow_dispatch&branch=main&per_page=1")"
          run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$run_json")"
          run_number="$(jq -r '.workflow_runs[0].run_number // empty' <<<"$run_json")"
          status="$(jq -r '.workflow_runs[0].status // empty' <<<"$run_json")"
          conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' <<<"$run_json")"
          head_sha="$(jq -r '.workflow_runs[0].head_sha // empty' <<<"$run_json")"
          html_url="$(jq -r '.workflow_runs[0].html_url // empty' <<<"$run_json")"
          created_at="$(jq -r '.workflow_runs[0].created_at // empty' <<<"$run_json")"
          test -n "$run_id"
          test "$head_sha" = "$EXPECTED_MAIN_SHA"
          echo "ATTEMPT4_RUN_ID=$run_id"
          echo "ATTEMPT4_RUN_NUMBER=$run_number"
          echo "ATTEMPT4_STATUS=$status"
          echo "ATTEMPT4_CONCLUSION=$conclusion"
          echo "ATTEMPT4_HEAD_SHA=$head_sha"
          echo "ATTEMPT4_CREATED_AT=$created_at"
          echo "ATTEMPT4_URL=$html_url"
