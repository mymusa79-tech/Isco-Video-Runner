name: Editorial Room Stage 7 Closure

on:
  push:
    branches: ["verify/editorial-room-stage5-9-final-current-main"]
    paths:
      - .github/workflows/editorial-room-stage7-closure.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  ENGINE_SHA: 2a8d246d03bb5247da23b3c7b7e97e995b4619bf

