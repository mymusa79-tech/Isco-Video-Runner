          old = '        used_hypotheses.add(hypothesis_key)\n        used_promises.add(promise_key)\n'
          new = '        used_hypotheses.add(hypothesis_key)\n'
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '                "viewer_promise": promise,\n                "title_role": title_role,\n'
          new = '                "viewer_promise": promise,\n                "viewer_promise_expression": promise_expression,\n                "locked_viewer_promise": intent.viewer_promise,\n                "editorial_fingerprint": intent.editorial_fingerprint,\n                "persona_version": intent.persona_version,\n                "title_role": title_role,\n'
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '        concept.setdefault("hypothesis_type", hypothesis_type(chr(64 + index)))\n        primary_query = concept["visual_query_en"]\n'
          new = '        concept.setdefault("hypothesis_type", hypothesis_type(chr(64 + index)))\n        editorial_binding = audit_editorial_packaging_binding(plan, concept)\n        concept["editorial_binding"] = editorial_binding\n        if editorial_binding["status"] == "block":\n            issues = ", ".join(editorial_binding.get("issues", []))\n            raise RuntimeError(f"Editorial packaging gate blocked {concept[\'candidate_id\']}: {issues}")\n        primary_query = concept["visual_query_en"]\n'
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '            "promise_integrity_status_counts": integrity_counts,\n            "provider_attempt_ceiling": 4,\n'
          new = '            "promise_integrity_status_counts": integrity_counts,\n            "editorial_binding_mode": "deterministic_release_gate",\n            "editorial_binding_status_counts": {\n                status: sum(1 for item in candidates_out if item["editorial_binding"]["status"] == status)\n                for status in ("pass", "review", "block")\n            },\n            "locked_editorial_fingerprint": candidates_out[0]["editorial_fingerprint"] if candidates_out else None,\n            "provider_attempt_ceiling": 4,\n'
          assert s.count(old) == 1
          s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")

          Path("tests/test_editorial_stage7.py").write_text(r'''from __future__ import annotations

import json
import tempfile
import unittest
from pathlib import Path
from unittest.mock import patch

from isco_video_agent.editorial_room import make_editorial_intent
from isco_video_agent.models import ProductionPlan, ScriptSection
from isco_video_agent.packaging_integrity import audit_editorial_packaging_binding
from isco_video_agent.production_pipeline import _plan_from_json
from isco_video_agent import thumbnail


class EditorialStage7Tests(unittest.TestCase):
    def _intent(self):
        return make_editorial_intent(
            editorial_thesis="الشعور بالتأخر يتضخم حين تستخدم مقياسًا لا يناسب حياتك.",
            viewer_starting_belief="المشاهد يظن أن سرعة الآخرين دليل على أنه متأخر فعلًا.",
            hidden_assumption="الافتراض الخفي هو أن كل الناس يجب أن يتقدموا بالإيقاع نفسه.",
            editorial_turn="بدل سؤال كم تأخرت، افحص المقياس الذي تستخدمه للحكم على تقدمك.",
            stakes="المقياس الخاطئ يحول التقدم الحقيقي إلى شعور دائم بالفشل.",
            viewer_promise="ستتعلم كيف تميز بين التأخر الحقيقي ومقارنة نفسك بمقياس لا يناسب حياتك.",
            evidence_boundaries=("لا نقدم تشخيصًا طبيًا.", "لا نعمم مسارًا واحدًا على الجميع."),
            earned_payoff="اختر مقياس تقدم مرتبطًا بظروفك وقارن نفسك بخطوتك السابقة.",
        )

    def _plan(self):
        intent = self._intent()
        return ProductionPlan(
            topic="لماذا تشعر أنك متأخر عن الجميع؟",
            pillar="understand",
            format="film",
            hook="قد لا تكون متأخرًا؛ ربما تستخدم مقياسًا لا يخص حياتك.",
            title_options=["هل أنت متأخر فعلًا؟"],
            thumbnail_concepts=["ساعة ومسار مختلف"],
            sections=[ScriptSection(id="s1", narration="نقارن سرعتنا بالآخرين ثم ننسى اختلاف نقطة البداية والظروف.", visual_query="person walking different path", key_point="افحص مقياس المقارنة")],
            cta="جرّب مقياسًا واحدًا هذا الأسبوع.",
            closing_payoff="اختر مقياس تقدم مرتبطًا بظروفك وقارن نفسك بخطوتك السابقة.",
            editorial_intent=intent.to_dict(),
        )

    def _candidate(self, plan):
        intent = self._intent()
        return {
            "candidate_id": "packaging-a",
            "title_ar": "هل مقياسك يجعلك متأخرًا؟",
            "text_mode": "short_text",
            "text_ar": "المقياس الخطأ",
            "packaging_hypothesis": "إعادة تعريف التأخر عبر كشف مقياس المقارنة الخاطئ.",
            "viewer_promise": intent.viewer_promise,
            "viewer_promise_expression": "ستعرف هل أنت متأخر فعلًا أم تحاكم حياتك بمقياس لا يناسبك.",
            "locked_viewer_promise": intent.viewer_promise,
            "editorial_fingerprint": intent.editorial_fingerprint,
            "persona_version": intent.persona_version,
        }

    def test_valid_candidate_is_bound_to_same_intent(self):
        plan = self._plan()
        result = audit_editorial_packaging_binding(plan, self._candidate(plan))
        self.assertIn(result["status"], {"pass", "review"})
        self.assertTrue(result["release_authority"])
        self.assertEqual(result["editorial_fingerprint"], plan.editorial_intent["editorial_fingerprint"])

    def test_missing_intent_fails_closed(self):
        plan = self._plan()
        plan.editorial_intent = {}
        result = audit_editorial_packaging_binding(plan, self._candidate(self._plan()))
        self.assertEqual(result["status"], "block")
        self.assertTrue(any(x.startswith("editorial_intent_invalid:") for x in result["issues"]))

    def test_fingerprint_mismatch_blocks(self):
        plan = self._plan()
        candidate = self._candidate(plan)
        candidate["editorial_fingerprint"] = "wrong"
        result = audit_editorial_packaging_binding(plan, candidate)
        self.assertEqual(result["status"], "block")
        self.assertIn("editorial_fingerprint_mismatch", result["issues"])

    def test_unrelated_expression_blocks_even_with_stamped_metadata(self):
        plan = self._plan()
        candidate = self._candidate(plan)
        candidate.update({
            "title_ar": "وصفة فطائر منزلية",
            "text_ar": "مطبخ سريع",
            "packaging_hypothesis": "مكونات وطهي وجبة لذيذة.",
            "viewer_promise_expression": "ستتعلم وصفة فطائر ومقاديرها ووقت خبزها.",
        })
        result = audit_editorial_packaging_binding(plan, candidate)
        self.assertEqual(result["status"], "block")
        self.assertIn("editorial_packaging_has_no_intent_anchor", result["issues"])

    def test_plan_json_reload_preserves_editorial_intent(self):
        plan = self._plan()
        with tempfile.TemporaryDirectory() as tmp:
            path = Path(tmp) / "plan.json"
            path.write_text(json.dumps(plan.to_dict(), ensure_ascii=False), encoding="utf-8")
            loaded = _plan_from_json(path)
        self.assertEqual(loaded.editorial_intent, plan.editorial_intent)

    def test_abc_share_locked_promise_without_extra_planner_calls(self):
        plan = self._plan()
        raw = {"concepts": [
            {"title_ar":"هل أنت متأخر فعلًا؟","text_mode":"short_text","text_ar":"مقياس خاطئ","visual_query_en":"person comparing clocks","alternate_visual_query_en":"different life paths","text_position":"left","packaging_hypothesis":"وضوح المقياس الخاطئ.","viewer_promise":"ستفهم لماذا يبدو تقدم الآخرين أسرع حين تستخدم مقياسًا لا يناسبك.","title_role":"يسأل عن التأخر.","thumbnail_role":"يكشف المقياس.","angle":"clarity","why_it_can_work":"واضح"},
            {"title_ar":"المقارنة التي تسرق تقدمك","text_mode":"short_text","text_ar":"سباق غيرك","visual_query_en":"runner on separate lanes","alternate_visual_query_en":"people walking separate roads","text_position":"right","packaging_hypothesis":"توتر المقارنة بسباق الآخرين.","viewer_promise":"ستعيد تقييم إحساسك بالتأخر عندما ترى أن مسارك لا يقاس بسرعة غيرك.","title_role":"يصنع التوتر.","thumbnail_role":"يجسد السباق.","angle":"tension","why_it_can_work":"متوتر"},
            {"title_ar":"غيّر المقياس أولًا","text_mode":"none","text_ar":"","visual_query_en":"single ruler beside winding road","alternate_visual_query_en":"measuring tape different paths","text_position":"center","packaging_hypothesis":"اختزال الفكرة في تغيير المقياس.","viewer_promise":"ستخرج بمقياس تقدم يناسب ظروفك بدل مقارنة خطوتك بإيقاع الآخرين.","title_role":"يقدم التحول.","thumbnail_role":"يجسد المقياس بصريًا.","angle":"minimalist","why_it_can_work":"بسيط"}
        ]}
        with patch.object(thumbnail, "json_text", return_value=raw) as model_call:
            concepts = thumbnail._concepts("fake", plan, "fake-model")
        model_call.assert_called_once()
        self.assertEqual(len(concepts), 3)
        self.assertEqual({x["viewer_promise"] for x in concepts}, {plan.editorial_intent["viewer_promise"]})
        self.assertEqual({x["editorial_fingerprint"] for x in concepts}, {plan.editorial_intent["editorial_fingerprint"]})
        self.assertEqual({x["persona_version"] for x in concepts}, {plan.editorial_intent["persona_version"]})
        self.assertEqual(len({x["packaging_hypothesis"] for x in concepts}), 3)


if __name__ == "__main__":
    unittest.main()
''', encoding="utf-8")
          PY
