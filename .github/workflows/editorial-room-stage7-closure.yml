          assert s.count(old) == 1
          s = s.replace(old, new)
          addition = r'''


def _ratio_value(value: float | None) -> float:
    return 0.0 if value is None else float(value)


def audit_editorial_packaging_binding(plan: ProductionPlan, candidate: dict) -> dict:
    """Bind one packaging hypothesis to the plan's locked EditorialIntent.

    This is deterministic release authority and makes no provider/model call. A/B/C may
    explore different click hypotheses, but the underlying viewer promise, fingerprint,
    and persona version stay identical. Lexical alignment is intentionally conservative:
    zero evidence blocks; weak paraphrase evidence is review, not an invented semantic
    detector.
    """
    issues: list[str] = []
    try:
        intent = intent_from_dict(getattr(plan, "editorial_intent", None))
    except EditorialContractError as exc:
        return {
            "schema_version": 1,
            "mode": "deterministic_editorial_gate",
            "status": "block",
            "score": 0.0,
            "issues": [f"editorial_intent_invalid:{exc}"],
            "release_authority": True,
        }

    if candidate.get("editorial_fingerprint") != intent.editorial_fingerprint:
        issues.append("editorial_fingerprint_mismatch")
    if candidate.get("persona_version") != intent.persona_version:
        issues.append("editorial_persona_version_mismatch")
    if str(candidate.get("locked_viewer_promise", "")).strip() != intent.viewer_promise:
        issues.append("locked_viewer_promise_mismatch")
    if str(candidate.get("viewer_promise", "")).strip() != intent.viewer_promise:
        issues.append("viewer_promise_not_locked")

    title = str(candidate.get("title_ar", "")).strip()
    thumb = str(candidate.get("text_ar", "")).strip() if candidate.get("text_mode", "short_text") != "none" else ""
    hypothesis = str(candidate.get("packaging_hypothesis", "")).strip()
    expression = str(candidate.get("viewer_promise_expression", "")).strip()
    if not title or not hypothesis or not expression:
        issues.append("editorial_packaging_fields_missing")

    package_expression = "\n".join(x for x in (title, thumb, hypothesis, expression) if x)
    promise_alignment = max(
        _ratio_value(_support_ratio(intent.viewer_promise, expression)),
        _ratio_value(_support_ratio(expression, intent.viewer_promise)),
    )
    turn_alignment = _ratio_value(_support_ratio(intent.editorial_turn, package_expression))
    payoff_alignment = _ratio_value(_support_ratio(intent.earned_payoff, package_expression))
    thesis_alignment = _ratio_value(_support_ratio(intent.editorial_thesis, package_expression))
    score = _weighted(
        (
            (promise_alignment, 0.45),
            (turn_alignment, 0.25),
            (payoff_alignment, 0.20),
            (thesis_alignment, 0.10),
        )
    )
    has_semantic_anchor = max(promise_alignment, turn_alignment, payoff_alignment, thesis_alignment) > 0.0
    if not has_semantic_anchor:
        issues.append("editorial_packaging_has_no_intent_anchor")

    hard_issue = bool(issues)
    if hard_issue:
        status = "block"
    elif score >= 0.30:
        status = "pass"
    else:
        status = "review"

    return {
        "schema_version": 1,
        "mode": "deterministic_editorial_gate",
        "status": status,
        "score": round(score, 4),
        "components": {
            "viewer_promise_expression_alignment": round(promise_alignment, 4),
            "editorial_turn_alignment": round(turn_alignment, 4),
            "earned_payoff_alignment": round(payoff_alignment, 4),
            "editorial_thesis_alignment": round(thesis_alignment, 4),
        },
        "issues": issues,
        "editorial_fingerprint": intent.editorial_fingerprint,
        "persona_version": intent.persona_version,
        "locked_viewer_promise": intent.viewer_promise,
        "release_authority": True,
        "interpretation": "A/B/C may vary packaging angle, never the locked EditorialIntent promise.",
    }
          '''
