          assert s.count(old) == 1
          p.write_text(s.replace(old, new), encoding="utf-8")

          p = Path("src/isco_video_agent/packaging_integrity.py")
          s = p.read_text(encoding="utf-8")
          old = 'from .models import ProductionPlan\n'
