name: Nidaa V24 Editorial Prompt Contract

on:
  push:
    branches: [agent/nidaa-v24-editorial-visual-policy-20261018]
  pull_request:
    branches: [main]
    paths:
      - clean_v2/short_format.py
      - clean_v2/pipeline.py
      - clean_v2/visual_story.py
      - scripts/test_v24_editorial_prompts.py
      - .github/workflows/nidaa-v24-editorial.yml

permissions:
  contents: read

jobs:
  editorial-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install minimal dependency
        run: python -m pip install 'Pillow==12.3.0'
      - name: Compile changed modules and checks
        run: python -m py_compile clean_v2/short_format.py clean_v2/pipeline.py clean_v2/visual_story.py scripts/test_v24_editorial_prompts.py
      - name: Check V24 writing/visual instructions and unchanged contracts
        run: python -m unittest scripts.test_v24_editorial_prompts -v
