name: Dispatch Canonical V4 Attempt

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize]
    paths:
      - ".github/canonical-v4-attempt-trigger"
      - ".github/workflows/dispatch-canonical-v4-attempt.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch-once:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Production V4 on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python - <<'PY'
          import json, os, time, urllib.request
          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          dispatch_url = f'https://api.github.com/repos/{repo}/actions/workflows/produce-resilient-v4.yml/dispatches'
          payload = json.dumps({'ref': 'main'}).encode('utf-8')
          req = urllib.request.Request(dispatch_url, data=payload, method='POST', headers=headers)
          with urllib.request.urlopen(req, timeout=30) as resp:
              if resp.status != 204:
                  raise SystemExit(f'unexpected dispatch status: {resp.status}')
          print('CANONICAL_V4_DISPATCHED')
          time.sleep(8)
          runs_url = f'https://api.github.com/repos/{repo}/actions/workflows/produce-resilient-v4.yml/runs?event=workflow_dispatch&branch=main&per_page=5'
          req = urllib.request.Request(runs_url, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as resp:
              data = json.load(resp)
          runs = data.get('workflow_runs') or []
          if not runs:
              raise SystemExit('dispatch succeeded but no workflow_dispatch run was discoverable')
          run = runs[0]
          print(f"CANONICAL_V4_RUN_ID={run.get('id')}")
          print(f"CANONICAL_V4_RUN_NUMBER={run.get('run_number')}")
          print(f"CANONICAL_V4_RUN_URL={run.get('html_url')}")
          print(f"CANONICAL_V4_HEAD_SHA={run.get('head_sha')}")
          PY
