name: Verify Production Stage Ladder

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  production-stage-ladder:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Initialize Stage Ladder runtime paths
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/production-stage-ladder"
          mkdir -p "$root/evidence" "$root/video-50" "$root/staging"
          {
            echo "EVIDENCE_DIR=$root/evidence"
            echo "BASELINE_DIR=$root/video-50"
            echo "STAGING_DIR=$root/staging"
            echo "CERTIFICATE_PATH=$root/stage-ladder-certification.json"
          } >> "$GITHUB_ENV"

      - name: Checkout exact Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Runner candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Resolve exact canonical Engine pin
        id: engine_contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from pathlib import Path
          text = Path('.github/workflows/produce-resilient-v4.yml').read_text(encoding='utf-8')
          checkout = re.findall(r'^\s+ref:\s+([0-9a-f]{40})\s*$', text, flags=re.MULTILINE)
          env_pin = re.findall(r'^\s+ISCO_ENGINE_SHA:\s+([0-9a-f]{40})\s*$', text, flags=re.MULTILINE)
          if len(checkout) != 1 or len(env_pin) != 1 or checkout[0] != env_pin[0]:
              raise SystemExit(f'Canonical V4 Engine pin mismatch: checkout={checkout} env={env_pin}')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f'engine_sha={checkout[0]}\n')
          PY

      - name: Checkout exact private Engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ steps.engine_contract.outputs.engine_sha }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine checkout
        working-directory: engine
        env:
          ENGINE_SHA: ${{ steps.engine_contract.outputs.engine_sha }}
        run: test "$(git rev-parse HEAD)" = "$ENGINE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install current production dependencies
        run: |
          set -euo pipefail
          APT_OPTS=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o DPkg::Lock::Timeout=60
          )
          sudo timeout --signal=TERM --kill-after=15s 180s apt-get "${APT_OPTS[@]}" update
          sudo timeout --signal=TERM --kill-after=15s 240s apt-get "${APT_OPTS[@]}" install -y ffmpeg fonts-noto-core
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Cloudflare Vision zero-inference preflight
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
          CLOUDFLARE_VISION_FREE_ONLY: "true"
          CLOUDFLARE_VISION_MAX_CALLS_PER_WORKFLOW: "2"
          CLOUDFLARE_VISION_QUOTA_FILE: ${{ runner.temp }}/cloudflare-preflight-post693-quota.json
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts import gold_cloudflare_vision_fallback as cf

          output = Path(os.environ["RUNNER_TEMP"]) / "cloudflare-preflight-post693.json"
          gates = []
          status = "ready_for_wire"
          failed_stage = None
          detail = None

          def gate(stage, fn, *args):
              global status, failed_stage, detail
              try:
                  value = fn(*args)
              except cf.CloudflareGoldVisionUnavailable as exc:
                  gates.append({"stage": stage, "status": "fail"})
                  status = "no_wire"
                  failed_stage = stage
                  detail = str(exc)[:1000]
                  return None
              gates.append({"stage": stage, "status": "pass"})
              return value

          creds = gate("credentials", cf._credentials)
          if status == "ready_for_wire":
              token, account_id = creds
              gate("zero_cost_subscription_proof", cf._prove_workers_free, token, account_id)
          if status == "ready_for_wire":
              gate("model_schema_probe", cf._prove_model_access, token, account_id)
          if status == "ready_for_wire":
              gate("workflow_quota_reservation", cf._reserve_workflow_call)

          payload = {
              "schema_version": 1,
              "runner_sha": os.environ.get("CANDIDATE_SHA", ""),
              "provider": cf.CLOUDFLARE_VISION_PROVIDER,
              "model": cf.CLOUDFLARE_VISION_MODEL,
              "status": status,
              "failed_stage": failed_stage,
              "detail": detail,
              "inference_attempt_performed": False,
              "gates": gates,
          }
          output.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload Cloudflare post-693 preflight
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cloudflare-preflight-post693
          path: ${{ runner.temp }}/cloudflare-preflight-post693.json
          if-no-files-found: error
          retention-days: 7

      - name: Cloudflare Llama 4 Scout one-wire qualification
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
          CLOUDFLARE_VISION_FREE_ONLY: "true"
          CLOUDFLARE_VISION_MAX_CALLS_PER_WORKFLOW: "2"
          CLOUDFLARE_VISION_QUOTA_FILE: ${{ runner.temp }}/cloudflare-preflight-post693-quota.json
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cloudflare-scout-one-wire"
          mkdir -p "$root/visual-qa"
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=c=blue:s=640x360:d=2:r=24" \
            -c:v libx264 -pix_fmt yuv420p \
            "$root/visual-qa/qualification-preview.mp4"

          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          import requests

          from scripts import gold_cloudflare_vision_fallback as cf
          from scripts import vision_stage_contract_v2 as contract

          model = "@cf/meta/llama-4-scout-17b-16e-instruct"
          root = Path(os.environ["RUNNER_TEMP"]) / "cloudflare-scout-one-wire"
          preview = root / "visual-qa" / "qualification-preview.mp4"
          output = root / "cloudflare-scout-one-wire-result.json"
          payload_out = {
              "schema_version": 1,
              "runner_sha": os.environ.get("CANDIDATE_SHA", ""),
              "provider": cf.CLOUDFLARE_VISION_PROVIDER,
              "model": model,
              "qualification": "single_real_inference_guided_json",
              "paid_recovery_allowed": False,
              "inference_attempts": 0,
          }

          token, account_id = cf._credentials()
          cf._prove_workers_free(token, account_id)

          schema_response = requests.get(
              f"{cf.CLOUDFLARE_API_BASE}/accounts/{account_id}/ai/models/schema",
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
              },
              params={"model": model},
              timeout=cf.CLOUDFLARE_PROBE_TIMEOUT_SECONDS,
          )
          schema_body = schema_response.json()
          if (
              not schema_response.ok
              or not isinstance(schema_body, dict)
              or schema_body.get("success") is not True
          ):
              payload_out["status"] = "model_schema_probe_failed"
              payload_out["detail"] = cf._error_text(schema_body)
          else:
              cf._reserve_workflow_call()
              prompt = contract.legacy._visual_prompt(
                  narration_context="A plain blue visual used only to qualify the Vision transport.",
                  intended_visual="A simple solid blue frame with no people and no unsafe content.",
              )
              frames = contract.legacy._sample_preview_frames(preview)
              content = [
                  {
                      "type": "image_url",
                      "image_url": {
                          "url": "data:image/jpeg;base64,"
                          + base64.b64encode(frame).decode("ascii")
                      },
                  }
                  for frame in frames
              ]
              content.append({"type": "text", "text": prompt})
              request_payload = {
                  "messages": [{"role": "user", "content": content}],
                  "temperature": 0,
                  "max_tokens": 700,
                  "guided_json": contract.VISUAL_AUDIT_SCHEMA,
              }
              encoded_model = "/".join(quote(part, safe="@") for part in model.split("/"))
              response = requests.post(
                  f"{cf.CLOUDFLARE_API_BASE}/accounts/{account_id}/ai/run/{encoded_model}",
                  headers={
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json",
                  },
                  json=request_payload,
                  timeout=cf.CLOUDFLARE_TIMEOUT_SECONDS,
              )
              payload_out["inference_attempts"] = 1
              try:
                  body = response.json()
              except Exception:
                  payload_out["status"] = "non_json_envelope"
                  payload_out["http_status"] = int(response.status_code)
              else:
                  if not response.ok or not isinstance(body, dict) or body.get("success") is not True:
                      payload_out["status"] = "provider_error"
                      payload_out["http_status"] = int(response.status_code)
                      payload_out["detail"] = cf._error_text(body)
                  else:
                      result = body.get("result")
                      raw = result.get("response") if isinstance(result, dict) else None
                      if isinstance(raw, dict):
                          data = raw
                      elif isinstance(raw, str):
                          try:
                              data = json.loads(raw.strip())
                          except json.JSONDecodeError:
                              data = None
                      else:
                          data = None
                      if data is None:
                          payload_out["status"] = "structured_output_invalid_json"
                      else:
                          error = contract._schema_error(data, resolved_model=model)
                          if error is not None:
                              payload_out["status"] = "structured_output_schema_invalid"
                              payload_out["detail"] = contract.legacy._safe_exception_detail(error)
                          else:
                              payload_out["status"] = "wire_success"
                              payload_out["normalized_result"] = (
                                  contract.gemini_provider._normalize_visual_audit(data)
                              )

          output.write_text(
              json.dumps(payload_out, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload_out, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload Cloudflare Scout one-wire qualification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cloudflare-scout-one-wire-qualification
          path: ${{ runner.temp }}/cloudflare-scout-one-wire/cloudflare-scout-one-wire-result.json
          if-no-files-found: warn
          retention-days: 7

      - name: P0 runtime environment state isolation
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: python scripts/production_stage_ladder.py phase P0 --evidence-dir "$EVIDENCE_DIR"

      - name: Certify Engine source after P0
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -c 'from scripts.engine_source_hermeticity import certify_engine_source_hermeticity; certify_engine_source_hermeticity("stage_ladder_P0")'

      - name: P1 planning provider routing capacity contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: python scripts/production_stage_ladder.py phase P1 --evidence-dir "$EVIDENCE_DIR"

      - name: Certify Engine source after P1
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -c 'from scripts.engine_source_hermeticity import certify_engine_source_hermeticity; certify_engine_source_hermeticity("stage_ladder_P1")'

      - name: P2 TTS voice and audio contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: python scripts/production_stage_ladder.py phase P2 --evidence-dir "$EVIDENCE_DIR"

      - name: Certify Engine source after P2
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -c 'from scripts.engine_source_hermeticity import certify_engine_source_hermeticity; certify_engine_source_hermeticity("stage_ladder_P2")'

      - name: P3 media visual security and cinematic contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: python scripts/production_stage_ladder.py phase P3 --evidence-dir "$EVIDENCE_DIR"

      - name: Certify Engine source after P3
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -c 'from scripts.engine_source_hermeticity import certify_engine_source_hermeticity; certify_engine_source_hermeticity("stage_ladder_P3")'

      - name: Fetch exact video-50 known-good baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$BASELINE_DIR"
          gh release download video-50 --repo "$GITHUB_REPOSITORY" --pattern final.mp4 --dir "$BASELINE_DIR"
          test -f "$BASELINE_DIR/final.mp4"
          test "$(stat -c %s "$BASELINE_DIR/final.mp4")" = "239012306"
          echo "143abdfb7b55f2269cab2c4634b68e7a99a5581ac08eceeccfb8cdda2ffdc742  $BASELINE_DIR/final.mp4" | sha256sum -c -

      - name: P4 real video-50 current Final Master QC replay
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: python scripts/production_stage_ladder.py phase P4 --evidence-dir "$EVIDENCE_DIR" --baseline "$BASELINE_DIR/final.mp4" --staging "$STAGING_DIR"

      - name: P5 current Gold same-render replay
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: python scripts/production_stage_ladder_p5_viewer_boundary.py phase P5 --evidence-dir "$EVIDENCE_DIR" --staging "$STAGING_DIR"

      - name: P6 current packaging delivery release dry replay
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: python scripts/production_stage_ladder.py phase P6 --evidence-dir "$EVIDENCE_DIR" --staging "$STAGING_DIR"

      - name: Certify P0-P6 same-SHA family closure
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          python scripts/production_stage_ladder.py certify --evidence-dir "$EVIDENCE_DIR" --output "$CERTIFICATE_PATH"
          test "$(jq -r .runner_sha "$CERTIFICATE_PATH")" = "$CANDIDATE_SHA"
          test "$(jq -r .engine_sha "$CERTIFICATE_PATH")" = "${{ steps.engine_contract.outputs.engine_sha }}"
          test "$(jq -r .status "$CERTIFICATE_PATH")" = "green"
          test "$(jq -r .production_dispatch_performed "$CERTIFICATE_PATH")" = "false"

      - name: Final Engine source hermeticity
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -c 'from scripts.engine_source_hermeticity import certify_engine_source_hermeticity; certify_engine_source_hermeticity("stage_ladder_final")'

      - name: Publish exact-SHA Stage Ladder certification ref
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="stage-ladder-green-$CANDIDATE_SHA"
          endpoint="repos/$GITHUB_REPOSITORY/git/ref/tags/$tag"
          if payload="$(gh api "$endpoint" 2>/dev/null)"; then
            test "$(jq -r .object.type <<<"$payload")" = "commit"
            test "$(jq -r .object.sha <<<"$payload")" = "$CANDIDATE_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" \
              -f sha="$CANDIDATE_SHA" >/dev/null
          fi
          echo "Published exact-SHA Stage Ladder certification: $tag"

      - name: Upload exact-SHA Stage Ladder certificate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-stage-ladder-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/production-stage-ladder/stage-ladder-certification.json
            ${{ runner.temp }}/production-stage-ladder/evidence/*.json
          if-no-files-found: error
          retention-days: 30
