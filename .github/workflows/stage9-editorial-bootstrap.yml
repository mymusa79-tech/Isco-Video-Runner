name: Stage 9 Editorial Bootstrap

on:
  push:
    branches:
      - activate/editorial-room-stage9-final-integration

permissions:
  contents: write

jobs:
  patch-stage9:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage 9 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: activate/editorial-room-stage9-final-integration
          persist-credentials: true
          fetch-depth: 0

      - name: Apply exact Stage 9 integration
        env:
          OLD_ENGINE_SHA: 860b61b0f99b285cc2917cba079e29bfa9e2c119
          NEW_ENGINE_SHA: 568da9edfb68ebf9ea6e7d6aed0b6a9ee9a1180a
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          old = os.environ["OLD_ENGINE_SHA"]
          new = os.environ["NEW_ENGINE_SHA"]
          replacements = {
              Path(".github/workflows/produce-resilient-v4.yml"): 3,
              Path(".github/workflows/telegram-editorial-control.yml"): 1,
              Path(".github/workflows/verify-human-editorial-intent-m7.yml"): 1,
          }
          for path, expected in replacements.items():
              text = path.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} old Engine pins, found {actual}")
              updated = text.replace(old, new)
              if updated.count(new) < expected:
                  raise SystemExit(f"{path}: Engine pin replacement did not materialize")
              path.write_text(updated, encoding="utf-8")

          runner = Path("scripts/run_v3_voice.py")
          text = runner.read_text(encoding="utf-8")
          anchor = '    ledger = _production_budget_ledger(request["format"])\n\n    previous_defer = os.environ.get("ISCO_DEFER_YOUTUBE_ANALYTICS")'
          replacement = (
              '    ledger = _production_budget_ledger(request["format"])\n'
              '    production_id = _production_id()\n'
              '    os.environ["ISCO_PRODUCTION_ID"] = production_id\n\n'
              '    previous_defer = os.environ.get("ISCO_DEFER_YOUTUBE_ANALYTICS")'
          )
          if text.count(anchor) != 1:
              raise SystemExit("run_v3_voice pre-production production_id anchor is not exact")
          text = text.replace(anchor, replacement)
          duplicate = '    ledger.write(out / "ai-budget.json")\n    production_id = _production_id()\n    manifest = _write_production_manifest(out, production_id=production_id, fmt=plan.format)'
          reuse = '    ledger.write(out / "ai-budget.json")\n    manifest = _write_production_manifest(out, production_id=production_id, fmt=plan.format)'
          if text.count(duplicate) != 1:
              raise SystemExit("run_v3_voice post-Gold production_id anchor is not exact")
          text = text.replace(duplicate, reuse)
          runner.write_text(text, encoding="utf-8")

          test = Path("scripts/test_editorial_stage9_integration.py")
          test.write_text('''from __future__ import annotations\n\nimport unittest\nfrom pathlib import Path\n\n\nENGINE_SHA = "568da9edfb68ebf9ea6e7d6aed0b6a9ee9a1180a"\nOLD_ENGINE_SHA = "860b61b0f99b285cc2917cba079e29bfa9e2c119"\n\n\nclass EditorialStage9IntegrationTests(unittest.TestCase):\n    def test_all_live_engine_pins_match_stage8_main(self) -> None:\n        production = Path(".github/workflows/produce-resilient-v4.yml").read_text(encoding="utf-8")\n        telegram = Path(".github/workflows/telegram-editorial-control.yml").read_text(encoding="utf-8")\n        hei = Path(".github/workflows/verify-human-editorial-intent-m7.yml").read_text(encoding="utf-8")\n        self.assertEqual(production.count(ENGINE_SHA), 3)\n        self.assertEqual(telegram.count(ENGINE_SHA), 1)\n        self.assertEqual(hei.count(ENGINE_SHA), 1)\n        for text in (production, telegram, hei):\n            self.assertNotIn(OLD_ENGINE_SHA, text)\n\n    def test_production_keeps_manual_dispatch_and_telegram_production_lock(self) -> None:\n        production = Path(".github/workflows/produce-resilient-v4.yml").read_text(encoding="utf-8")\n        telegram = Path(".github/workflows/telegram-editorial-control.yml").read_text(encoding="utf-8")\n        self.assertIn("workflow_dispatch:", production)\n        self.assertNotIn("\\n  push:", production)\n        self.assertNotIn("\\n  schedule:", production)\n        self.assertIn('CONTROL_PLANE_PRODUCTION_ENABLED: "false"', telegram)\n\n    def test_one_production_id_is_bound_before_engine_and_reused_after_gold(self) -> None:\n        runner = Path("scripts/run_v3_voice.py").read_text(encoding="utf-8")\n        self.assertEqual(runner.count("production_id = _production_id()"), 1)\n        self.assertEqual(runner.count('os.environ["ISCO_PRODUCTION_ID"] = production_id'), 1)\n        before = runner.index("orchestrator.produce(")\n        binding = runner.index('os.environ["ISCO_PRODUCTION_ID"] = production_id')\n        manifest = runner.index("_write_production_manifest(out, production_id=production_id")\n        analytics = runner.index("production_id=production_id if manifest.get")\n        self.assertLess(binding, before)\n        self.assertLess(before, manifest)\n        self.assertLess(manifest, analytics)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")
          PY

      - name: Remove bootstrap and verify diff
        run: |
          set -euo pipefail
          rm .github/workflows/stage9-editorial-bootstrap.yml
          git diff --check
          test "$(grep -RIl '860b61b0f99b285cc2917cba079e29bfa9e2c119' \
            .github/workflows/produce-resilient-v4.yml \
            .github/workflows/telegram-editorial-control.yml \
            .github/workflows/verify-human-editorial-intent-m7.yml | wc -l)" -eq 0
          python -m unittest scripts.test_editorial_stage9_integration -v

      - name: Commit exact Stage 9 patch
        run: |
          set -euo pipefail
          git config user.name "isco-stage9-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/produce-resilient-v4.yml \
            .github/workflows/telegram-editorial-control.yml \
            .github/workflows/verify-human-editorial-intent-m7.yml \
            scripts/run_v3_voice.py \
            scripts/test_editorial_stage9_integration.py
          git rm .github/workflows/stage9-editorial-bootstrap.yml
          git diff --cached --check
          git commit -m "Editorial Room Stage 9: integrate certified Engine main"
          git push origin HEAD:activate/editorial-room-stage9-final-integration
