name: TEMP Verify SFX Live M7 Binding

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENGINE_SHA: 64ab711bc904e9581c3cc6c8280d1321ae738eb1
    steps:
      - name: Checkout Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout exact Engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ env.ENGINE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact Engine
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "$ENGINE_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Install locked Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Focused Engine SFX tests
        working-directory: engine
        run: python -m unittest tests.test_cinematic_v2_sfx -v
      - name: Focused Runner SFX and audio chain tests
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m unittest scripts.test_sfx_live_binding -v
          python -m unittest scripts.test_audio_mastering_live_binding -v
          python -m unittest scripts.test_runtime_closure -v
          python -m unittest scripts.test_m7_live_binding -v
      - name: Wiring sanity
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          grep -F 'install_audio_mastering_live_binding()' scripts/runtime_closure.py >/dev/null
          grep -F 'install_sfx_live_binding()' scripts/runtime_closure.py >/dev/null
          grep -F 'visual-timeline.json' scripts/sfx_live_binding.py >/dev/null
          grep -F 'post_mastering_pre_final_mux' scripts/sfx_live_binding.py >/dev/null
