name: TEMP Verify M10 Evidence Cards

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENGINE_SHA: 64ab711bc904e9581c3cc6c8280d1321ae738eb1
    steps:
      - name: Checkout Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Checkout exact Engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ env.ENGINE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact Engine
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "$ENGINE_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.12"}
      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Install locked Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Focused M10 and chain tests
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          (cd engine && python -m unittest tests.test_cinematic_v2_m10_cards -v)
          python -m unittest scripts.test_m10_live_binding -v
          python -m unittest scripts.test_runtime_closure -v
          python -m unittest scripts.test_m9_live_binding -v
          python -m unittest scripts.test_m8_live_binding -v
      - name: Real Arabic libass card smoke
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/m10-smoke
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i color=c=0x202020:s=1920x1080:r=30:d=2 -c:v libx264 -pix_fmt yuv420p /tmp/m10-smoke/src.mp4
          python - <<'PY'
          from pathlib import Path
          from isco_video_agent.cinematic_m10_cards import CardRequest, CardType, render_card
          from scripts.m10_live_binding import _layout
          root=Path('/tmp/m10-smoke')
          out=render_card(root/'src.mp4', CardRequest(CardType.QUOTE,'هذه عبارة عربية موثقة موجودة حرفيًا في النص','نداء اليقظة',0.3,1.6), _layout(), root/'dest.mp4')
          assert out.is_file() and out.stat().st_size > 1000
          PY
      - name: Wiring sanity
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          grep -F 'install_m10_live_binding()' scripts/runtime_closure.py >/dev/null
          grep -F 'invented_claims_allowed' scripts/m10_live_binding.py >/dev/null
          grep -F '_MAX_CARDS = 2' scripts/m10_live_binding.py >/dev/null
