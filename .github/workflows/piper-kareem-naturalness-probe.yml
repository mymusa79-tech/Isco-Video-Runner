name: Piper Kareem Naturalness Probe

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/probe_piper_kareem_naturalness.py"
      - ".github/workflows/piper-kareem-naturalness-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install pinned Piper
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'piper-tts==1.4.2'

      - name: Download the exact current fallback voice
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/piper-voices"
          python -m piper.download_voices             --data-dir "$RUNNER_TEMP/piper-voices"             ar_JO-kareem-medium
          test -s "$RUNNER_TEMP/piper-voices/ar_JO-kareem-medium.onnx"
          test -s "$RUNNER_TEMP/piper-voices/ar_JO-kareem-medium.onnx.json"

      - name: Generate bounded A-B samples
        run: |
          set -euo pipefail
          python scripts/probe_piper_kareem_naturalness.py             --model "$RUNNER_TEMP/piper-voices/ar_JO-kareem-medium.onnx"             --output probe_artifacts/piper-kareem-naturalness

      - name: Show report
        if: always()
        run: |
          cat probe_artifacts/piper-kareem-naturalness/piper-kareem-naturalness-report.json || true

      - name: Upload listening samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: piper-kareem-naturalness-probe
          path: probe_artifacts/piper-kareem-naturalness/
          if-no-files-found: warn
          retention-days: 7
