name: Isco Video Production Resilient V3

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Arabic topic or working title"
        required: true
        default: "كيف تنهض بعد أن سقطت كثيرًا؟"
        type: string
      format:
        description: "film or story"
        required: true
        default: film
        type: choice
        options: [film, story]

concurrency:
  group: isco-video-resilient-v3
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout private engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 2e271271c7770289eef81c354a26681cb2ee3d23
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core openssl
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
          python -m pip check
          python -m unittest discover -s tests -q

      - name: Prepare secure request and secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          TOPIC_INPUT: ${{ inputs.topic }}
          FORMAT_INPUT: ${{ inputs.format }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          test -n "$GROQ_API_KEY"
          test -n "$OPENROUTER_API_KEY"
          test -n "$PEXELS_API_KEY"
          test -n "$PIXABAY_API_KEY"
          umask 077
          mkdir -p "$RUNNER_TEMP/isco-secrets"
          printf '%s' "$GEMINI_API_KEY" > "$RUNNER_TEMP/isco-secrets/gemini"
          printf '%s' "$GROQ_API_KEY" > "$RUNNER_TEMP/isco-secrets/groq"
          printf '%s' "$OPENROUTER_API_KEY" > "$RUNNER_TEMP/isco-secrets/openrouter"
          printf '%s' "$PEXELS_API_KEY" > "$RUNNER_TEMP/isco-secrets/pexels"
          printf '%s' "$PIXABAY_API_KEY" > "$RUNNER_TEMP/isco-secrets/pixabay"
          printf '%s' "$YOUTUBE_API_KEY" > "$RUNNER_TEMP/isco-secrets/youtube"
          python - <<'PY'
          import json, os
          from pathlib import Path
          topic = (os.environ.get("TOPIC_INPUT") or "").strip() if os.environ.get("EVENT_NAME") == "workflow_dispatch" else "كيف تنهض بعد أن سقطت كثيرًا؟"
          fmt = (os.environ.get("FORMAT_INPUT") or "film").strip().lower() if os.environ.get("EVENT_NAME") == "workflow_dispatch" else "film"
          if not topic or fmt not in {"film", "story"}:
              raise SystemExit("Invalid production request")
          Path(os.environ["RUNNER_TEMP"], "isco-request.json").write_text(json.dumps({"topic": topic, "format": fmt}, ensure_ascii=False), encoding="utf-8")
          PY

      - name: Verify provider authentication without generation
        env:
          GROQ_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/groq
          PIXABAY_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/pixabay
        run: |
          python - <<'PY'
          import os, requests
          from pathlib import Path
          groq = Path(os.environ["GROQ_API_KEY_FILE"]).read_text().strip()
          pixabay = Path(os.environ["PIXABAY_API_KEY_FILE"]).read_text().strip()
          a = requests.get("https://api.groq.com/openai/v1/models", headers={"Authorization": "Bearer " + groq}, timeout=30)
          if not a.ok: raise SystemExit(f"Groq auth failed: HTTP {a.status_code}")
          b = requests.get("https://pixabay.com/api/videos/", params={"key": pixabay, "q": "nature", "per_page": 3, "safesearch": "true"}, timeout=30)
          if not b.ok: raise SystemExit(f"Pixabay auth failed: HTTP {b.status_code}")
          print("Groq auth OK; Pixabay auth OK")
          PY

      - name: Produce with task-level router
        working-directory: engine
        env:
          GEMINI_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/gemini
          GROQ_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/groq
          OPENROUTER_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/openrouter
          PEXELS_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/pexels
          PIXABAY_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/pixabay
          YOUTUBE_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/youtube
          REQUEST_FILE: ${{ runner.temp }}/isco-request.json
          GEMINI_CONTENT_MODEL: gemini-2.5-flash
          GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
          TRENDS_GEO: SA
          YOUTUBE_REGION: SA
          YOUTUBE_LANGUAGE: ar
          PYTHONPATH: ${{ github.workspace }}
        run: python ../scripts/task_level_planner_router.py

      - name: Stage final review
        run: |
          set -euo pipefail
          OUT_DIR="$(find engine/output -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -f "$OUT_DIR/final.mp4"
          mkdir -p safe-output
          cp "$OUT_DIR/final.mp4" safe-output/final.mp4
          if [ -f "$OUT_DIR/quality-final.json" ]; then cp "$OUT_DIR/quality-final.json" safe-output/quality-final.json; fi
          if [ -f "$OUT_DIR/rights-manifest.json" ]; then cp "$OUT_DIR/rights-manifest.json" safe-output/rights-manifest.json; fi

      - name: Upload review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: isco-resilient-v3-${{ github.run_number }}
          path: safe-output/
          if-no-files-found: error
          retention-days: 1
