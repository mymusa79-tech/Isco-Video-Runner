name: Verify Cinematic V2 Combined Integration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p0c-migration-contracts.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout verifier carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact Engine integration candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: d06797f1ffc70774900f6c4409855110d452abda
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact Runner integration candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Runner
          ref: f5f1fb4a42b4e16467a20a0f8a166831d9213d15
          path: candidate-runner
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact candidate SHAs
        run: |
          set -euo pipefail
          test "$(git -C engine rev-parse HEAD)" = "d06797f1ffc70774900f6c4409855110d452abda"
          test "$(git -C candidate-runner rev-parse HEAD)" = "f5f1fb4a42b4e16467a20a0f8a166831d9213d15"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install locked Engine and audit dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
          python -m pip install 'pip-audit==2.10.1'
          pip-audit --no-deps -r requirements-lock.txt

      - name: Focused Cinematic V2 Engine contracts
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest -q \
            tests.test_cinematic_v2_runtime \
            tests.test_cinematic_v2_m8_color_kernel \
            tests.test_cinematic_v2_m10_cards \
            tests.test_cinematic_v2_m11_cc0

      - name: Focused Runner production binding contracts
        working-directory: candidate-runner
        env:
          PYTHONPATH: ${{ github.workspace }}/candidate-runner/scripts:${{ github.workspace }}/engine/src:${{ github.workspace }}/candidate-runner
        run: |
          set -euo pipefail
          python -m py_compile scripts/cinematic_v2_runtime_installer.py scripts/run_v3_voice.py
          python -m unittest scripts.test_cinematic_v2_runtime_installer -v

      - name: Full Engine regression
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -q

      - name: Approved-Brief CLI matrix
        working-directory: engine
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src"
          brief="production/approved_brief.json"
          backup="$RUNNER_TEMP/approved_brief.backup.json"
          had_brief=0
          if [ -f "$brief" ]; then cp "$brief" "$backup"; had_brief=1; fi
          restore() {
            if [ "$had_brief" -eq 1 ]; then cp "$backup" "$brief"; else rm -f "$brief"; fi
          }
          trap restore EXIT

          rm -f "$brief"
          python -m isco_video_agent.cli produce --dry-run --no-research --topic "اختبار آمن للمصفوفة"
          python -m isco_video_agent.cli produce --dry-run --no-research

          mkdir -p production
          cat > "$brief" <<'JSON'
          {
            "approved_by_user": true,
            "approved_topic": "موضوع معتمد للاختبار",
            "format": "film",
            "approved_at": "2026-08-22T00:00:00Z",
            "weekly_option_id": "ci-matrix",
            "research_pack": [],
            "content_boundaries": []
          }
          JSON
          python -m isco_video_agent.cli produce --dry-run --no-research
          if python -m isco_video_agent.cli produce --dry-run --no-research --topic "موضوع مختلف"; then
            echo "Mismatching explicit topic unexpectedly succeeded" >&2
            exit 1
          fi

      - name: Full Runner regression
        working-directory: candidate-runner
        env:
          PYTHONPATH: ${{ github.workspace }}/candidate-runner/scripts:${{ github.workspace }}/engine/src:${{ github.workspace }}/candidate-runner
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort \
              | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          python -m unittest "${test_modules[@]}" -q

      - name: Integration invariants
        run: |
          set -euo pipefail
          git -C engine diff --check
          git -C candidate-runner diff --check
          test -f engine/src/isco_video_agent/cinematic_v2_runtime.py
          test -f engine/src/isco_video_agent/cinematic_m8_color_kernel.py
          test -f engine/src/isco_video_agent/cinematic_m10_cards.py
          test -f engine/src/isco_video_agent/cinematic_m11_cc0.py
          test -f candidate-runner/scripts/cinematic_v2_runtime_installer.py
          grep -q 'install_cinematic_v2_runtime()' candidate-runner/scripts/run_v3_voice.py
          ! grep -R --line-number -E 'GEMINI_API_KEY\s*=|PEXELS_API_KEY\s*=|PRIVATE_SOURCE_TOKEN\s*=' engine/src candidate-runner/scripts/cinematic_v2_runtime_installer.py
          echo 'Cinematic V2 combined integration invariants PASS'
