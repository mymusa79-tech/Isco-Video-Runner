name: Verify Clean Gold V2 Plus Packaging V1

on:
  pull_request:
    paths:
      - "scripts/gold_enforce_phase4.py"
      - "scripts/gold_thumbnail_budget.py"
      - "scripts/run_v3_voice.py"
      - "scripts/packaging_delivery_contract.py"
      - "scripts/test_thumbnail_pixabay_bridge_p0d.py"
      - "scripts/test_packaging_artifact_delivery_p0e.py"
      - ".github/workflows/produce-resilient-v4.yml"
      - ".github/workflows/p0c-migration-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout integrated Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prove clean Gold ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8f22d73cab614c0a8b19a2efaa37259656917644 HEAD
          echo "Clean Gold Phase 4 v2 ancestry preserved"

      - name: Checkout exact Foundation plus Packaging Engine integration candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 69bd421053d1f1f3d3d3fe71934272e91220cb3b
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 0

      - name: Verify pinned Engine integration candidate
        run: |
          set -euo pipefail
          test "$(git -C engine rev-parse HEAD)" = "69bd421053d1f1f3d3d3fe71934272e91220cb3b"
          echo "Engine integration HEAD: $(git -C engine rev-parse HEAD)"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install locked Engine runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Run Gold Phase 2B 3 4 plus Packaging Runner regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m unittest \
            scripts.test_gold_shadow_phase2b \
            scripts.test_gold_single_evaluator_phase3 \
            scripts.test_gold_enforce_phase4 \
            scripts.test_thumbnail_pixabay_bridge_p0d \
            scripts.test_packaging_artifact_delivery_p0e \
            -v

      - name: Run Packaging Engine P0 P1 P2 regressions
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_thumbnail_cultural_safety \
            tests.test_thumbnail_packaging_contract \
            tests.test_thumbnail_batch_review \
            tests.test_thumbnail_candidate_board \
            tests.test_thumbnail_pixabay_fallback \
            tests.test_packaging_identity_integrity_p1 \
            tests.test_thumbnail_renderer_p1 \
            tests.test_youtube_packaging_reporting_p1 \
            tests.test_packaging_early_brief_p2 \
            tests.test_packaging_experiments_p2 \
            tests.test_packaging_learning_p2 \
            tests.test_packaging_benchmark_p2 \
            -v

      - name: Run Analytics and Cinematic integration regressions
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_youtube_production_observer_credentials \
            tests.test_youtube_retention_m1_storage \
            tests.test_youtube_retention_m1_fallback \
            tests.test_cinematic_m1_loop_safety \
            tests.test_cinematic_m2_music_bed \
            tests.test_cinematic_m3_color \
            tests.test_cinematic_m4_voice_pacing \
            tests.test_cinematic_m5_outro \
            tests.test_cinematic_m6_opening \
            tests.test_cinematic_m6_opening_selection \
            -v

      - name: Run full Engine suite
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -q

      - name: Run full Runner regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort \
              | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          python -m unittest "${test_modules[@]}" -q

      - name: Verify exact Packaging delta over clean Gold v2
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/integration/gold-v2-packaging-v1:refs/remotes/origin/integration/gold-v2-packaging-v1"
          candidate="origin/integration/gold-v2-packaging-v1"
          actual="$(git diff --name-only 8f22d73cab614c0a8b19a2efaa37259656917644.."$candidate" | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/p0c-migration-contracts.yml \
            .github/workflows/produce-resilient-v4.yml \
            scripts/gold_enforce_phase4.py \
            scripts/gold_thumbnail_budget.py \
            scripts/packaging_delivery_contract.py \
            scripts/run_v3_voice.py \
            scripts/test_packaging_artifact_delivery_p0e.py \
            scripts/test_thumbnail_pixabay_bridge_p0d.py | sort)"
          printf 'ACTUAL\n%s\nEXPECTED\n%s\n' "$actual" "$expected"
          test "$actual" = "$expected"
          git diff --check 8f22d73cab614c0a8b19a2efaa37259656917644.."$candidate"

      - name: Verify safety and authority invariants
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import inspect
          from scripts.gold_enforce_phase4 import run_gold_enforce_phase4
          from scripts.gold_thumbnail_budget import build_budgeted_thumbnail_package
          from scripts.packaging_delivery_contract import validate_packaging_delivery
          assert 'pixabay' in inspect.signature(run_gold_enforce_phase4).parameters
          assert 'pixabay_key' in inspect.signature(build_budgeted_thumbnail_package).parameters
          assert callable(validate_packaging_delivery)
          print('Gold authority + Pixabay routing + Packaging delivery invariants PASS')
          PY
          test -z "${GEMINI_API_KEY:-}"
          test -z "${PEXELS_API_KEY:-}"
          test -z "${PIXABAY_API_KEY:-}"
          echo 'No provider credentials exposed'
