name: P0-C Migration Contract Freeze

on:
  push:
    branches: ["p0c/phase1-extract-gold-finalizer"]
    paths:
      - "scripts/test_p0c_migration_contracts.py"
      - ".github/workflows/p0c-migration-contracts.yml"
  pull_request:
    paths:
      - "scripts/test_p0c_migration_contracts.py"
      - ".github/workflows/p0c-migration-contracts.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Runner contract branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Capture prior failed Engine job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            --connect-timeout 20 --max-time 120 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/95989005991/logs" \
            --output prior-job-95989005991.log
          test -s prior-job-95989005991.log
          wc -l prior-job-95989005991.log

      - name: Upload prior failed Engine job log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prior-job-95989005991
          path: prior-job-95989005991.log
          if-no-files-found: error
          retention-days: 1

      - name: Checkout private Engine contract branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: p0c/phase1-extract-gold-finalizer
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install locked Engine test runtime
        run: |
          set -euo pipefail
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            install -y ffmpeg fonts-noto-core
          cd engine
          python -m pip install --timeout 30 --retries 3 -r requirements-lock.txt
          python -m pip install --timeout 30 --retries 3 --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Run full private Engine suite
        run: |
          set -euo pipefail
          cd engine
          python -m unittest discover -s tests -v

      - name: Run full Runner regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort \
              | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          printf 'Runner test modules (%s):\n' "${#test_modules[@]}"
          printf '  %s\n' "${test_modules[@]}"
          python -m unittest "${test_modules[@]}" -v

      - name: Compile migration-sensitive Runner adapters
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/run_v3_voice.py \
            scripts/task_level_planner_router.py \
            scripts/voice_mesh.py \
            scripts/test_p0c_migration_contracts.py

      - name: Verify provider credentials are absent
        run: |
          set -euo pipefail
          test -z "${GEMINI_API_KEY:-}"
          test -z "${GROQ_API_KEY:-}"
          test -z "${OPENROUTER_API_KEY:-}"
          test -z "${PEXELS_API_KEY:-}"
          test -z "${PIXABAY_API_KEY:-}"
          echo "P0-C contract job exposed no provider API credentials"
