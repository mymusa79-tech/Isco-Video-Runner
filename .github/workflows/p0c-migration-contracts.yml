name: P0-C Migration Contract Freeze

on:
  push:
    branches: ["p0c/phase1-extract-gold-finalizer"]
    paths:
      - "scripts/test_p0c_migration_contracts.py"
      - ".github/workflows/p0c-migration-contracts.yml"
  pull_request:
    paths:
      - "scripts/test_p0c_migration_contracts.py"
      - ".github/workflows/p0c-migration-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Runner contract branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout private Engine contract branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: p0c/phase1-extract-gold-finalizer
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install locked Engine test runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Run full private Engine suite
        run: |
          set -euo pipefail
          cd engine
          python -m unittest discover -s tests -v

      - name: Run full Runner regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Compile migration-sensitive Runner adapters
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/run_v3_voice.py \
            scripts/task_level_planner_router.py \
            scripts/voice_mesh.py \
            scripts/test_p0c_migration_contracts.py

      - name: Verify provider credentials are absent
        run: |
          set -euo pipefail
          test -z "${GEMINI_API_KEY:-}"
          test -z "${GROQ_API_KEY:-}"
          test -z "${OPENROUTER_API_KEY:-}"
          test -z "${PEXELS_API_KEY:-}"
          test -z "${PIXABAY_API_KEY:-}"
          echo "P0-C contract job exposed no provider API credentials"
