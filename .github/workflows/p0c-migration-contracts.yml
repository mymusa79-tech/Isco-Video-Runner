name: Verify Retention V2 M2 On Current Foundation

on:
  pull_request:
    paths:
      - ".github/workflows/p0c-migration-contracts.yml"
      - ".github/workflows/verify-retention-m2-current.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact Engine M2 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: agent/retention-v2-m2-timeline-binding
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install locked Engine runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: M0 M0.1 M1 M2 targeted regressions
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_youtube_analytics_health \
            tests.test_youtube_analytics_bound_health \
            tests.test_youtube_analytics_direct_health \
            tests.test_youtube_production_observer_credentials \
            tests.test_youtube_retention_m1_storage \
            tests.test_youtube_retention_m1_fallback \
            tests.test_youtube_retention_m1_observation_schema \
            tests.test_youtube_retention_m2_timeline_binding \
            -v

      - name: Full Engine regression suite
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -q

      - name: Verify exact M2 isolation boundary and contracts
        working-directory: engine
        run: |
          set -euo pipefail
          BASE_SHA=0a65585f987d262e2d08bbd752f9f45bf5e3a16f
          git cat-file -e "$BASE_SHA^{commit}"
          git diff --check "$BASE_SHA"..HEAD
          actual="$(git diff --name-only "$BASE_SHA"..HEAD | sort)"
          expected="$(printf '%s\n' \
            scripts/bind_retention_timeline.py \
            src/isco_video_agent/retention_timeline.py \
            tests/test_youtube_retention_m2_timeline_binding.py | sort)"
          printf 'ACTUAL\n%s\nEXPECTED\n%s\n' "$actual" "$expected"
          test "$actual" = "$expected"
          python - <<'PY'
          import inspect
          import isco_video_agent.retention_timeline as rt
          source = inspect.getsource(rt)
          assert 'timeline-map.json' in source
          assert 'forced alignment' in source
          assert 'CTA inference' in source
          assert 'production_influence' in source and 'none' in source
          assert 'ai_calls' in source
          print('M2 isolation PASS: derived read-only binding, no AI/production influence')
          PY

      - name: Verify no provider credentials are present
        run: |
          set -euo pipefail
          test -z "${GEMINI_API_KEY:-}"
          test -z "${GROQ_API_KEY:-}"
          test -z "${OPENROUTER_API_KEY:-}"
          test -z "${PEXELS_API_KEY:-}"
          test -z "${PIXABAY_API_KEY:-}"
          echo 'No provider credentials exposed'
