name: Isco Local Brain Benchmark V2
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/local-brain-benchmark-v2.yml"
concurrency:
  group: isco-local-brain-benchmark-v2
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      MODEL_URL: https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf?download=true
      MODEL_SHA256: 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
      LLAMA_TAG: b9637
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure runner-local paths
        run: |
          echo "MODEL_DIR=$RUNNER_TEMP/isco-local-brain" >> "$GITHUB_ENV"
          echo "MODEL_FILE=$RUNNER_TEMP/isco-local-brain/Qwen3-4B-Q4_K_M.gguf" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/isco-local-brain/runtime:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Restore local brain cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/isco-local-brain
          key: isco-local-brain-qwen3-4b-q4km-7485fe6f-llama-b9637
      - name: Install pinned runtime bundle
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_DIR/runtime"
          if [ ! -x "$MODEL_DIR/runtime/llama-server" ] || [ ! -f "$MODEL_DIR/runtime/libllama-server-impl.so" ]; then
            rm -rf "$MODEL_DIR/runtime" "$RUNNER_TEMP/llama-src"
            mkdir -p "$MODEL_DIR/runtime"
            git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama-src"
            cd "$RUNNER_TEMP/llama-src"
            git checkout --detach aedb2a5e9ca3d4064148bbb919e0ddc0c1b70ab3
            cmake -B build -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
            cmake --build build --config Release -j4 --target llama-server
            cp -a build/bin/. "$MODEL_DIR/runtime"/
            chmod 0755 "$MODEL_DIR/runtime/llama-server"
          fi
          test -f "$MODEL_DIR/runtime/libllama-server-impl.so"
          "$MODEL_DIR/runtime/llama-server" --version
      - name: Download verified official model
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_DIR"
          if [ ! -f "$MODEL_FILE" ] || ! echo "$MODEL_SHA256  $MODEL_FILE" | sha256sum -c - >/dev/null 2>&1; then
            rm -f "$MODEL_FILE" "$MODEL_FILE.part"
            curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 "$MODEL_URL" -o "$MODEL_FILE.part"
            echo "$MODEL_SHA256  $MODEL_FILE.part" | sha256sum -c -
            mv "$MODEL_FILE.part" "$MODEL_FILE"
          fi
          echo "$MODEL_SHA256  $MODEL_FILE" | sha256sum -c -
      - name: Cost and disk gate
        run: |
          set -euo pipefail
          FREE_KB=$(df --output=avail -k "$RUNNER_TEMP" | tail -1)
          test "$FREE_KB" -ge 6291456
          SIZE=$(stat -c%s "$MODEL_FILE")
          test "$SIZE" -le 3221225472
          echo "free_disk_mb=$((FREE_KB/1024)) model_mb=$((SIZE/1024/1024))"
      - name: Start local brain
        run: |
          set -euo pipefail
          mkdir -p benchmark-output
          "$MODEL_DIR/runtime/llama-server" --model "$MODEL_FILE" --host 127.0.0.1 --port 8080 --ctx-size 4096 --threads 4 --threads-batch 4 --parallel 1 --no-webui >benchmark-output/llama-server.log 2>&1 &
          echo $! > "$RUNNER_TEMP/llama.pid"
          PID=$(cat "$RUNNER_TEMP/llama.pid")
          ( peak=0; while kill -0 "$PID" 2>/dev/null; do rss=$(awk '/VmRSS:/ {print $2}' "/proc/$PID/status" 2>/dev/null || echo 0); [ "${rss:-0}" -gt "$peak" ] && peak="$rss"; echo "$peak" > "$RUNNER_TEMP/peak-kb"; sleep 1; done ) &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null && exit 0
            kill -0 "$PID" 2>/dev/null || { cat benchmark-output/llama-server.log; exit 1; }
            sleep 1
          done
          exit 1
      - name: Benchmark Arabic planning
        env:
          LOCAL_LLM_ENDPOINT: http://127.0.0.1:8080/v1/chat/completions
          LOCAL_LLM_MODEL: local-qwen3-4b-q4km
          LOCAL_BRAIN_REPORT: benchmark-output/local-brain-report.json
          LOCAL_BRAIN_TIME_BUDGET_S: "420"
          LOCAL_BRAIN_MAX_RSS_MB: "12288"
        run: timeout 480 python scripts/local_brain_benchmark.py
      - name: Resource gate
        if: always()
        run: |
          set -euo pipefail
          PID=$(cat "$RUNNER_TEMP/llama.pid" 2>/dev/null || true)
          PEAK=$(cat "$RUNNER_TEMP/peak-kb" 2>/dev/null || echo 0)
          [ -z "$PID" ] || kill "$PID" 2>/dev/null || true
          mkdir -p benchmark-output
          echo "llama_peak_rss_mb=$((PEAK/1024))" | tee benchmark-output/resources.txt
          df -h . | tee -a benchmark-output/resources.txt
          du -sh "$MODEL_DIR" | tee -a benchmark-output/resources.txt
          test "$PEAK" -le 12582912
          test -f benchmark-output/local-brain-report.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: isco-local-brain-v2-${{ github.run_number }}
          path: benchmark-output/
          if-no-files-found: warn
          retention-days: 1
