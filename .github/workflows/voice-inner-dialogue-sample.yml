name: Voice Inner Dialogue Sample (Gemini 3.8 Charon)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/voice-inner-dialogue-sample.yml"

permissions:
  contents: read

jobs:
  synthesize_inner_dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Synthesize inner dialogue with Charon only
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          mkdir -p voice-samples
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          endpoint = "https://generativelanguage.googleapis.com/v1beta/interactions"
          api_key = os.environ["GEMINI_API_KEY"]

          reflective = (
              "Natural adult Modern Standard Arabic. Same single person thinking privately to himself. "
              "Warm, mature and intimate; subtle hesitation before questions, calm self-correction in answers, "
              "human pacing, no announcer tone, no theatrical acting, no second character."
          )
          resolved = (
              "Same exact Charon speaker and identity. Slightly clearer and steadier as the thought resolves, "
              "still private and conversational, never motivational-speaker delivery."
          )

          content = [
              {
                  "type": "text",
                  "text": "لماذا أؤجلها مرة أخرى؟ هل المشكلة فعلًا أنني كسول؟",
                  "annotations": [{"type": "speech_metadata", "style": reflective}],
              },
              {
                  "type": "text",
                  "text": "لا. لو كان الأمر كسلًا فقط، لما ظللت أفكر فيها طوال اليوم.",
                  "annotations": [{"type": "speech_metadata", "style": reflective}],
              },
              {
                  "type": "text",
                  "text": "ربما أنا أنتظر اللحظة التي أشعر فيها أنني مستعد تمامًا.",
                  "annotations": [{"type": "speech_metadata", "style": reflective}],
              },
              {
                  "type": "text",
                  "text": "لكن ماذا لو أن الاستعداد لا يأتي قبل البداية أصلًا؟",
                  "annotations": [{"type": "speech_metadata", "style": reflective}],
              },
              {
                  "type": "text",
                  "text": "إذن لا أحتاج إلى دفعة كبيرة. أحتاج خطوة صغيرة أستطيع أن أبدأ بها الآن.",
                  "annotations": [{"type": "speech_metadata", "style": resolved}],
              },
          ]

          payload = {
              "model": "gemini-3.8-flash-tts",
              "input": [{"type": "user_input", "content": content}],
              "response_format": {"type": "audio"},
              "generation_config": {"speech_config": [{"voice": "Charon"}]},
          }
          request = urllib.request.Request(
              endpoint,
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": api_key,
              },
          )
          with urllib.request.urlopen(request, timeout=180) as response:
              result = json.loads(response.read().decode("utf-8"))

          encoded = None
          for step in reversed(result.get("steps", [])):
              for block in reversed(step.get("content", [])):
                  if block.get("type") == "audio" and block.get("data"):
                      encoded = block["data"]
                      break
              if encoded:
                  break
          if not encoded:
              raise RuntimeError("no audio returned")
          audio = base64.b64decode(encoded)
          if not audio.startswith(b"RIFF"):
              raise RuntimeError("non-WAV response")
          target = Path("voice-samples/charon_inner_dialogue.wav")
          target.write_bytes(audio)
          print(f"OK {target} {len(audio)} bytes")
          PY

      - name: Convert sample to MP3
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y ffmpeg
          ffmpeg -y -hide_banner -loglevel error \
            -i voice-samples/charon_inner_dialogue.wav \
            -codec:a libmp3lame -q:a 2 voice-samples/charon_inner_dialogue.mp3

      - name: Upload inner dialogue sample
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gemini38-charon-inner-dialogue
          path: |
            voice-samples/charon_inner_dialogue.wav
            voice-samples/charon_inner_dialogue.mp3
          if-no-files-found: error
          retention-days: 3
