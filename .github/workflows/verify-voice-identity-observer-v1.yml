name: Verify Voice Identity Observer V1

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/voice_identity_observer.py"
      - "scripts/test_voice_identity_observer.py"
      - "scripts/voice_mesh.py"
      - "scripts/test_voice_mesh.py"
      - "scripts/run_v3_voice.py"
      - "scripts/test_run_v3_voice.py"
      - "scripts/gold_shadow_phase2a.py"
      - "scripts/test_gold_shadow_phase2a.py"
      - "voice-profiles/voice-reference-profile-v1.json"
      - ".github/workflows/produce-resilient-v4.yml"
      - ".github/workflows/verify-voice-identity-observer-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout runner observer branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve canonical V4 Engine pin
        id: engine_pin
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('.github/workflows/produce-resilient-v4.yml')
          text = path.read_text(encoding='utf-8')
          checkout = re.findall(r'^\s+ref:\s+([0-9a-f]{40})\s*$', text, flags=re.MULTILINE)
          env_pin = re.findall(r'^\s+ISCO_ENGINE_SHA:\s+([0-9a-f]{40})\s*$', text, flags=re.MULTILINE)
          if len(checkout) != 1 or len(env_pin) != 1 or checkout[0] != env_pin[0]:
              raise SystemExit(f'V4 Engine pin mismatch: checkout={checkout} env={env_pin}')
          sha = checkout[0]
          required = (
              'workflow_dispatch:',
              'engine/production/approved_brief.json',
              'approved_by_user',
              'approved_topic',
              'ISCO_APPROVED_BRIEF_PATH:',
          )
          missing = [needle for needle in required if needle not in text]
          forbidden = ('inputs.topic', 'inputs.format', 'TOPIC_INPUT', 'FORMAT_INPUT', 'EVENT_NAME', 'push:')
          present = [needle for needle in forbidden if needle in text]
          if missing or present:
              raise SystemExit(f'V4 production contract drift: missing={missing} forbidden_present={present}')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as fh:
              fh.write(f'engine_sha={sha}\n')
          print('V4 Engine pin contract OK:', sha)
          PY

      - name: Checkout current canonical private Engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ steps.engine_pin.outputs.engine_sha }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine checkout
        working-directory: engine
        env:
          ENGINE_SHA: ${{ steps.engine_pin.outputs.engine_sha }}
        run: test "$(git rev-parse HEAD)" = "$ENGINE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install locked Engine and observer runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      # Full Engine ownership lives only in verify-private-engine.yml
      # (Canonical Full Regression). This workflow owns Voice/Gold contracts,
      # immutable reference provenance and the real ECAPA smoke.
      - name: Verify V4 uses the checked-out Engine
        env:
          ENGINE_SHA: ${{ steps.engine_pin.outputs.engine_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          import yaml

          path = Path('.github/workflows/produce-resilient-v4.yml')
          text = path.read_text(encoding='utf-8')
          if not isinstance(yaml.safe_load(text), dict):
              raise SystemExit('V4 workflow did not parse as a YAML mapping')
          current = os.environ['ENGINE_SHA']
          checkout = re.findall(r'^\s+ref:\s+([0-9a-f]{40})\s*$', text, flags=re.MULTILINE)
          env_pin = re.findall(r'^\s+ISCO_ENGINE_SHA:\s+([0-9a-f]{40})\s*$', text, flags=re.MULTILINE)
          if checkout != [current] or env_pin != [current]:
              raise SystemExit(f'V4 does not use checked-out Engine: checkout={checkout} env={env_pin} expected={current}')
          print('V4 Engine pin contract OK:', current)
          PY

      - name: Run combined Runner Voice and Gold contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}:${{ github.workspace }}/engine/src
        run: |
          set -euo pipefail
          python -m unittest \
            scripts.test_voice_mesh \
            scripts.test_voice_identity_observer \
            scripts.test_gold_shadow_phase2a \
            scripts.test_run_v3_voice -v

      - name: Assert Gold and Voice namespaces are disjoint
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}:${{ github.workspace }}/engine/src
        run: |
          python - <<'PY'
          from isco_video_agent.ai_budget import Capability
          from isco_video_agent.production_pipeline import _final_critic_spec
          from scripts.voice_identity_observer import AUDIT_FILENAME

          legacy = {
              _final_critic_spec('FINAL_CRITIC_OPENING_VISUAL', Capability.VISION).task_id,
              _final_critic_spec('FINAL_CRITIC_RELEASE_REVIEW', Capability.TEXT).task_id,
          }
          gold = {
              _final_critic_spec('FINAL_CRITIC_OPENING_VISUAL', Capability.VISION, task_prefix='GOLD_SHADOW_', task_kind='GOLD_SHADOW_FINAL_CRITIC').task_id,
              _final_critic_spec('FINAL_CRITIC_RELEASE_REVIEW', Capability.TEXT, task_prefix='GOLD_SHADOW_', task_kind='GOLD_SHADOW_FINAL_CRITIC').task_id,
          }
          tts = {f'TTS_SECTION_{i:02d}' for i in range(1, 9)}
          assert legacy.isdisjoint(gold)
          assert gold.isdisjoint(tts)
          assert AUDIT_FILENAME == 'voice-identity-audit.json'
          assert AUDIT_FILENAME != 'gold-shadow-comparison.json'
          print('Namespace contract OK:', sorted(legacy), sorted(gold), AUDIT_FILENAME)
          PY

      - name: Assert immutable approved voice-reference provenance
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = Path('voice-profiles/voice-reference-profile-v1.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          source = data.get('source', {})
          embedding = data.get('embedding', {})
          profiles = data.get('profiles', {})

          assert data.get('schema_version') == 1
          assert data.get('profile_version') == 'channel-voice-roster-v1'
          assert data.get('mode') == 'human_approved_reference'
          assert source.get('runner_run_id') == 32224276241
          assert source.get('artifact_id') == 9355112613
          assert source.get('tts_model') == 'gemini-3.1-flash-tts-preview'
          assert source.get('human_approval') == 'Charon=primary; Orus=questioner'
          assert embedding.get('backend') == 'speechbrain-ecapa-voxceleb'
          assert embedding.get('model_source') == 'speechbrain/spkrec-ecapa-voxceleb'
          assert embedding.get('model_revision') == 'a025b9e8262be969a7b3f8f53c01d346eadf361b'
          assert embedding.get('sample_rate_hz') == 16000
          assert float(embedding.get('window_seconds')) == 4.0

          primary = profiles.get('primary', {})
          questioner = profiles.get('questioner', {})
          assert primary.get('voice_name') == 'Charon'
          assert questioner.get('voice_name') == 'Orus'
          assert primary.get('reference_sha256') == '129130c0c453dcf13f9ad5f861052d8346a0dafdb4f0126e437d566530363a87'
          assert questioner.get('reference_sha256') == '5bfa06f7f22e22a3b9f0344d0b2ddbb7dff3ac28131616f4477f52a72cec23ea'

          dimensions = {len(primary.get('centroid', [])), len(questioner.get('centroid', []))}
          assert len(dimensions) == 1 and next(iter(dimensions)) >= 64
          for role, profile in (('primary', primary), ('questioner', questioner)):
              centroid = profile['centroid']
              assert all(math.isfinite(float(value)) for value in centroid)
              norm = math.sqrt(sum(float(value) ** 2 for value in centroid))
              assert 0.999 <= norm <= 1.001, (role, norm)
              assert len(profile.get('reference_windows', [])) >= 3
          print('Approved Voice profile provenance OK; hashes and ECAPA revision immutable')
          PY

      - name: Build deterministic local ECAPA smoke WAV
        run: |
          set -euo pipefail
          python - <<'PY'
          import math
          import struct
          import wave
          from pathlib import Path

          rate = 16000
          seconds = 14.0
          total = int(rate * seconds)
          out = Path('voice-observer-ecapa-smoke.wav')
          phase = 0.0
          frames = bytearray()
          for index in range(total):
              t = index / rate
              f0 = 118.0 + 18.0 * math.sin(2.0 * math.pi * 0.31 * t)
              phase += 2.0 * math.pi * f0 / rate
              envelope = 0.42 + 0.16 * math.sin(2.0 * math.pi * 2.7 * t) + 0.08 * math.sin(2.0 * math.pi * 4.9 * t)
              sample = envelope * (
                  0.58 * math.sin(phase)
                  + 0.25 * math.sin(2.0 * phase + 0.3)
                  + 0.12 * math.sin(3.0 * phase + 0.8)
                  + 0.05 * math.sin(5.0 * phase + 1.1)
              )
              sample = max(-0.95, min(0.95, sample))
              frames.extend(struct.pack('<h', int(round(sample * 32767))))
          with wave.open(str(out), 'wb') as handle:
              handle.setnchannels(1)
              handle.setsampwidth(2)
              handle.setframerate(rate)
              handle.writeframes(frames)
          assert out.stat().st_size > rate * 2 * 10
          print('Deterministic ECAPA smoke WAV built:', out, out.stat().st_size)
          PY

      - name: ECAPA real-model smoke against enrolled immutable references
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}:${{ github.workspace }}/engine/src
        run: |
          set -euo pipefail
          python - <<'PY'
          import math
          from pathlib import Path
          from scripts.voice_identity_observer import _analyze_wav

          sample = Path('voice-observer-ecapa-smoke.wav')
          single = _analyze_wav(sample, dialogue=False)
          dialogue = _analyze_wav(sample, dialogue=True)
          score = single['speaker_similarity']
          if score is None or not math.isfinite(float(score)) or not -1.0 <= float(score) <= 1.0:
              raise SystemExit(f'invalid ECAPA primary similarity: {score!r}')
          if len(single['window_scores']) < 3 or len(dialogue['window_scores']) < 3:
              raise SystemExit('ECAPA smoke did not measure start/middle/end windows')
          if any('questioner_similarity' not in item for item in dialogue['window_scores']):
              raise SystemExit('Dialogue ECAPA smoke omitted questioner-reference scores')
          for item in dialogue['window_scores']:
              for key in ('primary_similarity', 'questioner_similarity'):
                  value = float(item[key])
                  if not math.isfinite(value) or not -1.0 <= value <= 1.0:
                      raise SystemExit(f'invalid {key}: {value!r}')
          print('ECAPA real-model runtime smoke OK; primary similarity=', score)
          print('Reference identity is owned by immutable enrolled centroids/hashes, not this synthetic smoke WAV')
          print('No threshold/enforcement asserted: Phase 1 remains uncalibrated observe-only')
          PY
