name: Temporary Engine Smoke

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/engine-smoke.yml"

permissions:
  contents: read

jobs:
  test-private-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private engine read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 8a9cd5161f28a6656d822924e5b6243c6e5bce3e
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install local media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install locked runtime
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Run full unit test suite without provider secrets
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -q
