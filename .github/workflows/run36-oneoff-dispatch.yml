# one-off trigger commit for Run36 bootstrap
name: Run36 One-Off Production Bootstrap

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/run36-oneoff-dispatch.yml"

permissions:
  contents: write
  actions: write

jobs:
  bootstrap-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Pin engine SHA on isolated Runner branch
        env:
          TARGET_BRANCH: ops/run36-engine-064acab
          OLD_ENGINE_SHA: a526ed095c886f8d7bdadafaab95158626047081
          NEW_ENGINE_SHA: 064acab57a0d9e155d5938145072dc548657061f
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path('.github/workflows/produce-resilient-v4.yml')
          text = path.read_text(encoding='utf-8')
          old = f"          ref: {os.environ['OLD_ENGINE_SHA']}"
          new = f"          ref: {os.environ['NEW_ENGINE_SHA']}"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one old engine SHA reference, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/produce-resilient-v4.yml
          git commit -m "chore: pin engine 064acab for run36"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "RUNNER_BRANCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch production from isolated branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ops/run36-engine-064acab
        run: |
          set -euo pipefail
          payload='{"ref":"ops/run36-engine-064acab","inputs":{"topic":"وهم البداية المثالية","format":"film"}}'
          status="$(curl --silent --show-error --output /tmp/dispatch-response.txt --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/produce-resilient-v4.yml/dispatches" \
            --data "$payload")"
          if [ "$status" != "204" ]; then
            cat /tmp/dispatch-response.txt >&2 || true
            echo "workflow_dispatch failed with HTTP $status" >&2
            exit 1
          fi
          echo "Dispatched production from ${TARGET_BRANCH} at ${RUNNER_BRANCH_SHA}"
