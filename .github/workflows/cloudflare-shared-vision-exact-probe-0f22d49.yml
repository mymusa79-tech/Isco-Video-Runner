name: Cloudflare Shared Vision Exact Probe 0f22d49

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/cloudflare-shared-vision-exact-probe-0f22d49.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-shared-vision-exact-probe-0f22d49
  cancel-in-progress: false

jobs:
  probe:
    name: cloudflare-exact-vision-probe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_RUNNER_SHA: 0f22d49c90416db856d1b0d79f8e4b0f6418cd77
      ENGINE_SHA: 3cbd689819e6b0e0b2ea9904d1998e24a5e2a293
      SOURCE_RUN_ID: "35401902573"
      SOURCE_ARTIFACT: clean-v2-cohort-visualqa-4d6f1b6-5
      FIXTURE_DIR: ${{ github.workspace }}/fixture
      PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
      CLOUDFLARE_VISION_FREE_ONLY: "true"
      CLOUDFLARE_VISION_MAX_CALLS_PER_WORKFLOW: "1"

    steps:
      - name: Checkout exact diagnostic candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0f22d49c90416db856d1b0d79f8e4b0f6418cd77
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Runner SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_RUNNER_SHA"

      - name: Checkout frozen private Engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 3cbd689819e6b0e0b2ea9904d1998e24a5e2a293
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine SHA
        run: test "$(git -C engine rev-parse HEAD)" = "$ENGINE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install exact Vision runtime
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y ffmpeg
          python -m pip install --disable-pip-version-check -r engine/requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e engine

      - name: Download frozen Visual-QA fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$FIXTURE_DIR"
          mkdir -p "$FIXTURE_DIR"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" \
            --dir "$FIXTURE_DIR"

      - name: Run one exact Cloudflare-only Vision probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_VISION_QUOTA_FILE: ${{ runner.temp }}/cloudflare-exact-probe-quota-v1.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from isco_video_agent.ai_budget import BudgetLedger, Capability, Priority, TaskSpec
          from isco_video_agent.media.ffmpeg import make_review_preview
          from scripts import gold_cloudflare_vision_fallback as cloudflare
          from scripts import vision_stage_contract_v2 as contract

          root = Path(os.environ["FIXTURE_DIR"])
          plan = json.loads((root / "plan.json").read_text(encoding="utf-8"))
          script = json.loads((root / "script.json").read_text(encoding="utf-8"))
          rights_doc = json.loads((root / "rights-manifest.json").read_text(encoding="utf-8"))
          sections = list(plan.get("sections") or [])
          rights = list(rights_doc.get("assets") or [])
          if not sections:
              raise SystemExit("frozen fixture has no plan sections")

          first = sections[0]
          section_id = str(first.get("id") or "").strip()
          row = next((x for x in rights if str(x.get("section_id") or "") == section_id), None)
          if not row:
              raise SystemExit(f"missing frozen selected visual for {section_id}")
          local_file = str(row.get("local_file") or "").strip()
          clip = root / "visuals" / local_file
          if not clip.is_file():
              raise SystemExit(f"missing frozen visual file: {local_file}")

          narration = next(
              (
                  str(x.get("narration") or "")
                  for x in (script.get("sections") or [])
                  if str(x.get("id") or "") == section_id
              ),
              "",
          )
          intended_visual = str(first.get("visual_query_en") or "").strip()

          preview_dir = root / "visual-qa"
          preview_dir.mkdir(parents=True, exist_ok=True)
          preview = preview_dir / f"01-{section_id}-preview.mp4"
          make_review_preview(clip, preview, portrait=False)

          ledger = BudgetLedger("film", enforce=True)
          spec = TaskSpec(
              task_id="CLOUDFLARE_EXACT_PROBE_S01",
              kind="VISUAL_AUDIT",
              priority=Priority.P0,
              capability=Capability.VISION,
              max_provider_attempts=5,
              schema_repair_allowed=False,
              local_fallback=False,
              semantic_block_is_final=True,
          )
          result = {
              "schema_version": 1,
              "candidate_runner_sha": os.environ["CANDIDATE_RUNNER_SHA"],
              "engine_sha": os.environ["ENGINE_SHA"],
              "source_run_id": os.environ["SOURCE_RUN_ID"],
              "source_artifact": os.environ["SOURCE_ARTIFACT"],
              "section": section_id,
              "provider": cloudflare.CLOUDFLARE_VISION_PROVIDER,
              "model": cloudflare.CLOUDFLARE_VISION_MODEL,
              "provider_order": ["cloudflare_workers_ai"],
              "same_visual_audit_schema": True,
              "max_cloudflare_calls_this_workflow": 1,
          }

          exit_code = 0
          try:
              audit = cloudflare.run_shared_cloudflare_attempt(
                  ledger,
                  spec,
                  preview=preview,
                  narration_context=narration,
                  intended_visual=intended_visual,
              )
          except cloudflare.CloudflareGoldVisionUnavailable as exc:
              result.update(
                  status="failure",
                  classification="preflight_no_wire",
                  error_type=type(exc).__name__,
                  reason=contract.legacy._safe_exception_detail(exc),
              )
              exit_code = 1
          except contract.VisionStageError as exc:
              result.update(
                  status="failure",
                  classification="wire_or_response_failure",
                  error_type=type(exc).__name__,
                  error_code=exc.code.value,
                  http_status=exc.http_status,
                  http_message=exc.http_message,
                  reason=exc.detail,
              )
              exit_code = 1
          except Exception as exc:
              result.update(
                  status="failure",
                  classification="unexpected_failure",
                  error_type=type(exc).__name__,
                  reason=contract.legacy._safe_exception_detail(exc),
              )
              exit_code = 1
          else:
              result.update(
                  status="success",
                  classification="cloudflare_wire_pass",
                  audit=audit,
              )
          finally:
              ledger.write(root / "cloudflare-exact-probe-budget.json")
              result["provider_attempts"] = ledger.to_summary().get("provider_attempts", {})
              (root / "cloudflare-exact-probe-result.json").write_text(
                  json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              print(json.dumps(result, ensure_ascii=False, sort_keys=True))

          raise SystemExit(exit_code)
          PY

      - name: Probe Workers AI model permission without inference
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts import gold_cloudflare_vision_fallback as cloudflare

          root = Path(os.environ["FIXTURE_DIR"])
          result = {
              "schema_version": 1,
              "provider": cloudflare.CLOUDFLARE_VISION_PROVIDER,
              "model": cloudflare.CLOUDFLARE_VISION_MODEL,
              "operation": "model_schema_get_only",
              "inference_performed": False,
          }
          try:
              token, account_id = cloudflare._credentials()
              cloudflare._prove_model_access(token, account_id)
          except Exception as exc:
              result.update(
                  status="failure",
                  error_type=type(exc).__name__,
                  reason=str(exc)[:1000],
              )
          else:
              result["status"] = "success"

          (root / "cloudflare-model-schema-probe.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload exact Cloudflare probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cloudflare-exact-probe-0f22d49
          path: |
            ${{ env.FIXTURE_DIR }}/cloudflare-exact-probe-result.json
            ${{ env.FIXTURE_DIR }}/cloudflare-vision-preflight.json
            ${{ env.FIXTURE_DIR }}/cloudflare-exact-probe-budget.json
            ${{ env.FIXTURE_DIR }}/cloudflare-model-schema-probe.json
          if-no-files-found: warn
          retention-days: 7
