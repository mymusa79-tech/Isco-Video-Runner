name: Temp Apply Engine Pin PR74

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  apply-pin:
    if: github.head_ref == 'chore/pin-engine-pr74-merge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Replace canonical Production V4 Engine pin
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/produce-resilient-v4.yml')
          old = '9191d64cf1af419a0e8147c65530e0f1420eec7f'
          new = '79e9993cc0d9459adc2585b9b46c6526f8c1cb6b'
          text = path.read_text(encoding='utf-8')
          old_count = text.count(old)
          new_count = text.count(new)
          if old_count == 3 and new_count == 0:
              text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          elif old_count == 0 and new_count == 3:
              print('Production V4 already pinned to merged Engine SHA')
          else:
              raise SystemExit(f'Unexpected pin state: old_count={old_count} new_count={new_count}')
          final = path.read_text(encoding='utf-8')
          if final.count(old) != 0 or final.count(new) != 3:
              raise SystemExit('Pin replacement postcondition failed')
          print('Canonical Production V4 pin PASS:', new)
          PY
          git diff --check

      - name: Commit pin update to PR branch when needed
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/produce-resilient-v4.yml; then
            echo 'No pin commit needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/produce-resilient-v4.yml
          git commit -m 'chore: pin Production V4 to merged Engine PR74'
          git push origin "HEAD:${{ github.head_ref }}"
