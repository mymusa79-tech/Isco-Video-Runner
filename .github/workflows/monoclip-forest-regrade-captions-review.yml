name: "Monoclip forest — real 1080p grade and meaningful Cairo captions"
on:
  push:
    branches: [feature/bw-monoclip-optin-v1]
    paths:
      - .github/workflows/monoclip-forest-regrade-captions-review.yml
  workflow_dispatch:

jobs:
  real-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Install FFmpeg and Arabic shaping tools without paid providers
        run: |
          python -m pip -q install imageio-ffmpeg pillow
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$HOME/ffmpeg"
          echo "$HOME" >> "$GITHUB_PATH"
      - name: Fetch genuine original 1080x1920 stock and Cairo locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/private-font
          curl -fLSsS --retry 2 --connect-timeout 15 --max-time 180 'https://videos.pexels.com/video-files/28464399/12391291_1080_1920_30fps.mp4' -o qa/real-original.mp4
          curl -fLSsS --retry 2 --max-time 90 'https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf' -o qa/private-font/Cairo.ttf
          test "$(stat -c%s qa/real-original.mp4)" -gt 1000000
          test "$(stat -c%s qa/private-font/Cairo.ttf)" -gt 100000
          fc-cache -f qa/private-font
          fc-scan -f '%{family}\n' qa/private-font/Cairo.ttf | head -1 | grep -i cairo
      - name: Author 8 meaningful full-phrase caption cards; preserve all Arabic words
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import ImageFont
          root=Path("qa")
          captions=[
              (0.00, 3.94, "كل هذا الجمال أمامك…", "ومع ذلك لا تراه."),
              (3.94, 7.83, "لأن ذهنك", "يسبق خطواتك دائمًا."),
              (7.83, 11.72, "تعدّ ما تبقّى", "من الطريق،"),
              (11.72, 15.62, "وتنسى أن تنظر", "إلى ما حولك."),
              (15.62, 19.53, "هنا ضوء يتسلّل", "بين الأشجار."),
              (19.53, 23.43, "وهنا لحظة", "لا تحتاج منك شيئًا."),
              (23.43, 27.35, "أبطئ قليلًا…", "وانظر جيدًا."),
              (27.35, 31.35, "لا تجعل الطريق يفوتك", "وأنت تعبره."),
          ]
          def ts(t):
              h=int(t//3600);m=int(t//60)%60;s=int(t)%60;cs=int(round((t-int(t))*100))
              if cs==100: s+=1;cs=0
              return f"{h}:{m:02}:{s:02}.{cs:02}"
          def srt(t):
              h=int(t//3600);m=int(t//60)%60;s=int(t)%60;ms=int(round((t-int(t))*1000))
              if ms==1000: s+=1;ms=0
              return f"{h:02}:{m:02}:{s:02},{ms:03}"
          head="""[Script Info]
          ScriptType: v4.00+
          WrapStyle: 2
          ScaledBorderAndShadow: yes
          PlayResX: 1080
          PlayResY: 1920
          YCbCr Matrix: TV.709

          [V4+ Styles]
          Format: Name,Fontname,Fontsize,PrimaryColour,SecondaryColour,OutlineColour,BackColour,Bold,Italic,Underline,StrikeOut,ScaleX,ScaleY,Spacing,Angle,BorderStyle,Outline,Shadow,Alignment,MarginL,MarginR,MarginV,Encoding
          Style: Body,Cairo,88,&H00F5F5F5,&H00F5F5F5,&H000A0B10,&H00000000,-1,0,0,0,100,100,0,0,1,6,0,2,75,75,430,1

          [Events]
          Format: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text
          """
          fontfile=root/"private-font/Cairo.ttf"
          lines=[]
          srt_lines=[]
          script=[]
          for i,(start,end,line1,line2) in enumerate(captions):
              size=98 if i in (0,len(captions)-1) else 90
              while size>=70:
                  font=ImageFont.truetype(str(fontfile),size)
                  try: font.set_variation_by_name("Bold")
                  except (ValueError,AttributeError,OSError): pass
                  widths=[font.getlength(line,direction="rtl",language="ar") for line in (line1,line2)]
                  if max(widths)<=900: break
                  size-=2
              assert size>=70,(i,size,max(widths))
              joined=f"{line1}\\N{line2}"
              lines.append(f"Dialogue: 0,{ts(start)},{ts(end)},Body,,0,0,0,,"
                           +r"{\an2\pos(540,1460)\fs"+str(size)+r"\bord7\shad0\fad(130,160)}"+joined)
              srt_lines.append(f"{i+1}\n{srt(start)} --> {srt(end)}\n{line1}\n{line2}\n")
              script.append(f"{line1} {line2}")
          (root/"captions.ass").write_text(head+"\n".join(lines)+"\n",encoding="utf-8")
          (root/"captions.srt").write_text("\n".join(srt_lines),encoding="utf-8")
          (root/"locked_visual_review_script.txt").write_text("\n".join(script)+"\n",encoding="utf-8")
          print(f"validated {len(lines)} two-line phrase cards, true Cairo Bold")
          PY
      - name: Render full-resolution color correction and captions
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -hide_banner -loglevel info -i qa/real-original.mp4 \
            -vf "crop=810:1440:135:320,scale=1080:1920:flags=lanczos,eq=contrast=1.04:brightness=-0.018:gamma=1.11:saturation=1.05,ass=qa/captions.ass:fontsdir=qa/private-font" \
            -t 31.35 -r 30 -an -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p \
            -movflags +faststart qa/FOREST_CINEMATIC_COLOR_1080P_REVISED_SILENT.mp4 \
            2>&1 | tee qa/render.txt
          grep -Ei "fontselect.*Cairo" qa/render.txt | head -4 || true
          for second in 2 9 17 28; do
            ffmpeg -y -hide_banner -loglevel error -ss "$second" \
              -i qa/FOREST_CINEMATIC_COLOR_1080P_REVISED_SILENT.mp4 \
              -frames:v 1 "qa/frame_$(printf '%02d' "$second").png"
          done
          ffprobe -v error -show_entries format=duration,size:stream=width,height,codec_type \
            -of json qa/FOREST_CINEMATIC_COLOR_1080P_REVISED_SILENT.mp4 > qa/probe.json
          python - <<'PY'
          import json
          r=json.load(open("qa/probe.json"))
          v=[s for s in r["streams"] if s["codec_type"]=="video"][0]
          assert (v["width"],v["height"])==(1080,1920), v
          assert 31.0<float(r["format"]["duration"])<31.6, r
          assert not any(s["codec_type"]=="audio" for s in r["streams"])
          print("verified original stock 1080p visual and no substituted audio")
          PY
          rm -rf qa/private-font qa/real-original.mp4 qa/render.txt
      - name: Preserve only user-facing MP4 stills SRT script and probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: genuine-forest-cairo-fullhd-improved-silent
          path: qa/
          retention-days: 7
          if-no-files-found: error
