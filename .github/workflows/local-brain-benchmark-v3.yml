name: Isco Local Brain Benchmark V3
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/local-brain-benchmark-v3.yml
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      MODEL_URL: https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf?download=true
      MODEL_SHA256: 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore local model cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/isco-local-brain
          key: isco-qwen3-4b-q4km-7485fe6f-llama-aedb2a5
      - name: Build pinned lightweight runtime
        run: |
          set -euo pipefail
          BASE="$HOME/.cache/isco-local-brain"
          mkdir -p "$BASE/runtime"
          if [ ! -x "$BASE/runtime/llama-server" ]; then
            git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama-src"
            cd "$RUNNER_TEMP/llama-src"
            git checkout --detach aedb2a5e9ca3d4064148bbb919e0ddc0c1b70ab3
            cmake -B build -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j4 --target llama-server
            cp build/bin/llama-server "$BASE/runtime/llama-server"
          fi
          "$BASE/runtime/llama-server" --version
      - name: Download verified official Qwen
        run: |
          set -euo pipefail
          BASE="$HOME/.cache/isco-local-brain"
          MODEL="$BASE/Qwen3-4B-Q4_K_M.gguf"
          mkdir -p "$BASE"
          if [ ! -f "$MODEL" ] || ! echo "$MODEL_SHA256  $MODEL" | sha256sum -c - >/dev/null 2>&1; then
            rm -f "$MODEL" "$MODEL.part"
            curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 "$MODEL_URL" -o "$MODEL.part"
            echo "$MODEL_SHA256  $MODEL.part" | sha256sum -c -
            mv "$MODEL.part" "$MODEL"
          fi
          echo "$MODEL_SHA256  $MODEL" | sha256sum -c -
          du -h "$MODEL"
      - name: Cost productivity and disk gate
        run: |
          set -euo pipefail
          MODEL="$HOME/.cache/isco-local-brain/Qwen3-4B-Q4_K_M.gguf"
          FREE_KB=$(df --output=avail -k "$HOME" | tail -1)
          SIZE=$(stat -c%s "$MODEL")
          echo "free_disk_mb=$((FREE_KB/1024)) model_mb=$((SIZE/1024/1024))"
          test "$FREE_KB" -ge 6291456
          test "$SIZE" -le 3221225472
      - name: Start local brain
        run: |
          set -euo pipefail
          mkdir -p benchmark-output
          MODEL="$HOME/.cache/isco-local-brain/Qwen3-4B-Q4_K_M.gguf"
          SERVER="$HOME/.cache/isco-local-brain/runtime/llama-server"
          "$SERVER" --model "$MODEL" --host 127.0.0.1 --port 8080 --ctx-size 4096 --threads 4 --threads-batch 4 --parallel 1 --no-webui >benchmark-output/llama-server.log 2>&1 &
          PID=$!
          echo "$PID" > "$RUNNER_TEMP/llama.pid"
          ( peak=0; while kill -0 "$PID" 2>/dev/null; do rss=$(awk '/VmRSS:/ {print $2}' "/proc/$PID/status" 2>/dev/null || echo 0); [ "${rss:-0}" -gt "$peak" ] && peak="$rss"; echo "$peak" > "$RUNNER_TEMP/peak-kb"; sleep 1; done ) &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null && { echo "ready_seconds=$i"; exit 0; }
            kill -0 "$PID" 2>/dev/null || { tail -100 benchmark-output/llama-server.log; exit 1; }
            sleep 1
          done
          exit 1
      - name: Benchmark production architecture and Arabic section
        env:
          LOCAL_LLM_ENDPOINT: http://127.0.0.1:8080/v1/chat/completions
          LOCAL_LLM_MODEL: local-qwen3-4b-q4km
          LOCAL_BRAIN_REPORT: benchmark-output/local-brain-report.json
          LOCAL_BRAIN_TIME_BUDGET_S: "420"
          LOCAL_BRAIN_MAX_RSS_MB: "12288"
          LOCAL_BRAIN_MIN_ARABIC_RATIO: "0.55"
        run: timeout 480 python scripts/local_brain_benchmark.py
      - name: Enforce resource budget
        if: always()
        run: |
          set -euo pipefail
          PID=$(cat "$RUNNER_TEMP/llama.pid" 2>/dev/null || true)
          PEAK=$(cat "$RUNNER_TEMP/peak-kb" 2>/dev/null || echo 0)
          [ -z "$PID" ] || kill "$PID" 2>/dev/null || true
          mkdir -p benchmark-output
          echo "llama_peak_rss_mb=$((PEAK/1024))" | tee benchmark-output/resources.txt
          df -h . | tee -a benchmark-output/resources.txt
          du -sh "$HOME/.cache/isco-local-brain" | tee -a benchmark-output/resources.txt
          test "$PEAK" -le 12582912
          test -f benchmark-output/local-brain-report.json
      - name: Upload one-day evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: local-brain-v3-${{ github.run_number }}
          path: benchmark-output/
          if-no-files-found: warn
          retention-days: 1
