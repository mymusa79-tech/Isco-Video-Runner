name: Editorial Room Stages 5-9 Current Main

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["verify/editorial-room-stage5-9-current-main"]

permissions:
  contents: read

jobs:
  verify-editorial-room:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Runner verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout Engine integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: feature/editorial-room-stage5-9-current-main
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Engine runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Focused Editorial Room tests
        working-directory: engine
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_editorial_room \
            tests.test_resilient_planner_persona_binding \
            tests.test_editorial_adapters -v
      - name: Full Engine regression
        working-directory: engine
        run: python -m unittest discover -s tests -q
      - name: Diff and tracked-worktree review
        working-directory: engine
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t dirty_paths < <(git status --porcelain --untracked-files=no | sed -E 's/^.. //')
          for path in "${dirty_paths[@]}"; do
            if [ "$path" != "state/history.json" ]; then
              git status --short
              git diff
              echo "ERROR: unexplained tracked mutation after tests: $path" >&2
              exit 1
            fi
          done
          if [ "${#dirty_paths[@]}" -gt 0 ]; then
            echo "Known test observer fixture mutation: state/history.json; restoring before cleanliness assertion"
            git checkout -- state/history.json
          fi
          test -z "$(git status --porcelain --untracked-files=no)"
