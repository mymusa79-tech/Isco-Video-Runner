name: Stage Production Engine Pin Unification

on:
  push:
    branches:
      - chore/activate-adaptive-engine-928ee95

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Build staged workflow blobs
        env:
          OLD_ENGINE_SHA: e9279ff0da4deab16ac41977c98e911ba809057f
          NEW_ENGINE_SHA: ece86a6aefe87901c8771a7cb2cec1a08523e704
        run: |
          set -euo pipefail
          mkdir -p .activation-staging
          files=(
            telegram-editorial-control.yml
            telegram-production-request.yml
            verify-human-editorial-intent-m7.yml
            verify-m11-live-integration.yml
          )
          for name in "${files[@]}"; do
            src=".github/workflows/$name"
            dst=".activation-staging/$name"
            cp "$src" "$dst"
            before="$(grep -F -c "$OLD_ENGINE_SHA" "$dst" || true)"
            if [ "$before" -lt 1 ]; then
              echo "Expected legacy production Engine pin missing from $src" >&2
              exit 1
            fi
            sed -i "s/$OLD_ENGINE_SHA/$NEW_ENGINE_SHA/g" "$dst"
            after_old="$(grep -F -c "$OLD_ENGINE_SHA" "$dst" || true)"
            after_new="$(grep -F -c "$NEW_ENGINE_SHA" "$dst" || true)"
            test "$after_old" -eq 0
            test "$after_new" -ge "$before"
            echo "$name: replaced $before production pin occurrence(s)"
          done

      - name: Commit staged blobs only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .activation-staging
          git commit -m "chore: stage unified production Engine workflow pins"
          git push origin HEAD:chore/activate-adaptive-engine-928ee95
