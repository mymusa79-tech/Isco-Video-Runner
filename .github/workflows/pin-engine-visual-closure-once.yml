name: One-shot activate visual-closure Engine pin

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/pin-engine-visual-closure-once.yml"

permissions:
  contents: write

concurrency:
  group: pin-engine-visual-closure-once-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  synchronize-exact-pin:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/visual-family-closure-run228'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 1

      - name: Replace exact certified Engine pin once
        env:
          OLD_ENGINE_SHA: 7516d772445ee5156fe4b4f47851f2f4e5bff3d0
          NEW_ENGINE_SHA: 2ec4b3fe58cd59cff673e0e43ad6d7459d518f45
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          files=(
            .github/ENGINE_CANDIDATE_SHA
            .github/workflows/produce-resilient-v4.yml
            .github/workflows/resume-audio-qc-pending.yml
            .github/workflows/resume-gold-qc-pending.yml
            .github/workflows/telegram-editorial-control.yml
            .github/workflows/telegram-production-request.yml
            .github/workflows/verify-human-editorial-intent-m7.yml
            .github/workflows/verify-m11-live-integration.yml
          )

          before=0
          for file in "${files[@]}"; do
            test -f "$file"
            count="$(grep -o "$OLD_ENGINE_SHA" "$file" | wc -l)"
            before=$((before + count))
          done
          test "$before" -eq 15

          for file in "${files[@]}"; do
            sed -i "s/$OLD_ENGINE_SHA/$NEW_ENGINE_SHA/g" "$file"
          done

          if grep -F "$OLD_ENGINE_SHA" "${files[@]}"; then
            echo "ERROR: stale Engine SHA remains in activation surface" >&2
            exit 1
          fi
          after="$(grep -ho "$NEW_ENGINE_SHA" "${files[@]}" | wc -l)"
          test "$after" -eq 15

          # Self-delete: this migration capability must not remain after the pin commit.
          git rm .github/workflows/pin-engine-visual-closure-once.yml
          git add "${files[@]}"
          git diff --cached --check
          git config user.name "isco-pin-activation-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Activate Engine visual failure-memory pin"
          git push origin "HEAD:$PR_HEAD_REF"
