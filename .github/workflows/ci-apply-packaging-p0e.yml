name: Apply Packaging P0-E Workflow Patch

on:
  push:
    branches: ["p0e/packaging-artifact-delivery"]
    paths:
      - ".github/workflows/ci-apply-packaging-p0e.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated P0-E branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: p0e/packaging-artifact-delivery
          fetch-depth: 0

      - name: Apply exact workflow delivery patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/produce-resilient-v4.yml')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              """            engine/output/*/opening-visual-audit.json
          if-no-files-found: warn
""",
              """            engine/output/*/opening-visual-audit.json
            engine/output/*/thumbnail-plan.json
            engine/output/*/thumbnail-*.jpg
            engine/output/*/rights-manifest.json
            engine/output/*/gold-enforce-report.json
          if-no-files-found: warn
""",
              'failure diagnostics packaging paths',
          )

          replace_once(
              """          import json
          import os
          from pathlib import Path
          roots = sorted(Path('output').glob('*'), key=lambda p: p.stat().st_mtime, reverse=True)
""",
              """          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          sys.path.insert(0, str(Path.cwd().parent))
          from scripts.packaging_delivery_contract import validate_packaging_delivery
          roots = sorted(Path('output').glob('*'), key=lambda p: p.stat().st_mtime, reverse=True)
""",
              'final review packaging validator import',
          )

          replace_once(
              """          if not manifest.exists():
              raise SystemExit('Missing production-manifest.json')
          q = json.loads(quality.read_text(encoding='utf-8'))
""",
              """          if not manifest.exists():
              raise SystemExit('Missing production-manifest.json')
          packaging = validate_packaging_delivery(root)
          q = json.loads(quality.read_text(encoding='utf-8'))
""",
              'final review packaging validation',
          )

          replace_once(
              """            ${{ steps.final_review.outputs.manifest_path }}
            ${{ steps.final_review.outputs.opening_audit_path }}
          if-no-files-found: error
""",
              """            ${{ steps.final_review.outputs.manifest_path }}
            ${{ steps.final_review.outputs.opening_audit_path }}
            ${{ steps.final_review.outputs.output_root }}/thumbnail-plan.json
            ${{ steps.final_review.outputs.output_root }}/thumbnail-*.jpg
            ${{ steps.final_review.outputs.output_root }}/rights-manifest.json
            ${{ steps.final_review.outputs.output_root }}/gold-enforce-report.json
          if-no-files-found: error
""",
              'final artifact packaging paths',
          )

          replace_once(
              """          import json
          import os
          from pathlib import Path
          root = Path(os.environ['FINAL_OUTPUT_ROOT'])
""",
              """          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          sys.path.insert(0, str(Path.cwd().parent))
          from scripts.packaging_delivery_contract import validate_packaging_delivery
          root = Path(os.environ['FINAL_OUTPUT_ROOT'])
""",
              'release packaging validator import',
          )

          replace_once(
              """          opening = Path(opening_value) if opening_value else None
          if video != root / 'final.mp4':
""",
              """          opening = Path(opening_value) if opening_value else None
          packaging = validate_packaging_delivery(root)
          if video != root / 'final.mp4':
""",
              'release packaging validation',
          )

          replace_once(
              """          release_assets=(\"$FINAL_VIDEO_PATH\" \"$FINAL_CRITIC_PATH\" \"$FINAL_BUDGET_PATH\" \"$FINAL_MANIFEST_PATH\")
""",
              """          release_assets=(\"$FINAL_VIDEO_PATH\" \"$FINAL_CRITIC_PATH\" \"$FINAL_BUDGET_PATH\" \"$FINAL_MANIFEST_PATH\" \"$FINAL_OUTPUT_ROOT/thumbnail-plan.json\" \"$FINAL_OUTPUT_ROOT/thumbnail-1.jpg\" \"$FINAL_OUTPUT_ROOT/thumbnail-2.jpg\" \"$FINAL_OUTPUT_ROOT/thumbnail-3.jpg\" \"$FINAL_OUTPUT_ROOT/rights-manifest.json\" \"$FINAL_OUTPUT_ROOT/gold-enforce-report.json\")
""",
              'release packaging assets',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate P0-E contract and workflow safety
        run: |
          set -euo pipefail
          python -m py_compile scripts/packaging_delivery_contract.py
          python -m unittest scripts.test_packaging_artifact_delivery_p0e -v
          git diff --check
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/produce-resilient-v4.yml').read_text(encoding='utf-8')
          trigger = workflow.split('concurrency:', 1)[0]
          assert 'branches: ["main"]' in trigger
          assert 'p0e/packaging-artifact-delivery' not in trigger
          assert 'workflow_run:' not in trigger
          assert 'pull_request:' not in trigger
          print('Production trigger isolation: PASS')
          PY

      - name: Commit tested workflow patch to isolated branch
        run: |
          set -euo pipefail
          rm .github/workflows/ci-apply-packaging-p0e.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/produce-resilient-v4.yml .github/workflows/ci-apply-packaging-p0e.yml
          git commit -m "feat: deliver Packaging A/B/C artifacts"
          git push origin HEAD:p0e/packaging-artifact-delivery
