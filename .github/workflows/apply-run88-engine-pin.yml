name: Apply Run 88 Engine Pin

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  apply-pin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Apply exact Engine pin to PR branch
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          OLD_SHA: 735fe3aa9bd42080ffc7e6b9ba25c04599e64b8e
          NEW_SHA: df9397fd3782e7a9f83b3c8732af27858bcee722
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          head_ref = os.environ['HEAD_REF']
          old = os.environ['OLD_SHA']
          new = os.environ['NEW_SHA']
          path = Path('.github/workflows/produce-resilient-v4.yml')
          text = path.read_text(encoding='utf-8')
          old_count = text.count(old)
          new_count = text.count(new)
          if old_count == 0 and new_count == 3:
              print('Run 88 Engine pin already applied; no-op')
              raise SystemExit(0)
          if old_count != 3 or new_count != 0:
              raise SystemExit(f'Unexpected V4 pin state: old={old_count} new={new_count}')
          updated = text.replace(old, new)
          if updated.count(new) != 3 or old in updated:
              raise SystemExit('Run 88 pin replacement invariant failed')

          base_commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()

          def api(path, method='GET', payload=None):
              url = f'https://api.github.com/repos/{repo}{path}'
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  url, data=data, method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read().decode('utf-8')
                  return json.loads(body) if body else {}

          blob = api('/git/blobs', 'POST', {'content': updated, 'encoding': 'utf-8'})
          tree = api('/git/trees', 'POST', {
              'base_tree': base_tree,
              'tree': [{
                  'path': '.github/workflows/produce-resilient-v4.yml',
                  'mode': '100644',
                  'type': 'blob',
                  'sha': blob['sha'],
              }],
          })
          commit = api('/git/commits', 'POST', {
              'message': 'ci: pin V4 to Run 88 Engine fix',
              'tree': tree['sha'],
              'parents': [base_commit],
          })
          api(f'/git/refs/heads/{head_ref}', 'PATCH', {'sha': commit['sha'], 'force': False})
          print(f'RUN88_PIN_COMMIT={commit["sha"]}')
          PY
