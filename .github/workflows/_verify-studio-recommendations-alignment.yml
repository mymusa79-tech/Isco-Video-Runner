name: Verify Studio Recommendations Alignment

on:
  push:
    branches:
      - feature/studio-recommendations-alignment

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile changed Python
        run: |
          set -euo pipefail
          python -m py_compile clean_v2/short_format.py clean_v2/pipeline.py scripts/clean_v2_release_delivery.py scripts/telegram_clean_v2_control.py scripts/test_clean_v2_short.py scripts/test_clean_v2_release_delivery.py scripts/test_telegram_clean_v2_control.py
      - name: Run focused Short hook and first-shot contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          from clean_v2.short_format import ShortFormatError, validate_short_hook_contract, validate_short_hook_visual_query, validate_short_hook_visual_story

          assert validate_short_hook_contract({"sections":[{"id":"s1","narration":"لماذا تفقد طاقتك قبل أن ينتهي يوم العمل؟"}]})["immediate_tension_shape"] == "direct_question"
          assert validate_short_hook_contract({"sections":[{"id":"s1","narration":"تعرف المهمة جيدًا، لكنك تبقى مكانك عندما يحين وقت البدء."}]})["immediate_tension_shape"] == "explicit_contrast"
          assert validate_short_hook_contract({"sections":[{"id":"s1","narration":"تفقد تركيزك قبل أن تبدأ المهمة الأولى."}]})["immediate_tension_shape"] == "early_consequence"

          for text in (
              "في حياتنا نمر أحيانًا بأيام نشعر فيها أن الأمور ليست واضحة.",
              "أحيانًا تعرف ما تريد فعله، لكنك تبقى مكانك.",
          ):
              try:
                  validate_short_hook_contract({"sections":[{"id":"s1","narration":text}]})
              except ShortFormatError as exc:
                  assert "short_hook_generic_calm_opening" in str(exc)
              else:
                  raise AssertionError("generic calm Short hook was accepted")

          try:
              validate_short_hook_visual_query("thoughtful person sitting in quiet room by window")
          except ShortFormatError as exc:
              assert "short_visual_query_hook_calm_or_generic" in str(exc)
          else:
              raise AssertionError("quiet first visual was accepted")

          active = "tense hands stopping mid action over unfinished task under deadline pressure"
          assert validate_short_hook_visual_query(active)["status"] == "pass"
          assert validate_short_hook_visual_story({"beats":[{"id":"b1","role":"hook","stock_query_en":active}]})["status"] == "pass"
          try:
              validate_short_hook_visual_story({"beats":[{"id":"b1","role":"hook","stock_query_en":"thoughtful person sitting in quiet room by window"}]})
          except ShortFormatError as exc:
              assert "short_visual_query_hook_calm_or_generic" in str(exc)
          else:
              raise AssertionError("quiet final visual-story hook beat was accepted")
          PY
      - name: Run release and Telegram unit suites
        run: |
          set -euo pipefail
          python -m unittest -v scripts.test_clean_v2_release_delivery scripts.test_telegram_clean_v2_control
      - name: Enforce manual-only YouTube publication
        run: |
          set -euo pipefail
          ! grep -n -E 'videos[.]insert|videos[.]update|MediaFileUpload|relatedVideoId' clean_v2/short_format.py clean_v2/pipeline.py scripts/clean_v2_release_delivery.py scripts/telegram_clean_v2_control.py .github/workflows/telegram-clean-v2-control.yml
      - name: Confirm first-shot gate is called before and after writer binding
        run: |
          set -euo pipefail
          test "$(grep -c 'validate_short_hook_visual_story(visual_story)' clean_v2/pipeline.py)" -eq 1
          test "$(grep -c 'validate_short_hook_visual_story(bound)' clean_v2/pipeline.py)" -eq 1
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
