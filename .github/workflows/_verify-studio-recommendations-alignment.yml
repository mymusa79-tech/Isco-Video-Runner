name: Verify Studio Recommendations Alignment

on:
  push:
    branches:
      - feature/studio-recommendations-alignment

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile changed Python
        run: |
          set -euo pipefail
          python -m py_compile             clean_v2/short_format.py             scripts/clean_v2_release_delivery.py             scripts/telegram_clean_v2_control.py             scripts/test_clean_v2_short.py             scripts/test_clean_v2_release_delivery.py             scripts/test_telegram_clean_v2_control.py
      - name: Run focused Short hook contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          from clean_v2.short_format import (
              ShortFormatError,
              validate_short_hook_contract,
              validate_short_visual_queries,
          )

          def plan(first):
              return {
                  "title": "x",
                  "promise": "x",
                  "cta": "",
                  "sections": [
                      {
                          "id": "s1",
                          "heading": "x",
                          "purpose": "x",
                          "visual_query_en": first,
                          "visual_query_alt_en": first + " close detail",
                      },
                      {
                          "id": "s2",
                          "heading": "x",
                          "purpose": "x",
                          "visual_query_en": "solitary person thinking in calm quiet room",
                          "visual_query_alt_en": "reflective person pausing alone indoors",
                      },
                      {
                          "id": "s3",
                          "heading": "x",
                          "purpose": "x",
                          "visual_query_en": "reflective person walking alone peaceful morning",
                          "visual_query_alt_en": "contemplative person standing by window",
                      },
                  ],
              }

          brief = {
              "approved_by_user": True,
              "approved_topic": "كيف تنهض عندما تفقد الدافع وتقول لنفسك لا أستطيع؟",
              "format": "short",
              "language": "ar",
              "audience": "Arabic-speaking adults",
              "editorial_intent": "نبرة هادئة وعملية وطبيعية.",
              "research_pack": [],
              "hard_constraints": ["No fabricated facts."],
          }

          direct = validate_short_hook_contract({
              "sections": [{"id": "s1", "narration": "لماذا تفقد طاقتك قبل أن ينتهي يوم العمل؟"}]
          })
          assert direct["immediate_tension_shape"] == "direct_question"

          contrast = validate_short_hook_contract({
              "sections": [{"id": "s1", "narration": "تعرف المهمة جيدًا، لكنك تبقى مكانك عندما يحين وقت البدء."}]
          })
          assert contrast["immediate_tension_shape"] == "explicit_contrast"

          try:
              validate_short_hook_contract({
                  "sections": [{"id": "s1", "narration": "في حياتنا نمر أحيانًا بأيام نشعر فيها أن الأمور ليست واضحة."}]
              })
          except ShortFormatError as exc:
              assert "short_hook_generic_calm_opening" in str(exc)
          else:
              raise AssertionError("generic calm hook was accepted")

          try:
              validate_short_visual_queries(
                  plan("thoughtful person sitting in quiet room by window"),
                  brief,
              )
          except ShortFormatError as exc:
              assert "short_visual_query_hook_calm_or_generic" in str(exc)
          else:
              raise AssertionError("quiet generic first visual was accepted")

          active = validate_short_visual_queries(
              plan("tense hands stopping mid action over unfinished task under deadline pressure"),
              brief,
          )
          assert active["status"] == "pass"
          assert active["hook_visual"]["action_hits"]
          assert active["hook_visual"]["tension_hits"]
          PY
      - name: Run focused release and Telegram tests
        run: |
          set -euo pipefail
          python -m unittest -v             scripts.test_clean_v2_release_delivery.CleanV2ReleaseDeliveryTests.test_one_click_package_contains_publish_ready_assets_for_podcast             scripts.test_clean_v2_release_delivery.CleanV2ReleaseDeliveryTests.test_related_video_id_is_null_unless_owner_explicitly_supplies_published_parent             scripts.test_clean_v2_release_delivery.CleanV2ReleaseDeliveryTests.test_invalid_published_parent_youtube_id_is_rejected_before_release             scripts.test_telegram_clean_v2_control.TelegramCleanV2ControlTests.test_longform_spacing_warning_is_same_format_configurable_and_non_blocking             scripts.test_telegram_clean_v2_control.TelegramCleanV2ControlTests.test_latest_longform_split_distinguishes_podcast_by_outside_text_identity
      - name: Enforce manual-only YouTube publication
        run: |
          set -euo pipefail
          ! grep -n -E 'videos[.]insert|videos[.]update|MediaFileUpload|relatedVideoId' clean_v2/short_format.py scripts/clean_v2_release_delivery.py scripts/telegram_clean_v2_control.py .github/workflows/telegram-clean-v2-control.yml
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
