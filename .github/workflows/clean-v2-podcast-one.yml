name: Clean V2 Podcast One-Shot

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: clean-v2-podcast-one-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  podcast-one:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor == github.repository_owner &&
       github.event.comment.body == '/clean-v2-podcast-one')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ISCO_ENGINE_SHA: 3cbd689819e6b0e0b2ea9904d1998e24a5e2a293
      GEMINI_CONTENT_MODEL: gemini-3.7-flash
      GEMINI_TTS_MODEL: gemini-3.8-flash-tts
      GROQ_CONTENT_MODEL: openai/gpt-oss-20b
      OPENROUTER_CONTENT_MODEL: google/gemma-4-26b-a4b-it:free
      MISTRAL_CONTENT_MODEL: ministral-14b-2512
      CLOUDFLARE_VISION_FREE_ONLY: "true"
      CLOUDFLARE_VISION_MAX_CALLS_PER_WORKFLOW: "5"
      CLEAN_V2_AI_STILL_FREE_ONLY: "true"
      CLEAN_V2_MUSIC_ALLOW_DOWNLOAD: "true"
      CLEAN_V2_OUTPUT: ${{ github.workspace }}/output/clean-v2-podcast-one
      CLEAN_V2_RESUME: ${{ runner.temp }}/clean-v2-podcast-resume
      CLEAN_V2_TTS_CACHE_PATH: ${{ runner.temp }}/clean-v2-tts-cache
      PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}

    steps:
      - name: Checkout exact Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Runner checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Restore verified CC0 music cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: clean_v2/assets/music/cache
          key: clean-v2-cc0-music-v1-${{ hashFiles('clean_v2/assets/music/library.json') }}

      - name: Checkout frozen private Engine source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 3cbd689819e6b0e0b2ea9904d1998e24a5e2a293
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine pin
        run: test "$(git -C engine rev-parse HEAD)" = "$ISCO_ENGINE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install production dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            ffmpeg \
            fontconfig \
            fonts-noto-core \
            tesseract-ocr \
            tesseract-ocr-ara
          bash scripts/install_cairo_bold.sh
          python -m pip install --disable-pip-version-check 'Pillow==12.3.0'
          python -m pip install --disable-pip-version-check -r engine/requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e engine

      - name: Build immutable Podcast brief
        id: brief
        run: |
          set -euo pipefail
          brief="$RUNNER_TEMP/clean-v2-podcast-one-brief.json"
          cat > "$brief" <<'JSON'
          {
            "approved_by_user": true,
            "approved_topic": "لماذا نعود إلى عادة نعرف أنها تؤذينا؟",
            "format": "podcast",
            "series_name": "خارج النص",
            "language": "ar",
            "audience": "Arabic-speaking adults",
            "editorial_intent": "بودكاست عربي بسيط وعميق، راوية أنثوية محايدة، سؤال مركزي واحد يتقدم منطقيًا دون حشو أو مبالغة.",
            "research_pack": [],
            "hard_constraints": [
              "No fabricated facts.",
              "Use the approved podcast voice route.",
              "Audio alone must carry the full meaning.",
              "Sparse visuals only; no visual dependency for comprehension.",
              "No paid provider or paid fallback."
            ]
          }
          JSON
          sha="$(BRIEF="$brief" python - <<'PY'
          import json, os
          from pathlib import Path
          from clean_v2.contracts import compute_brief_sha256
          path = Path(os.environ["BRIEF"])
          print(compute_brief_sha256(json.loads(path.read_text(encoding="utf-8"))))
          PY
          )"
          echo "CLEAN_V2_PODCAST_BRIEF=$brief" >> "$GITHUB_ENV"
          echo "ISCO_APPROVED_BRIEF_SHA256=$sha" >> "$GITHUB_ENV"
          echo "brief_sha=$sha" >> "$GITHUB_OUTPUT"
          test "${#sha}" = 64

      - name: Restore exact Podcast request checkpoint
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ env.CLEAN_V2_RESUME }}
          key: clean-v2-resume-v6-podcast-${{ runner.os }}-${{ github.sha }}-${{ env.ISCO_ENGINE_SHA }}-${{ steps.brief.outputs.brief_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            clean-v2-resume-v6-podcast-${{ runner.os }}-${{ github.sha }}-${{ env.ISCO_ENGINE_SHA }}-${{ steps.brief.outputs.brief_sha }}-

      - name: Restore verified Gemini TTS chunks
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ env.CLEAN_V2_TTS_CACHE_PATH }}
          key: clean-v2-gemini38-chunk-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            clean-v2-gemini38-chunk-v1-${{ runner.os }}-

      - name: Produce one Podcast
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_VISION_QUOTA_FILE: ${{ runner.temp }}/cloudflare-clean-v2-vision-quota-v1.json
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/telegram_clean_v2_notify.py watch --output "$CLEAN_V2_OUTPUT" --kind podcast --poll-seconds 4 &
          notify_pid=$!
          cleanup_notify() {
            kill "$notify_pid" 2>/dev/null || true
            wait "$notify_pid" 2>/dev/null || true
          }
          trap cleanup_notify EXIT
          set +e
          python -m clean_v2 \
            --brief "$CLEAN_V2_PODCAST_BRIEF" \
            --approved-sha "$ISCO_APPROVED_BRIEF_SHA256" \
            --engine-sha "$ISCO_ENGINE_SHA" \
            --runner-sha "$GITHUB_SHA" \
            --resume-from "$CLEAN_V2_RESUME" \
            --max-visuals 4 \
            --output "$CLEAN_V2_OUTPUT"
          production_status=$?
          set -e
          cleanup_notify
          trap - EXIT
          exit "$production_status"

      - name: Prepare exact Podcast request checkpoint
        if: always()
        id: clean_v2_checkpoint
        run: |
          set -euo pipefail
          if python scripts/clean_v2_resume_cache.py prepare \
            --output "$CLEAN_V2_OUTPUT" \
            --target "$CLEAN_V2_RESUME" | grep -qx 'save_allowed=true'; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          else
            echo "save=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save exact Podcast request checkpoint
        if: always() && steps.clean_v2_checkpoint.outputs.save == 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ env.CLEAN_V2_RESUME }}
          key: clean-v2-resume-v6-podcast-${{ runner.os }}-${{ github.sha }}-${{ env.ISCO_ENGINE_SHA }}-${{ steps.brief.outputs.brief_sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prepare verified Gemini TTS chunks
        if: always()
        id: clean_v2_tts_cache
        run: |
          set -euo pipefail
          if python -m clean_v2.tts_cache prepare \
            --root "$CLEAN_V2_TTS_CACHE_PATH" | grep -qx 'save_allowed=true'; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          else
            echo "save=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save verified Gemini TTS chunks
        if: always() && steps.clean_v2_tts_cache.outputs.save == 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ env.CLEAN_V2_TTS_CACHE_PATH }}
          key: clean-v2-gemini38-chunk-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Require complete Podcast final
        run: |
          set -euo pipefail
          test -s "$CLEAN_V2_OUTPUT/final.mp4"
          test "$(jq -r .status "$CLEAN_V2_OUTPUT/run-manifest.json")" = "pass"
          test "$(jq -r .status "$CLEAN_V2_OUTPUT/final.json")" = "pass"
          test "$(jq -r .status "$CLEAN_V2_OUTPUT/final-master-qc.json")" = "pass"
          test "$(jq -r .voice_provider "$CLEAN_V2_OUTPUT/run-manifest.json")" = "gemini-3.8:Charon"

      - name: Upload Podcast evidence and final file
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clean-v2-podcast-one-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.CLEAN_V2_OUTPUT }}
          if-no-files-found: warn
          retention-days: 7

      - name: Deliver Podcast through unified GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/clean_v2_release_delivery.py deliver \
            --output-root "$CLEAN_V2_OUTPUT" \
            --scope podcast \
            --delivery-key "podcast-one"

      - name: Notify Telegram terminal result
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLEAN_V2_JOB_STATUS: ${{ job.status }}
        run: |
          python scripts/telegram_clean_v2_notify.py terminal \
            --output "$CLEAN_V2_OUTPUT" \
            --kind podcast \
            --job-status "$CLEAN_V2_JOB_STATUS" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
