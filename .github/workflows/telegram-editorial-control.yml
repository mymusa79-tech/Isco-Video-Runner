name: Telegram Editorial Control

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      webhook_update_b64:
        description: "Base64-encoded Telegram update from the authenticated edge webhook"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: telegram-editorial-control
  cancel-in-progress: false

env:
  ENGINE_SHA: d698dbfddbf7cdb752d40362dfb58c6942cb52dd
  RESEARCH_ENGINE_SHA: bf85607f6e34dcedc199abad7e610b12c4685309
  CONTROL_PLANE_PRODUCTION_ENABLED: "true"

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Restore encrypted control-panel state
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$STATE_ENCRYPTION_KEY"
          mkdir -p "$RUNNER_TEMP/isco-control"
          state="$RUNNER_TEMP/isco-control/control-panel.json"
          encrypted="$RUNNER_TEMP/isco-control/control-panel.json.enc"
          git fetch --no-tags origin control-plane-state:refs/remotes/origin/control-plane-state || true
          if git show origin/control-plane-state:state/control-panel.json.enc > "$encrypted" 2>/dev/null; then
            openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 \
              -pass env:STATE_ENCRYPTION_KEY -in "$encrypted" -out "$state"
            echo "CONTROL_STATE_FRESH=false" >> "$GITHUB_ENV"
          else
            printf '%s\n' '{"schema_version":1,"telegram_offset":0,"sessions":{},"requests":{},"pending_actions":[],"production_queue":[],"last_event_at":null}' > "$state"
            echo "CONTROL_STATE_FRESH=true" >> "$GITHUB_ENV"
          fi
          chmod 600 "$state"
          echo "CONTROL_STATE_PATH=$state" >> "$GITHUB_ENV"

      - name: Materialize Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/isco-control/secrets"
          printf '%s' "$TELEGRAM_BOT_TOKEN" > "$RUNNER_TEMP/isco-control/secrets/telegram-token"
          printf '%s' "$TELEGRAM_CHAT_ID" > "$RUNNER_TEMP/isco-control/secrets/telegram-chat"
          printf '%s' "$TELEGRAM_ALLOWED_USER_ID" > "$RUNNER_TEMP/isco-control/secrets/telegram-user"
          echo "TELEGRAM_BOT_TOKEN_FILE=$RUNNER_TEMP/isco-control/secrets/telegram-token" >> "$GITHUB_ENV"
          echo "TELEGRAM_CHAT_ID_FILE=$RUNNER_TEMP/isco-control/secrets/telegram-chat" >> "$GITHUB_ENV"
          echo "TELEGRAM_ALLOWED_USER_ID_FILE=$RUNNER_TEMP/isco-control/secrets/telegram-user" >> "$GITHUB_ENV"

      - name: Prime Telegram offset on first activation
        if: env.CONTROL_STATE_FRESH == 'true'
        run: |
          set -euo pipefail
          if python scripts/telegram_webhook_replay.py webhook-active; then
            echo "Telegram webhook is active; getUpdates offset priming is not applicable"
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          from scripts.telegram_control_panel import TelegramClient, _read_secret_file, load_state, save_state
          state_path = Path(__import__('os').environ['CONTROL_STATE_PATH'])
          token = _read_secret_file('TELEGRAM_BOT_TOKEN_FILE')
          if not token:
              raise SystemExit(0)
          state = load_state(state_path)
          updates = TelegramClient(token).call('getUpdates', {'offset': 0, 'timeout': 0, 'allowed_updates': ['message', 'callback_query']}) or []
          ids = [int(item['update_id']) for item in updates if isinstance(item, dict) and 'update_id' in item]
          if ids:
              state['telegram_offset'] = max(ids) + 1
          save_state(state_path, state)
          print(f"Telegram control offset primed at {state['telegram_offset']}; historical updates ignored")
          PY

      - name: Poll or replay authorized Telegram commands
        id: poll
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          WEBHOOK_UPDATE_B64: ${{ inputs.webhook_update_b64 }}
        run: |
          set -euo pipefail
          active_v4="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/produce-resilient-v4.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
          active_telegram="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/telegram-production-request.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
          active=$((active_v4 + active_telegram))
          echo "release_approval_consumed=false" >> "$GITHUB_OUTPUT"

          if [ "$active" -gt 0 ]; then
            if [ -n "$WEBHOOK_UPDATE_B64" ]; then
              set +e
              python scripts/telegram_webhook_replay.py release-approval-only \
                --state "$CONTROL_STATE_PATH" \
                --update-b64 "$WEBHOOK_UPDATE_B64"
              approval_rc=$?
              set -e
              case "$approval_rc" in
                0)
                  echo "Production is active; exact release approval callback was accepted through the webhook-only seam"
                  echo "release_approval_consumed=true" >> "$GITHUB_OUTPUT"
                  ;;
                3)
                  echo "Production is active; non-release stateful Telegram command remains read-only"
                  ;;
                *)
                  echo "Release approval webhook validation failed while production is active" >&2
                  exit "$approval_rc"
                  ;;
              esac
            else
              echo "A production workflow is active; stateful Telegram control remains read-only"
            fi
            echo "production_active=true" >> "$GITHUB_OUTPUT"
            echo "needs_engine=false" >> "$GITHUB_OUTPUT"
            echo "needs_production=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "production_active=false" >> "$GITHUB_OUTPUT"

          if [ -n "$WEBHOOK_UPDATE_B64" ]; then
            python scripts/telegram_webhook_replay.py replay \
              --state "$CONTROL_STATE_PATH" \
              --update-b64 "$WEBHOOK_UPDATE_B64"
            exit 0
          fi

          if python scripts/telegram_webhook_replay.py webhook-active; then
            echo "Telegram webhook is active; getUpdates polling is suppressed for every trigger mode"
            echo "needs_engine=false" >> "$GITHUB_OUTPUT"
            echo "needs_production=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Telegram webhook is inactive; certified fallback polling owns ingress for this serialized run"
          python scripts/telegram_topic_research_v2.py poll --state "$CONTROL_STATE_PATH"

      - name: Checkout exact private Engine for research only
        if: steps.poll.outputs.needs_engine == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ env.RESEARCH_ENGINE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python for research only
        if: steps.poll.outputs.needs_engine == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install locked Engine research runtime
        if: steps.poll.outputs.needs_engine == 'true'
        run: |
          set -euo pipefail
          PYTHONPATH=engine/src python scripts/security_v1_supply_chain_preflight.py lock --lock engine/requirements-lock.txt
          python -m pip install -r engine/requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e engine
          python -m pip check

      - name: Execute one pending editorial research request
        if: steps.poll.outputs.needs_engine == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Run #120 (Research provider reliability P0): the scholarly-query
          # enrichment step inside Research now fails over to OpenRouter's free
          # model chain when Gemini is quota-exhausted or otherwise unavailable.
          # See scripts/research_provider_reliability.py.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_CONTENT_MODEL: gemini-2.5-flash
          TRENDS_GEO: SA
          YOUTUBE_REGION: SA
          YOUTUBE_LANGUAGE: ar
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/telegram_topic_research_v2.py research --state "$CONTROL_STATE_PATH"

      - name: Reserve explicit production dispatch
        id: reserve
        if: steps.poll.outputs.needs_production == 'true'
        env:
          REQUEST_ID: ${{ steps.poll.outputs.production_request_id }}
          REQUEST_SHA256: ${{ steps.poll.outputs.production_request_sha256 }}
        run: |
          set -euo pipefail
          test -n "$REQUEST_ID"
          test -n "$REQUEST_SHA256"
          python scripts/telegram_production_queue.py reserve \
            --state "$CONTROL_STATE_PATH" \
            --request-id "$REQUEST_ID" \
            --sha256 "$REQUEST_SHA256" \
            --runner-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Persist dispatch reservation before workflow dispatch
        id: persist_reservation
        if: steps.poll.outputs.needs_production == 'true'
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$STATE_ENCRYPTION_KEY"
          encrypted="$RUNNER_TEMP/isco-control/control-panel.reserved.json.enc"
          openssl enc -aes-256-cbc -salt -pbkdf2 -md sha256 \
            -pass env:STATE_ENCRYPTION_KEY -in "$CONTROL_STATE_PATH" -out "$encrypted"
          git fetch --no-tags origin control-plane-state:refs/remotes/origin/control-plane-state
          worktree="$RUNNER_TEMP/isco-control-reservation-worktree"
          git worktree add --detach "$worktree" origin/control-plane-state
          mkdir -p "$worktree/state"
          cp "$encrypted" "$worktree/state/control-panel.json.enc"
          cd "$worktree"
          git config user.name "isco-control-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/control-panel.json.enc
          if git diff --cached --quiet; then
            echo "Dispatch reservation already durable"
          else
            git commit -m "state: reserve explicit Telegram production dispatch"
            git push origin HEAD:control-plane-state
          fi

      - name: Dispatch one explicitly reserved production request
        id: dispatch_gateway
        if: steps.poll.outputs.needs_production == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.reserve.outputs.production_request_id }}
          REQUEST_SHA256: ${{ steps.reserve.outputs.production_request_sha256 }}
          AUTHORIZATION_ID: ${{ steps.reserve.outputs.production_authorization_id }}
        run: |
          set -euo pipefail
          test -n "$REQUEST_ID"
          test -n "$REQUEST_SHA256"
          test -n "$AUTHORIZATION_ID"
          gh workflow run telegram-production-request.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f request_id="$REQUEST_ID" \
            -f request_sha256="$REQUEST_SHA256" \
            -f authorization_id="$AUTHORIZATION_ID" \
            -f engine_sha="$ENGINE_SHA"

      - name: Compensate durable reservation if gateway dispatch failed
        id: compensate_gateway_dispatch
        if: >-
          always() &&
          steps.poll.outputs.needs_production == 'true' &&
          steps.persist_reservation.outcome == 'success' &&
          steps.dispatch_gateway.outcome == 'failure'
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          REQUEST_ID: ${{ steps.reserve.outputs.production_request_id }}
          REQUEST_SHA256: ${{ steps.reserve.outputs.production_request_sha256 }}
          AUTHORIZATION_ID: ${{ steps.reserve.outputs.production_authorization_id }}
        run: |
          set -euo pipefail
          test -n "$STATE_ENCRYPTION_KEY"
          test -n "$REQUEST_ID"
          test -n "$REQUEST_SHA256"
          test -n "$AUTHORIZATION_ID"
          fresh_enc="$RUNNER_TEMP/isco-control/gateway-dispatch-failed-latest.json.enc"
          fresh_state="$RUNNER_TEMP/isco-control/gateway-dispatch-failed-latest.json"
          git fetch --no-tags origin control-plane-state:refs/remotes/origin/control-plane-state
          git show origin/control-plane-state:state/control-panel.json.enc > "$fresh_enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 \
            -pass env:STATE_ENCRYPTION_KEY -in "$fresh_enc" -out "$fresh_state"
          chmod 600 "$fresh_state"
          python scripts/telegram_v4_ingress.py fail \
            --state "$fresh_state" \
            --request-id "$REQUEST_ID" \
            --sha256 "$REQUEST_SHA256" \
            --authorization-id "$AUTHORIZATION_ID" \
            --reason workflow_dispatch_failed
          cp "$fresh_state" "$CONTROL_STATE_PATH"
          openssl enc -aes-256-cbc -salt -pbkdf2 -md sha256 \
            -pass env:STATE_ENCRYPTION_KEY -in "$fresh_state" -out "$fresh_enc"
          worktree="$RUNNER_TEMP/isco-control-gateway-dispatch-failed-worktree"
          git worktree add --detach "$worktree" origin/control-plane-state
          mkdir -p "$worktree/state"
          cp "$fresh_enc" "$worktree/state/control-panel.json.enc"
          cd "$worktree"
          git config user.name "isco-control-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/control-panel.json.enc
          if git diff --cached --quiet; then
            echo "Gateway dispatch compensation produced no state delta" >&2
            exit 1
          fi
          git commit -m "state: compensate failed Telegram gateway dispatch"
          git push origin HEAD:control-plane-state

      - name: Persist encrypted control-panel state
        id: persist_control_state
        if: >-
          always() &&
          steps.poll.outputs.needs_production != 'true' &&
          (
            steps.poll.outputs.production_active != 'true' ||
            steps.poll.outputs.release_approval_consumed == 'true'
          )
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$STATE_ENCRYPTION_KEY"
          encrypted="$RUNNER_TEMP/isco-control/control-panel.json.enc"
          openssl enc -aes-256-cbc -salt -pbkdf2 -md sha256 \
            -pass env:STATE_ENCRYPTION_KEY -in "$CONTROL_STATE_PATH" -out "$encrypted"
          git fetch --no-tags origin control-plane-state:refs/remotes/origin/control-plane-state
          worktree="$RUNNER_TEMP/isco-control-state-worktree"
          git worktree add --detach "$worktree" origin/control-plane-state
          mkdir -p "$worktree/state"
          cp "$encrypted" "$worktree/state/control-panel.json.enc"
          cd "$worktree"
          git config user.name "isco-control-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/control-panel.json.enc
          if git diff --cached --quiet; then
            echo "Control-panel state unchanged"
          else
            git commit -m "state: update encrypted Telegram control panel"
            git push origin HEAD:control-plane-state
          fi

      - name: Build sanitized Telegram read projection
        id: build_projection
        if: >-
          always() &&
          (
            steps.poll.outputs.production_active == 'true' ||
            (steps.poll.outputs.release_approval_consumed == 'true' && steps.persist_control_state.outcome == 'success') ||
            (
              steps.poll.outputs.needs_production == 'true' &&
              steps.persist_reservation.outcome == 'success' &&
              (
                steps.dispatch_gateway.outcome == 'success' ||
                steps.compensate_gateway_dispatch.outcome == 'success'
              )
            ) ||
            (steps.poll.outputs.needs_production != 'true' && steps.poll.outputs.production_active != 'true' && steps.persist_control_state.outcome == 'success')
          )
        run: |
          set -euo pipefail
          test -n "${CONTROL_STATE_PATH:-}"
          test -f "$CONTROL_STATE_PATH"
          python scripts/telegram_status_projection.py \
            --state "$CONTROL_STATE_PATH" \
            --output "$RUNNER_TEMP/isco-control/telegram-status.json"

      - name: Persist sanitized Telegram read projection
        if: always() && steps.build_projection.outcome == 'success'
        run: |
          set -euo pipefail
          projection="$RUNNER_TEMP/isco-control/telegram-status.json"
          test -f "$projection"
          git fetch --no-tags origin control-plane-state:refs/remotes/origin/control-plane-state
          worktree="$RUNNER_TEMP/isco-control-projection-worktree"
          git worktree add --detach "$worktree" origin/control-plane-state
          mkdir -p "$worktree/state"
          cp "$projection" "$worktree/state/telegram-status.json"
          cd "$worktree"
          git config user.name "isco-control-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/telegram-status.json
          if git diff --cached --quiet; then
            echo "Sanitized Telegram read projection unchanged"
          else
            git commit -m "state: update sanitized Telegram status projection"
            git push origin HEAD:control-plane-state
          fi

      - name: Remove plaintext control secrets and state
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/isco-control" || true
