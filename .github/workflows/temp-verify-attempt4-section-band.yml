name: Temp Verify Attempt4 Section Band

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'fix/attempt4-residual-section-band'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact Runner PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact production Engine pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 79e9993cc0d9459adc2585b9b46c6526f8c1cb6b
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact Engine pin
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "79e9993cc0d9459adc2585b9b46c6526f8c1cb6b"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install locked Engine
        run: |
          set -euo pipefail
          python -m pip install -r engine/requirements-lock.txt
          python -m pip install --no-deps -e engine
          python -m pip check

      - name: Verify canonical Production V4 still pins exact Engine
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/produce-resilient-v4.yml')
          text = p.read_text(encoding='utf-8')
          sha = '79e9993cc0d9459adc2585b9b46c6526f8c1cb6b'
          count = text.count(sha)
          if count != 3:
              raise SystemExit(f'Expected exact Engine SHA three times in Production V4, got {count}')
          print('Production V4 Engine pin PASS:', sha)
          PY

      - name: Attempt 4 focused regression
        run: python -m unittest scripts.test_append_retry_guard -v

      - name: Full Engine regression
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Full Runner regression
        run: python -m unittest discover -s scripts -p 'test_*.py' -q

      - name: Diff sanity
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD || git diff --check
