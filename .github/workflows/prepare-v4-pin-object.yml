name: Prepare V4 Pin Commit Object

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/prepare-v4-pin-object-trigger"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare updated V4 workflow artifact
        env:
          OLD_SHA: cae51d6c83262de0a785e0d805462e9392909754
          NEW_SHA: a1eea541c8ec36b0c701093793c730ffcc53b03b
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          old = os.environ['OLD_SHA']
          new = os.environ['NEW_SHA']
          source = Path('.github/workflows/produce-resilient-v4.yml')
          text = source.read_text(encoding='utf-8')
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'Expected exactly 3 old V4 engine pins, found {count}')
          updated = text.replace(old, new)
          if updated.count(new) != 3 or old in updated:
              raise SystemExit('Updated V4 Engine pin contract is not exact 3/3')
          out = Path('prepared-v4-pin')
          out.mkdir(exist_ok=True)
          target = out / 'produce-resilient-v4.yml'
          target.write_text(updated, encoding='utf-8')
          print('Prepared V4 workflow: exact three Engine SHA replacements; old SHA absent')
          PY

      - name: Upload prepared V4 workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: run104-v4-pin-candidate
          path: prepared-v4-pin/produce-resilient-v4.yml
          if-no-files-found: error
          retention-days: 1
