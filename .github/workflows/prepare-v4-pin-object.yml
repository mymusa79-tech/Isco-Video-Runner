name: Prepare V4 Pin Commit Object

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/prepare-v4-pin-object-trigger"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Stage exact atomic current Engine pins
        env:
          OLD_SHA: 089a97adde5d2e64b35262f944865241384f1429
          NEW_SHA: 64ab711bc904e9581c3cc6c8280d1321ae738eb1
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          old = os.environ['OLD_SHA']
          new = os.environ['NEW_SHA']
          expected = {
              Path('.github/workflows/produce-resilient-v4.yml'): 3,
              Path('.github/workflows/telegram-editorial-control.yml'): 1,
              Path('.github/workflows/verify-human-editorial-intent-m7.yml'): 1,
          }
          stage = Path('pin-stage')
          manifest = {'old_sha': old, 'new_sha': new, 'files': {}}
          for path, count in expected.items():
              text = path.read_text(encoding='utf-8')
              if text.count(old) != count:
                  raise SystemExit(f'{path}: expected {count} old pins, found {text.count(old)}')
              updated = text.replace(old, new)
              if old in updated or updated.count(new) < count:
                  raise SystemExit(f'{path}: replacement contract mismatch')
              dest = stage / path
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_text(updated, encoding='utf-8')
              manifest['files'][path.as_posix()] = {
                  'replacements': count,
                  'sha256': hashlib.sha256(updated.encode('utf-8')).hexdigest(),
              }

          production = (stage / '.github/workflows/produce-resilient-v4.yml').read_text(encoding='utf-8')
          telegram = (stage / '.github/workflows/telegram-editorial-control.yml').read_text(encoding='utf-8')
          hei = (stage / '.github/workflows/verify-human-editorial-intent-m7.yml').read_text(encoding='utf-8')
          if production.count(new) != 3:
              raise SystemExit('Production V4 canonical pin count mismatch')
          if telegram.count(new) != 1 or 'CONTROL_PLANE_PRODUCTION_ENABLED: "false"' not in telegram:
              raise SystemExit('Telegram pin/production-lock contract mismatch')
          if hei.count(new) != 1:
              raise SystemExit('HEI/M7 verifier pin contract mismatch')
          (stage / 'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          print('Atomic M7 pin staging PASS')
          PY

      - name: Upload staged pin files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-m7-pin-stage
          path: pin-stage
          if-no-files-found: error
          retention-days: 1
