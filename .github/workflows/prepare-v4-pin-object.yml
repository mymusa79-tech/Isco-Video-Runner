name: Prepare V4 Pin Commit Object

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/prepare-v4-pin-object-trigger"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Create remote commit object with atomic current Engine pins
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OLD_SHA: 089a97adde5d2e64b35262f944865241384f1429
          NEW_SHA: 64ab711bc904e9581c3cc6c8280d1321ae738eb1
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          old = os.environ['OLD_SHA']
          new = os.environ['NEW_SHA']
          expected = {
              '.github/workflows/produce-resilient-v4.yml': 3,
              '.github/workflows/telegram-editorial-control.yml': 1,
              '.github/workflows/verify-human-editorial-intent-m7.yml': 1,
          }
          updated_files = {}
          for name, count in expected.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{name}: expected {count} old pins, found {actual}')
              updated = text.replace(old, new)
              if updated.count(new) < count or old in updated:
                  raise SystemExit(f'{name}: replacement contract mismatch')
              updated_files[name] = updated

          if updated_files['.github/workflows/produce-resilient-v4.yml'].count(new) != 3:
              raise SystemExit('Production V4 canonical pin count mismatch')
          telegram = updated_files['.github/workflows/telegram-editorial-control.yml']
          if telegram.count(new) != 1 or 'CONTROL_PLANE_PRODUCTION_ENABLED: "false"' not in telegram:
              raise SystemExit('Telegram pin/production-lock contract mismatch')
          if updated_files['.github/workflows/verify-human-editorial-intent-m7.yml'].count(new) != 1:
              raise SystemExit('HEI/M7 verifier pin contract mismatch')

          base_commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()

          def api(path, method='GET', payload=None):
              url = f'https://api.github.com/repos/{repo}{path}'
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(url, data=data, method=method, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              })
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read().decode('utf-8')
                  return json.loads(body) if body else {}

          tree_entries = []
          for name, content in updated_files.items():
              blob = api('/git/blobs', 'POST', {'content': content, 'encoding': 'utf-8'})
              tree_entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = api('/git/trees', 'POST', {'base_tree': base_tree, 'tree': tree_entries})
          commit = api('/git/commits', 'POST', {
              'message': 'integration: activate current M7 Engine across production surfaces',
              'tree': tree['sha'],
              'parents': [base_commit],
          })
          print(f'BASE_COMMIT_SHA={base_commit}')
          print(f'PREPARED_COMMIT_SHA={commit["sha"]}')
          print('Prepared atomic pin diff: 3 V4 + 1 Telegram + 1 HEI/M7 replacements')
          PY
