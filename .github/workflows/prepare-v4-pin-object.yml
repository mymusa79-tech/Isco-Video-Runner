name: Prepare V4 Pin Commit Object

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/prepare-v4-pin-object-trigger"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Create remote commit object with updated V4 pin
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OLD_SHA: a1eb2fdeffe14fa369844e35caa61708f79285d0
          NEW_SHA: 7629bc87a0adcd1a1c0864ecf833478076f01ad3
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          old = os.environ['OLD_SHA']
          new = os.environ['NEW_SHA']
          path = Path('.github/workflows/produce-resilient-v4.yml')
          text = path.read_text(encoding='utf-8')
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 old V4 engine pins, found {count}')
          updated = text.replace(old, new)
          if updated.count(new) != 2:
              raise SystemExit('Updated V4 engine pin count is not exactly 2')

          base_commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()

          def api(path, method='GET', payload=None):
              url = f'https://api.github.com/repos/{repo}{path}'
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read().decode('utf-8')
                  return json.loads(body) if body else {}

          blob = api('/git/blobs', 'POST', {'content': updated, 'encoding': 'utf-8'})
          tree = api('/git/trees', 'POST', {
              'base_tree': base_tree,
              'tree': [{
                  'path': '.github/workflows/produce-resilient-v4.yml',
                  'mode': '100644',
                  'type': 'blob',
                  'sha': blob['sha'],
              }],
          })
          commit = api('/git/commits', 'POST', {
              'message': 'ci: pin V4 to merged content-tone engine',
              'tree': tree['sha'],
              'parents': [base_commit],
          })
          print(f'BASE_COMMIT_SHA={base_commit}')
          print(f'PREPARED_COMMIT_SHA={commit["sha"]}')
          print('Prepared diff: exactly two SHA replacements')
          PY
