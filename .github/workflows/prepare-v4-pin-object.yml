name: Prepare V4 Pin Commit Object

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/prepare-v4-pin-object-trigger"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 1

      - name: Atomically update current Engine pin surfaces
        env:
          OLD_SHA: 089a97adde5d2e64b35262f944865241384f1429
          NEW_SHA: 64ab711bc904e9581c3cc6c8280d1321ae738eb1
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          old = os.environ['OLD_SHA']
          new = os.environ['NEW_SHA']
          expected = {
              Path('.github/workflows/produce-resilient-v4.yml'): 3,
              Path('.github/workflows/telegram-editorial-control.yml'): 1,
              Path('.github/workflows/verify-human-editorial-intent-m7.yml'): 1,
          }
          for path, count in expected.items():
              text = path.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} old pins, found {actual}')
              updated = text.replace(old, new)
              if updated.count(new) < count:
                  raise SystemExit(f'{path}: replacement count mismatch')
              path.write_text(updated, encoding='utf-8')

          production = Path('.github/workflows/produce-resilient-v4.yml').read_text(encoding='utf-8')
          telegram = Path('.github/workflows/telegram-editorial-control.yml').read_text(encoding='utf-8')
          hei = Path('.github/workflows/verify-human-editorial-intent-m7.yml').read_text(encoding='utf-8')
          if production.count(new) != 3:
              raise SystemExit('Production V4 must contain exactly three canonical Engine pin occurrences')
          if telegram.count(new) != 1 or 'CONTROL_PLANE_PRODUCTION_ENABLED: "false"' not in telegram:
              raise SystemExit('Telegram pin/production-lock contract mismatch')
          if hei.count(new) != 1:
              raise SystemExit('HEI/M7 verifier pin contract mismatch')
          if any(old in path.read_text(encoding='utf-8') for path in expected):
              raise SystemExit('Old Engine pin remains in canonical pin surfaces')
          print('Atomic M7 production pin replacement PASS')
          PY
          git diff --check
          git config user.name "isco-integration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/produce-resilient-v4.yml \
                  .github/workflows/telegram-editorial-control.yml \
                  .github/workflows/verify-human-editorial-intent-m7.yml
          git commit -m "integration: activate current M7 Engine across production surfaces"
          git push origin "HEAD:${{ github.head_ref }}"
