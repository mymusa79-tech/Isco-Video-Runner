name: Export Backfill Content Style Diff Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-backfill-content-style-diff-once.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout private Engine head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 2be33929854e098961bbc2d16a1311bd3afee26a
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: true
          fetch-depth: 1

      - name: Build exact base-to-head diff
        run: |
          set -euo pipefail
          git -C engine fetch --depth=1 origin 2a7317ea8a6672ba78bed541c7fbc9e84fb13824
          git -C engine diff --binary --full-index \
            2a7317ea8a6672ba78bed541c7fbc9e84fb13824 \
            2be33929854e098961bbc2d16a1311bd3afee26a \
            > "$RUNNER_TEMP/backfill-content-style-v1.diff"
          test -s "$RUNNER_TEMP/backfill-content-style-v1.diff"
          sha256sum "$RUNNER_TEMP/backfill-content-style-v1.diff" > "$RUNNER_TEMP/backfill-content-style-v1.diff.sha256"

      - name: Encrypt private diff before public artifact upload
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/public.pem" <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAnJ+PwaO41Yzi4XcSAEgw
          rVnT2G2aj22AZuyRC1LIWpGhp8iqoe/jxrWh+UlyQ2KGxOY/aoYIpViQeEPI2pFA
          LQXtYuqDd8c1tIUJe95O9oKpEira94Zm2lgg0EtI9gFjWbX/PXcv7Ub7vk+LlqDI
          iEX6oR8PaFf0F8W1W2rrTni+j1HMCSHKkdlO9QxhtD4OSgzpTpaOiWMJNdcwgwEU
          57gGT5VZFN/tjZRh4B3Qvxi5naX+qTU0dtZVqmF/uRP4TrzzdahEoYaWvKxP8Ykp
          ERmSyeDg8zO2q2LkDRa5iBuUzzhD8RLsI1gVpUicH4S74S+QoNMIfItCUnEq9jZa
          nWOIWjX/ora+8fy1Njn2BMfULXFqc+3yxXaZcSYR5ZW0c8gOA6eKPr9XoNsBiyZs
          Qmw2LkvSEzmX9r4qLBggzzkzxSFh9LgVB7Foh7Z5q9+QswV0oqEql0BDGwsrhb0n
          aTTKlxzEmBinAqdUU33Vt2dxp830oeCxg6il+CZOnJ3BAgMBAAE=
          -----END PUBLIC KEY-----
          PUBKEY
          openssl rand 32 > "$RUNNER_TEMP/diff-key.bin"
          openssl rand 16 > "$RUNNER_TEMP/diff-iv.bin"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/diff-bundle.tar.gz" \
            backfill-content-style-v1.diff backfill-content-style-v1.diff.sha256
          openssl enc -aes-256-cbc \
            -K "$(xxd -p -c 256 "$RUNNER_TEMP/diff-key.bin")" \
            -iv "$(xxd -p -c 256 "$RUNNER_TEMP/diff-iv.bin")" \
            -in "$RUNNER_TEMP/diff-bundle.tar.gz" \
            -out "$GITHUB_WORKSPACE/backfill-content-style-diff.tar.gz.enc"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/public.pem" \
            -pkeyopt rsa_padding_mode:oaep \
            -in "$RUNNER_TEMP/diff-key.bin" \
            -out "$GITHUB_WORKSPACE/diff-key.bin.enc"
          cp "$RUNNER_TEMP/diff-iv.bin" "$GITHUB_WORKSPACE/diff-iv.bin"
          rm -f "$RUNNER_TEMP/backfill-content-style-v1.diff" \
                "$RUNNER_TEMP/backfill-content-style-v1.diff.sha256" \
                "$RUNNER_TEMP/diff-bundle.tar.gz" "$RUNNER_TEMP/diff-key.bin" \
                "$RUNNER_TEMP/diff-iv.bin" "$RUNNER_TEMP/public.pem"

      - name: Upload encrypted diff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: backfill-content-style-full-diff
          path: |
            backfill-content-style-diff.tar.gz.enc
            diff-key.bin.enc
            diff-iv.bin
          if-no-files-found: error
          retention-days: 1
