name: Run54 Production Validation

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/run54-production-validation.yml"

permissions:
  contents: write

concurrency:
  group: run54-production-validation
  cancel-in-progress: false

jobs:
  validate-production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout verified private engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 5e2baf0c17ad04d14844b3f2cca21b774f643a23
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install engine and local voice fallback
        run: |
          set -euo pipefail
          # Trigger commit for this one-shot production validation.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          if ! fc-list | grep -qi 'Noto Sans Arabic'; then
            sudo apt-get update
            sudo apt-get install -y fonts-noto-core
          fi
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
          python -m pip install 'piper-tts==1.4.2'
          mkdir -p "$RUNNER_TEMP/piper-voices"
          python -m piper.download_voices --data-dir "$RUNNER_TEMP/piper-voices" ar_JO-kareem-medium
          test -f "$RUNNER_TEMP/piper-voices/ar_JO-kareem-medium.onnx"
          test -f "$RUNNER_TEMP/piper-voices/ar_JO-kareem-medium.onnx.json"

      - name: Restore encrypted cross-run memory
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/isco-state"
          mkdir -p "$state_dir"
          python scripts/persistent_memory.py restore \
            --repo . \
            --plain "$state_dir/history.json" \
            --branch agent-state \
            --legacy-state state/history.json.enc \
            --github-output "$GITHUB_OUTPUT"
          test -f "$state_dir/history.json"
          chmod 600 "$state_dir/history.json"
          echo "ISCO_HISTORY_PATH=$state_dir/history.json" >> "$GITHUB_ENV"

      - name: Prepare production request and secret files
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          test -n "$GROQ_API_KEY"
          test -n "$OPENROUTER_API_KEY"
          test -n "$PEXELS_API_KEY"
          test -n "$PIXABAY_API_KEY"
          umask 077
          mkdir -p "$RUNNER_TEMP/isco-secrets"
          printf '%s' "$GEMINI_API_KEY" > "$RUNNER_TEMP/isco-secrets/gemini"
          printf '%s' "$GROQ_API_KEY" > "$RUNNER_TEMP/isco-secrets/groq"
          printf '%s' "$OPENROUTER_API_KEY" > "$RUNNER_TEMP/isco-secrets/openrouter"
          printf '%s' "$PEXELS_API_KEY" > "$RUNNER_TEMP/isco-secrets/pexels"
          printf '%s' "$PIXABAY_API_KEY" > "$RUNNER_TEMP/isco-secrets/pixabay"
          printf '%s' "$YOUTUBE_API_KEY" > "$RUNNER_TEMP/isco-secrets/youtube"
          printf '%s' "$YOUTUBE_CLIENT_ID" > "$RUNNER_TEMP/isco-secrets/youtube-client-id"
          printf '%s' "$YOUTUBE_CLIENT_SECRET" > "$RUNNER_TEMP/isco-secrets/youtube-client-secret"
          printf '%s' "$YOUTUBE_REFRESH_TOKEN" > "$RUNNER_TEMP/isco-secrets/youtube-refresh-token"
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'isco-request.json').write_text(
              json.dumps({'topic': 'صوت الآخرين في رأسك', 'format': 'film'}, ensure_ascii=False),
              encoding='utf-8',
          )
          PY

      - name: Verify local voice fallback
        env:
          PIPER_MODEL_PATH: ${{ runner.temp }}/piper-voices/ar_JO-kareem-medium.onnx
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, wave
          from pathlib import Path
          from piper import PiperVoice
          model = Path(os.environ['PIPER_MODEL_PATH'])
          voice = PiperVoice.load(str(model), config_path=str(model) + '.json')
          out = Path(os.environ['RUNNER_TEMP']) / 'piper-preflight.wav'
          with wave.open(str(out), 'wb') as wav:
              voice.synthesize_wav('هذا اختبار صوت محلي.', wav)
          if out.stat().st_size < 1024:
              raise SystemExit('Piper preflight produced empty audio')
          print('Piper local voice preflight OK')
          PY

      - name: Produce one real film
        working-directory: engine
        env:
          GEMINI_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/gemini
          GROQ_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/groq
          OPENROUTER_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/openrouter
          PEXELS_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/pexels
          PIXABAY_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/pixabay
          YOUTUBE_API_KEY_FILE: ${{ runner.temp }}/isco-secrets/youtube
          YOUTUBE_CLIENT_ID_FILE: ${{ runner.temp }}/isco-secrets/youtube-client-id
          YOUTUBE_CLIENT_SECRET_FILE: ${{ runner.temp }}/isco-secrets/youtube-client-secret
          YOUTUBE_REFRESH_TOKEN_FILE: ${{ runner.temp }}/isco-secrets/youtube-refresh-token
          ISCO_ENGINE_SHA: 5e2baf0c17ad04d14844b3f2cca21b774f643a23
          REQUEST_FILE: ${{ runner.temp }}/isco-request.json
          PIPER_MODEL_PATH: ${{ runner.temp }}/piper-voices/ar_JO-kareem-medium.onnx
          GEMINI_CONTENT_MODEL: gemini-2.5-flash
          GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
          TRENDS_GEO: SA
          YOUTUBE_REGION: SA
          YOUTUBE_LANGUAGE: ar
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          python ../scripts/run_v3_voice.py 2>&1 | tee "$RUNNER_TEMP/run54-production.log"

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: run54-production-validation-${{ github.run_number }}
          path: |
            engine/output/*/final.mp4
            engine/output/*/quality-final.json
            engine/output/*/quality-precheck.json
            engine/output/*/plan.json
            engine/output/*/planning-telemetry.json
            engine/output/*/visual-audit.json
            engine/output/*/final-critic.json
            engine/output/*/ai-budget.json
            engine/output/*/production-manifest.json
            engine/output/*/opening-visual-audit.json
            engine/output/*/thumbnail-plan.json
            engine/output/*/thumbnail-*.jpg
            engine/output/*/rights-manifest.json
            engine/output/*/gold-enforce-report.json
            ${{ runner.temp }}/run54-production.log
          if-no-files-found: warn
          retention-days: 7

      - name: Record validation run state
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/observer-state"
          git clone --depth 1 --branch ops/run36-observer-state "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/observer-state"
          cd "$RUNNER_TEMP/observer-state"
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('run54-production-latest.json').write_text(json.dumps({
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_number': int(os.environ['GITHUB_RUN_NUMBER']),
              'status': os.environ.get('RESULT', ''),
              'head_sha': os.environ.get('GITHUB_SHA', ''),
          }, indent=2), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add run54-production-latest.json
          git commit -m 'ops: capture Run54 production validation state' || true
          git push origin HEAD:ops/run36-observer-state
