name: Verify Final Pin P2 Remediation Combined

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  exact-combined-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact Runner pin candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e78aa81546c55f67b8c4a394379d22abd112477b
          path: runner
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact Runner checkout and pin-only scope
        working-directory: runner
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e78aa81546c55f67b8c4a394379d22abd112477b"
          git diff --check 4dffd788882abc5b1083b2b8e4ab7f9e14873022..e78aa81546c55f67b8c4a394379d22abd112477b
          mapfile -t changed < <(git diff --name-only 4dffd788882abc5b1083b2b8e4ab7f9e14873022..e78aa81546c55f67b8c4a394379d22abd112477b | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/produce-resilient-v4.yml"
          test "$(grep -o '9191d64cf1af419a0e8147c65530e0f1420eec7f' .github/workflows/produce-resilient-v4.yml | wc -l)" -eq 3
          test "$(grep -o '549d1dc32cd57c4cccfefecf7f04e35b6f3e1b39' .github/workflows/produce-resilient-v4.yml | wc -l)" -eq 0

      - name: Checkout exact final private Engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 9191d64cf1af419a0e8147c65530e0f1420eec7f
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine checkout
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "9191d64cf1af419a0e8147c65530e0f1420eec7f"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install media and locked Engine runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          cd engine
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Full Engine suite
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Full Runner regression suite against final Engine
        working-directory: runner
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}/runner
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q

      - name: Canonical Production V4 exact-pin sanity
        working-directory: runner
        run: |
          set -euo pipefail
          grep -q 'ref: 9191d64cf1af419a0e8147c65530e0f1420eec7f' .github/workflows/produce-resilient-v4.yml
          grep -Fq 'test "$(git rev-parse HEAD)" = "9191d64cf1af419a0e8147c65530e0f1420eec7f"' .github/workflows/produce-resilient-v4.yml
          grep -q 'ISCO_ENGINE_SHA: 9191d64cf1af419a0e8147c65530e0f1420eec7f' .github/workflows/produce-resilient-v4.yml
