name: Apply selected visual runner wiring

on:
  push:
    branches:
      - ci/final-critic-selected-visuals

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ci/final-critic-selected-visuals
          fetch-depth: 0

      - name: Apply artifact wiring patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/produce-resilient-v4.yml")

          replace_once(
              workflow,
              "            engine/output/*/planning-telemetry.json\n            engine/output/*/final-critic.json\n",
              "            engine/output/*/planning-telemetry.json\n            engine/output/*/visual-audit.json\n            engine/output/*/final-critic.json\n",
          )
          replace_once(
              workflow,
              "          telemetry = root / 'planning-telemetry.json'\n          critic = root / 'final-critic.json'\n",
              "          telemetry = root / 'planning-telemetry.json'\n          visual_audit = root / 'visual-audit.json'\n          critic = root / 'final-critic.json'\n",
          )
          replace_once(
              workflow,
              "          if not plan.exists():\n              raise SystemExit('Missing plan.json')\n          if not critic.exists():\n",
              "          if not plan.exists():\n              raise SystemExit('Missing plan.json')\n          if not visual_audit.exists():\n              raise SystemExit('Missing visual-audit.json')\n          if not critic.exists():\n",
          )
          replace_once(
              workflow,
              "          telemetry_path = (Path('engine') / telemetry) if telemetry.exists() else None\n          critic_path = Path('engine') / critic\n",
              "          telemetry_path = (Path('engine') / telemetry) if telemetry.exists() else None\n          visual_audit_path = Path('engine') / visual_audit\n          critic_path = Path('engine') / critic\n",
          )
          replace_once(
              workflow,
              "              fh.write(f'telemetry_path={telemetry_path.as_posix() if telemetry_path else \"\"}\\n')\n              fh.write(f'critic_path={critic_path.as_posix()}\\n')\n",
              "              fh.write(f'telemetry_path={telemetry_path.as_posix() if telemetry_path else \"\"}\\n')\n              fh.write(f'visual_audit_path={visual_audit_path.as_posix()}\\n')\n              fh.write(f'critic_path={critic_path.as_posix()}\\n')\n",
          )
          replace_once(
              workflow,
              "            ${{ steps.final_review.outputs.telemetry_path }}\n            ${{ steps.final_review.outputs.critic_path }}\n",
              "            ${{ steps.final_review.outputs.telemetry_path }}\n            ${{ steps.final_review.outputs.visual_audit_path }}\n            ${{ steps.final_review.outputs.critic_path }}\n",
          )
          replace_once(
              workflow,
              "          FINAL_TELEMETRY_PATH: ${{ steps.final_review.outputs.telemetry_path }}\n          FINAL_CRITIC_PATH: ${{ steps.final_review.outputs.critic_path }}\n",
              "          FINAL_TELEMETRY_PATH: ${{ steps.final_review.outputs.telemetry_path }}\n          FINAL_VISUAL_AUDIT_PATH: ${{ steps.final_review.outputs.visual_audit_path }}\n          FINAL_CRITIC_PATH: ${{ steps.final_review.outputs.critic_path }}\n",
          )
          replace_once(
              workflow,
              "          test -n \"$FINAL_QUALITY_PATH\"\n          test -n \"$FINAL_CRITIC_PATH\"\n",
              "          test -n \"$FINAL_QUALITY_PATH\"\n          test -n \"$FINAL_VISUAL_AUDIT_PATH\"\n          test -n \"$FINAL_CRITIC_PATH\"\n",
          )
          replace_once(
              workflow,
              "          telemetry = Path(telemetry_value) if telemetry_value else None\n          critic = Path(os.environ['FINAL_CRITIC_PATH'])\n",
              "          telemetry = Path(telemetry_value) if telemetry_value else None\n          visual_audit = Path(os.environ['FINAL_VISUAL_AUDIT_PATH'])\n          critic = Path(os.environ['FINAL_CRITIC_PATH'])\n",
          )
          replace_once(
              workflow,
              "          if quality != root / 'quality-final.json':\n              raise SystemExit(f'Release quality file escaped reviewed output root: {quality}')\n          if critic != root / 'final-critic.json':\n",
              "          if quality != root / 'quality-final.json':\n              raise SystemExit(f'Release quality file escaped reviewed output root: {quality}')\n          if visual_audit != root / 'visual-audit.json':\n              raise SystemExit(f'Release visual audit escaped reviewed output root: {visual_audit}')\n          if critic != root / 'final-critic.json':\n",
          )
          replace_once(
              workflow,
              "          for required in (video, quality, critic, budget, manifest):\n",
              "          for required in (video, quality, visual_audit, critic, budget, manifest):\n",
          )
          replace_once(
              workflow,
              "          release_assets=(\"$FINAL_VIDEO_PATH\" \"$FINAL_CRITIC_PATH\" \"$FINAL_BUDGET_PATH\" \"$FINAL_MANIFEST_PATH\")\n",
              "          release_assets=(\"$FINAL_VIDEO_PATH\" \"$FINAL_VISUAL_AUDIT_PATH\" \"$FINAL_CRITIC_PATH\" \"$FINAL_BUDGET_PATH\" \"$FINAL_MANIFEST_PATH\")\n",
          )

          test_path = Path("scripts/test_visual_audit_workflow_contract.py")
          test_path.write_text('''from __future__ import annotations

import unittest
from pathlib import Path


class VisualAuditWorkflowContractTests(unittest.TestCase):
    @classmethod
    def setUpClass(cls) -> None:
        cls.workflow = Path(".github/workflows/produce-resilient-v4.yml").read_text(encoding="utf-8")

    def test_failure_diagnostics_upload_visual_audit(self) -> None:
        self.assertIn("engine/output/*/visual-audit.json", self.workflow)

    def test_success_artifact_and_release_carry_visual_audit(self) -> None:
        self.assertIn("visual_audit = root / 'visual-audit.json'", self.workflow)
        self.assertIn("visual_audit_path={visual_audit_path.as_posix()}", self.workflow)
        self.assertIn("${{ steps.final_review.outputs.visual_audit_path }}", self.workflow)
        self.assertIn("FINAL_VISUAL_AUDIT_PATH", self.workflow)
        self.assertIn("$FINAL_VISUAL_AUDIT_PATH", self.workflow)


if __name__ == "__main__":
    unittest.main()
''', encoding="utf-8")
          PY

      - name: Verify runner contract
        run: python -m unittest scripts.test_visual_audit_workflow_contract -q

      - name: Commit isolated runner wiring
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-selected-visuals-runner.yml
          git add .github/workflows/produce-resilient-v4.yml scripts/test_visual_audit_workflow_contract.py
          git commit -m "ci: preserve visual audit diagnostics"
          git push origin HEAD:ci/final-critic-selected-visuals
