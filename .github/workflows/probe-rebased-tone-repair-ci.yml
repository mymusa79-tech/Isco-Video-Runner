name: Probe Rebased Tone Repair CI

on:
  push:
    branches:
      - fix/tone-repair-mistral-schema-main-c30e

permissions:
  contents: read

jobs:
  full-clean-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y ffmpeg
      - name: Run full Clean V2 suite
        run: |
          python -m unittest \
            scripts.test_clean_v2 \
            scripts.test_clean_v2_channel_persona \
            scripts.test_clean_v2_human_feel \
            scripts.test_clean_v2_structural_ai_flags \
            scripts.test_clean_v2_tone_naturalness \
            scripts.test_clean_v2_opening_director \
            scripts.test_clean_v2_contextual_cta \
            scripts.test_clean_v2_legacy_cinematic \
            scripts.test_clean_v2_final_master_qc \
            scripts.test_clean_v2_visual_pacing \
            -v
