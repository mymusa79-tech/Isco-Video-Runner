name: Install Certified Editorial Room Stage 7

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  ENGINE_BASE: 02aeb6f4d9172553b3360b7add5fdcef59944985
  ENGINE_BRANCH: feature/editorial-room-stage5-9-final-current-main

jobs:
  install-certified-stage7:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Runner verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout exact Engine integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: ${{ env.ENGINE_BRANCH }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: true
          fetch-depth: 0

      - name: Assert exact certified base
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ENGINE_BASE"
          test -z "$(git status --porcelain)"

      - name: Reapply exact certified Stage 7 candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/editorial-room-stage7-pr-certify-v5.yml').read_text(encoding='utf-8')
          names = [
              'Apply exact Stage 7 V3 production candidate',
              'Reuse exact Stage 7 V3 contracts',
              'Migrate legacy packaging fixtures to locked EditorialIntent',
          ]
          blocks = []
          for name in names:
              marker = f'      - name: {name}\n'
              start = src.index(marker)
              run_marker = '        run: |\n'
              start = src.index(run_marker, start) + len(run_marker)
              next_step = src.find('      - name:', start)
              end = len(src) if next_step < 0 else next_step
              lines = src[start:end].splitlines()
              blocks.append('\n'.join(line[10:] if line.startswith('          ') else line for line in lines).rstrip() + '\n')
          Path('/tmp/apply-stage7-certified.sh').write_text('set -euo pipefail\n' + '\n'.join(blocks), encoding='utf-8')
          PY
          cd engine
          bash /tmp/apply-stage7-certified.sh

      - name: Apply exact V7 legacy thumbnail fixture migration
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('tests/test_thumbnail_alternate_query_recovery.py'),
              Path('tests/test_thumbnail_candidate_board.py'),
              Path('tests/test_thumbnail_pixabay_fallback.py'),
          ]
          helper = '''\n\ndef _intent():\n    return make_editorial_intent(\n        editorial_thesis="العودة بعد السقوط تُبنى من خطوة صغيرة قابلة للتكرار.",\n        viewer_starting_belief="المشاهد يظن أن السقوط يعني أن عليه العودة دفعة واحدة.",\n        hidden_assumption="الافتراض الخفي أن الخطوات الصغيرة لا تُحسب كعودة حقيقية.",\n        editorial_turn="بدل انتظار قفزة كبيرة، ابدأ بخطوة صغيرة قابلة للتنفيذ اليوم.",\n        stakes="انتظار العودة الكاملة قد يطيل التوقف ويضعف الثقة.",\n        viewer_promise="ستتعلم كيف تبدأ العودة بعد السقوط بخطوة صغيرة قابلة للتنفيذ اليوم.",\n        evidence_boundaries=("لا نقدم علاجًا طبيًا.", "لا نعمم مسارًا واحدًا على الجميع."),\n        earned_payoff="اختر خطوة صغيرة قابلة للتنفيذ اليوم وابدأ منها عودتك.",\n    )\n'''
          for p in files:
              s = p.read_text(encoding='utf-8')
              marker = 'from isco_video_agent import thumbnail\n'
              if p.name == 'test_thumbnail_pixabay_fallback.py':
                  marker = 'from isco_video_agent import production_pipeline, thumbnail\n'
              assert s.count(marker) == 1, p
              s = s.replace(marker, marker + 'from isco_video_agent.editorial_room import make_editorial_intent\n', 1)
              anchor = '\n\ndef _plan():\n'
              assert s.count(anchor) == 1, p
              s = s.replace(anchor, helper + anchor, 1)
              old = '        closing_payoff="payoff",\n    )\n'
              new = '        closing_payoff="payoff",\n        editorial_intent=_intent().to_dict(),\n    )\n'
              assert s.count(old) == 1, p
              s = s.replace(old, new, 1)
              old = 'def _concept(index: int) -> dict:\n    slot = chr(64 + index)\n'
              assert old in s, p
              s = s.replace(old, 'def _concept(index: int) -> dict:\n    slot = chr(64 + index)\n    intent = _intent()\n', 1)
              s = s.replace('"packaging_hypothesis": f"فرضية {index}",', '"packaging_hypothesis": f"زاوية عملية للعودة بعد السقوط بخطوة صغيرة {index}",', 1)
              s = s.replace('"viewer_promise": f"وعد {index}",', '"viewer_promise": intent.viewer_promise,\n        "viewer_promise_expression": f"ستتعلم كيف تبدأ العودة بعد السقوط بخطوة صغيرة قابلة للتنفيذ اليوم {index}",\n        "locked_viewer_promise": intent.viewer_promise,\n        "editorial_fingerprint": intent.editorial_fingerprint,\n        "persona_version": intent.persona_version,', 1)
              p.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: Verify exact V7 blob identities and scope
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected=(
            [src/isco_video_agent/production_pipeline.py]=be6f55c58532045a4054e0c6e123b4867849650f
            [src/isco_video_agent/packaging_integrity.py]=a08f99a61c379bc5c3fc82f3a772119c5fa14033
            [src/isco_video_agent/thumbnail.py]=57ac1b57cd9d50180e43e41709e11a42c9b01f82
            [tests/test_editorial_stage7.py]=2bf62b339f6f8fe0f12ec27d679ba8239cd88c87
            [tests/test_packaging_identity_integrity_p1.py]=898e0736e3a22cdd4881b479049d4d7082e2f0fc
            [tests/test_thumbnail_packaging_contract.py]=037901964b9ba154a7cce9538b8befdef96d8609
            [tests/test_thumbnail_alternate_query_recovery.py]=d9a75ded002412e822d8d83bca0e6b88393df638
            [tests/test_thumbnail_candidate_board.py]=00bd56b830979bd69e4c3ef02a1aa3fe90e2c60e
            [tests/test_thumbnail_pixabay_fallback.py]=6c0037c920684472ebaa125736f7070829966383
          )
          mapfile -t changed < <(git status --porcelain --untracked-files=all | sed -E 's/^.. //')
          test "${#changed[@]}" -eq 9
          for path in "${changed[@]}"; do
            test -n "${expected[$path]:-}" || { echo "unexpected path: $path" >&2; exit 1; }
            actual="$(git hash-object "$path")"
            test "$actual" = "${expected[$path]}" || { echo "blob mismatch: $path $actual" >&2; exit 1; }
          done

      - name: Commit and push exact certified Stage 7
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "isco-editorial-certifier"
          git config user.email "actions@users.noreply.github.com"
          git add src/isco_video_agent/production_pipeline.py src/isco_video_agent/packaging_integrity.py src/isco_video_agent/thumbnail.py \
            tests/test_editorial_stage7.py tests/test_packaging_identity_integrity_p1.py tests/test_thumbnail_packaging_contract.py \
            tests/test_thumbnail_alternate_query_recovery.py tests/test_thumbnail_candidate_board.py tests/test_thumbnail_pixabay_fallback.py
          git commit -m "feat(editorial): bind packaging to locked intent"
          git push origin HEAD:"$ENGINE_BRANCH"
