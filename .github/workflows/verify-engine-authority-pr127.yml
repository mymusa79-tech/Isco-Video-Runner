name: Verify Engine PR127 Authority Contract

on:
  pull_request:
    paths:
      - ".github/workflows/verify-engine-authority-pr127.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout Engine PR127 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: fix/single-production-authority-contract
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Run Engine production-authority regression tests
        working-directory: engine
        run: python -m unittest tests.test_production_authority_boundary -v

      - name: Verify current Runner against Engine PR127 authority contract
        working-directory: engine
        run: python scripts/verify_production_authority_boundary.py --runner-root ..
