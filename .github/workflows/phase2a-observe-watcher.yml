name: Phase 2A Observe Watcher

on:
  push:
    branches: ["ops/phase2a-real-production-run"]
    paths:
      - ".github/workflows/phase2a-observe-watcher.yml"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      actions: read
      contents: write
    steps:
      - name: Wait for one-shot production and publish machine-readable result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_HEAD_SHA: 33b8eb92c5ccfb266521c48e4464a9fc20ace3bf
          TARGET_BRANCH: ops/phase2a-real-production-run
          TARGET_WORKFLOW: phase2a-real-production-observe.yml
          RESULT_PATH: .github/phase2a-watch-result.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import io
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          import zipfile

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          target_sha = os.environ['TARGET_HEAD_SHA']
          branch = os.environ['TARGET_BRANCH']
          workflow = os.environ['TARGET_WORKFLOW']
          result_path = os.environ['RESULT_PATH']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json; charset=utf-8',
          }

          def api(path, method='GET', payload=None):
              url = f'https://api.github.com/repos/{repo}{path}'
              data = None if payload is None else json.dumps(payload, ensure_ascii=False).encode('utf-8')
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as resp:
                  raw = resp.read()
                  ctype = resp.headers.get('Content-Type', '')
                  if 'json' in ctype and raw:
                      return json.loads(raw.decode('utf-8'))
                  return raw

          run = None
          for _ in range(180):
              query = urllib.parse.urlencode({'event': 'push', 'branch': branch, 'per_page': 20})
              data = api(f'/actions/workflows/{workflow}/runs?{query}')
              matches = [r for r in data.get('workflow_runs', []) if r.get('head_sha') == target_sha]
              if matches:
                  run = max(matches, key=lambda r: r.get('created_at', ''))
                  if run.get('status') == 'completed':
                      break
              time.sleep(20)
          else:
              raise SystemExit('Timed out waiting for Phase 2A production workflow')

          run_id = int(run['id'])
          artifacts_data = api(f'/actions/runs/{run_id}/artifacts?per_page=100')
          artifacts = artifacts_data.get('artifacts', [])
          selected = next((a for a in artifacts if str(a.get('name', '')).startswith('phase2a-real-production-')), None)
          comparison = None
          artifact_files = []
          artifact_id = None
          if selected is not None:
              artifact_id = int(selected['id'])
              zip_bytes = api(f'/actions/artifacts/{artifact_id}/zip')
              with zipfile.ZipFile(io.BytesIO(zip_bytes)) as zf:
                  artifact_files = sorted(zf.namelist())
                  names = [n for n in artifact_files if n.endswith('/gold-shadow-comparison.json') or n == 'gold-shadow-comparison.json']
                  if names:
                      comparison = json.loads(zf.read(names[0]).decode('utf-8'))

          jobs = api(f'/actions/runs/{run_id}/jobs?per_page=100').get('jobs', [])
          job_summary = []
          for job in jobs:
              job_summary.append({
                  'id': job.get('id'),
                  'name': job.get('name'),
                  'status': job.get('status'),
                  'conclusion': job.get('conclusion'),
                  'steps': [
                      {
                          'name': step.get('name'),
                          'status': step.get('status'),
                          'conclusion': step.get('conclusion'),
                      }
                      for step in job.get('steps', [])
                  ],
              })

          result = {
              'schema_version': 1,
              'target_head_sha': target_sha,
              'production_run_id': run_id,
              'production_run_number': run.get('run_number'),
              'production_status': run.get('status'),
              'production_conclusion': run.get('conclusion'),
              'production_event': run.get('event'),
              'production_head_branch': run.get('head_branch'),
              'production_head_sha': run.get('head_sha'),
              'artifact_id': artifact_id,
              'artifact_files': artifact_files,
              'gold_shadow_comparison_found': comparison is not None,
              'gold_shadow_comparison': comparison,
              'jobs': job_summary,
          }

          encoded = base64.b64encode(json.dumps(result, ensure_ascii=False, indent=2).encode('utf-8')).decode('ascii')
          api(f'/contents/{result_path}', 'PUT', {
              'message': 'chore: record Phase 2A production observation result',
              'content': encoded,
              'branch': branch,
          })
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
