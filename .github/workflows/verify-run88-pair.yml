name: Verify Run 88 Engine Runner Pair

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  run88-pair-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Runner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout Run 88 Engine candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: e30c75f3bf2075c3fdc7016297ee67850f242279
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Engine candidate
        working-directory: engine
        run: test "$(git rev-parse HEAD)" = "e30c75f3bf2075c3fdc7016297ee67850f242279"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Engine candidate
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Focused Run 88 Engine regression
        working-directory: engine
        run: python -m unittest tests.test_run88_brand_signature_isolation -v

      - name: Full Engine regression
        working-directory: engine
        run: python -m unittest discover -s tests -q

      - name: Focused Run 88 Runner regression
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: python -m unittest scripts.test_run88_identity_isolation -v

      - name: Full Runner regression
        env:
          PYTHONPATH: ${{ github.workspace }}/engine/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t test_modules < <(
            find scripts -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' \
              | sort | sed -e 's#/#.#g' -e 's#\.py$##'
          )
          test "${#test_modules[@]}" -gt 0
          python -m unittest "${test_modules[@]}" -q

      - name: Diff sanity
        run: git diff --check origin/main...HEAD || git diff --check
