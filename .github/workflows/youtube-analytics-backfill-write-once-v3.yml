name: YouTube Analytics Backfill WRITE Once v3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/youtube-analytics-backfill-write-once-v3.yml

permissions:
  contents: write

concurrency:
  group: youtube-analytics-backfill-write-once
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_HISTORY_SHA_BEFORE: a1694ee55e74641b1efe8b4f564f3974c4ce991095d05a9e59369fc109dfeace
      EXPECTED_IMPORT_FINGERPRINT: 372eecb42ba3eee870e7bf7cbf6d0bc824425e4eeb4df4223fedd8d0057c9dbd
      EXPECTED_UNRESOLVED_VIDEO_ID: SZiEuKz_VWI
    steps:
      - name: Checkout runner read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout reviewed Engine backfill code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: 6c78a821c83ab73115bf6eaadaaac4b36bef27ec
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Verify reviewed runtime
        working-directory: engine
        run: |
          set -euo pipefail
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
          python -m unittest discover -s tests -p 'test_youtube_backfill*.py' -q
          python -m unittest tests.test_analytics_insights tests.test_analytics_insights_v2 tests.test_learning_metrics_source -q

      - name: Restore real history and lock approved baseline
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/isco-backfill-write-state"
          meta="$RUNNER_TEMP/restore-meta.txt"
          mkdir -p "$state_dir"
          python scripts/persistent_memory.py restore \
            --repo . --plain "$state_dir/history.json" --branch agent-state \
            --legacy-state state/history.json.enc --github-output "$meta"
          grep -qx 'save_allowed=true' "$meta"
          test -f "$state_dir/history.json"
          chmod 600 "$state_dir/history.json"
          before="$(sha256sum "$state_dir/history.json" | awk '{print $1}')"
          test "$before" = "$EXPECTED_HISTORY_SHA_BEFORE"
          echo "ISCO_HISTORY_PATH=$state_dir/history.json" >> "$GITHUB_ENV"
          echo "HISTORY_SHA_BEFORE=$before" >> "$GITHUB_ENV"
          echo "History SHA before WRITE: $before"

      - name: Materialize YouTube read-only credentials
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          for n in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN YOUTUBE_API_KEY; do test -n "${!n:-}"; done
          umask 077
          mkdir -p "$RUNNER_TEMP/isco-youtube-secrets"
          printf '%s' "$YOUTUBE_CLIENT_ID" > "$RUNNER_TEMP/isco-youtube-secrets/client-id"
          printf '%s' "$YOUTUBE_CLIENT_SECRET" > "$RUNNER_TEMP/isco-youtube-secrets/client-secret"
          printf '%s' "$YOUTUBE_REFRESH_TOKEN" > "$RUNNER_TEMP/isco-youtube-secrets/refresh-token"
          printf '%s' "$YOUTUBE_API_KEY" > "$RUNNER_TEMP/isco-youtube-secrets/api-key"

      - name: Fresh SCAN and exact approved-set guard
        working-directory: engine
        env:
          YOUTUBE_CLIENT_ID_FILE: ${{ runner.temp }}/isco-youtube-secrets/client-id
          YOUTUBE_CLIENT_SECRET_FILE: ${{ runner.temp }}/isco-youtube-secrets/client-secret
          YOUTUBE_REFRESH_TOKEN_FILE: ${{ runner.temp }}/isco-youtube-secrets/refresh-token
          YOUTUBE_API_KEY_FILE: ${{ runner.temp }}/isco-youtube-secrets/api-key
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/private-write-artifact"
          preview="$GITHUB_WORKSPACE/private-write-artifact/youtube-backfill-preview.WRITE.json"
          python scripts/backfill_youtube_analytics.py scan --history "$ISCO_HISTORY_PATH" --preview "$preview" >/dev/null
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['GITHUB_WORKSPACE'])/'private-write-artifact/youtube-backfill-preview.WRITE.json').read_text(encoding='utf-8'))
          s=d['summary']; c=s['classified']
          expected={'to_import':128,'unresolved':1}
          for k,v in expected.items():
              if int(s.get(k,-1))!=v: raise SystemExit(f'{k} changed: {s.get(k)}')
          if {k:int(c.get(k,-1)) for k in ('film','short','story')} != {'film':19,'short':109,'story':0}:
              raise SystemExit(f'format counts changed: {c}')
          if d.get('history_sha256_before_scan')!=os.environ['EXPECTED_HISTORY_SHA_BEFORE']:
              raise SystemExit('baseline SHA changed')
          imports=sorted((str(v.get('video_id','')),str(v.get('format',''))) for v in d.get('videos',[]) if v.get('action')=='import')
          fp=hashlib.sha256('\n'.join(f'{a}:{b}' for a,b in imports).encode()).hexdigest()
          if fp!=os.environ['EXPECTED_IMPORT_FINGERPRINT']: raise SystemExit(f'import set changed: {fp}')
          unresolved=[v for v in d.get('videos',[]) if v.get('action')=='unresolved']
          if len(unresolved)!=1 or unresolved[0].get('video_id')!=os.environ['EXPECTED_UNRESOLVED_VIDEO_ID'] or unresolved[0].get('creator_content_type') is not None:
              raise SystemExit('unresolved record changed')
          print('Approved-set guard PASS: exact 128 IDs/formats; 19 film; 109 short; one unresolved excluded.')
          PY
          test "$(sha256sum "$ISCO_HISTORY_PATH" | awk '{print $1}')" = "$HISTORY_SHA_BEFORE"

      - name: WRITE approved records and repeat for idempotency
        working-directory: engine
        run: |
          set -euo pipefail
          preview="$GITHUB_WORKSPACE/private-write-artifact/youtube-backfill-preview.WRITE.json"
          python - <<'PY' > "$RUNNER_TEMP/non-backfill-before.sha256"
          import hashlib,json,os
          from pathlib import Path
          d=json.loads(Path(os.environ['ISCO_HISTORY_PATH']).read_text(encoding='utf-8'))
          raw=d.get('learning',{}).get('metrics',[]) if isinstance(d.get('learning',{}),dict) else []
          keep=[x for x in raw if isinstance(x,dict) and str(x.get('ingestion_source','')).strip()!='youtube_backfill_v1']
          print(hashlib.sha256(json.dumps(keep,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest())
          PY
          python scripts/backfill_youtube_analytics.py write --history "$ISCO_HISTORY_PATH" --preview "$preview" --confirm WRITE_BACKFILL > "$RUNNER_TEMP/write-first.json"
          after="$(sha256sum "$ISCO_HISTORY_PATH" | awk '{print $1}')"
          echo "$after" > "$RUNNER_TEMP/history-after.sha256"
          echo "HISTORY_SHA_AFTER=$after" >> "$GITHUB_ENV"
          python scripts/backfill_youtube_analytics.py write --history "$ISCO_HISTORY_PATH" --preview "$preview" --confirm WRITE_BACKFILL > "$RUNNER_TEMP/write-second.json"
          test "$(sha256sum "$ISCO_HISTORY_PATH" | awk '{print $1}')" = "$after"

      - name: Validate local WRITE and refresh learning insights
        working-directory: engine
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from collections import Counter
          from pathlib import Path
          from isco_video_agent.analytics_insights import refresh_learning_insights, insights_path
          temp=Path(os.environ['RUNNER_TEMP']); state=Path(os.environ['ISCO_HISTORY_PATH'])
          first=json.loads((temp/'write-first.json').read_text()); second=json.loads((temp/'write-second.json').read_text())
          if first.get('imported')!=128 or first.get('skipped_existing_production_observer')!=0 or first.get('skipped_existing_backfill')!=0:
              raise SystemExit(f'first WRITE invalid: {first}')
          if second.get('imported')!=0 or second.get('skipped_existing_backfill')!=128:
              raise SystemExit(f'idempotency invalid: {second}')
          d=json.loads(state.read_text(encoding='utf-8')); raw=d.get('learning',{}).get('metrics',[])
          b=[x for x in raw if isinstance(x,dict) and x.get('ingestion_source')=='youtube_backfill_v1' and x.get('backfill_version')==1]
          ids=[str(x.get('video_id','')) for x in b]; formats=Counter(str(x.get('format','')) for x in b)
          if len(b)!=128 or len(set(ids))!=128 or formats!=Counter({'short':109,'film':19}):
              raise SystemExit(f'backfill invalid: rows={len(b)} unique={len(set(ids))} formats={formats}')
          if any(str(x.get('classification_status','')).lower()=='unresolved' for x in b): raise SystemExit('unresolved imported')
          keep=[x for x in raw if isinstance(x,dict) and str(x.get('ingestion_source','')).strip()!='youtube_backfill_v1']
          non_after=hashlib.sha256(json.dumps(keep,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          non_before=(temp/'non-backfill-before.sha256').read_text().strip()
          if non_after!=non_before: raise SystemExit('production_observer/legacy changed')
          insights=refresh_learning_insights()
          if insights.get('schema_version')!=2 or insights.get('cohort_isolation')!='strict_by_format' or insights.get('production_influence')!='none':
              raise SystemExit('insights validation failed')
          after=(temp/'history-after.sha256').read_text().strip()
          report={'operation':'youtube_analytics_backfill_write_v1','write_performed':True,'history_sha256_before':os.environ['HISTORY_SHA_BEFORE'],'history_sha256_after':after,'first_write':first,'idempotency_second_write':second,'backfill_rows_after':len(b),'backfill_unique_video_ids':len(set(ids)),'formats':dict(formats),'unresolved_imported':0,'production_observer_preserved':True,'production_observer_payload_sha256_before':non_before,'production_observer_payload_sha256_after':non_after,'insights_schema_version':2,'insights_cohort_isolation':'strict_by_format','remote_persistence_verified':False}
          (Path(os.environ['GITHUB_WORKSPACE'])/'private-write-artifact/write-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Local WRITE validation PASS: 128 imported; second WRITE imported 0; observer/legacy unchanged.')
          print('History SHA after WRITE:',after)
          print('Insights:',insights_path())
          PY

      - name: Checkout isolated agent-state writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: state-writer
          persist-credentials: true
          fetch-depth: 1

      - name: Persist encrypted state and verify remote plaintext SHA
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          encrypted="$RUNNER_TEMP/isco-backfill-write-state/history.json.enc"
          python scripts/persistent_memory.py encrypt --plain "$ISCO_HISTORY_PATH" --encrypted "$encrypted"
          python scripts/persistent_memory.py persist --repo state-writer --encrypted "$encrypted" --branch agent-state --run-number "backfill-${GITHUB_RUN_NUMBER}"
          verify="$RUNNER_TEMP/isco-backfill-verify"; mkdir -p "$verify"
          python scripts/persistent_memory.py restore --repo state-writer --plain "$verify/history.json" --branch agent-state --legacy-state state/history.json.enc
          remote_sha="$(sha256sum "$verify/history.json" | awk '{print $1}')"
          test "$remote_sha" = "$HISTORY_SHA_AFTER"
          state_head="$(git -C state-writer ls-remote --heads origin refs/heads/agent-state | awk '{print $1}')"; test -n "$state_head"
          echo "AGENT_STATE_HEAD=$state_head" >> "$GITHUB_ENV"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['GITHUB_WORKSPACE'])/'private-write-artifact/write-report.json'; d=json.loads(p.read_text(encoding='utf-8'))
          d['remote_persistence_verified']=True; d['remote_history_sha256']=os.environ['HISTORY_SHA_AFTER']; d['agent_state_head']=os.environ['AGENT_STATE_HEAD']
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          echo "Remote history SHA verified: $remote_sha"
          echo "agent-state HEAD: $state_head"

      - name: Encrypt results for private review
        run: |
          set -euo pipefail
          umask 077
          cp "$(dirname "$ISCO_HISTORY_PATH")/learning-insights.json" "$GITHUB_WORKSPACE/private-write-artifact/learning-insights.json"
          cat > "$RUNNER_TEMP/backfill-public.pem" <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAnJ+PwaO41Yzi4XcSAEgw
          rVnT2G2aj22AZuyRC1LIWpGhp8iqoe/jxrWh+UlyQ2KGxOY/aoYIpViQeEPI2pFA
          LQXtYuqDd8c1tIUJe95O9oKpEira94Zm2lgg0EtI9gFjWbX/PXcv7Ub7vk+LlqDI
          iEX6oR8PaFf0F8W1W2rrTni+j1HMCSHKkdlO9QxhtD4OSgzpTpaOiWMJNdcwgwEU
          57gGT5VZFN/tjZRh4B3Qvxi5naX+qTU0dtZVqmF/uRP4TrzzdahEoYaWvKxP8Ykp
          ERmSyeDg8zO2q2LkDRa5iBuUzzhD8RLsI1gVpUicH4S74S+QoNMIfItCUnEq9jZa
          nWOIWjX/ora+8fy1Njn2BMfULXFqc+3yxXaZcSYR5ZW0c8gOA6eKPr9XoNsBiyZs
          Qmw2LkvSEzmX9r4qLBggzzkzxSFh9LgVB7Foh7Z5q9+QswV0oqEql0BDGwsrhb0n
          aTTKlxzEmBinAqdUU33Vt2dxp830oeCxg6il+CZOnJ3BAgMBAAE=
          -----END PUBLIC KEY-----
          PUBKEY
          openssl rand 32 > "$RUNNER_TEMP/result-key.bin"; openssl rand 16 > "$RUNNER_TEMP/result-iv.bin"
          tar -C "$GITHUB_WORKSPACE/private-write-artifact" -czf "$RUNNER_TEMP/results.tar.gz" write-report.json learning-insights.json youtube-backfill-preview.WRITE.json
          openssl enc -aes-256-cbc -K "$(xxd -p -c 256 "$RUNNER_TEMP/result-key.bin")" -iv "$(xxd -p -c 256 "$RUNNER_TEMP/result-iv.bin")" -in "$RUNNER_TEMP/results.tar.gz" -out "$GITHUB_WORKSPACE/private-write-artifact/results.tar.gz.enc"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/backfill-public.pem" -pkeyopt rsa_padding_mode:oaep -in "$RUNNER_TEMP/result-key.bin" -out "$GITHUB_WORKSPACE/private-write-artifact/result-key.bin.enc"
          cp "$RUNNER_TEMP/result-iv.bin" "$GITHUB_WORKSPACE/private-write-artifact/result-iv.bin"
          rm -f "$GITHUB_WORKSPACE/private-write-artifact/write-report.json" "$GITHUB_WORKSPACE/private-write-artifact/learning-insights.json" "$GITHUB_WORKSPACE/private-write-artifact/youtube-backfill-preview.WRITE.json"

      - name: Upload encrypted WRITE verification artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: youtube-backfill-write-results-v3-${{ github.run_number }}
          path: |
            private-write-artifact/results.tar.gz.enc
            private-write-artifact/result-key.bin.enc
            private-write-artifact/result-iv.bin
          if-no-files-found: error
          retention-days: 1

      - name: Cleanup sensitive material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/isco-youtube-secrets" "$RUNNER_TEMP/isco-backfill-write-state" "$RUNNER_TEMP/isco-backfill-verify" "$RUNNER_TEMP/result-key.bin" "$RUNNER_TEMP/result-iv.bin" "$RUNNER_TEMP/backfill-public.pem" "$RUNNER_TEMP/results.tar.gz" "$GITHUB_WORKSPACE/private-write-artifact"
