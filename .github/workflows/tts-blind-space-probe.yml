name: TTS Blind Three Engine Smoke

on:
  push:
    branches: ["agent/tts-blind-execution-2026-08-26"]
    paths:
      - ".github/workflows/tts-blind-space-probe.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install clients
        run: python -m pip install --disable-pip-version-check --quiet "google-genai>=2,<3" "gradio_client>=1.12,<2" "soundfile>=0.13,<1"
      - name: Generate one Arabic sample with all three engines
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          import numpy as np
          import soundfile as sf
          from gradio_client import Client

          sys.path.insert(0, str(Path("scripts").resolve()))
          import tts_blind_test as blind

          out = Path("tts-smoke")
          out.mkdir(parents=True, exist_ok=True)
          item = blind._read_corpus(Path("scripts/tts_blind_corpus_ar.json"))[0]
          report = {"sample_id": item.sample_id, "engines": {}}

          def normalize_to_wav(source, path: Path):
              audio, rate = sf.read(str(source), always_2d=False)
              if getattr(audio, "ndim", 1) > 1:
                  audio = np.mean(audio, axis=1)
              sf.write(str(path), audio, int(rate), subtype="PCM_16", format="WAV")

          def validate(name: str, path: Path):
              if not path.is_file() or path.stat().st_size < 512:
                  raise RuntimeError(f"{name}: output missing or too small")
              info = sf.info(str(path))
              duration = float(info.duration)
              if duration <= 0.2:
                  raise RuntimeError(f"{name}: invalid duration {duration}")
              report["engines"][name] = {
                  "status": "ok",
                  "file": path.name,
                  "bytes": path.stat().st_size,
                  "duration_s": round(duration, 3),
                  "sample_rate_hz": int(info.samplerate),
                  "channels": int(info.channels),
              }

          try:
              p = out / "gemini.wav"
              blind._generate_gemini(item, p)
              validate("gemini", p)
          except Exception as exc:
              report["engines"]["gemini"] = {"status": "error", "reason": f"{type(exc).__name__}: {exc}"[:700]}

          try:
              client = Client("openbmb/VoxCPM-Demo", verbose=False)
              source = client.predict(
                  item.text,
                  item.direction,
                  None,
                  False,
                  "",
                  2.0,
                  False,
                  False,
                  api_name="/generate",
              )
              p = out / "voxcpm2.wav"
              normalize_to_wav(source, p)
              validate("voxcpm2", p)
          except Exception as exc:
              report["engines"]["voxcpm2"] = {"status": "error", "reason": f"{type(exc).__name__}: {exc}"[:700]}

          try:
              client = Client("ResembleAI/Chatterbox-Multilingual-TTS-V3", verbose=False)
              source = client.predict(
                  item.text,
                  None,
                  "ar",
                  0.5,
                  0.8,
                  42,
                  0.5,
                  api_name="/generate_tts_audio",
              )
              p = out / "chatterbox_multilingual_v3.wav"
              normalize_to_wav(source, p)
              validate("chatterbox_multilingual_v3", p)
          except Exception as exc:
              report["engines"]["chatterbox_multilingual_v3"] = {"status": "error", "reason": f"{type(exc).__name__}: {exc}"[:700]}

          (out / "smoke-report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          failed = [name for name, row in report["engines"].items() if row.get("status") != "ok"]
          if failed:
              raise SystemExit("Smoke failed: " + ", ".join(failed))
          PY
      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-blind-three-engine-smoke
          path: tts-smoke/
          if-no-files-found: warn
          retention-days: 7
