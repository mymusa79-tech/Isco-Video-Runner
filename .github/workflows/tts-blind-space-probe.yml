name: TTS Blind Three Engine Smoke

on:
  push:
    branches: ["agent/tts-blind-execution-2026-08-26"]
    paths:
      - ".github/workflows/tts-blind-space-probe.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install clients
        run: python -m pip install --disable-pip-version-check --quiet "google-genai>=1,<2" "gradio_client>=1.12,<2"
      - name: Generate one Arabic sample with all three engines
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          from gradio_client import Client

          sys.path.insert(0, str(Path("scripts").resolve()))
          import tts_blind_test as blind

          out = Path("tts-smoke")
          out.mkdir(parents=True, exist_ok=True)
          item = blind._read_corpus(Path("scripts/tts_blind_corpus_ar.json"))[0]
          report = {"sample_id": item.sample_id, "engines": {}}

          def validate(name: str, path: Path):
              if not path.is_file() or path.stat().st_size < 512:
                  raise RuntimeError(f"{name}: output missing or too small")
              proc = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=nw=1:nk=1", str(path)],
                  check=True, capture_output=True, text=True,
              )
              duration = float(proc.stdout.strip())
              if duration <= 0.2:
                  raise RuntimeError(f"{name}: invalid duration {duration}")
              report["engines"][name] = {"status": "ok", "file": path.name, "bytes": path.stat().st_size, "duration_s": round(duration, 3)}

          # Gemini: use the permanent harness adapter exactly as merged.
          try:
              p = out / "gemini.wav"
              blind._generate_gemini(item, p)
              validate("gemini", p)
          except Exception as exc:
              report["engines"]["gemini"] = {"status": "error", "reason": f"{type(exc).__name__}: {exc}"[:500]}

          # VoxCPM2: official public Space, mapped to the harness's engine role.
          try:
              client = Client("openbmb/VoxCPM-Demo", verbose=False)
              source = client.predict(
                  item.text,
                  item.direction,
                  None,
                  False,
                  "",
                  2.0,
                  False,
                  False,
                  api_name="/generate",
              )
              p = out / "voxcpm2.wav"
              subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-i", str(source), "-ar", "24000", "-ac", "1", "-c:a", "pcm_s16le", str(p)], check=True)
              validate("voxcpm2", p)
          except Exception as exc:
              report["engines"]["voxcpm2"] = {"status": "error", "reason": f"{type(exc).__name__}: {exc}"[:500]}

          # Chatterbox V3: fetch the Space's Arabic reference first, then synthesize Arabic.
          try:
              client = Client("ResembleAI/Chatterbox-Multilingual-TTS-V3", verbose=False)
              ref_result = client.predict("ar", api_name="/on_language_change")
              if isinstance(ref_result, (list, tuple)):
                  arabic_ref = ref_result[0]
              else:
                  arabic_ref = ref_result
              source = client.predict(
                  item.text,
                  arabic_ref,
                  "ar",
                  0.5,
                  0.8,
                  42,
                  0.5,
                  api_name="/generate_tts_audio",
              )
              p = out / "chatterbox_multilingual_v3.wav"
              subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-i", str(source), "-ar", "24000", "-ac", "1", "-c:a", "pcm_s16le", str(p)], check=True)
              validate("chatterbox_multilingual_v3", p)
          except Exception as exc:
              report["engines"]["chatterbox_multilingual_v3"] = {"status": "error", "reason": f"{type(exc).__name__}: {exc}"[:500]}

          (out / "smoke-report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          failed = [name for name, row in report["engines"].items() if row.get("status") != "ok"]
          if failed:
              raise SystemExit("Smoke failed: " + ", ".join(failed))
          PY
      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-blind-three-engine-smoke
          path: tts-smoke/
          if-no-files-found: warn
          retention-days: 7
