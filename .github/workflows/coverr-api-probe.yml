name: Coverr API Probe

on:
  push:
    branches:
      - test/coverr-api-probe-20260930
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
    steps:
      - name: Probe Coverr downloadable media safely
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          key = os.environ.get("COVERR_API_KEY", "").strip()
          if not key:
              raise SystemExit("COVERR_API_KEY is not available to this workflow")
          print("COVERR_SECRET_PRESENT=true")

          api_headers = {
              "Authorization": f"Bearer {key}",
              "Accept": "application/json",
              "User-Agent": "Nidaa-Visuals-Coverr-Probe/1.0",
          }

          def api_get(path, params=None):
              url = "https://api.coverr.co" + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers=api_headers, method="GET")
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return resp.status, json.loads(resp.read().decode("utf-8"))

          def range_probe(url, label):
              if not url:
                  print(f"{label}_URL_PRESENT=false")
                  return
              print(f"{label}_URL_PRESENT=true")
              req = urllib.request.Request(
                  url,
                  headers={
                      "Range": "bytes=0-1023",
                      "User-Agent": "Nidaa-Visuals-Coverr-Probe/1.0",
                  },
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      body = resp.read(1024)
                      print(f"{label}_HTTP={resp.status}")
                      print(f"{label}_CONTENT_TYPE={resp.headers.get('content-type','')}")
                      print(f"{label}_CONTENT_LENGTH={resp.headers.get('content-length','')}")
                      print(f"{label}_CONTENT_RANGE={resp.headers.get('content-range','')}")
                      print(f"{label}_BYTES_READ={len(body)}")
              except urllib.error.HTTPError as e:
                  print(f"{label}_HTTP={e.code}")
                  print(f"{label}_ERROR={e.read(200).decode('utf-8',errors='replace')}")

          status, videos = api_get("/videos", {"query": "city", "page_size": 1, "urls": "true"})
          print(f"VIDEO_API_HTTP={status}")
          v = (videos.get("hits") or [None])[0]
          if v:
              print("VIDEO_ID=" + str(v.get("id","")))
              print("VIDEO_TITLE=" + str(v.get("title",""))[:120])
              print("VIDEO_DURATION=" + str(v.get("duration","")))
              print("VIDEO_MAX=" + str(v.get("max_width","")) + "x" + str(v.get("max_height","")))
              urls = v.get("urls") or {}
              range_probe(urls.get("mp4_preview"), "VIDEO_PREVIEW")
              range_probe(urls.get("mp4_download"), "VIDEO_DOWNLOAD")

          status, audios = api_get("/audios", {"query": "piano", "page_size": 1})
          print(f"AUDIO_LIST_HTTP={status}")
          a = (audios.get("hits") or [None])[0]
          if a:
              aid = str(a.get("id",""))
              print("AUDIO_ID=" + aid)
              print("AUDIO_LIST_KEYS=" + ",".join(sorted(a.keys())))
              print("AUDIO_LIST_NAME=" + str(a.get("name") or a.get("title") or ""))
              print("AUDIO_LIST_DURATION=" + str(a.get("duration","")))
              print("AUDIO_LIST_GENRES=" + json.dumps(a.get("genres",[]),ensure_ascii=True))
              print("AUDIO_LIST_MOODS=" + json.dumps(a.get("moods",[]),ensure_ascii=True))
              print("AUDIO_LIST_INSTRUMENTS=" + json.dumps(a.get("instruments",[]),ensure_ascii=True))
              lurls = a.get("urls") or {}
              print("AUDIO_LIST_PREVIEW=" + str(bool(lurls.get("preview"))).lower())
              print("AUDIO_LIST_PREVIEW_DOWNLOAD=" + str(bool(lurls.get("previewDownload"))).lower())
              print("AUDIO_LIST_MASTER_DOWNLOAD=" + str(bool(lurls.get("masterDownload"))).lower())

              dstatus, detail = api_get("/audios/" + urllib.parse.quote(aid))
              print(f"AUDIO_DETAIL_HTTP={dstatus}")
              print("AUDIO_DETAIL_KEYS=" + ",".join(sorted(detail.keys())))
              durls = detail.get("urls") or {}
              print("AUDIO_DETAIL_PREVIEW=" + str(bool(durls.get("preview"))).lower())
              print("AUDIO_DETAIL_PREVIEW_DOWNLOAD=" + str(bool(durls.get("previewDownload"))).lower())
              print("AUDIO_DETAIL_MASTER_DOWNLOAD=" + str(bool(durls.get("masterDownload"))).lower())
              range_probe(durls.get("preview"), "AUDIO_PREVIEW")
              range_probe(durls.get("previewDownload"), "AUDIO_PREVIEW_DOWNLOAD")
              range_probe(durls.get("masterDownload"), "AUDIO_MASTER_DOWNLOAD")
          PY
