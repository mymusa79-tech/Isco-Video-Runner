name: Final V4 Pin And Run

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/final-v4-pin-run-trigger"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Verify final V4 engine pin
        env:
          OLD_SHA: a1eb2fdeffe14fa369844e35caa61708f79285d0
          NEW_SHA: 7629bc87a0adcd1a1c0864ecf833478076f01ad3
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          text = Path('.github/workflows/produce-resilient-v4.yml').read_text(encoding='utf-8')
          old = os.environ['OLD_SHA']
          new = os.environ['NEW_SHA']
          if text.count(old) != 0:
              raise SystemExit('Old Engine SHA is still present in V4')
          if text.count(new) != 2:
              raise SystemExit(f'Expected final Engine SHA exactly twice, found {text.count(new)}')
          print(f'Verified V4 Engine SHA: {new}')
          PY

      - name: Dispatch decisive production run and capture run id
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          workflow = 'produce-resilient-v4.yml'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json; charset=utf-8',
          }

          def get_runs():
              query = urllib.parse.urlencode({'event': 'workflow_dispatch', 'per_page': 20})
              url = f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?{query}'
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read().decode('utf-8')).get('workflow_runs', [])

          before = {int(r['id']) for r in get_runs()}
          url = f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/dispatches'
          payload = json.dumps({
              'ref': 'main',
              'inputs': {'topic': 'صوت الآخرين في رأسك', 'format': 'film'},
          }, ensure_ascii=False).encode('utf-8')
          req = urllib.request.Request(url, data=payload, method='POST', headers=headers)
          with urllib.request.urlopen(req, timeout=30) as resp:
              if resp.status != 204:
                  raise SystemExit(f'Unexpected dispatch status: {resp.status}')

          for _ in range(15):
              time.sleep(2)
              fresh = [r for r in get_runs() if int(r['id']) not in before]
              if fresh:
                  run = max(fresh, key=lambda r: r.get('created_at', ''))
                  print('PRODUCTION_RUN_ID=' + str(run['id']))
                  print('PRODUCTION_RUN_NUMBER=' + str(run['run_number']))
                  print('PRODUCTION_STATUS=' + str(run['status']))
                  print('PRODUCTION_TOPIC=صوت الآخرين في رأسك')
                  raise SystemExit(0)
          raise SystemExit('Dispatch returned 204 but no new production run appeared within polling window')
          PY
