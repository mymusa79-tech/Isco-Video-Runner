name: Validate Engine 110-word floor tests

on:
  push:
    branches: ["validate/engine-tests-110-floor"]
    paths:
      - ".github/workflows/validate-engine-tests-110-floor.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private engine candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mymusa79-tech/Isco-Video-Agent
          ref: c68a8e28031a3d994432170b0a70942878a8f64d
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: engine
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install locked runtime
        working-directory: engine
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Full unit and media test suite
        working-directory: engine
        run: python -m unittest discover -s tests -v

      - name: Dry-run orchestration with explicit topic
        working-directory: engine
        run: isco-video produce --topic "لماذا تشعر أنك متأخر عن الجميع؟" --format auto --dry-run --no-research

      - name: Dry-run autonomous topic selection
        working-directory: engine
        run: isco-video produce --format auto --dry-run --no-research
