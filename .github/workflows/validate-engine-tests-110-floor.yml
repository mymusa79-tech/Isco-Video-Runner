name: Inspect Run41 tone audit context

on:
  pull_request:
    paths:
      - ".github/workflows/validate-engine-tests-110-floor.yml"

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_JOB: "95736460098"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Extract quality audit context
        shell: bash
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/${TARGET_JOB}/logs" \
            > job.log

          echo "=== QUALITY / TONE MATCHES ==="
          grep -nEi 'tone|naturalness|preach|cultural|dignity|narrative.format|religious|content.quality|semantic|repetition|repair dossier|issue.notes|needs.repair|quality audit|audit.*block|status.*block' job.log | tail -n 260 || true

          echo "=== PLANNING WINDOW ==="
          sed -n '3885,3955p' job.log
