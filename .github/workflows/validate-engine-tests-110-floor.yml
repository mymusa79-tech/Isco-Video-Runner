name: Inspect Run40 planner context

on:
  pull_request:
    paths:
      - ".github/workflows/validate-engine-tests-110-floor.yml"

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_JOB: "95729550957"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Extract planner context
        shell: bash
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/${TARGET_JOB}/logs" \
            > job.log

          echo "=== PLANNER KEY EVENTS ==="
          grep -nEi 'checkpoint hit|Planning subtask|Script Doctor|repair dossier|repair attempt|repair applied|word|duration contract|quality|audit|plan' job.log | tail -n 180 || true

          echo "=== FAILURE WINDOW ==="
          sed -n '3890,3985p' job.log
