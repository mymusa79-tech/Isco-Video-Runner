name: Inspect Run41 production failure

on:
  pull_request:
    paths:
      - ".github/workflows/validate-engine-tests-110-floor.yml"

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_JOB: "95736460098"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Extract Run41 failure context
        shell: bash
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/${TARGET_JOB}/logs" \
            > job.log

          echo "=== PLANNER KEY EVENTS ==="
          grep -nEi 'Planning subtask|Script Doctor|bounded retry|repair dossier|repair applied|words=|append|duration' job.log | tail -n 220 || true

          echo "=== ERROR MATCHES ==="
          grep -nEi 'Traceback|RuntimeError|ValueError|AssertionError|Exception|Error:|failed|blocked|under.?length|duration|retry|append' job.log | tail -n 160 || true

          echo "=== FINAL 320 LOG LINES ==="
          tail -n 320 job.log
