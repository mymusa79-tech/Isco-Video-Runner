name: Inspect Run40 production failure

on:
  pull_request:
    paths:
      - ".github/workflows/validate-engine-tests-110-floor.yml"

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_JOB: "95729550957"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Extract production failure context
        shell: bash
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/${TARGET_JOB}/logs" \
            > job.log

          echo "=== ERROR MATCHES (last 120) ==="
          grep -nEi 'Traceback|RuntimeError|ValueError|AssertionError|Exception|Error:|failed|blocked|Script Doctor|under.?length|duration|retry' job.log | tail -n 120 || true

          echo "=== FINAL 260 LOG LINES ==="
          tail -n 260 job.log
