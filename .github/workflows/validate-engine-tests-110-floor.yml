name: Inspect Run42 production failure

on:
  pull_request:
    paths:
      - ".github/workflows/validate-engine-tests-110-floor.yml"

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_JOB: "95741282522"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Extract Run42 failure context
        shell: bash
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/${TARGET_JOB}/logs" \
            > job.log

          echo "=== PLANNER / QUALITY EVENTS ==="
          grep -nEi 'Planner quality guard|Append-only|Script Doctor|bounded retry|repair dossier|repair applied|tone|naturalness|content.quality|words=|append|duration' job.log | tail -n 260 || true

          echo "=== ERROR MATCHES ==="
          grep -nEi 'Traceback|RuntimeError|ValueError|AssertionError|Exception|Error:|failed|blocked|under.?length|duration|retry|append|tone|quality' job.log | tail -n 180 || true

          echo "=== FINAL 360 LOG LINES ==="
          tail -n 360 job.log
